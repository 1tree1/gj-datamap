<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구경주역 데이터맵</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>구경주역 데이터맵</h1>
      <p class="sub">경주시 고시 제2026-8호 지구단위계획 · S1 부지</p>
    </header>
    <section id="layers">
      <h2>레이어</h2>
      <ul id="layer-list"></ul>
    </section>
    <section id="viewstats">
      <h2>현재 화면</h2>
      <dl>
        <div><dt>필지</dt><dd id="st-parcels">–</dd></div>
        <div><dt>공시지가 중앙값</dt><dd id="st-jiga">–</dd></div>
        <div><dt>줌</dt><dd id="st-zoom">–</dd></div>
      </dl>
    </section>
    <section id="chart-sec">
      <h2>획지 면적 — 추출 vs 고시</h2>
      <div id="chart"></div>
    </section>
    <section id="selected">
      <h2>선택</h2>
      <div id="sel-body" class="muted">지도에서 피처를 클릭</div>
    </section>
    <footer>
      <span id="basemap-ctl"></span>
      좌표: 처리본 EPSG:5187 → 웹 4326 · 출처 T1 경주시 고시 / V-World
    </footer>
  </aside>
  <div id="map"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
