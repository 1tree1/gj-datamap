  - key: vworld_uo_layers
    name: V-World UO 계열(기타 지역지구) 실사용 검증 (2026-09-17)
    type: T1
    url: https://api.vworld.kr/req/data
    method: LT_C_UO101 교육환경보호구역(절대·상대) · LT_C_UO301 문화재 구역(국가지정문화재구역·문화재보호구역·역사문화환경보존지역·시도지정) · LT_C_UO601 관광단지 · LT_C_UP201 재해위험지구 · LT_C_UM000 가축사육제한구역
    note: |
      ★ UO301은 문화재 관련 **폴리곤**을 준다 → 2026-09-17 규제 영역(C-017)을 법정 경계로 교체 완료. alias=지정번호 또는 이름, remark=이름 또는 허용기준 구역('300m이내지역', '1구역(개별검토)')이 섞여 있음.
      UO601 관광단지는 이름 속성이 없어 고시번호로 역추적(C-026).
