# 자료 출처 레지스트리
# 각 소스의 접근 방법·갱신주기·인증·한도를 기록한다.
# tier는 자료별로 index.csv에 붙이고, 여기에는 소스 자체의 성격을 적는다.

sources:
  - key: gyeongju_gosi
    name: 경주시 고시·공고
    type: T1
    url: https://www.gyeongju.go.kr
    method: web
    cadence: 주 1회 폴링 (gazette_watch.py)
    note: 공모 기간 중 최고 가성비. 지구단위계획 결정고시가 여기 뜬다

  - key: g2b
    name: 나라장터
    type: T2
    url: https://www.g2b.go.kr
    method: web
    cadence: 주 1회 폴링
    note: 2026 도입시설·경제성 분석 과업지시서 — 최우선 확보 대상

  - key: vworld
    name: V-World 국가공간정보
    type: T1
    url: https://www.vworld.kr
    method: OpenAPI / WMS / WFS / SHP
    auth: API key
    quota: 30000/day
    note: 지적도·용도지역·토지특성·3D 건물·배경지도

  - key: sgis
    name: 통계지리정보서비스
    type: T2
    url: https://sgis.kostat.go.kr
    method: OpenAPI
    auth: AccessToken (갱신 필요)
    note: 행정경계 GeoJSON · 인구 격자 · 가구유형 · 도시화 분석지도

  - key: data_go_kr
    name: 공공데이터포털
    type: T2
    url: https://www.data.go.kr
    method: OpenAPI / File
    auth: API key
    quota: 10000/day (개발계정)
    note: 건축물대장 · 공시지가 · 실거래가 · 건물에너지 · 교통

  - key: nsdi_plat
    name: 국토정보플랫폼
    type: T2
    url: https://map.ngii.go.kr
    method: 다운로드 / OpenAPI
    note: DEM · 수치지형도 · 항공사진 시계열 · 고지도 · 정사영상

  - key: heritage_gis
    name: 국가유산 공간정보
    type: T1
    url: https://gis-heritage.go.kr
    note: 지정문화유산 위치 · 역사문화환경 보존지역

  - key: geoinfo
    name: 국토지반정보 통합DB
    type: T2
    url: https://www.geoinfo.or.kr
    note: 시추공 N값 · 토층 · 지하수위 — 층수·사업비 하한 판단

  - key: krail
    name: 국가철도공단
    type: T1
    method: 정보공개청구 / 공고
    note: 폐선부지 활용지침 · MOU 원문 · 토지 소유 현황

  # ---------------------------------------------------------------
  # 2026-09-17 추가 — 상권·유동인구·교통량 시각화용 (조사: work/20260917_상권유동교통_소스수집.md)
  # ---------------------------------------------------------------

  - key: sbiz_store
    name: 소상공인시장진흥공단 상가(상권)정보
    type: T2
    url: https://www.data.go.kr/data/15083033/fileData.do
    method: 파일(CSV, 분기) / OpenAPI(15012005)
    auth: API key (공공데이터포털)
    quota: 파일 무제한 · API 개발계정
    cadence: 분기. 최신 20260331 기준(등록 2026-08-05), 차기 2026-10-31
    crs: EPSG:4326 (경도·위도 컬럼)
    note: 업소 점(상호·업종 대중소·지번·법정동) + API로 상권영역 폴리곤(반경/사각형/행정동). 개폐업 이력은 없음 → localdata 병행

  - key: localdata
    name: 행안부 지방행정인허가데이터
    type: T1
    url: https://file.localdata.go.kr/file/download/{업종}/info?orgCode=5050000  (업종 목록 /file/{업종}/info, 시도 전 업종 /file/download-all?orgCode=6470000_ALL)
    method: 파일(업종별·지역별, 인증 없음) / OpenAPI(data.go.kr, 업종별 서비스 — 예 15155139 apis.data.go.kr/1741000/foreigner_city_homestays, 활용신청 필요)
    auth: 파일 없음 / API는 data.go.kr 키 + 서비스별 활용신청 (2026-10-01 기존 키 403 SERVICE_KEY_IS_NOT_REGISTERED)
    cadence: 일 단위 (API 설명: 2일 전 기준 현행화)
    crs: EPSG:5174 (포털 표기 "보정계수 안들어간 Bessel 중부원점TM") — 2026-10-01 소진공 동일 상호 231건 대조 중앙값 2.6m로 확인
    note: |
      업종별 인허가·폐업·휴업 일자 = 개폐업 시계열의 T1 원천. 상권 '치환 vs 회복' 판단의 근거.
      2026 공공데이터포털로 통합 — www.localdata.go.kr 은 응답 없음(2026-10-01). 다운로드는 세션 쿠키 + /file/validate/download-count 선행 호출 필요.
      확보: 숙박 3업종 경주시(C-041, pipeline/build_lodging_permits.py). 전 업종은 미수집.

  - key: tour_datalab
    name: 한국관광 데이터랩 (한국관광공사)
    type: T2
    url: https://datalab.visitkorea.or.kr
    method: 웹 조회(무료 회원) / OpenAPI 지역별 방문자수_GW (data.go.kr 15101972)
    auth: 회원 / API key
    quota: API 개발계정 1,000/일
    cadence: 월 · 일자별
    note: KT 이동통신 기반 방문자(현지인·외지인·외국인), 카드 소비, 내비 목적지 검색. 공개 단위는 시군구(일별). 읍면동은 지자체 계정 전용 → 경주시 협조 시 가능. CLAUDE.md §4 "통신사 유동인구 미구매"의 공식 대체재

  - key: stcis
    name: 교통카드 빅데이터 통합정보시스템 (한국교통안전공단)
    type: T2
    url: https://www.stcis.go.kr
    method: 웹 통계 / 파일 대중교통 이용현황요약 (data.go.kr 15122740)
    cadence: 수시. 최신 수정 2025-06-30
    note: 정류장별·노선별·지역별 승하차. 원도심 정류장 단위 = S2 유동인구 프록시(proxy_for=보행 유입). 정류장 좌표는 TAGO 정류장 정보와 조인

  - key: korail_station
    name: 코레일 역별 승하차 인원
    type: T2
    url: https://www.data.go.kr (코레일 검색)
    method: 파일 / OpenAPI
    note: 신경주역·서경주역 일별 승하차. 외부 유입의 정량 앵커. 데이터셋 ID 확인 필요

  - key: road_re_kr
    name: 교통량정보제공시스템 (국토부·한국건설기술연구원)
    type: T2
    url: https://www.road.re.kr/pds/data_02.asp
    method: 자료실 다운로드 (브라우저 필요 — curl 차단)
    cadence: 연. 1997–2025 상시·수시 통계연보 + 지도CD 5종 확인
    note: 일반국도·지방도 상시/수시 조사지점 AADT(차종·방향·시간대). 경주 통과 국도 4·7·35·20·28호선 지점. S3, 원도심 통과 구간만 S2

  - key: ex_aadt
    name: 한국도로공사 연평균일교통량
    type: T2
    url: https://www.data.go.kr/data/15062249/fileData.do
    method: 파일
    cadence: 연. 최신 20241231
    note: 고속도로 구간·영업소(경주IC 등). S3

  - key: its_flow
    name: 국토부 교통소통정보 + 표준노드링크 (국가교통정보센터)
    type: T2
    url: https://www.its.go.kr/opendata/opendataList?service=traffic
    method: OpenAPI 실시간(5분) / 표준노드링크 SHP (nodelink.its.go.kr)
    auth: its.go.kr 인증키 (data.go.kr 15040463 경유 가능)
    note: |
      ★ 실측(2026-09-17): 시군도 포함됨 — 태종로·원화로·금성로 등 원도심 링크 5분 속도 제공. 키 DATA_GO_KR_KEY_CAR.
      키 서비스 항목에 돌발·CCTV·VMS·차량검지(VDS=교통량)는 미포함 → its.go.kr 마이페이지에서 추가.
      표준노드링크 zip은 nodelinkRef 페이지 CSRF 토큰 + /opendata/nodelinkFileSDownload/DF_{seq}/0

  - key: gj_its
    name: 경주시 교통정보센터
    type: T2
    url: https://its.gyeongju.go.kr/trafficstat.do
    method: 웹 화면만 (교통통계: 도로명·구간별 평균/최고/최저 속도·혼잡시간). 파일·API 없음 — 2026-09-16 확인
    note: 중앙로·태종로·원화로 등 시내 구간속도의 유일한 공식 출처. 원자료는 정보공개청구 대상 (requests.csv)

  - key: ktdb
    name: 국가교통DB (KTDB)
    type: T2
    url: https://www.ktdb.go.kr
    method: 자료 신청 (심사)
    note: 링크별 배정 교통량·O/D 매트릭스. gaps.md 기등록. data.go.kr 15117884(20260803)는 통행실태조사 요약 XLSX일 뿐 링크 교통량 아님

  - key: sgis_biz
    name: SGIS 사업체·종사자 통계 (집계구·격자)
    type: T2
    url: https://sgis.kostat.go.kr
    method: OpenAPI / 다운로드
    note: 종사자 수 = 주간 활동인구 프록시(proxy_for=주간 상주). 상가 점 데이터와 교차 검증용

