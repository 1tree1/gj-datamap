  - key: eum_gosi
    name: 토지이음 고시정보 (국토부 LURIS)
    type: T1
    url: https://www.eum.go.kr/web/gs/gv/gvGosiList.jsp
    method: 웹 검색(시군구 47130) → 고시문·지형도면 PDF/JPG 다운로드. DownloadBig.jsp는 curl 가능, 고시문은 FileDownload.do POST(seq, file)
    cadence: 고시 즉시
    note: 지구단위계획·용도지구·역사문화환경 허용기준 고시의 **원문 레지스트리**. 경주시 고시 제2026-8호(2026-01-22) 여기서 확보 → A-001/A-002

  - key: heritage_map_dl
    name: 국가유산청 지정유산 지도다운로드
    type: T1
    url: https://www.data.go.kr/data/15148507/fileData.do
    method: SHP 파일 (또는 gis-heritage.go.kr 데이터개방 > 파일다운로드)
    cadence: 최신 2025-09-22
    crs: 확인 필요
    note: 지정구역·보호구역·**역사문화환경보존지역·매장유산유존지역** 폴리곤 8,227건. 4겹 중 ③ + 매장문화재를 한 번에. 허용기준(구역별 높이)은 별도 고시(토지이음)와 조인

  - key: heritage_permit
    name: 역사문화환경 보존지역 내 건축행위 등 허용기준
    type: T1
    url: https://www.cha.go.kr (2023 공간정보 서비스 허용기준 데이터 개방) / 토지이음 고시정보(국가유산청 고시)
    method: 파일 / 고시문
    note: 유산별·구역(1~3구역)별 허용 높이. heritage_map_dl 폴리곤에 속성으로 붙일 것

  - key: godo_district
    name: 고도 보존 및 육성 특별법 — 경주 고도 지정지구(특별보존지구·역사문화환경지구)
    type: T1
    url: 토지이음 고시정보 검색 (담당기관 국가유산청, '경주 고도')
    method: 고시문·지형도면 PDF
    note: 2012 지정, 경주 277.1㎢(특별보존 219.2 / 역사문화환경 57.9)[T4 korea.kr]. 4겹 중 ②. 지구단위계획 결정도 1매의 '최고고도지구(15/20/25/36m)'는 국토계획법 용도지구로 별개 — 둘 다 그릴 것

  - key: unesco_buffer
    name: 세계유산 경주역사유적지구 완충구역
    type: T1
    url: https://whc.unesco.org/en/list/976 (지도 PDF) / 국가유산청
    method: PDF → 지오레퍼런싱, 또는 heritage_map_dl 보호구역 레이어에 포함 여부 확인
    note: 벡터 공개 여부 미확인. gaps 기등록

  - key: vworld_upis
    name: V-World 도시계획(UPIS) 레이어
    type: T1
    url: https://www.vworld.kr/dev/v4dv_2ddataguide2_s001.do
    method: 데이터 API WFS/WMS — 용도지역 LT_C_UQ111 · 용도지구 UQ112 · 용도구역 UQ113 · 도시계획시설 LT_C_UPISUQ15x 계열 · 지구단위계획구역 [코드 확인 필요]
    auth: API key
    note: 4겹 중 ①과 기존 도시계획시설 결정. 고시 반영 지연 있음 — 2026-8호 반영 여부 확인 후 사용

  - key: land_owner
    name: 국토부 토지소유정보
    type: T1
    url: https://www.data.go.kr/data/15045905/fileData.do
    method: SHP/CSV (시군구 단위, 20240408 등록) / nsdi 오픈마켓
    note: 필지별 소유구분(국유·공유·사유·법인 등). 부지매입비 2,091억[T4] 검증의 출발점. 개인 식별 정보 없음(소유구분만)

  - key: land_price
    name: 국토부 개별공시지가정보
    type: T1
    url: https://www.data.go.kr/data/15052266/fileData.do
    method: SHP/CSV (20250121 등록) / V-World 토지특성 API(PNU)
    cadence: 연 (매년 5월 결정공시)
    note: PNU 조인. 실거래가는 rt.molit.go.kr API 별도

  - key: city_go_kr
    name: 도시재생 종합정보체계 개방데이터
    type: T2
    url: https://www.city.go.kr/portal/notice/opensys/contents02/link.do
    method: 파일 다운로드(회원) — 활성화지역 진단지표(시군구·읍면동), **쇠퇴진단지표(시군구·읍면동·집계구)**, 잠재력지표
    note: 공모 자격 요건(쇠퇴 3지표) 공식 산출본. 집계구 단위가 있어 S2 가능. 도시재생활성화지역(역전·황오1) 경계는 사업현황 메뉴/경주시 고시에서

  - key: bldg_ledger
    name: 건축HUB 건축물대장 (표제부·총괄표제부)
    type: T1
    url: https://www.data.go.kr/data/15044719/fileData.do (총괄표제부 파일, 월 갱신) / 건축HUB 건축물대장정보 API
    method: 파일(시군구 전량) / API(PNU·지번)
    note: 사용승인일 → 노후건축물 비율(20년·30년). 주용도·연면적·층수. 연속수치지도 건물(bjcd+bonu+bunu → PNU)과 조인

  - key: bldg_energy
    name: 건축HUB 건물에너지정보 (전기·가스)
    type: T2
    url: https://www.data.go.kr/data/15135963/openapi.do (API) / 15054214 (전기 파일 20240930)
    method: API(지번, 월) / 파일
    note: proxy_for=공실. 단독주택·200세대 미만 공동주택·산업용 제외 → 원도심 상가·업무 건물에는 유효, 주거에는 무효. 반드시 제외 범위를 지도 범례에 명시

  - key: vacant_house
    name: 경주시 빈집 실태조사
    type: T2
    url: 경주시 (정보공개청구) / 빈집정보시스템
    method: 청구
