  - key: vworld_uq123
    name: V-World 용도지구 계열 레이어 실사용 검증 (2026-09-17)
    type: T1
    url: https://api.vworld.kr/req/data
    method: LT_C_UQ121 경관지구 · UQ123 고도지구(+최저고도지구) · UQ124 방화지구 · UQ126 보호지구 · UQ128 취락지구 — S2 bbox 동작. UQ112/113은 관리지역·농림지역(용도지구 아님). UQ122/125/127/129/130/UPISUQ1xx는 INVALID_RANGE 또는 0건
    note: |
      UQ123 속성은 uname('고도지구'/'최저고도지구')·dyear·dnum(마지막 고시)뿐 — 높이 상한 없음.
      높이는 고시 결정조서(A-004)와 지형도면(A-005)에서 라벨을 읽어 배정(pipeline/build_godo.py).
      dnum으로 원 고시를 역추적 가능: 2020-479(고도지구 정비), 2023-449(용도지구 변경), 2024-241(황오1지구 지적재조사), 2021-220/2010-618(재정비), 2022-142(보문천군).
