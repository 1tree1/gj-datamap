<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PoC 시나리오 대시보드</title>
<style>
  :root { --bg:#f4f1ea; --panel:#fffdf8; --ink:#25231f; --mute:#7a7569; --line:#d9d3c5; --acc:#8a2f1d; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 "Malgun Gothic", "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  #app { display:grid; grid-template-columns: 250px 1fr 300px; grid-template-rows: 1fr 250px; gap:8px; height:100vh; padding:8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; overflow:hidden; }
  h2 { margin:0 0 8px; font-size:12px; letter-spacing:.04em; color:var(--mute); font-weight:600; }
  #controls { grid-row: 1 / span 2; overflow:auto; }
  label { display:block; margin:10px 0 2px; }
  input[type=range], select { width:100%; }
  output { float:right; font-family:"Courier New", monospace; }
  #viewport { position:relative; padding:0; }
  #viewport canvas { display:block; width:100%; height:100%; }
  #kpis { display:grid; grid-template-columns: repeat(2, 1fr); gap:4px; }
  .ring { height:112px; }
  #bottom { grid-column: 2 / span 2; display:grid; grid-template-columns: 1.2fr 1fr 1fr; gap:8px; padding:0; background:none; border:none; }
  #bottom .card { height:100%; }
  #timing { font-family:"Courier New", monospace; font-size:11px; white-space:pre-wrap; color:var(--acc); margin-top:12px; }
  .chart { width:100%; height:calc(100% - 22px); }
  .tag { font-size:10px; color:var(--mute); }
</style>
</head>
<body>
<div id="app">
  <div id="controls" class="card">
    <h2>입력 · Design Option</h2>
    <select id="opt"></select>
    <label>층수 배율 <output id="o_fm"></output></label><input id="fm" type="range" min="0.5" max="1.6" step="0.05" value="1" />
    <label>주거 비중 보정 <output id="o_res"></output></label><input id="res" type="range" min="0.5" max="2" step="0.05" value="1" />
    <label>공사비 배율 <output id="o_cx"></output></label><input id="cx" type="range" min="0.8" max="1.5" step="0.02" value="1" />
    <label>할인율 % <output id="o_dr"></output></label><input id="dr" type="range" min="2" max="12" step="0.25" value="5" />
    <label>임대·매각 수익 배율 <output id="o_rv"></output></label><input id="rv" type="range" min="0.6" max="1.5" step="0.02" value="1" />
    <div id="timing"></div>
    <p class="tag">PoC: 단위수익·원단위는 속도 측정용 가정치(출처 없음). 도형은 work/20261005_plan_clean/gis 사본.</p>
  </div>
  <div id="viewport" class="card"></div>
  <div id="kpis" class="card"></div>
  <div id="bottom">
    <div class="card"><h2>NPV · IRR · 손익분기 (닫힌식)</h2><div id="c_cash" class="chart"></div></div>
    <div class="card"><h2>5목적 레이더 (현재안 vs 균형안)</h2><div id="c_radar" class="chart"></div></div>
    <div class="card"><h2>평행좌표 (합성 파레토 200점 · 브러시)</h2><div id="c_pcp" class="chart"></div></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
