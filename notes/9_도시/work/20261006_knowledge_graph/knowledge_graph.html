,"P_PARK","P_JOBS","P_OPS","PLA18"]},{"fid":"K2-059","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 67/72 · 12/72 · PDF 71쪽·12쪽","page":"67","kind":"direction","topic":"정주우선행정 — KPI 3종(인구유출률·청년신혼 정착률·고령 삶의 만족도)","text":"강연은 관광객 수보다 머무는 시민의 수, 사업 건수보다 주민 삶의 변화를 성과로 삼는 행정을 표방하며 KPI로 인구유출률, 청년·신혼 정착률, 고령 삶의 만족도 3개를 든다. '거주적합성(여기서 오래 살고 싶은 도시의 조건)'을 재생의 첫째 기준으로 내세우고(슬라이드 12: 관광객 중심 개발 → 주민 거주 중심 재생), 젠트리피케이션 슬라이드(20)는 황리단길을 들어 재생의 성공을 '예뻐지는 것'이 아니라 주민이 계속 살 수 있는지로 재야 한다고 쓴다. 정주성은 住(노후주택 개선·집수리)·職(동네 마을기업·소상공인, 세대별 일자리 매칭)·遊(경로당·마을광장·공원)·學(시민강좌·평생학습·마을학교) 4요소로 정리된다(슬라이드 54).","values":"KPI 3종: 인구유출률 / 청년·신혼 정착률 / 고령 삶의 만족도; 정주성 4요소 住職遊學","note":"경주시 지역재생지원센터장의 2026.8 강연 — 정책 방향 발언이며 법정 지표가 아님. 두 축 KPI 중 '거주 축' 후보 지표. 住職遊學 4요소는 청년주거·일자리·여가를 묶는 직주락 구성과 방향이 같다(수치 기준은 없음).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_TWOAX","P_HOUSE","P_JOBS","PL26_TALK"]},{"fid":"K2-060","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 51/72 · PDF 55쪽","page":"51","kind":"conflict","topic":"2040 다핵형 공간구조 — 1도심 5지역중심, '모든 것을 시내로 모으지 않겠다'","text":"원도심 하나에 힘을 몰아주는 방식에서 벗어나 신경주·안강·외동·감포·불국 5개 지역중심이 함께 커지는 다핵형 공간구조를 제시하며 '모든 것을 시내로 모으지 않겠습니다'를 핵심방향으로 한다.","values":"1도심 + 5지역중심(신경주·안강·외동·감포·불국)","note":"분산 삽입형 대안의 시 정책 정합성 근거이면서, 시청·의회를 구경주역에 집중하는 안과는 긴장 관계.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_HALL","P_USE","PL26_TALK"]},{"fid":"K2-061","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 52·53·55/72 · PDF 56·57·59쪽","page":"52","kind":"direction","topic":"폐선부지 활용 3축 — 녹지축·문화복합축·주민 공유자산(국유재산 무상귀속), 초록 리본, 스마트트램","text":"2021 폐선된 동해남부선을 '100년 만에 되찾은 도심의 큰 땅'으로 보고 녹지축(도시바람길숲·스마트트램·산책로), 문화복합축(옛 경주역·폐역사·마을광장 재활용), 주민이 함께 쓰는 자산(국유재산 무상귀속)으로 잇는다고 한다. 옛 물길·고분군·폐선부지를 하나의 초록 리본(도시바람길숲·북천 수변축·골목 보행친화거리)으로 잇고, 폐선부지를 따라 조용하고 친환경적인 노면전차(스마트트램) 도입을 검토한다.","values":"녹지축 / 문화복합축 / 주민 공유자산; 스마트트램 검토","note":"'국유재산 무상귀속'은 시의 정책 지향이며 법적 확정이 아님 — 2026 국가시범지구 가이드라인은 시행자의 부지 권원 확보를 요구한다(archive B-S3-20260206).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_OPEN","P_STN","P_TRAMHUB","P_COST","P_OPS","PL26_TALK"]},{"fid":"K2-062","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 32·36·37·38/72 · PDF 36·40·41·42쪽","page":"36","kind":"fact","topic":"구경주역사(現 경주문화관1918)·급수탑·황오동 철도관사촌 = 철도 시스템 유산","text":"구경주역사(원화로 266, 1936.11.1 영업개시, 연면적 876.6㎡, 벽돌 단층 한식골기와·동판지붕 절충형)는 현재 '경주문화관1918'로 리모델링돼 문화시설로 쓰이고, 1920년대 후반 급수탑과 황오동 철도관사촌(1930년대 중반~, 해방 전 80여 호, 약 7할 현존, 2호 연립 격자배치)이 함께 남아 하나의 철도 시스템으로 읽어야 한다고 한다. 보존 vs 활용, 식민잔재 vs 지역정체성, 생활공간 vs 관광자원의 세 축 긴장을 제시한다.","values":"구역사 876.6㎡; 1936.11.1; 급수탑 1920년대 후반; 관사촌 80여 호 중 약 7할","note":"문화재 등록 여부·이축 가능성은 언급 없음. 구 역사가 이미 문화시설로 운영 중이라 '근대역사관' 신설 대신 기존 시설과의 역할 분담이 쟁점.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_STN","P_CULT","D_RAILHERIT","PL26_TALK"]},{"fid":"K2-063","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 69/72 · PDF 73쪽","page":"69","kind":"direction","topic":"매장유산 규제 극복 공법 — 무굴착 마이크로파일·필로티 다층보존·디지털 우회","text":"파지 않고 짓는 기술로 지하 무굴착 공법(마이크로파일), 건물 아래 유적층을 그대로 두는 필로티·다층보존, 개발이 어려우면 메타버스·XR로 대체하는 디지털 우회를 병행하자고 제시한다.","values":"마이크로파일; 필로티; XR","note":"공법 열거 수준이며 구체 심도·구조 제한 수치는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_DIG","P_FORM","P_PARK","PL26_TALK"]},{"fid":"K2-064","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 2/72·PDF 2쪽, 슬라이드 72/72·PDF 77쪽","page":"2","kind":"direction","topic":"주민참여형 2035 도시재생전략계획 수립 예정 — 시민참여계획단(안)","text":"강연 서문은 '주민참여형 2035 도시재생전략계획 수립'을 다룰 주제로 제시하고, 마무리 슬라이드에서 도시재생시민참여계획단(안)·주민협의체 정기모임·시민강좌를 다음 단계로 안내한다(담당: 경주시 철도도심재생과 지역재생지원센터).","values":"2035 도시재생전략계획 수립; 담당 철도도심재생과","note":"전략계획 재정비 시 부지의 활성화지역 편입 기회가 될 수 있음(추정). 수립 일정은 미기재.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_COST","P_PHASE","PLR_AREA","PL26_TALK"]},{"fid":"K2-065","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 5·6·7·66/72 · PDF 5·6·7·70쪽","page":"5","kind":"fact","topic":"2026 인구·고령·주택·일자리 현황","text":"2026.6 총인구 243,051명(세대 127,119), 65세 이상 29.7%(72,258명), 주택보급률 120.8%(2025.1)이며 원도심 30년 이상 노후건축물이 55~65%라고 한다. 제조업 사업체의 80% 이상이 50인 미만이라 청년 일자리와 미스매치가 크다고 진단한다.","values":"243,051명(2026.6); 65세↑ 29.7%; 주택보급률 120.8%; 원도심 30년↑ 55~65%","note":"2026 최신치지만 강연 슬라이드 수치 — 인용 시 KOSIS·주민등록통계 원자료로 대체.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_HOUSE","P_JOBS","P_TWOAX","PL26_TALK"]},{"fid":"K2-066","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"1회차 황오동 · 지정토론① 황오동장 · 인쇄 16~17쪽 (PDF 12쪽)","page":"16","kind":"fact","topic":"황오동 사업 현황·일정 — 문화관1918 운영, 태종로 2026·양정로 2027 예정","text":"황오동장은 경주역사 및 부지개발 성과로 경주문화관1918(경주역문화플랫폼) 운영과 황오황촌 임시공영주차장 준공을 들고, 중부·황오 통합행정타운 건립, 화랑초~경주고 도시계획도로 확장(2026 예정), 태종로 개설(2026 예정), 양정로 개설(2027 예정)을 예고한다.","values":"태종로 개설 2026; 양정로 개설 2027; 화랑초~경주고 도로 확장 2026","note":"A-007(태종로 2020~2021, 양정로 ~2025)보다 일정이 늦춰짐. 2025.6 시점 발언.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_CROSS","P_PHASE","P_STN","P_PARK","PLM_FORUM"]},{"fid":"K2-067","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"2회차 중부동 · 지정토론① 중부동장 · 인쇄 34~35쪽 (PDF 21쪽)","page":"34","kind":"standard","topic":"도심 고도제한 완화 — 20~25m → 36m (2020.12.2 도시관리계획안 고시)","text":"중부동 역점사업 목록에 '도심고도제한완화지역·재건축 활성화'가 있고 내용은 고도제한 완화 20~25m→36m, 도시관리계획안 고시(2020.12.2)다.","values":"20~25m → 36m; 2020.12.2","note":"적용 구역(부지 포함 여부)은 미기재 — 중부동 재건축 활성화 목적으로 보이며 부지(성동동)에 그대로 적용된다는 근거 없음. 고도지구 도면 확인 필요.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FAR","PLM_FORUM"]},{"fid":"K2-068","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"1회차 황오동 · 지정토론② 주민자치위원 · 인쇄 18~19쪽 (PDF 13쪽)","page":"18","kind":"direction","topic":"황오동 주민 요구 — 폐철도 활용을 체감 가능하게, 건축규제는 공공주도 개발로","text":"황오동 주민자치위원은 인구감소와 행정동 통합, 경주역 폐철과 급감한 유동인구, 문화재·고도 개발제한, 공설시장 노후화, 불법주차·도보이동권을 현안으로 들고, 폐철도 활용방안을 시민이 가시적으로 체감하도록 추진하고 건축규제에 의한 제한을 공공주도의 개발행위로 풀자고 제안한다.","values":"","note":"8개 동 세션 중 경주역 폐철(폐역)을 현안으로 직접 든 곳은 황오동이고, 선도동은 폐철도 구간 활용을 별도로 거론(별도 항목). 시청·의회 이전 요구는 없음(gap 항목).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_FAR","P_PARK","P_OPS","PLM_FORUM"]},{"fid":"K2-069","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"2회차 중부동 · 주제발표 도시정책관 · 인쇄 32~33쪽 (PDF 20쪽)","page":"32","kind":"conflict","topic":"도시정책관 발언 — 황리단길 유사 대체제는 정체성 약화, 젠트리피케이션·지구조례 과제","text":"경주시 도시정책관은 황리단길 지속가능성 과제로 공공상가 조성·공급(임대료 상승 관련), 100년가게 육성, 대규모 상점 억제, 지구조례 제정, 코워킹 공간, 바가지요금 근절, 젠트리피케이션, 공연장·여행자거리(global street)를 나열하고, 황리단길과 유사한 대체제를 조성하면 황리단길 정체성이 약화된다(금리단길)고 경고한다. 같은 발표에서 대중교통 일정구간 무료·미래교통수단 도입, 신라왕경 중심구역 확대 보존과 노후주거지 재건축·저층주거 도입, 노인인구 대책과 1도심·부도심 공간체계 재구축을 제시한다.","values":"","note":"부지에 황리단길형 상업 거리를 만드는 안에 대한 시 정책 담당자의 경고 — 판매·체험 기능은 성동시장 연장·업종 비중복 원칙으로 제한할 근거.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_RETAIL","P_TRAMHUB","P_HOUSE","PLM_FORUM"]},{"fid":"K2-070","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"4회차 동천동 · 지정토론②·비전 · 인쇄 70~71·76~77쪽 (PDF 39·42쪽)","page":"76","kind":"conflict","topic":"동천동 비전 — 시청 소재 '행정 중심' 정체성","text":"동천동은 경주시청이 있는 행정의 중심·부도심으로 소개되고, 주민 비전은 '청년이 머무는 활기찬 살기 좋은 행정도시, 동천동'이다. 시청이 구경주역으로 옮겨가면 동천동의 정체성과 이전적지 활용 문제가 생길 수 있다(해석).","values":"동천동 인구 21,776명·10,546세대(2023.6)","note":"사실(동천동 행정 중심 비전)은 확인, '시청 이전과의 충돌'은 추정. 동천~황성 도시숲(북천~형산강)도 같은 회차에서 언급. 동천동은 A-006 p.251 기준 이미 쇠퇴 2개 충족(인구 −5.5%·노후 63.8%)이라 이전적지 공동화가 겹칠 수 있다(추정).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_HALL","PL30_MULTI","PLM_FORUM"]},{"fid":"K2-071","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"7회차 선도동 인쇄 118~119·124~125쪽, 3회차 황남동 인쇄 52~53쪽, 6회차 성건동 인쇄 104~105쪽 (PDF 63·66·30·56쪽)","page":"118","kind":"direction","topic":"인접 동 계획 — 선도동 폐철도 구간·태종로 녹지축, 황남동 통합환승주차장, 성건동 주차난","text":"선도동은 태종로 녹지축 개선(지중화)과 폐철도 구간 활용, 경주역~광명~충효 도로망 연결선 확보를 과제로 들고 시의원은 선도동 폐철도부지를 황토산책길·자전거길·주차장 등으로 전환하자고 한다. 황남동은 문화관광 통합환승주차장 조성을, 성건동은 석장동 공용주차장 조성(만성적 주차난 해소)을 역점사업으로 든다.","values":"황남동 문화관광 통합환승주차장; 석장동 공용주차장; 선도동 폐철도부지 → 산책·자전거길","note":"남측(선도동) 폐선축 연결과 인근 환승·주차 사업이 부지의 환승·주차 기능과 중복될 수 있음(위치·규모 미기재).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_PARK","P_TRAMHUB","PLM_FORUM"]},{"fid":"K2-072","doc":"B-006","doc_title":"2025 경주시 찾아가는 도시재생대학 결과보고서 (2025.08)","loc":"1~8회차 전체 발표·토론·비전 요지 (PDF 9~78쪽)","page":"","kind":"gap","topic":"8개 동 세션 어디에도 시청·의회 이전 요구·논의 없음","text":"8개 동(황오·중부·황남·동천·황성·성건·선도·월성) 퍼실리테이션 비전과 토론 요지에 구경주역 부지로의 시청·의회 이전을 요구하거나 논의한 대목이 없다. 행정 관련 언급은 중부·황오 통합행정복합타운(동 단위: 행정복지센터 1,163㎡·주민자치센터 864㎡, 위치 미기재)과 동천동의 행정중심 비전뿐이다.","values":"통합행정복합타운 행정복지센터 1,163㎡·주민자치센터 864㎡(각 2층)","note":"텍스트 검색(PyMuPDF) 기준이며 이미지 속 문자는 확인 불가. 시청 이전의 시민 수요 근거는 A-011(2030 기본계획 설문)·B-001에서 보강해야 함. '행정복합타운'이라는 이름이 동 단위(약 2,000㎡)와 부지 단위로 혼용되므로 구분 필요.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"guides","nodes":["P_HALL","PLM_FORUM"]},{"fid":"K2-073","doc":"B-007","doc_title":"행복황촌 CBT 기반 마을호텔 발표자료 (행복황촌 마을기업·협동조합, 2025.10 기준)","loc":"슬라이드 5·7·10·11·13·23·24·25 (PDF 5·7·10·11·13·23~25쪽)","page":"11","kind":"fact","topic":"거점시설 5개 관리위탁(2025.4~2028.3)·마을기업·협동조합·지역재생회사(CRC)","text":"행복황촌은 마을기업으로 지정(2025)돼 경주시로부터 거점시설 5개(황촌마을활력소 871.44㎡·황촌상권활력소 488.76㎡·마을부엌&카페 52.29㎡·게스트하우스 49.59㎡·황오동사랑채 57.75㎡)를 2025.4~2028.3 3년간 위탁 운영하며, 마을호텔 조합기여금(월 15만원)·공간임대·F&B·체험 수익으로 시설 운영비를 충당하고 지역재생회사(CRC) 육성을 목표로 한다. 시설 운영방식은 사무위탁·관리위탁·무상사용·사용수익허가를 구분한다.","values":"5개 시설 합계 약 1,520㎡; 위탁 3년; 조합기여금 월 15만원; 총사업비 254.47억(p.5)","note":"조합 설립 시 조합원이 p.13은 21명·출자금 2,100만원, p.7은 32명으로 달리 적음(B-004 p.25는 21명; p.13 제목엔 '마을기업_61인'도 병기). p.5는 사업기간을 2021~24년(4년)으로 적어 A-007 변경판(2021~2026)과 다름. p.28은 주민이 거점시설을 직접 운영하려면 공동체 수익 구조가 있어야 한다고 서술(운영 재원 논리). 협동조합 자체 발표자료(자기보고).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_OPS","P_COST","PLA20"]},{"fid":"K2-074","doc":"B-007","doc_title":"행복황촌 CBT 기반 마을호텔 발표자료 (행복황촌 마을기업·협동조합, 2025.10 기준)","loc":"슬라이드 14~17 (PDF 14~17쪽)","page":"16","kind":"fact","topic":"마을호텔 숙소 21개소(2025.10) — 빈집·철도관사 전환","text":"2025.10 현재 행복황촌 마을호텔은 숙소 21개(외국인관광도시민박업 19·한옥체험업 2)이며 2024년 12개소에서 9개소 늘었다. 빈집·철도관사(6등급 적산가옥)를 숙소·카페로 전환한 사례(황오여관, 경주역장관사 카페)가 있고, 외국인관광도시민박업은 도시재생활성화계획에 따른 마을기업에 허용된 특례를 근거로 한다.","values":"숙소 21개(민박 19·한옥체험 2); 2024년 12개 → 2025.10 21개","note":"원문은 '1년 내 약 57% 증가'로 적으나 12→21은 +75%로 불일치(같은 자료 p.10은 2025 현재 19개 운영 중). 부지에 숙박을 넣을 때 기존 21개 마을숙소와 수요를 나누게 됨. 외국인관광도시민박업 특례는 활성화계획상 마을기업에 허용된 것이므로(p.14) 활성화지역 밖 부지의 숙박에 그대로 적용되는지는 별도 확인 필요(추정).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_STAY","P_HOUSE","P_STN","PLA20"]},{"fid":"K2-075","doc":"B-007","doc_title":"행복황촌 CBT 기반 마을호텔 발표자료 (행복황촌 마을기업·협동조합, 2025.10 기준)","loc":"슬라이드 18~19 (PDF 18~19쪽)","page":"18","kind":"conflict","topic":"지역경제 지표와 유동인구 수치 불일치 — 일평균 41,165명 vs 22,646·5,431명","text":"마을호텔 효과로 카페 월평균 매출 +11%, 신규고객유입률 89.4%, 정규일자리 37개(연 8,880명 연인원), '일평균 유동인구 41,165명 확보'(소상공인365 재인용 2025.7.14)를 제시하나, 같은 구역을 다룬 B-004는 주요 상권 유동인구 5,431명(2024), B-005는 황오동 사업지 22,646명(2024)·20,986명(2024.01~2025.04)으로 크게 다르다.","values":"41,165명 vs 22,646명(B-005) vs 5,431명(B-004); 정규일자리 37개","note":"집계 반경·구역 정의 차이로 추정(황오동 전체는 2024년 44,922명, B-005 p.63 → 41,165는 황오동 전체급). 같은 정의로 재추출하기 전에는 인용 금지.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","PLA20"]},{"fid":"K2-076","doc":"B-004","doc_title":"2025년 행복황촌(성동·황오지구, 일반근린형) 도시재생 성과지표 및 모니터링 용역 결과보고서 (2025.12)","loc":"Ⅲ-3.2 유동인구 인쇄 93쪽, Ⅲ-3.6 방문객 인쇄 106~118쪽, 지표별 추이 인쇄 35~37쪽 (PDF 동일)","page":"93","kind":"fact","topic":"행복황촌 유동인구·방문객 기준선 (방문 축)","text":"주요 상권 유동인구(소상공인 상권정보, 통신사 50m셀·중심 300m)는 2019 1,096명→2024 5,431명(+396%)이며 2021~2023은 1,295·1,300·1,623명이다. 방문객은 경주시민 75.0%·여성 73.0%·60대 이상 41.0%이고, 체류시간은 2022년 2.45시간→2023년 2.86시간→최신 3.05~3.30시간, 방문객 지역 만족도는 72.8점(2022)→83.6점(2023)→84.5~85.1점(최신), 객단가는 타지역 약 10만원 vs 7만원이다.","values":"유동인구 1,096(2019)→5,431(2024); 체류 2.45→2.86→3.05~3.30시간; 객단가 7만/10만원; 경주시민 75.0%","note":"최신 값이 본문 요약(p.25: 체류 3.05시간·만족 85.1점)과 표(p.37: 3.30시간·84.5점)에서 다르고 마지막 시점의 연도 표기가 불명확. 방문객 대부분이 시민이라 '관광' 축 기준선으로는 한계.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","PLM_MONITOR"]},{"fid":"K2-077","doc":"B-004","doc_title":"2025년 행복황촌(성동·황오지구, 일반근린형) 도시재생 성과지표 및 모니터링 용역 결과보고서 (2025.12)","loc":"Ⅲ 지표별 추이 인쇄 34~39쪽, 요약 인쇄 22~27쪽 (PDF 동일)","page":"39","kind":"fact","topic":"행복황촌 거주 축 기준선 — 정주의향 98%·사업 직후 정점 후 하락·빈집 7.6%","text":"주민 정주의향은 97.1→98.0→98.7%(3개 시점)이고, 이웃 소통 69.0→64.0점, 이웃 신뢰 75.2→71.2점, 황오동 소속감 79.0→66.8점(2023→2024)으로 사업 직후 정점 뒤 하락했다. 빈집은 7.6%(394호 중 30), 빈점포는 10.7%(112개 중 12)이고 주택 전수 701가구(거주 1,117명)·상가 전수 112개가 조사 모집단이다.","values":"정주의향 97.1→98.7%; 빈집 7.6%; 빈점포 10.7%; 701가구/1,117명; 상가 112개","note":"표(p.39)의 정주의향은 3개 값만 있고 연도 열 정렬이 불명확해 연도 매핑은 원문 확인 필요.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","P_HOUSE","PLM_MONITOR"]},{"fid":"K2-078","doc":"B-004","doc_title":"2025년 행복황촌(성동·황오지구, 일반근린형) 도시재생 성과지표 및 모니터링 용역 결과보고서 (2025.12)","loc":"연구요약 인쇄 30쪽 (PDF 30쪽; 본문 Ⅴ-1 IPA)","page":"30","kind":"fact","topic":"중요도–만족도(IPA) — 주차·도로·대중교통이 최우선 개선과제","text":"IPA에서 기초생활기반(주차·도로·대중교통)은 중요도 81.8·만족도 39.5로 '중점개선', 시설 접근성(도시공원·문화시설·대중교통시설)은 83.0·45.3, 상권유지·일자리는 68.5·39.8이며 안전은 89.0·72.0으로 유지 영역이다.","values":"기초생활기반 81.8/39.5; 시설접근성 83.0/45.3; 상권·일자리 68.5/39.8; 안전 89.0/72.0","note":"주민이 건물보다 주차·도로·대중교통·공원 접근을 우선한다는 근거(표본 200명).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_PARK","P_OPEN","P_TRAMHUB","PLM_MONITOR"]},{"fid":"K2-079","doc":"B-004","doc_title":"2025년 행복황촌(성동·황오지구, 일반근린형) 도시재생 성과지표 및 모니터링 용역 결과보고서 (2025.12)","loc":"Ⅲ-6.1 젠트리피케이션 인쇄 142~145쪽, 지표별 추이 인쇄 39쪽 (PDF 동일)","page":"145","kind":"fact","topic":"지가·임대료 — 경주역 개발 기대가 지가 상승 요인으로 서술","text":"행복황촌 44개소 공시지가 평균은 표 기준 442,934(2021)→485,880(+9.1%)→516,904(+6.4%)→488,003(−5.59%)→486,217원/㎡(−0.37%, 2025)이며, 임대료는 '경주역 개발 등이 예상되면서 지가가 상승할 것으로 예상'되고 게스트하우스 입점 소식에 임대료를 올리는 건물주가 많아 임대료 지원 정책이 필요하다고 한다.","values":"공시지가 442,934→486,217원/㎡(2021→2025); 최고 516,904","note":"부지 개발 발표 자체가 인접 임대료에 영향을 주므로 두 축 중 '생활업종' 보호 장치(상생협약·임대료 상한)가 필요. 본문 p.42는 하락 시점을 22→23년으로 적어 연도 표기가 표와 한 해 어긋남. B-007 p.19는 '부동산가치 급증·거래 급증·귀향 창업'을 서술하나 수치 없는 자기보고이고, 이 표의 공시지가는 최근 2개 시점 하락(측정 대상이 달라 직접 상충은 아님).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","P_TWOAX","P_COST","PLM_MONITOR"]},{"fid":"K2-080","doc":"B-005","doc_title":"2024년 황오동 원도심(중심시가지형) 도시재생뉴딜사업 성과지표 및 모니터링 용역 결과보고서 (2025.09)","loc":"Ⅳ-4-2) 유동인구 추이 인쇄 48쪽, Ⅴ 인쇄 63·66·72·73쪽 (PDF 56·71·74·80·81)","page":"66","kind":"fact","topic":"황오동 사업지 유동인구 −14.7%(2020→2024) — 원인은 2021.12 경주역 폐역, 신 앵커 도입 제언","text":"황오동 사업지 연평균 유동인구는 2020 26,536→2021 25,065→2022 24,555→2023 22,077(황오동 전체 43,794명에 사업지 비율 보정)→2024 22,646명이고 2024.01~2025.04 일평균은 20,986명이다. 보고서는 감소의 주된 원인을 2021.12 경주역 폐역으로 보고 2004년 구 남원역 사례를 들어 역 폐쇄가 1~3년에 걸쳐 주변 유동인구를 급감시킨다고 해석하며, 폐역 부지의 신규사업과 황오동 재생사업을 연계해 새로운 앵커 기능으로 유동인구를 재창출하라고 제언한다.","values":"26,536(2020)→22,646(2024) = −14.7%; 일평균 20,986(2024.01~2025.04)","note":"폐역 인과는 해석이며 통계 검증이 없음. 행복황촌(B-004)과 정의가 달라 직접 비교 불가. 2023 값은 보정치.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","P_USE","PLM_MONITOR"]},{"fid":"K2-081","doc":"B-005","doc_title":"2024년 황오동 원도심(중심시가지형) 도시재생뉴딜사업 성과지표 및 모니터링 용역 결과보고서 (2025.09)","loc":"6. 성과관리 DB 대상지 창업 및 폐업 현황 인쇄 82~85쪽 (PDF 90~93쪽)","page":"82","kind":"fact","topic":"성동동 40(구 경주역 부지) 2024 영업신고 21건 — 모두 며칠 내 폐업한 임시영업","text":"2024년 대상지 창업 70건 목록 중 소재지가 성동동 40(경주역 40)인 영업신고가 21건(휴게·일반음식점·제과점)이고 전부 인허가 후 2~23일 안에 폐업했다(2024.05.03→05.05·05.26, 06.13→06.15, 09.06→09.08, 11.11~15→11.24). 축제·행사 임시영업으로 보이며 창업 70건의 30%, 같은 해 폐업 66건 중 같은 21건이다.","values":"21건 / 창업 70건 (30%); 폐업 66건에도 동일 21건 포함","note":"부지가 이미 행사·야시장 공간으로 쓰인다는 정황 — 1단계 광장·가변 공공공간 수요 근거. 이 보고서의 '창업 +45.8%(48→70)' 지표는 임시영업이 부풀린 값이므로 인용 주의. 임시영업 해석은 추정(건수는 직접 계수).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_OPEN","P_USE","P_PHASE","PLM_MONITOR"]},{"fid":"K2-082","doc":"B-005","doc_title":"2024년 황오동 원도심(중심시가지형) 도시재생뉴딜사업 성과지표 및 모니터링 용역 결과보고서 (2025.09)","loc":"Ⅴ-1 종합성과지표·자체성과지표 인쇄 63~64쪽 (PDF 71~72쪽)","page":"63","kind":"fact","topic":"종합성과 — 보행환경 사업 기대 높고 거점시설 만족도는 준공 후 하락","text":"거점공간 만족도는 청년창업거점센터·작은도서관 9.6(2022)→6.7→4.4(2024), 오픈스튜디오 6.6→4.3, 어울림마당 6.7→4.6으로 준공 후 매년 낮아진 반면, 미준공 사업 기대도는 글로벌 문화로 7.1·황오거리 7.2·안전한 골목길 7.5로 높고 주민 보행환경 만족도는 6.4→5.6으로 하락했다.","values":"거점 만족도 9.6→6.7→4.4; 기대도 7.1/7.2/7.5; 보행환경 만족 6.4→5.6","note":"주민 선호는 건물보다 보행환경 — 1단계 연결·보행 우선 논거(CLAUDE.md §5-2).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_PED","P_USE","P_CROSS","PLM_MONITOR"]},{"fid":"K2-083","doc":"B-ref1","doc_title":"2026 경주시 도시재생대학 1일차 발표자료 — 경주형 도시재생 개요 (박정호, 2026.8.12)","loc":"슬라이드 60/72 · PDF 64쪽","page":"60","kind":"direction","topic":"길의 가치 4항목 — 안전·쉼(50m마다 앉을 곳)·만남·이야기","text":"강연은 좋은 길의 조건을 안전(어르신이 넘어지지 않는 골목, 밝은 야간 조명), 쉼(50m마다 앉을 곳, 그늘나무·벤치), 만남(앉아 이야기 나눌 마당, 작은 광장), 이야기(도로명·표석·해설판)로 제시하고, 계획 방향으로 도로가 아니라 사람의 걸음을 기준으로 도시를 다시 짜 옛 물길·고분군·폐선부지를 하나의 초록 리본으로 잇는다고 한다(슬라이드 53).","values":"벤치·그늘 간격 50m; 야간 조명; 마당·작은 광장; 표석·해설판","note":"시 지역재생지원센터 강연 슬라이드의 정성 기준(법정 기준 아님). 50m 간격은 보행축 가구(街具) 배치 간격의 참고값으로만 쓸 수 있고 출처 등급은 T2 soft.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_PED","P_OPEN","P_AXIS","PL26_TALK"]},{"fid":"K2-084","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"부록 4. 경주시 도시재생위원회 자문(2021.9.17) 인쇄 451~452쪽 (PDF 461~462)","page":"452","kind":"fact","topic":"경주역 부지 매입 재원·주관부서(폐철도활용사업단)·민간참여 유치·산업경제거점 요구","text":"2021.9 도시재생위원회 자문에 대한 시 답변은 경주역 부지가 매입을 위한 재원확보·운용과 활용방안 수립에서 재생사업과 함께 폐철도 활용사업의 주관부서인 폐철도활용사업단과 지속적으로 연계·협업해야 한다고 설명하고, 도시경제기반형 활성화계획 단계에서 경주시 실무부서 연계와 민간참여 유치로 '지역 산업 경제거점'이 될 계획안을 내겠다고 한다. 같은 답변은 도심 전역의 고도지구로 신규 개발 압력이 낮아 도심공동화가 지속된다고 진단하고, 이를 넘으려면 관광·자동차 부품 산업 지원기관·기업 유치와 이를 담을 대규모 거점부지 확보가 필요하다고 쓴다. 도시경제기반형 사업요건은 50만㎡ 내외·복합앵커시설·일자리 창출로 적힌다.","values":"도시경제기반형 ≤50만㎡·복합앵커시설·고용기반 창출; 부지 매입 재원 별도; 주관부서 폐철도활용사업단","note":"부지 '매입'이 필요하다는 서술은 K2 문서 중 이 쪽뿐이고 매입 주체·재원·금액은 없다. 소유는 철도공단 69,790·철도공사 78,864·기재부 116㎡(K2-001)이며, 2026 혁신지구 가이드라인은 시행자의 부지 권원 확보를 요구한다(archive B-S3-20260206). 도시경제기반형 지정 자체는 확정안에서 반영되지 않았다(K2-006).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_OPS","P_JOBS","P_USE","PLR_SITE"]},{"fid":"K2-085","doc":"A-008","doc_title":"경주시 도시재생활성화계획[중심시가지형][변경] 이천년 고도(古都) 경주의 부활 — 황오동 (2025.12)","loc":"Ⅳ A-1 프론티어밸리 인쇄 79쪽, B-3 황오 커뮤니티센터 인쇄 112쪽, C-3 어울림마당 인쇄 130·132쪽; A-007 Ⅳ-3 황촌문화마당 인쇄 136쪽 (A-008 PDF 동일; A-007 PDF 140)","page":"112","kind":"fact","topic":"인접 필지 부지매입비 실적 — 서측 약 230~491만원/㎡, 동측 황촌문화마당 약 93만원/㎡","text":"활성화계획 사업비표의 부지매입비를 대지면적으로 나눈 값은 황오 커뮤니티센터 1,753㎡에 5,385.0백만원(약 307만원/㎡), 프론티어밸리 201㎡에 987.3백만원(약 491만원/㎡), 어울림마당 311㎡에 714.3백만원(약 230만원/㎡)이고, 동측 황촌문화마당(2필지 665㎡)은 부지매입비 약 621백만원(약 93만원/㎡)이다. 공원조성비 단가는 88만원/㎡(국토교통부 기반시설 표준설치비용 근거)로 적혀 있다.","values":"서측 약 230~491만원/㎡; 동측 약 93만원/㎡; 공원조성비 88만원/㎡","note":"㎡당 값은 이 추출에서 부지매입비÷대지면적으로 나눈 환산치(원문에 단가 표기 없음)이며 토지·건물 포함 여부가 표에 구분되지 않고 계획 시점(2019~2021) 감정가 기준이다. 부지(철도 국유지) 매입·보상가의 범위 참고로만 쓰고 현재 지가는 공시지가·실거래가로 재산출할 것.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_COST","P_OPEN","PLA18","D_COSTUNIT"]},{"fid":"K2-086","doc":"A-008","doc_title":"경주시 도시재생활성화계획[중심시가지형][변경] 이천년 고도(古都) 경주의 부활 — 황오동 (2025.12)","loc":"Ⅳ B-1 글로벌 어울림 광장 인쇄 91~93·96쪽, C-3 어울림마당 인쇄 130~131쪽; A-007 Ⅳ-3 황촌문화마당 인쇄 136~137쪽 (A-007 PDF 140~141)","page":"91","kind":"fact","topic":"기존·계획 소규모 광장·마당 — 글로벌 어울림 광장 2,987㎡·어울림마당 311㎡·황촌문화마당 665㎡(야간주차 20면 겸용)","text":"활성화계획은 황오동의 진입관문인 팔우정 경관광장(황오동 109-21 외 5필지 2,987㎡, 시 확보 완료)에 디지털 조형물 콘텐츠를 얹는 글로벌 어울림 광장(2024~2025, 10.95억원)을 두고, 황오동 128-11의 노후 건물을 철거해 311㎡ 소규모 공원 '어울림마당'(11.93억원)을 만들며(생활SOC 분석에서 도시공원 부분소외), 동측 황오동 155-2·163-41에는 665㎡ 황촌문화마당을 두되 단차를 없애 저녁에는 20면 주민 주차장으로 겸용한다. 목적은 동부사적지에서 구도심으로 관광객을 유도하고 반짝시장·문화장터를 담는 것이다.","values":"글로벌 어울림 광장 2,987㎡(10.95억); 어울림마당 311㎡(11.93억); 황촌문화마당 665㎡ + 야간주차 20면","note":"부지의 상징광장·공원과 같은 황오동 권역에 소규모 분산 광장이 이미 계획·공급되므로 부지의 광장은 규모·역할(대규모 행사 수용, 가변 공간)을 달리 정해야 중복을 피한다. 팔우정 광장의 부지 대비 위치는 도면 확인 필요. 준공 후 어울림마당 만족도는 6.7→4.6으로 하락(B-005 p.63, K2-082).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_OPEN","P_PARK","PLA18"]},{"fid":"K3a-001","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §1.2 연구범위·진행, 인쇄 p.8–11 (PDF p.9–12)","page":"8","kind":"fact","topic":"문서 성격·연구 범위","text":"동국대·가천대 도시·건축 스튜디오와 도시설계 지원연구(2025.3~6, 학생 약 55명)로 수행된 학술 기획연구이며 법정계획이 아니다. 공간범위는 형산강·북천·(옛)경주역·태종로로 둘러싸인 원도심 약 4㎢(넓게 약 12㎢), 광역은 지름 약 20km, 시간범위는 2025~2035이고 2025.6.19 경주시 도시브랜드 자문위원회에 발표됐다.","values":"원도심 약 4㎢ / 확장 약 12㎢ / 지역권 지름 약 20km / 2025~2035 / 연구 2025.3~6 / 학생 21명(동국대 8+13)·34명(가천대)","note":"제안 24건은 학생 설계안이며 경주시 채택안이 아님. 표지 기준 발주 경주시 미래전략실, 수행 동국대 산학협력단.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","P417_DIR"]},{"fid":"K3a-002","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.1 경주의 주요 이슈, 인쇄 p.16–17 (PDF p.17–18)","page":"16","kind":"fact","topic":"도시 여건: 인구 −11%, 시 예산 2조2,500억, 상시 지진 위험","text":"경주 인구는 1995년 274,000명에서 2025년 244,000명으로 30년간 약 11% 줄었고 2025년 시 예산은 2조2,500억 원으로 인구 24만 도시치고 여유가 있다고 본다(양성자가속기 연구센터 2018~2024 완공도 언급). 경주는 단층대에 있어 2016년 진도 5.8, 2023.11 진도 4.0, 2025.5 진도 2 지진이 반복되므로 도시구조와 건축이 상시 내진 대비를 갖춰야 하고, 요약은 내진·내화 성능이 높은 현대 목조(하이브리드) 건축을 대안으로 든다.","values":"274,000(1995)→268,000(2005)→260,000(2015)→244,000(2025), −11% / 2025 예산 2조2,500억원 / 2016 M5.8·2023.11 M4.0·2025.5 M2.0 / 현대 목조(하이브리드)","note":"가나자와 454천→454천(보합), 도야마 409천→406천(−0.73%)과 비교. 예산 출처는 문서에 명시 없음. 목조 하이브리드는 인쇄 p.6(요약 다섯째)에도 있으며 내진 등급 등 수치 기준은 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_COST","P_JOBS","P_TWOAX","P_FORM","P_ENERGY","P417_DIR","D_QUAKE"]},{"fid":"K3a-003","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.1 도시확장 1~4단계, 인쇄 p.18–19 (PDF p.19–20)","page":"18","kind":"fact","topic":"왕경 블록 모듈 약 120×120m와 선상지 지반","text":"신라 왕경은 정방형 격자 블록(약 120×120m)으로 조성됐고 바르셀로나 블록(약 113×113m)과 규모가 유사하며, 그 흔적이 일부 도로체계에 남아 최대 보존 가치를 가진다고 본다. 원도심 왕경 구역은 선상지로 지반이 약하고 습지가 넓어 수해에 취약했다고 서술한다.","values":"왕경 블록 약 120×120m / 바르셀로나 약 113×113m / 교토·나라 약 120×120m","note":"B-ref2 p.10(1방 164m×140m)과 수치가 다름 → 별도 conflict 항목 참조. 지반 서술은 정성이며 지내력·지하수위 수치 없음. 현 원도심 블록은 금리단길 블록이 명동의 약 3배이고 내부 공터가 주차장으로 쓰인다는 서술이 있음(우체국 블록 제안, 인쇄 p.164–165).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_LOT","P_FORM","P_DIG","P417_DIR"]},{"fid":"K3a-004","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.1 도시확장 3·4단계, 인쇄 p.21–24 (PDF p.22–25)","page":"21","kind":"fact","topic":"(옛)경주역 연혁, 주변 시설 형성, 원도심 4분할, 2021 폐역","text":"첫 경주역(1918)은 현 서라벌문화회관 자리였고 역 기능이 옮겨 온 (옛)경주역(1937) 주변 화랑로를 중심으로 우체국·은행·법원·경찰서·시청·중앙시장·성동시장이 형성됐으며, 식민지적 개발로 태종로가 확장되며 왕경 도시공간이 남북으로 갈렸다. 철로는 인공 제방 역할로 범람지를 제한했고, 1990년대 이후 신경주역(KTX) 개통과 함께 화랑로·성동시장·중앙시장 상권이 쇠퇴했으며 원도심은 (옛)경주역·나원역·금장역을 중심으로 네 구역으로 갈렸고 2021년을 기점으로 도심 부근 주요 철도역이 모두 폐업했다.","values":"첫 경주역 1918(서라벌문화회관 자리) / (옛)경주역 1937 / 원도심 4구역 분리 / 2021 폐역","note":"연도 표기가 1937(p.21)과 1936(p.114·116·257·360)으로 갈림 → conflict 항목 참조. 철로=제방 서술은 노반·성토층(P_DIG)의 배경 설명 수준이며 수치 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_STN","P_CROSS","P_RETAIL","P_DIG","P_PARK","P417_DIR","D_HISTMAP"]},{"fid":"K3a-005","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.1 방향 1, 인쇄 p.77 (PDF p.78)","page":"77","kind":"direction","topic":"방향 1: 지역문화권 중심부로 성장","text":"경주는 옛 길·트레일·폐철도선(옛 동해선)·수계로 포항·울산·대구·영천과 지역문화권을 이뤄 왔다고 보고, 폐철도를 지역 이동체계로 살려 외곽 마을과 도시를 잇는 중심부 기능을 강화하자고 한다. 부지는 이 폐철도 축 위의 거점이므로 광역 연결(트램·트레일) 기점 역할이 요구된다.","values":"—","note":"부지를 직접 지목하지 않음. 부지 요구는 방향 4·목표 3b에서 구체화.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_USE","P417_DIR"]},{"fid":"K3a-006","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.1 방향 2, 인쇄 p.77 (PDF p.78)","page":"77","kind":"direction","topic":"방향 2: 동서 방향 대중교통 개선(무인 셔틀)","text":"남북 대중교통은 활성화돼 있으나 형산강과 동해선 철도선을 가로지르는 동서 대중교통이 불편하므로, 서경주역을 시작으로 금장동·나원동·황성동·용강동·동국대·동국대병원·황성공원·시립도서관·시청·터미널을 잇는 순환형 무인 셔틀을 운행한다. 거점 정거장은 인필(in-fill)과 공공·상업 기능을 집중시키는 보행 활동의 출발점으로 삼는다.","values":"서경주역 기점 순환형 무인 셔틀; 정거장=인필·공공·상업 집중","note":"이 서술의 경유지 목록에는 (옛)경주역/성동시장이 없고 인쇄 p.30·74·83의 노선에는 있음 → 노선 서술이 쪽마다 조금씩 다름.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_CROSS","P_PED","P_USE","P417_DIR"]},{"fid":"K3a-007","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.1 방향 3, 인쇄 p.77 (PDF p.78)","page":"77","kind":"direction","topic":"방향 3: 시대별 구역을 고분-정원-티하우스로 보행 연결","text":"신라 왕경·고려조선 읍성·근현대 철도관광 도시를 모두 보행권에서 경험하게 하되, 시대 경계(팔우정삼거리, 태종로변 법장사-공용주차장, 계림로/첨성로 교차지, 선덕네거리 등)를 소나무 정원과 차문화 거점으로 조성하고 왕경 진입부에는 기둥을 쓴 고전적 입면을 도입하자고 한다.","values":"경계점: 팔우정삼거리·법장사-공용주차장·계림로/첨성로 교차지·선덕네거리","note":"부지(근현대 철도관광 구역)에 대한 직접 요구는 없음. 팔우정삼거리가 부지 남단 인근 경계점이라는 위치 판독은 [추정](P+R ④와 팔우정 로터리 제안 p.168·174 기준). 입면 요구는 '왕경 진입부'에 한정.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_OPEN","P_PED","P_FORM","P417_DIR"]},{"fid":"K3a-008","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.1 방향 4, 인쇄 p.78 (PDF p.79)","page":"78","kind":"direction","topic":"방향 4: 하천·철도 통합 — (옛)경주역은 문화예술 복합 쇼핑센터·공동 연구 캠퍼스·트램 기점","text":"(옛)철도역과 주변 부지를 경주의 새로운 문화예술 복합 쇼핑센터 및 공동 연구 캠퍼스로 조성하고, 옛 동해선을 따라 남쪽(입실·불국사)과 북쪽(안강·포항)으로 철로 없이 운행하는 트램을 개통해 지역권 중심 기능을 확보하라고 한다. 또한 형산강-북천을 잇는 옛 철도길(금성로368~372번길)을 조경해 하천 공원화를 유도하고, 하천변 높이 36m 개발 가능 부지에는 하천과 이어진 주거·문화예술 시설을 두어 성건동의 주차 수요·녹지 부족을 완화한다.","values":"(옛)경주역=문화예술 복합 쇼핑센터+공동 연구 캠퍼스 / 트램 남(입실·불국사)·북(안강·포항) / 하천변 36m / 옛 철도길 금성로368~372번길","note":"부지 용도·시설을 가장 구체적으로 지목한 문장. '36m'는 하천변 별도 부지(경주세무서·흥무초 일대) 이야기이며 부지 자체의 높이 기준이 아님. 법령 근거 미제시.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_RETAIL","P_CULT","P_JOBS","P_TRAMHUB","P_H","P_AXIS","P417_DIR"]},{"fid":"K3a-009","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.1 방향 5, 인쇄 p.78 (PDF p.79)","page":"78","kind":"direction","topic":"방향 5: 직주락 원도심 — 주차장·유휴지에 주거 포함 인필","text":"원도심은 거대한 하나의 주차장이며 드라이브스루식 소비가 확산돼 보행이 단절되므로, 상주인구와 일자리를 함께 갖춘 직주락 원도심이 대안이라고 본다. 성동시장·중앙시장 주변 주차장과 유휴 부지에 주거를 포함한 인필 개발을 하고, 주요 도로변 주차장은 축소·재배치하며, 지상부에 연속된 상점과 명확한 보행체계를 두어 새 대중교통과 연결하라고 한다.","values":"직주락(상주인구+일자리) / 시장 주변 주차장·유휴 부지 인필 / 주차장 축소·재배치 / 지상부 연속 상점","note":"의뢰인 방향(직주락·성동시장 연계)과 가장 직접 맞닿는 조항. 세대수·주차 면수 등 수치는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HOUSE","P_JOBS","P_PARK","P_RETAIL","P_PED","P_TWOAX","P417_DIR"]},{"fid":"K3a-010","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.1 도시설계 목표 3b·2a·2b·3a, 인쇄 p.79 (PDF p.80)","page":"79","kind":"direction","topic":"도시설계 목표 10개 중 부지 직접 지목은 3b 하나","text":"목표 10개 가운데 구경주역을 직접 지목한 것은 3b '(옛)경주역의 교통거점 기능 부활과 복합 문화상업 플랫폼으로의 변신' 하나이고, 2a(순환형 대중교통·거점 보행체계), 2b(시장·상업도로 활성화를 위한 주차장 인필과 보행체계), 3a(고속·시외버스터미널 통합 재개발)가 부지 값에 간접 영향을 준다. 나머지(1a·1b 트레킹·하천, 4a·4b 신라구역·고분 주변 주차장의 정원·차문화관, 5a·5b 읍성·학교 활용)는 부지 요구가 없다.","values":"목표 3b / 2a / 2b / 3a (부지 관련) ; 1a·1b·4a·4b·5a·5b (무관)","note":"4b(대릉원 인접 공영주차장을 정원·차문화관으로 전환)는 대릉원 주변 주차 용량을 줄이므로 부지 쪽 주차 수요에 영향을 줄 수 있다는 해석은 [추정].","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_USE","P_RETAIL","P_CULT","P_PARK","P_PED","P417_DIR"]},{"fid":"K3a-011","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §3.1 미래 변수 7·Table 2, 인쇄 p.71–72 (PDF p.72–73)","page":"72","kind":"fact","topic":"변수 7: (옛)경주역=경계공백지대(Border Vacuum), 시나리오별 비중 A 1점·B 3점·C 3점","text":"변수 7 '경주역과 경주터미널의 정비·재개발'에서 (옛)경주역은 원도심 동서 구역의 보행 연결을 끊어 온 경계공백지대(Border Vacuum)이고, 고속·시외버스터미널의 분리된 기능은 하천변 보행 접근과 원도심 교통혼잡을 일으킨다고 진단한다. 매트릭스에서 변수 7은 시나리오 A(원도심 지속 쇠퇴)에서 1점, B(철도 기반 컴팩트 도시)·C(원도심 거점 민간개발)에서 3점이고, 변수 3·4는 B·C 3점, 변수 5는 B 2점·C 3점, 변수 6(연구기관 유치)은 C에서만 3점이다.","values":"변수 7개 / 변수7: A●·B●●●·C●●● / 변수3: B●●●·C●●● / 변수4: B●●●·C●●● / 변수5: B●●·C●●● / 변수6: C●●●","note":"점 수는 표의 ● 개수(질적 강도, 정량 아님). 표 머리 축은 '직주 분리 ↔ 정책 개입: 직주 근접'(A는 분리, B·C는 근접)이며 표 이미지로 재확인함. 같은 용어가 인쇄 p.104–105·109에 반복.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CROSS","P_PED","P_CULT","P_JOBS","P_TRAMHUB","P_USE","P417_SCEN"]},{"fid":"K3a-012","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §3.2 시나리오 A, 인쇄 p.73 (PDF p.74)","page":"73","kind":"fact","topic":"시나리오 A: 황오동은 점진 재생 속에 상업화·거주 유출","text":"추세 지속 시나리오(A)에서 황오동은 대규모 투자나 구조 변화 없이 점진적 재생에 머물러 주거 기능이 상업 기능으로 바뀌고, 차량 중심 관광으로 방문객은 크게 늘지 않는 반면 거주인이 빠져 동네 전체가 상업화되고 일상 생활공간이 사라진다고 예측한다. 성건동 고려인 커뮤니티는 확장되고 황리단길 중심 관광거점은 원도심과 분리된 채 성장한다.","values":"A: 원도심 지속 쇠퇴 / 10~15년 후","note":"두 축(거주·방문) 균형 상실 시나리오의 근거 문장으로 쓸 수 있음. 정량 예측은 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TWOAX","P_HOUSE","P417_SCEN"]},{"fid":"K3a-013","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §3.2 시나리오 B, 인쇄 p.73–74 (PDF p.74–75)","page":"73","kind":"direction","topic":"시나리오 B: 서경주역 관문 + 무인 셔틀 + 정거장 주변 주거 인필","text":"서경주역을 새 관문으로 삼아 무인 셔틀을 황성공원·시청·(옛)경주역/성동시장·팔우정삼거리·서라벌문화회관·중앙시장·터미널·동국대병원 등으로 운행하고, 정거장 주변 기존 주차장 부지에 청년·근로자·방문자를 위한 주거·상업·공공 기능을 인필해 압축형 원도심을 만든다. 구경주역은 이 셔틀 거점 중 하나이며 보행권 내 주거·상업·공공 기능 밀집이 목표다.","values":"셔틀 거점: 황성공원·시청·(옛)경주역/성동시장·팔우정삼거리·서라벌문화회관·중앙시장·터미널·동국대병원","note":"시청은 셔틀 정거장으로만 등장하며 시청 이전 제안은 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_HOUSE","P_USE","P_PARK","P417_SCEN"]},{"fid":"K3a-014","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §3.2 시나리오 C, 인쇄 p.74–75 (PDF p.75–76)","page":"74","kind":"direction","topic":"시나리오 C: 철도청 장기 임대, 북측 연구소 콤플렉스·북천변 민간 주거","text":"(옛)경주역과 주변 부지를 철도청으로부터 장기 임대해 역 북쪽에는 정부·민간기업 연구소 콤플렉스를, 북천에 면한 부지에는 민간 주거 개발을 두고, 화랑로·우체국·KT사옥 일대에는 지역대학 공동캠퍼스와 로컬콘텐츠 타운을 세우며, (옛)경주역을 중심으로 포항·울산을 잇는 무철로 트램을 운행한다. 대릉원 주차장 부지에는 미술관·인포센터를 두어 황리단길과 보행 허브를 잇는다.","values":"부지 장기 임대 / 북측 연구소 콤플렉스 / 북천 면한 부지 민간 주거 / 트램(포항·울산)","note":"유일하게 소유·재원 방식(장기 임대·민간개발)을 언급한 대목. '철도청'은 현재 국가철도공단·한국철도공사 체계와 명칭이 다름 → conflict 항목 참조. 규모·면적 수치 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_JOBS","P_HOUSE","P_CULT","P_TRAMHUB","P_COST","P_OPS","P417_SCEN"]},{"fid":"K3a-015","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.1 이슈 셋째(대중교통), 인쇄 p.30 (PDF p.31)","page":"30","kind":"direction","topic":"순환형 무인 셔틀 노선과 P+R 거점 4곳(위치만, 규모 없음)","text":"서경주역을 원도심의 기능적 관문으로 삼아 서경주역→황성공원→시청→성동시장-(옛)경주역→서라벌문화회관→고속·시외버스터미널→형산강→동국대병원을 도는 무인 순환 셔틀을 제안한다. 환승·P+R(공용주차) 거점은 성건동주민자치센터~흥덕초(수변), 경주세무서 인접 원화로·경주교 수변, 터미널 주변, 팔우정삼거리 주변의 네 곳이며 주차 규모는 제시하지 않는다.","values":"P+R 4곳: ①성건동주민자치센터·흥덕초 수변 ②경주세무서 인접 원화로·경주교 수변 ③고속·시외버스터미널 주변 ④팔우정삼거리 주변 / 현 경주역(신)~원도심 9km","note":"②(세무서·북천 앞)와 ④(팔우정)가 부지 북단·남단에 인접해 부지 안에 대규모 주차를 두지 않아도 되는 근거로 읽을 수 있음[추정]. '흥덕초'는 p.78의 '흥무초'와 표기가 다름(오기 가능).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_TRAMHUB","P_PARK","P_CROSS","P417_MOB"]},{"fid":"K3a-016","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.1 이슈 셋째, 인쇄 p.30 (PDF p.31) 및 §4.2 도시설계 제안 3, 인쇄 p.101 (PDF p.102)","page":"30","kind":"standard","topic":"(옛)경주역 중심 북 약18km·남 약18km 무철로 트램 + A·B·C 3개 노선","text":"(옛)경주역을 중심으로 북쪽 구간 약 18km와 남쪽 구간 약 18km에 각각 양방향 도로기반 무인 무철로 트램(또는 셔틀버스)을 운행한다고 쓴다. 북은 안강을 지나 효자역(위덕대·포항공대)·괴동역(포항폴리텍), 남은 외동·매곡·중산 산단의 모화역까지이며 불국사·입실온천·양동마을을 잇는다. p.101은 경주역–모화역(A), 포항 괴동역(B), 아화역(C) 세 노선을 지도로 보인다.","values":"북 약 18km + 남 약 18km (각각) / A: 경주역–불국사역–입실역–모화역 / B: 경주역–안강역–양자동역–효자역–괴동역 / C: 경주역~아화역(서경주역·모량역 경유로 표시)","note":"기존 정리의 '남북 18km'는 합계가 아니라 구간별 약 18km(합계 약 36km)임에 유의. 노선·경유역 판독은 인쇄 p.101 지도 기준(C노선 경유역은 도면 판독)이며 노선 길이·운행 간격·정거장 간격 수치는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_TRAMHUB","P_JOBS","P_USE","P417_MOB"]},{"fid":"K3a-017","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.2 도시설계 제안 1(순환형 대중교통), 인쇄 p.83–84 (PDF p.84–85)","page":"83","kind":"direction","topic":"무인셔틀+트램+보행: (옛)경주역 앞 광장의 연계시설 부족과 환승거점화","text":"서경주역·경주역(성동시장)·경주세무서(북천 앞)·경주시청·중앙시장·동국대병원을 잇는 순환 셔틀 노선도를 제시하고, 현황으로 KTX 이용객은 버스로 갈아타야 도심에 진입할 수 있고 교외 버스는 배차간격이 길다고 짚는다. (옛)경주역 앞 광장은 연계되는 문화·행정·상업시설이 부족해 활용되지 않으므로 원화로에 셔틀 정거장을, (옛)경주역에 트램을 두어 대중교통 환승거점으로 바꾸고 컨벤션센터·문화센터·백화점 등을 통합 개발하라고 한다.","values":"역 앞 광장 활용 부족 / 환승거점 + 컨벤션센터·문화센터·백화점 / 폐선로로 원도심–황오동 보행 단절","note":"'문화·행정·상업시설 부족'을 지적하면서도 처방에는 행정시설이 들어가지 않음. 노선도는 이미지(p.83)이며 정류장 6곳을 직접 판독.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_RETAIL","P_CULT","P_CROSS","P_USE","P417_MOB"]},{"fid":"K3a-018","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.2 도시설계 제안 4((옛)경주역의 부활과 변신), 인쇄 p.104–105 (PDF p.105–106)","page":"104","kind":"direction","topic":"(옛)경주역 역사는 현 위치에서 보전, 부지 현황은 정비소·공장·북천 비연계","text":"(옛)경주역은 단순한 철도 인프라를 넘어 경주 정체성의 상징이고 그 가치는 현재 위치에 있을 때 보전될 수 있다고 보며, 교통거점 기능을 부분 복원하고 주변에 복합문화시설을 개발해 동서 구역을 잇자고 한다. 현황으로 철도 부지와 북천 남측은 차량 정비소·공장 등으로 쓰여 수변과 연계되지 않고, 중부동에서 철도 부지를 지나 황오동으로 갈 수 있는 보행로가 현저히 부족하다고 진단한다.","values":"역사 현 위치 보전 / 교통거점 부분 복원 / 복합문화시설 개발 / 북천 비연계 / 동서 보행로 부족","note":"이축 논의는 문서 전체에 없음. 의뢰인의 '이축 또는 보존' 중 보존 쪽만 지지. 현황 수치 없음(건축물 기능·보행동선 지도 p.105).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STN","P_CROSS","P_USE","P_PED","P_AXIS","P417_P24"]},{"fid":"K3a-019","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.2 도시설계 제안 4, 인쇄 p.108–109 (PDF p.109–110)","page":"108","kind":"direction","topic":"공동 캠퍼스·점진 매입·북천변 고도제한 완화 + 역사 보존·보차혼용 도로·트램 정거장","text":"중부동과 (옛)경주역에 지역권 공동 캠퍼스를 만들고(KT·경북패션디자인산업연구원·우체국 대형 건축물 일부를 대학시설로 전환), 소규모 건축물과 주차장은 점진적으로 매입·전환해 효과를 검증하며 예산 압박을 줄이고, 철도 부지는 단계적으로 복합문화시설을 개발하며 남북 보행동선으로 북천변과 잇고 북천변 부지는 고도제한 완화 등 민간개발을 유도한다. 역사 보존과 함께 동서 연결용 보차혼용 도로, 옛 철도선을 따른 트램, 철도 부지 안 상업·문화·광장·녹지·대학시설을 두어 단면에 트램정거장·컨벤션센터·문화센터·철도 관사·신흥장미마을이 표기된다.","values":"점진 매입·전환 / 철도 부지 단계적 개발 / 북천변 고도제한 완화+민간개발 / 보차혼용 동서 도로 / 트램정거장","note":"고도제한 완화의 구체 수치(m)는 이 쪽에 없고 p.78의 '36m'와 같은 규정인지도 문서가 밝히지 않음. 동서 연결을 신설 차도가 아닌 보차혼용 도로로 본 유일한 안(건축 제안 P01은 도로 개설을 경계).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","P_COST","P_JOBS","P_H","P_AXIS","P_PED","P_CROSS","P_TRAMHUB","P_USE","P_LANE","P417_P24"]},{"fid":"K3a-020","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.2 도시설계 제안 8(중심 시장과 상점 도로), 인쇄 p.122–123, p.126–127 (PDF p.123–124, p.127–128)","page":"122","kind":"direction","topic":"성동·중앙시장·화랑로: 점포·주차장 일부를 아티스트 레지던시로, 시장 내 공공공간, 교통섬 해체, (옛)경주역은 화랑로 동단 보행 공간","text":"전통시장 방문자가 계속 줄고 주차장이 있는 상권만 유지되며 차량·보행 동선이 충돌한다고 진단한다. 성동시장·중앙시장의 일부 점포(또는 주차장 일부)를 아티스트 레지던시로 바꿔 상주인구를 확보하고 시장 내부 일부를 휴식용 공공공간으로 고치며, 성동시장은 공공공간을 정문길·남3문과 보행으로 잇고 역전삼거리·중앙시장 사거리·서라벌 네거리 교통섬을 해체해 인도를 넓힌다. 중앙시장은 5동·6동 자리에 아트리움, 제1공영주차장 자리에 아티스트 레지던시 신축을 제안한다. 같은 제안의 교토 시조도로 교훈(p.123)은 화랑로를 대중교통·차량이 모이는 상업 동맥으로, 화랑로 동쪽 끝 (옛)경주역을 화랑로를 상징하는 보행자 공간으로 삼으라고 적는다.","values":"아티스트 레지던시(시장 점포·주차장 일부) / 시장 내 공공공간 / 교통섬 3곳 해체 / 중앙시장 5·6동 아트리움 / 제1공영주차장→레지던시 신축 / 화랑로=대중교통·차량 동맥, (옛)경주역=화랑로 동단 보행 공간(p.123)","note":"'주차장이 있는 상권만 유지'는 시장 연계 시 주차 공급이 상권 변수라는 현황 진단. 역전삼거리는 구경주역 앞(원화로) 교차점으로 판독[추정]. 레지던시 규모·호수 수치 없음. 의뢰인의 '성동시장 연장(흡수 아님)' 방향과 맞는 서술.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_RETAIL","P_CULT","P_HOUSE","P_PARK","P_PED","P_CROSS","P_TRAMHUB","P417_PROP"]},{"fid":"K3a-021","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.2 도시설계 제안 1(사례 교훈: 도야마), 인쇄 p.82 (PDF p.83)","page":"82","kind":"standard","topic":"대중교통 거점 반경 500m를 주거추진지역으로(도야마 사례의 교훈)","text":"도야마 사례에서 얻은 교훈으로 대중교통 거점 반경 500m를 주거추진지역으로 지정해 혜택을 줌으로써 교외 시민의 도심 이주를 장려하고, 거점을 활용해 문화상업·의료·교육시설을 포함한 개발을 통합 추진해야 한다고 적는다.","values":"거점 반경 500m = 주거추진지역","note":"경주 적용 기준으로 확정된 값이 아니라 사례 교훈 서술. 경주 정거장 반경에 적용하자는 명시는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_HOUSE","P_TRAMHUB","P_USE","P417_MOB"]},{"fid":"K3a-022","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.1 대상지 1, §5.2 터미널(복합환승센터), 인쇄 p.142–147, p.232–237, p.304–309","page":"142","kind":"fact","topic":"고속·시외버스터미널 부지 제안 3건(현 터미널 자리 재개발)","text":"터미널 부지 제안 3건은 모두 현 터미널(노서동·사정동, 태종로 685·686 및 강변로 184 일대) 자리를 통합 재개발한다. 첫째는 약 21,650㎡에 두 터미널을 통합하고 버스 동선을 지하로 넣으며 호텔·상업을 더하고, 둘째는 모빌리티 허브 8개소 중 메인 허브로 1~2층 교통·3~5층 호텔·상가·주차타워·6층 전망대를 두며, 셋째는 터미널·호텔·상업·체험을 묶은 TOD 복합환승센터다.","values":"대지 약 21,650㎡ / 노서동 정형필지 36m 고도제한·사정동 비정형필지 10m 고도제한(p.144) / 모빌리티 허브 8개소·15분 접근(p.234) / 6층 전망대(p.237)","note":"이 3건은 구경주역이 아니라 터미널 현위치 대안이며, 구경주역 부지로 터미널을 옮기는 안(P07·P15·P18·P20·P21·P22·P23)과 반대 방향. 고도제한 36m/10m는 이 대지 두 블록에 대한 서술.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["PL30_TERM","P_TRAMHUB","P_PARK","P417_PROP"]},{"fid":"K3a-023","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §4.2·§5.1·§5.2 목차·본문, 인쇄 p.3–5, p.104, p.148–411","page":"3","kind":"fact","topic":"(옛)경주역 부지 제안 24건의 구성과 유형 분포(P번호 부여)","text":"(옛)경주역 부지를 다룬 제안은 도시설계 1건(P24, p.104)과 건축설계 23건(동국대 P01~P03, 가천대 P04~P23)이며 합쳐 24건이다. 건축 23건을 주 프로그램으로 가르면 교통·터미널·환승·물류 8건(P05·P07·P08·P15·P18·P20·P22·P23), 문화·예술·창조 5건(P01·P02·P03·P11·P21), 휴양·숙박·관광·보행 4건(P04·P12·P13·P16), 역사·박물관·수장고 2건(P10·P14), 주거·정주 2건(P06·P09), 연구·캠퍼스 1건(P17), 판매·체험 1건(P19)이다. 시청·의회를 두는 안은 0건이다.","values":"P01 p.148 / P02 p.154 / P03 p.158 / P04 p.220 / P05 p.244 / P06 p.250 / P07 p.256 / P08 p.268 / P09 p.274 / P10 p.280 / P11 p.298 / P12 p.316 / P13 p.346 / P14 p.358 / P15 p.364 / P16 p.370 / P17 p.376 / P18 p.382 / P19 p.386 / P20 p.392 / P21 p.398 / P22 p.404 / P23 p.410 / P24(도시설계) p.104","note":"P번호는 본 조사에서 목차 순서로 붙인 것이며 원문에는 번호가 없다. 쪽 수는 목차(p.3–5)와 PDF 쪽 대조로 확인(인쇄 = PDF−1). 이미지 위주 쪽이 많아(P05·P06·P13·P17·P19·P22·P23 등) 유형은 제목·도면 라벨 기준이라 일부 [추정]. 24건 산식: 건축 23 + 도시설계 1 (앞서 '건축 21+도시설계 1+폐철도 2'와 같은 값).","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"guides","nodes":["P_USE","P_CULT","P_TRAMHUB","P_HOUSE","P_HALL","P_STAY","P_RETAIL","P417_PROP"]},{"fid":"K3a-024","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.1 대상지 2a·2b·2c·§5.2 Studio A, 인쇄 p.148, p.154, p.158, p.257","page":"148","kind":"fact","topic":"제안별 대상지 경계 면적이 29,133㎡~123,040㎡로 제각각","text":"건축 제안이 적은 대지 면적은 P01 약 123,040㎡(황오동 142-1 일대), P02 45,424㎡(성동동 32-1 일대), P03 29,133㎡(원화로 266, (구)경주역), P07 구 철도부지 약 97,468㎡로 서로 다르다. 이 연구는 부지 경계를 하나로 확정하지 않았다.","values":"123,040㎡ / 45,424㎡ / 29,133㎡ / 약 97,468㎡","note":"의뢰인 계획 경계 218,478㎡, 고시 156,460㎡, 시 구상 79,438㎡[T4], 2022 전략계획 148,770㎡(성동동 169-2 외 110필지; A-006 인쇄 p.138)와 모두 다름. P07 수치는 도면 속 라벨(인쇄 p.257). P01은 부지 서측 '역전지구'와 동측 '황오1지구'가 모두 도시재생활성화지역으로 지정돼 있다고 적음(인쇄 p.150).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_BND","P417_PROP"]},{"fid":"K3a-025","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.1 대상지 2a, 인쇄 p.148–153 (PDF p.149–154)","page":"148","kind":"direction","topic":"P01: 문화예술+IT 플랫폼 — 폐철로를 트램·보행특화거리로, 동서는 도로 개설이 아닌 마당 시퀀스","text":"원구도심에 야간 정주 인구를 끌 창의 거점이 부족하다고 진단하고, 극장·컨벤션센터 등 예술·기술 거점과 IT 캠퍼스·R&D 센터를 두어 외곽 산단과 도심의 단절을 완충한다. 폐철로는 트램 노선과 보행특화거리로 바꿔 남북축을 재구성하고, 동서축은 차량 중심 연계도로가 도심 단절을 고착화할 수 있다며 도로 개설 없이 마당·회랑 같은 보행 흐름으로 잇는다.","values":"대지 약 123,040㎡ / 극장·컨벤션센터·IT 캠퍼스·R&D / 남북=트램+보행특화거리 / 동서=보행 마당 시퀀스(도로 개설 반대)","note":"'차량 중심의 연계도로 개설이 논의되고 있다'(p.149)는 현황 서술은 동서 가로 신설 논의가 있었음을 시사하나 출처·위치는 밝히지 않음. 동서 가로 개수 수치 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_CULT","P_JOBS","P_AXIS","P_CROSS","P_TWOAX","P417_PROP"]},{"fid":"K3a-026","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.1 대상지 2b·2c, 인쇄 p.154–161","page":"154","kind":"direction","topic":"P02·P03: 미술관 선형 배치와 세대 통합형 문화플랫폼(청년지원·공방·공동판매)","text":"P02는 폐철도 남북을 선형공원으로, 동서는 보행 흐름의 연결축으로 삼고 미술관 프로그램을 선형으로 배치하며, 서측은 상업·교통 중심지·동측 황촌은 고령 저층주거지로 심리적 거리가 크다고 진단한다. P03은 철도를 필로티·브릿지로 재구성하고 도서관·소규모 공방·청년 예술가 셀러마켓·지역 브랜드 공동판매관·청년 창업 팝업·3층 청년지원센터·코워킹·공유주방·시니어 라운지와 주차장 입출구·택시 승강장을 두며, 주변 건축물이 1~3층 저층이고 고도제한이 걸려 있다고 분석한다.","values":"P02 대지 45,424㎡ / P03 대지 29,133㎡·3층 청년지원센터 / 주변 건축물 1~3층","note":"의뢰인의 레지던시·공방·청년창업지원·판매·체험 방향과 가장 가까운 건축 제안은 P03. 매장 면적·점포 수 등 규모 수치는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CULT","P_RETAIL","P_JOBS","P_AXIS","P_CROSS","P_H","P_PARK","P417_PROP"]},{"fid":"K3a-027","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio B 대상지(신예진), 인쇄 p.298–303 (PDF p.299–304)","page":"298","kind":"direction","topic":"P11: 야간 문화 프로그램·청년 창업 소규모 거리·복합 공영주차장·주민 협의체(젠트리피케이션 대응)","text":"P11은 문제로 젠트리피케이션 우려, 원도심 주차난, 부지 고립, 야간 유동인구 부족을 꼽고 대응으로 주민 협의체 구축과 지역 예술가·창작자 문화공간 제공, 보행축·문화 산책로 연결, 관광객 대응 복합 공영주차장 설치, 폐부지의 야간 문화 프로그램과 지역 청년 창업 소규모 거리를 제시한다. 남북 세로축 메인 거리와 직선 철도 운영 계획, 상하단 주차장, 인근 건물과 비슷한 스카이라인(고도제한 고려)도 담았다.","values":"야간 문화 프로그램 / 청년 창업 소규모 거리 / 복합 공영주차장(규모 미제시) / 주민 협의체 / 스카이라인=인근 건물 높이","note":"두 축 KPI(방문·체류 ↔ 야간·거주) 문제의식과 가장 가까운 서술. 젠트리피케이션 완충 장치로 '주민 협의체 프로세스'를 명시.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TWOAX","P_OPS","P_PARK","P_CULT","P_H","P_AXIS","P417_PROP"]},{"fid":"K3a-028","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio D 대상지(우성경), 인쇄 p.398–403 (PDF p.399–404)","page":"398","kind":"direction","topic":"P21: 시립미술관+호텔 3동(5층)+버스터미널+상점가 복합문화단지, 폐역사 1층을 헐어 황오동과 연결","text":"P21은 터미널을 폐경주역 부지로 이전하고, 시립미술관(상설 전시관 4층·기획 전시관), 호텔 3동(5층, 1층은 상점가), 조각공원, 박공지붕 상점가(높이 4~12m)를 배치한다. 보문단지 호텔 중심 구조 때문에 20~30대 숙박 수요를 도심이 못 받는다고 보고 호텔을 '살아 있는 마을'의 주거 대용·24시간 체류 프로그램으로 쓴다. 폐경주역사 1층부를 헐어 황오동과 연결되는 보행축을 만들고, 기존 철도길을 따른 가로 보행축은 시의 철도 도심 공원화 사업과 연계한다.","values":"호텔 5층 3동 / 상설 전시관 4층 / 상점가 4~12m / 건물 5층≈25m(단면 GL+25000) / 폐역사 1층 해체","note":"구 역사를 일부 해체하는 유일한 안. '경주시가 진행 중인 철도 도심 공원화 사업'의 근거 문서는 제시 안 함. 호텔=주거 대용은 안 자체의 논리이며 청년주거 세대수 근거는 아님.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CULT","P_STAY","P_HOUSE","P_STN","P_H","P_CROSS","P_AXIS","P417_PROP"]},{"fid":"K3a-029","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 터미널 이전 안(P05·P07·P08·P15·P18·P20·P21·P22·P23), 인쇄 p.244–249, p.256–261, p.268–273, p.364–369, p.382–397, p.404–411","page":"256","kind":"direction","topic":"교통·터미널·환승·물류 8건 중 7건은 현 터미널 기능을 구경주역 부지로 이전","text":"P07(터미널 이전+트램·PM·상가), P15(선형 문화공원+버스터미널), P18(터미널 이전+모빌리티 허브), P20(복합환승센터: R&D센터·버스터미널·황오동 주민센터), P21, P22(주차타워·터미널·도서관 허브), P23(복원HUB+버스터미널)은 고속·시외버스터미널 기능을 구경주역 부지에 둔다. 나머지 P05(물류센터·UAM 버티포트·트램 승강장=행사용 가변 공간)와 P08(물류동·버티포트·환승센터 3~4층 주차타워·복합문화시설·업무동)은 터미널 없이 물류·모빌리티 구상이며, 이는 연구 본문의 터미널 현위치 통합 재개발(목표 3a)과 어긋난다.","values":"터미널 부지 이전 7/23건 (P07·P15·P18·P20·P21·P22·P23) / P08 환승센터 3~4층 주차타워 / P05 트램 승강장=행사용 가변 공간","note":"P23은 도면 라벨(인쇄 p.411 '버스터미널'), P18은 이미지 속 문구(인쇄 p.383)로 확인해 '추정' 등급. 학생 제안 간 합의가 아니라 개별 설계 선택임. UAM·드론 물류는 실험안 성격이 강하고 물동량·주차 수치는 없음.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"calibrates","nodes":["PL30_TERM","P_TRAMHUB","P_PARK","P_USE","P417_PROP"]},{"fid":"K3a-030","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio A 대상지(P07) p.256–261, Studio D 대상지(P18) p.382–385 (PDF p.257–262, p.383–386)","page":"256","kind":"standard","topic":"P07 현 터미널 운행·수용 수치(22대 등)와 P18 방문객 주차 약 1,000대(3층)","text":"P07은 현 경주버스터미널이 37개 지역·13개 노선을 운행하고 주간 약 1,000대가 다니며 시외·고속 합쳐 버스 22대를 수용하고 부산동부 일 50회·동대구 일 42회가 가장 많다고 적고, 구 철도부지 약 97,468㎡에 구 역사를 일부 개조해 터미널로 쓰며 1층 버스·택시, 2층 PM, 3층 트램, 4층 옥상정원으로 쌓는다(버스 11.5×2.5m, 45도 주차 1대 12×4m, 트램 최소 곡선반경 25m). P18은 방문객 주차를 약 10,000㎡ 바닥에 300~400대(층당)로 보고 3층 약 1,000대로 설계하며 황오동 주민 주차는 산책·주차·시설을 분리한 별도 공간으로 푼다.","values":"현 터미널 37개 지역·13개 노선·주간 약 1000대·수용 22대 / 부산동부 50회/일·동대구 42회/일 / 구 철도부지 약 97,468㎡ / P18 약 10,000㎡·층당 300~400대·3층 약 1,000대","note":"P18 수치는 이미지 속 문구 판독(인쇄 p.383 하단), 건축 제안 중 주차 면수를 적은 유일한 안. 본문 p.37은 대구 운행을 '하루 47회'로 적어 p.257의 동대구 42회와 다름. 모두 학생 설계의 전제값이며 공식 통계가 아님.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["PL30_TERM","P_PARK","P_TRAMHUB","P_STN","P_TWOAX","P417_PROP"]},{"fid":"K3a-031","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio A·B 대상지(P06 이성은·P09 김미현), 인쇄 p.250–255, p.274–279","page":"250","kind":"direction","topic":"주거·정주 제안은 2건뿐(P06 도시농업 복합주거+파머스마켓, P09 3층 행정·보육·주거 다문화 공간) — 세대수 없음","text":"P06은 폐경주역 부지에 도시농업·파머스마켓을 결합한 복합 주거 공간을 두고 필로티·보이드로 동서를 잇는다. P09는 성건동 일대 초등학교 3곳 신입생 중 다문화 가정이 최소 62%~최대 90%임을 근거로 고려인 통근버스 기점이 될 구경주역에 다목적 마당을 두고 1층 체험·관람, 2층 지속 프로그램, 3층 행정·보육·주거를 배치한다. 두 안 모두 세대수·주거 면적은 제시하지 않는다.","values":"성건동 초교 3곳 신입생 중 다문화 62%~90% / P09 3층=행정·보육·주거 / 세대수 없음","note":"P06은 주 설명이 이미지(인쇄 p.253)라 요지만 판독. 청년주거(직주락) 구체 값(세대수·유형)을 줄 수 있는 근거는 이 문서에 없음. 요약(p.6)의 '청년 주택'은 문구뿐.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HOUSE","P_HALL","P_RETAIL","P417_PROP"]},{"fid":"K3a-032","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio A·B·C 대상지(P04 A, P12 B, P13·P16 C), 인쇄 p.220–225, p.316–321, p.346–352, p.370–375","page":"220","kind":"direction","topic":"휴양·숙박·관광·보행 4건: 온천·식물원·주차·수장고(P04), 템플스테이(P12), 마을호텔·고가보행길 노드(P13), KNOT 관광 노드(P16)","text":"P04는 목욕시설·식물원·넓은 주차 공간·청년 예술전시와 유물·예술품을 함께 보관·전시하는 수장고를 두고, 문화재 발굴 어려움으로 인한 심각한 주차난·공원녹지 부족·폐역 좌우 단절을 문제로 짚는다. P12는 수공간 템플스테이와 전시·도서관·카페를, P13은 황오동 고가보행길과 마을호텔·문화제작실 노드를, P16은 폐역을 성동시장·황촌·읍성을 잇는 '매듭 공간'으로 삼아 상부 관광·하부 주민 프로그램, 자전거 인프라와 육교를 제안한다.","values":"P04 목욕시설·식물원·주차·수장고 / P12 템플스테이 2층 / P13 고가보행길+경주역 일대 노드 4개 / P16 상부 관광·하부 주민","note":"P04의 폐역 연도 '2010년 신경주역 이전'은 본문(2021.12)과 다름 → conflict 항목 참조. P13은 '경주 전역 허브' 계획의 일부로 황오동을 중심 허브로 둠.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STAY","P_PARK","P_CULT","P_CROSS","P_PED","P_TWOAX","P417_PROP"]},{"fid":"K3a-033","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio D 대상지(P17·P19), 인쇄 p.376–381, p.386–391","page":"376","kind":"direction","topic":"P17 문화유산 디지털·AI·미디어 캠퍼스, P19 증류소(주류 제조·판매·투어)","text":"P17은 문화유산 디지털화·AI·미디어 학과를 묶은 캠퍼스(전자도서관·철길전시관·공유오피스·기숙사·작업마당 도면 라벨)를 제안한다. P19는 철로와 플랫폼을 보존하며 전통 소주 증류소·주류 상업공간·레스토랑·문화시설·녹지 휴게를 두고 공정 단계별 투어 프로그램을 구성하며, 과거 경주역 급수탑 물탱크를 재가동해 북천 물을 펌프로 끌어 쓰고 증류 폐열·폐수를 에너지로 바꿔 재생 온실에 쓰는 순환 구상과 폐선을 이용한 물류 트램을 담았다.","values":"P17: 전자도서관·철길전시관·공유오피스·기숙사 / P19: 증류소+투어+레스토랑+급수탑 재가동·폐열 온실","note":"두 안은 설명문이 거의 없고 도면·라벨만 있어 판독이 불완전([추정]). P17의 도면은 대학 건물명(월정관·첨성관·선덕관 등)이 적힌 대지로 보여 위치가 (옛)경주역 부지인지 불명확함. 구 급수탑은 P19 도면(인쇄 p.389 'RECLAMATION')에서 확인되는 철도 유산 요소.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"guides","nodes":["P_JOBS","P_CULT","P_RETAIL","P_ENERGY","P_HOUSE","P_STN","P417_PROP"]},{"fid":"K3a-034","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.2 Studio B·C 대상지(김소예·김희애), 인쇄 p.280–285, p.358–363","page":"280","kind":"direction","topic":"역사·박물관·수장고 2건(P10 역사문화 클러스터, P14 도시역사박물관) — 구 역사는 존치·로비로 재활용","text":"P10은 박물관·전시동, 2층 브릿지의 '보이는 수장고', 수장고·유물 복원 연구동, 교육동(학생 유물 복원 실습실), 카페테리아·공방을 두고 기존 경주역 역사를 로비로 쓰며 남북 폐철도를 중앙 광장 보행로로 쓰되 남단 유적지구와 이으려 주 프로그램을 남단에, 북측은 공원으로 둔다. P14는 폐역사의 외피와 형태를 보존하고 트램 중심 복합 플랫폼·도시역사박물관(철도체험존·도시 타임라인관·역사도서관·수장고)·워케이션 센터를 두며 철도 관사는 숙박시설, 차량기지·철로는 전시공간으로 전환한다.","values":"P10 남단=주 프로그램·북측=공원 / P14 관사→숙박·차량기지→전시 / 1918 개업·1936 신축·2021 폐역 연표(p.360)","note":"수장고는 부지 안 P04·P10과 부지 밖 2건(읍성·경찰서 부지 p.262, 대릉원 북 법원네거리 p.312)에도 제안되어 위치가 분산됨. 수장 규모(㎡·점) 수치는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CULT","P_STN","P_AXIS","P_STAY","P_USE","P417_PROP"]},{"fid":"K3a-035","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 구 역사 취급 종합(P07·P10·P11·P14·P18·P21·P24), 인쇄 p.104, p.257–261, p.284, p.300, p.361, p.383, p.401","page":"104","kind":"fact","topic":"구 역사 취급: 현 위치 보존·재활용 다수, 일부 개조 1건, 1층 해체 1건, 이축 0건","text":"구 역사는 P24가 현 위치 보전을, P10이 로비 재활용을, P14가 외피·형태 보존을, P07이 일부 개조 후 터미널 사용을, P18이 경주문화관1918 기능 흡수를 제안하고, P21만 1층을 헐어 황오동 보행축을 낸다. 역사를 다른 곳으로 옮기는(이축) 안은 없다. 구 역사는 현재 경주문화관1918(경주역 문화플랫폼)로 쓰인다.","values":"보존·재활용 ≥5건 / 일부 개조 1(P07) / 1층 해체 1(P21) / 이축 0","note":"현재 '문화관'으로 쓰인다는 서술은 B-001 p.300(P11), '경주문화관1918' 명칭은 B-001 p.383(P18)과 B-survey 도시재생대학 보고서 인쇄 p.16–17에서 확인. 이축은 이 문서군에서 아무도 다루지 않았으므로 의뢰인의 이축 안은 근거를 다른 문서에서 찾아야 함.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"guides","nodes":["P_STN","P417_PROP"]},{"fid":"K3a-036","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 남북·동서 축 종합(P01·P02·P03·P07·P10·P11·P15·P21·P22·P24), 인쇄 p.149–157, p.257, p.284, p.302, p.364, p.401, p.405","page":"149","kind":"fact","topic":"남북 폐철도 축 활용 10건 vs 동서 횡단은 보행·마당·육교·필로티 중심, 신설 차도 반대 1건·보차혼용 1건","text":"남북 폐철도를 트램·보행특화거리·선형공원·문화 선형공원·보행축으로 쓰는 안이 P01·P02·P03·P07·P10·P11·P15·P21·P22와 P24(남북 보행동선+북천 연결)로 10건이다. 동서 횡단은 마당 시퀀스(P01), 필로티·보이드(P03·P06), 고가보행길·육교(P13·P16), 폐역사 1층 개방(P21), 보차혼용 도로(P24)로 제안되고, 횡단 가로를 몇 개 낼지는 어느 안도 수치로 말하지 않는다.","values":"남북 축 활용 10/24 / 동서: 마당·필로티·고가·육교 다수, 보차혼용 도로 1, 신설 차도 반대 1(P01)","note":"의뢰인 설계(동서 횡단 가로 3~5개)를 직접 뒷받침하거나 반박하는 수치 근거는 없다. 가로 폭·간격 수치도 없음. 건수는 본문 판독 기준 추정(P03 포함 여부는 불확실).","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"calibrates","nodes":["P_AXIS","P_CROSS","P_PED","P_LANE","P417_PROP"]},{"fid":"K3a-037","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 층수·고도 종합(P03·P07·P08·P09·P10·P11·P14·P15·P20·P21), 인쇄 p.159–161, p.260, p.273, p.276, p.285, p.301, p.363, p.367, p.396, p.403","page":"161","kind":"fact","topic":"제안 건축물의 층수는 2~5층(옥상정원·전망 제외), 인근 건축물 1~3층·고도제한 서술","text":"부지 제안 건축은 P11 2층, P03·P09·P10·P14·P15·P20 3층, P07·P08 4층(옥상정원), P21 호텔 5층·전시관 4층으로 대체로 2~5층이다. P03은 신라 문화재 보호구역이 넓어 주변 건축물이 주로 1~3층이고 고층 건물은 법적 높이 제한을 지켜 조망이 트인다고 쓰고, P11은 인근 건물 높이에 맞추며, P14의 SWOT는 고도제한 때문에 대규모 개발이 불가하다고 적는다.","values":"제안 2~5층 / 주변 1~3층 / 고도제한으로 대규모 개발 불가(SWOT)","note":"부지의 법정 고도·용적률·건폐율 수치는 문서에 없음(P_H·P_FAR의 'limits'를 줄 수 없음). 층수는 평면·단면 라벨에서 센 값이라 [추정].","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"calibrates","nodes":["P_H","P_FAR","P_FORM","P417_PROP"]},{"fid":"K3a-038","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 주차 종합(P03·P04·P07·P08·P11·P18·P22), 인쇄 p.161, p.221, p.258, p.273, p.299–302, p.383, p.407","page":"161","kind":"fact","topic":"부지 내 주차를 포함한 제안 7건(P03·P04·P07·P08·P11·P18·P22), 면수 수치는 P18만","text":"구경주역 부지 안에 주차 기능을 두는 제안은 P03(입출구), P04(넓은 주차 공간), P07(터미널 주차), P08(환승센터 3~4층 주차타워), P11(복합 공영주차장·상하단 주차장), P18(약 1,000대), P22(주차타워·터미널·도서관 허브 3개 층)로 7건이다. 이는 방향 5가 말한 원도심 주차장 축소·재배치와 긴장하며, 연구는 매설문화재 때문에 지하보다 지상·노외 주차가 발달했다고도 적는다(p.323).","values":"주차 포함 7/23 / 면수 수치 제시 1건(P18 약 1,000대)","note":"주차 면수·산정 원단위는 이 문서에 없음. 매설문화재→지상 주차 발달 서술은 대릉원 인접 제안(인쇄 p.323)에 있으며 부지에 대한 직접 서술은 아님.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"calibrates","nodes":["P_PARK","P_DIG","P417_PROP"]},{"fid":"K3a-039","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.1 대상지 3·5, §5.2 설세훈·김소향·최지석, 인쇄 p.162–167, p.180–185, p.238–243, p.286–291, p.352–357","page":"180","kind":"direction","topic":"부지 인접 제안: 북천철교 보행·트램 정류소(6,895㎡), 성동시장↔경주역 공중보행로, 화랑로 6→2차선 TOD, 양정로 역사문화거리","text":"농협공판장 부지(성동동 149-1·175, 6,895㎡)는 북천철교를 따라 북천까지 보행으로 잇고 트램 정류소·버스 환승 가로로 쓰자고 한다. 성동시장 문화클러스터는 시장(1971 염매시장 기원, 약 1.3만㎡·점포 300여 개·노점 30여 명)과 구경주역을 공중보행로로 잇고 구경주역을 공원화(선로→선형공원, 역사→전시·카페·정보라운지, 철도 유휴부지→공연장·예술가 레지던시·마켓)한다. 화랑로 인근 제안은 화랑로를 6차선에서 2차선으로 줄여 대중교통+보행 TOD 구간으로, 황촌 제안은 양정로를 신라 주작대로 추정 역사문화거리로 만든다.","values":"농협공판장 6,895㎡ / 성동시장 약 1.3만㎡·300+점포·노점 30여 / 화랑로 6차선→2차선 / 양정로","note":"농협공판장 부지는 구경주역 북단·북천철교와 맞닿아 북측 접속점으로 읽힘[추정]. 성동시장 수치는 학생 안 서술문(인쇄 p.286). 화랑로 차로 축소는 본문에 교통량 검토 없음. 황촌 제안(인쇄 p.355)은 동측 주변이 1층 규모 저층·한옥 곡선 지붕·휴먼스케일 골목 구조라고 분석해 동측 접속부(골목·입면) 맥락 자료로 쓸 수 있음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_AXIS","P_TRAMHUB","P_RETAIL","P_CULT","P_CROSS","P_LANE","P_PED","P_FORM","P417_PROP"]},{"fid":"K3a-040","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 B. 설문 개요·응답자 특성, 인쇄 p.33–35 (PDF p.34–36) 및 p.13–14","page":"33","kind":"fact","topic":"시민설문: 응답 65명(유효 63), 인지지도 응답은 27명","text":"설문은 2025년 3월 16일·4월 24일 두 차례 네이버폼·대면 인터뷰로 했고 응답자 65명 중 유효 63명(원도심 30·교외 33·미확인 2; 남 26·여 39)이다. 인지지도를 그린 사람은 27명(원도심 14·교외 13)이며, 청년층(10~30대)은 교외 거주(21명)가, 중장년층(40대 이상)은 원도심 거주(20명)가 더 많아 청년 의견의 상당수가 원도심 밖 거주자의 것이다.","values":"응답 65 / 유효 63 / 원도심 30(성건 14·중부 10·황오 6) / 교외 33 / 인지지도 27 / 청년 31(원도심 10·교외 21) · 중장년 32(원도심 20·교외 12)","note":"'63명'은 유효 설문 응답자이지 인지지도 장수가 아님(기존 정리의 '인지지도 63장'은 정정 필요). 본문 p.13–14는 '무작위 약 50명', 3.15–16·5.9–10 두 차례, A3 용지로 적어 p.33(65명, 3.16·4.24, A4)과 서로 다름 → conflict 항목 참조. 표본 소규모·비확률.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_HOUSE","P_TWOAX","P417_SURVEY"]},{"fid":"K3a-041","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 이슈 6 (옛)경주역의 미래 활용에 대한 기대, 인쇄 p.63–64 (PDF p.64–65)","page":"63","kind":"fact","topic":"(옛)경주역 활용 기대: 문화쇼핑(백화점) 31명(56.3%), 교통거점 16명(25%), 청년의 주거 1명","text":"응답자 55명 중 31명(56.3%)이 (옛)경주역이 경주를 대표하는 문화쇼핑 거점이 되길, 16명(25%)이 폐역 이전처럼 대표 교통거점이 되길 기대했다. 응답 58개 기준으로는 문화쇼핑 37·교통거점 16·지식기술센터 3·공공기관 3이고, 청년층(27명)은 문화쇼핑 16·교통거점 12·주거 1, 중장년층(28명)은 문화쇼핑 21·교통거점 4·지식기술센터 3·공공기관 3이다. 연구는 '문화쇼핑'을 백화점으로 해석하며, 교통거점 응답은 신경주역 이동이 불편하고 신경주역까지 걸리는 시간이 자가용으로 울산·포항에 가는 시간(약 30분)과 비슷하다는 이유이고 이용자 수 부족으로 실현이 어렵다는 단서를 붙인다. 중장년층은 교통거점의 추억과 성동시장 쇠퇴를 아쉬워하나 자가용·택시 때문에 문화쇼핑을 더 원한다고 해석한다.","values":"n=55 / 문화쇼핑 31명(56.3%)·응답 37 / 교통거점 16명(25%)·응답 16 / 지식기술센터 3 / 공공기관 3 / 청년: 문화쇼핑 16·교통 12·주거 1 / 중장년: 문화쇼핑 21·교통 4·지식 3·공공 3 / 신경주역 이동≈울산·포항 자가용 약 30분","note":"원문 내부 불일치: 31명 vs 응답 37, 16/55=29%인데 '25%'로 표기, 응답 합계 58 vs 항목 합 59(복수응답 가능성). 시설별 선호이며 비확률 소표본. 청년층 주거 선호는 1명, 공공기관 3명으로 청년주거·시청 수요 근거로는 약함.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","P_TRAMHUB","P_HOUSE","P_HALL","P_USE","P_JOBS","P_TRIP","P417_SURVEY"]},{"fid":"K3a-042","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 이슈 2 인지지도 사례, 인쇄 p.42–46 (PDF p.43–47)","page":"44","kind":"fact","topic":"인지지도 응답자의 (옛)경주역·성동시장 서술","text":"황오동 80대 응답자(no.4)는 경주역이 없어지며 성동시장이 쇠퇴했고 성동시장과 (옛)경주역의 관계가 중요하며 다시 교통거점이 들어오길 바란다고 했다. 동천동 50대(no.20)는 성동시장과 (옛)경주역 외에는 인지되는 거점이 없다고 하고, 중부동 10대(no.11)는 (옛)경주역 위치를 틀리게 그려 잘 인지하지 못하며 (옛)경주역과 학교 사이 시내는 가지 않는다고 했다.","values":"인지지도 사례 no.4(80대 황오동)·no.18(40대 성건동)·no.20(50대 동천동)·no.11(10대 중부동)","note":"개별 사례 서술(질적). 세대별 인지 차이: 고령층은 성동시장–역 연관, 10대는 위치 인지 약함.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","P_TRAMHUB","P_TWOAX","P417_SURVEY"]},{"fid":"K3a-043","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 이슈 2(중심부) 집계, 인쇄 p.50–55 (PDF p.51–56)","page":"51","kind":"fact","topic":"중심부 인식에서 (옛)경주역 7표·성동시장, 분리된 시민 집단","text":"상징적 중심부 3곳 응답 150개 중 (옛)경주역 7(4.6%)·성동시장 4(2.6%)로 황리단길 25·첨성대 16에 크게 못 미치고, 장보기·쇼핑 중심 3곳(52명)은 홈플러스·성동시장 16, 중부동 탑마트·중앙시장 13, 하나로마트 8이다. 시민은 북문로·화랑로·태종로를 기준으로 성건동(외국인)·화랑로 이남(원도심 거주자)·태종로 이남(방문자)으로 나뉘고 모두가 공유하는 거점이 없으며 화랑로·태종로는 차량 통행이 많아 중심부를 가른다.","values":"상징 중심 응답 150: 황리단길 25·첨성대 16·(옛)경주역 7·성동시장 4 / 쇼핑 중심(n=52): 홈플러스·성동시장 16·탑마트·중앙시장 13·하나로마트 8","note":"쇼핑 중심 표에서 '성동시장 16'은 원도심 열, '홈플러스 16'은 교외 열로 갈려 있어 본문 합산 표기(홈플러스·성동시장 16)와 열 해석이 다를 수 있음[추정]. 공유 거점 부재 = 부지가 담을 '공유 공간' 필요성의 근거.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","P_TWOAX","P_CROSS","P_OPEN","P417_SURVEY"]},{"fid":"K3a-044","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 이슈 7 대중교통 평가, 인쇄 p.65–67 (PDF p.66–68)","page":"65","kind":"fact","topic":"원도심 대중교통 2.7/5, 해결책은 자율주행 무료버스·보행공간·폐철도 재개통·트램","text":"응답 54명이 원도심 대중교통을 5점 만점에 평균 2.7점(청년 2.48, 중장년 3.03)으로 매겼고 불편 요인은 배차간격이다. 해결책 선호는 자율주행 무료 버스 18, 보행공간 개선 13, 폐철도 재개통 10, 트램 8, 버스 전용차선 1(n=51)이며, 타 도시 이동 수단은 버스터미널 30·기차역 22·자가용 19(n=49)이고 터미널 불편은 시내 연결성 부족 12·도로혼잡 11·고속/시외 기능 분리 9 순이다.","values":"만족도 2.7(청년 2.48, 중장년 3.03; n=54) / 자율주행 무료버스 18·보행 13·폐철도 재개통 10·트램 8·버스전용 1 / 이동수단 터미널 30·기차 22·자가용 19 / 터미널 불편 연결성 12·혼잡 11·기능분리 9·환승 5·주차 5","note":"만족도 2.7은 KPI 기준선(baseline) 후보. 재개통·트램 합 18은 자율주행 18과 같은 규모.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_TRAMHUB","P_PED","P_TRIP","P_TWOAX","P417_SURVEY"]},{"fid":"K3a-045","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 이슈 8 미래상, 인쇄 p.68–69 (PDF p.69–70)","page":"68","kind":"fact","topic":"원도심 필요시설 쇼핑여가 26·대중교통 24·문화예술 24, 주차는 1건; 미래상은 관광 우세·시민을 위한 도시 11","text":"원도심에 필요한 시설은 쇼핑여가 26, 대중교통 24, 문화예술 24, 의료보건 8, 하천정보 6, 학교교육 5, 관광시설 2, 편의시설 1, 주차 1(n=52)이고, 미래 방향은 관광도시 35·힐링도시 28·역사도시 23이며 '시민을 위한 도시'가 11명이다. 보전 29 대 개발 26(n=55)으로 거의 같은 비중이며, 연구는 관광에 치우친 정체성에 대해 거주지로서의 경주와의 균형을 요구하는 인식이라고 해석한다.","values":"필요시설(n=52): 쇼핑여가 26·대중교통 24·문화예술 24·의료보건 8·하천정보 6·학교교육 5·관광시설 2·편의 1·주차 1 / 미래상(n=52): 관광 35·힐링 28·역사 23·시민을 위한 도시 11 / 보전 29:개발 26(n=55)","note":"주차 응답이 1건뿐이라는 점은 2015 기본계획 설문(교통 문제 1위 주차시설 확충 38.8%)과 질문이 달라 직접 비교는 불가하나 대조됨. 두 축(방문·체류 ↔ 거주·생활) 균형을 요구하는 시민 인식의 근거 문장 포함.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_PARK","P_TWOAX","P_CULT","P_RETAIL","P417_SURVEY"]},{"fid":"K3a-046","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.2 이슈 5 하천의 이용과 잠재력, 인쇄 p.60–62 (PDF p.61–63)","page":"60","kind":"fact","topic":"원도심은 하천이 아니라 주차장으로 둘러싸여 있고 시민은 하천변에 주차한 뒤 도보 진입","text":"하천 이용자 50명(76.9%)은 서천·북천·동천을 주로 산책·주차에 쓰며, 하천변 주차장은 북동천 7개·서천 1개와 서천 대형 화물차 주차장 1개로 원도심은 하천이 아니라 주차장으로 둘러싸여 있다고 서술한다. 시민은 시내 주차가 부족하고 불편해 서천에 주차한 뒤 시내로 들어오며, 보행체계의 거점이 기능 거점이 아니라 주차장 위치라고 분석한다.","values":"하천 이용 50명(76.9%) / 북천·동천 26·서천 20·남천 4 / 목적 산책 29·주차 4·골프 1 / 주차장 북동천 7·서천 1+화물 1","note":"구경주역 북단(북천)과 닿는 하천변 주차 패턴의 배경. 주차 회전율·면수 수치는 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_PARK","P_PED","P_OPEN","P_TRIP","P417_SURVEY"]},{"fid":"K3a-047","doc":"B-survey","doc_title":"2030 경주도시기본계획 §시민의식 설문조사 (A-011, 2015.9~10 조사; 알려진 설문값의 쪽 확인용 대조 항목)","loc":"A-011 2030 경주도시기본계획 제1편 제2장 4절 시민의식 설문조사, 인쇄 p.79 (PDF p.93); 조사개요 인쇄 p.72–73","page":"79","kind":"fact","topic":"2015 시민 설문: 경주역 부지 활용 복합위락 44.5%·행정복합타운 26.2%·공원광장 22.9% — 인쇄 p.79(78 아님)","text":"2015.9.18~10.17 설문(배포 1,970부·회수 1,408부 71.5%, 95% 신뢰·표본오차 3.1%)에서 경주역 부지 이전 활용방안은 복합위락공간(쇼핑센터·영화관) 44.5%, 행정복합타운(공공청사·복지시설) 26.2%, 공원·광장 22.9%, 문화·예술공간 5.1%, 기타·무응답 각 0.7%이고, 교통 문제 개선은 대규모 주차시설 확충 38.8%, 대중교통 서비스 개선 25.6%, 도로망 확충 20.3%, 쾌적한 보행환경 14.3% 순이다.","values":"경주역 부지: 복합위락 44.5 / 행정복합 26.2 / 공원·광장 22.9 / 문화·예술 5.1 / 기타 0.7 / 무응답 0.7 ; 교통: 주차시설 38.8 / 대중교통 25.6 / 도로망 20.3 / 보행 14.3 ; n=1,408","note":"기존 정리(work/20260920_자료전수_추출_활용준비.md)가 적은 '인쇄쪽 78'은 PDF 대조 결과 인쇄 p.79(PDF p.93)가 맞음(p.78에는 해당 수치 없음). 조사시기는 2015년이며 2025 설문(B-001)과 표본·문항이 달라 수치 비교 불가. 2023 폐철도 기본구상 설문(시청 이전 63.7%)은 이 문서군 어디에도 없음(T4, 원문 미확인).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_RETAIL","P_HALL","P_OPEN","P_PARK","PL30_SURVEY"]},{"fid":"K3a-048","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 3. 경주역의 입지적 특성과 과제 01, 슬라이드 p.47 (PDF p.47); 격자 훼손은 p.13","page":"47","kind":"fact","topic":"경주역=유적 단절의 장소이자 근대 역사 축적지 — 1930년대 한옥형 청사·경주역 앞 삼층석탑·미규명 부지 터","text":"(구)경주역은 철로 폐선으로 훼손된 신라 고도의 역사적 골격과 유적지 단절이 드러나는 장소이면서 신라시대 유적과 근대(1936) 이후의 유무형 역사가 쌓인 곳이라고 규정한다. 1930년대에 지어진 한옥형 경주역 청사와 90여 년 이어진 경주의 관문, 아직 밝혀지지 않은 경주역 부지 터의 역사적 실체, 경주역 앞의 삼층석탑을 열거한다. 일제 이후 사선형 도로(1912)와 철도(1918)가 신라 격자형 공간구조를 훼손하고 유적지를 끊었다는 설명이 같은 자료 p.13에 있다.","values":"한옥형 경주역 청사(1930년대) / 90여 년 관문 / 경주역 앞 삼층석탑 / 사선도로 1912·철도 1918로 격자 훼손","note":"삼층석탑(경주역 앞)과 '부지 터의 미규명 역사적 실체'를 명시한 문서는 이 문서군에서 B-ref2뿐(B-001에는 없음). 석탑의 현 위치·규모·지정 여부는 제시되지 않음. 워크숍 발표 슬라이드(미간행)이며 2011 경주고도보존계획(경주시·국토연구원)을 요약해 쓴 부분이 많음. 연도는 p.47 '1936', p.48 '1937'로 표기가 갈림.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_STN","P_PAGODA","P_DIG","P_AXIS","P_CROSS","D_HISTMAP"]},{"fid":"K3a-049","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 3. 경주역의 입지적 특성과 과제, 슬라이드 p.48 (PDF p.48)","page":"48","kind":"direction","topic":"역사문화축 연계 지점: 녹색바람길(폐철도부지 개발 기본계획안 2023.10)·근대(1937) 역사성 포용·보행 네트워크의 출발점","text":"경주역은 월성·대릉원·황룡사지로 이어지는 역사문화축의 연계 지점으로서 훼손된 신라 고도 골격 회복과 단절된 유적지 통합, 근대(1937) 이후 쌓인 역사성 포용, 도심 활력 기반 조성의 출발점, 경주 문화유적지 보행 네트워크의 출발점이자 종착점이라고 본다. 경주시 폐철도부지 개발 기본계획안(2023.10)의 '녹색 바람길'(Step 1-1 경주역 일원, Step 1-2 형산강철교~무열왕릉, 동궁과 월지~사천왕사지 복원 구간)을 근거 그림으로 인용한다.","values":"녹색바람길 Step 1-1 경주역 일원 / Step 1-2 형산강철교~무열왕릉 / 복원 구간: 동궁과 월지~사천왕사지","note":"인용한 폐철도부지 개발 기본계획안(경주시 폐철도활용사업단 2023.10)의 원문 쪽은 이 문서군에 없음 → 별도 확인 필요. 지도 이미지로 판독.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_PED","P_STN","P_TRAMHUB","P_CROSS","D_HISTMAP"]},{"fid":"K3a-050","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 3. 경주역의 입지적 특성과 과제 02·맺음, 슬라이드 p.49, p.51 (PDF p.49, p.51)","page":"49","kind":"direction","topic":"(구)경주역의 과제 3가지: 동서·남북 연계 회복, 도심 건물 외관의 조화를 선도하는 중심축, 역사·예술이 입면에 축적되는 미래 문화유산","text":"(구)경주역은 첫째 동서·남북으로 단절된 고도의 역사문화환경을 연계·회복하고, 둘째 일반 중소도시와 구별되지 않는 도심 건물 외관이 고도 역사문화경관과 조화되도록 선도하는 중심축이 되며, 셋째 천년고도의 역사·예술·정신문화가 도심 건물 외관에 창조적으로 디자인돼 쌓이는 미래지향적 경관을 유도해야 한다고 쓴다. 근거로 유네스코 역사도시경관 권고(HUL)를 들며 경주역은 도심의 중요 역사도시경관 요소로서 기능과 외관을 함께 고려해야 하고, 결론은 '동결된 과거가 아닌 21세기에 만들어지는 미래문화유산'이다.","values":"과제 3개 / UNESCO HUL 권고 / 맺음: 동결된 과거 아닌 21세기 미래문화유산","note":"입면·재료·높이 수치 기준은 없고 원칙 수준. 공공문화시설 유명 건축가 설계공모 제안은 p.37(도심기능 연계)에 별도.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_FORM","P_STN","P_CROSS","P_PED","D_HISTMAP"]},{"fid":"K3a-051","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 2-04 서라벌 왕경권 공간관리계획, 슬라이드 p.26, p.33–34 (PDF p.26, p.33–34)","page":"26","kind":"direction","topic":"철로를 활용한 광역 녹색교통 역사문화 네트워크, 장기 유적 통합을 위한 도로 노선 조정·철도 일부 폐쇄","text":"서라벌 왕경권 공간관리계획(고도보존육성계획 파트, 2011 경주고도보존계획 요약으로 보임)은 범례에 '철로를 활용한 광역 녹색교통 역사문화 네트워크'와 '일부 도로노선 변경을 통한 단절된 유적군 통합'을 두고, 장기적으로 국도 4호선·7번 산업국도와 유적지 통과 도로를 축소·조정하며 중앙선·동해남부선 일부 구간을 폐쇄하고 서천변 신교각, 진입 구간 환승시설과 녹색교통 체계를 구축하자고 한다. 폐철도를 광역 녹색교통으로 쓰는 방향은 B-001의 트램과 같다.","values":"철로 활용 광역 녹색교통 / 국도 4·7 통과도로 축소·노선 조정 / 서천변 신교각 / 진입구간 환승시설","note":"슬라이드에 계획명이 직접 적히지 않아 2011년 경주고도보존계획 요약이라는 판단은 [추정](참고문헌 p.51 기준). 이후 상위계획 반영 여부는 이 문서만으로 알 수 없음. 도로 축소는 태종로·원화로 교통 처리에 영향을 줄 수 있으나 수치 없음.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_AXIS","P_CROSS","D_HISTMAP"]},{"fid":"K3a-052","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 2-04-3 도심기능 재생 및 활성화, 슬라이드 p.37–40 (PDF p.37–40)","page":"37","kind":"direction","topic":"도심 공공기능 강화(시청 이전·문화공간·관광정보센터·민속박물관)와 '공공기능의 도심 집중 유도, 외곽 이전 지양'","text":"읍성·도심 구역의 기능 재생 방안으로 공공기능 강화(시청 이전, 시청 주변 문화공간 확보, 관광정보센터·민속박물관 설립), 도심상업 활성화, 역사기록관·경주숲 조성, 공공문화시설의 유명 건축가 설계공모를 들고, 원칙으로 도심의 공공기능을 유지해 도시 중심성을 지키고 공공기능의 도심 집중을 유도하며 외곽 이전을 지양한다고 적는다. 시청 이전 대상지는 구경주역이 아니라 이 도심 구역 도면의 '경주 시청 이전' 표기로만 나타난다.","values":"공공기능 강화: 시청 이전·문화공간·관광정보센터·민속박물관 / 원칙: 공공기능 도심 집중, 외곽 이전 지양","note":"시청을 어디로 옮기는지는 슬라이드에서 구경주역으로 특정되지 않음(도면상 도심 구역). 시청 도심 입지를 지지하는 원칙 근거로만 사용 가능. 2011 경주고도보존계획 요약으로 보이나 슬라이드에 직접 명기되지 않음([추정]); 현행 계획과의 정합 미확인.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HALL","P_CULT","P_FORM","D_HISTMAP"]},{"fid":"K3a-053","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 2-04-2·04-3 구역 현황표, 슬라이드 p.36, p.38 (PDF p.36, p.38)","page":"36","kind":"fact","topic":"인접 구역의 고도지구 값: 황남동 주거지 10m·현상변경 3구역 12m, 팔우정 일대 일반상업 15m·현상변경 4구역 15m","text":"황남동 주거지 구역은 제1종일반주거지역에 고도지구 10m·역사문화미관지구이고 문화재 현상변경허가 검토구역 3구역(12m)이며, 팔우정 일대(구 경주시청 부지 등 방치 필지 다수) 도심 구역은 일반상업지역에 고도지구 15m·중심지미관지구이고 현상변경허가 검토구역 4구역(15m)이다. 후자는 토지 70,510㎡·필지 276·건축물 155동(30년 이상 87동, 약 56%)이다.","values":"황남동: 1종일반주거·고도지구 10m·현상변경 3구역 12m·199,363㎡ / 팔우정 일대: 일반상업·고도지구 15m·현상변경 4구역 15m·70,510㎡","note":"구경주역 부지가 아니라 인접·인근 구역의 2011 계획 시점 값. 팔우정 일대가 부지 남단에 닿는다는 위치 판독은 도면 라벨 기준[추정]. 현행 고도지구·현상변경 기준은 별도 T1 확인 필요.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_H","P_FAR","P_FORM","D_HISTMAP","L_GODO"]},{"fid":"K3a-054","doc":"B-survey","doc_title":"2025년 경주시 찾아가는 도시재생대학 결과보고서 (도시작가솔루션, 2025.08.21)","loc":"도시재생대학 결과보고서 1회차 황오동, 인쇄 p.16–17 (PDF p.12)","page":"16","kind":"fact","topic":"황오동장 발표: 경주문화관1918 운영·황오황촌 임시공영주차장·중부황오 통합행정타운, 인접 도로 3건 예정(2026·2027)","text":"황오동 역점사업으로 경주역사 및 부지개발 항목에 경주문화관1918(경주역 문화플랫폼) 운영과 황오황촌 임시공영주차장 준공을, 별도로 중부·황오 통합행정타운 건립을 든다. 도로로는 화랑초~경주고 도시계획도로 확장(2026 예정), 양정로 개설(2027 예정), 태종로 개설(2026 예정)이 예정돼 있다고 소개하고 중심상권 르네상스(2026까지)·전통시장 특성화시장 육성도 진행 중이라고 한다.","values":"화랑초~경주고 도시계획도로 확장 2026 / 양정로 개설 2027 / 태종로 개설 2026 / 경주문화관1918 / 황오황촌 임시공영주차장","note":"황오동장(2025.6.25) 구술 요약이라 도로 노선 위치·폭 수치는 없음. 양정로·태종로 개설이 부지 남·동측 접속가로에 영향을 주는지는 별도 도면 확인 필요. 통합행정타운의 위치는 이 쪽에서 밝히지 않음(B-001 p.119 도면에는 읍성 구역에 표기).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_CROSS","P_PARK","P_HALL","P_STN","P_LANE","PLM_FORUM"]},{"fid":"K3a-055","doc":"B-survey","doc_title":"2025년 경주시 찾아가는 도시재생대학 결과보고서 (도시작가솔루션, 2025.08.21)","loc":"도시재생대학 결과보고서 1회차 황오동, 인쇄 p.18–19, p.24–25 (PDF p.13, p.16)","page":"18","kind":"direction","topic":"황오동 주민 제안: 폐철도 활용은 시민이 체감할 사업으로, 규제 제한은 공공 주도 개발행위로, 비전 '젊은이들이 모이는 창의적 플랫폼 도시'","text":"황오동 주민자치위원은 현안으로 경주역 폐철과 급감한 유동인구, 문화재·고도 등 개발행위 제한, 관광객을 수용 못하는 원도심 상권, 불법주차와 도보 이동권을 꼽고, 제안으로 폐철도 활용방안을 시민이 가시적으로 체감할 수 있는 사업으로 추진하고 건축규제에 의한 제한을 공공 주도의 개발행위로 풀자고 한다. 주민 퍼실리테이션 비전은 '젊은이들이 모이는 창의적 플랫폼 도시 황오동' 등 세 가지다.","values":"참석 34명 / 현안: 경주역 폐철·유동인구 급감·개발행위 제한·불법주차 / 제안: 폐철도 활용 가시화·공공 주도 개발 / 비전: 젊은이들이 모이는 창의적 플랫폼 도시 황오동","note":"주민 의견은 소규모 워크숍(34명) 결과이며 구경주역 부지 용도별 선호 수치는 없음. '젊은이' 비전은 청년 직주락 방향의 정성 근거.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_TWOAX","P_H","P_OPS","P_PARK","PLM_FORUM"]},{"fid":"K3a-056","doc":"B-survey","doc_title":"2025년 경주시 찾아가는 도시재생대학 결과보고서 (도시작가솔루션, 2025.08.21)","loc":"도시재생대학 결과보고서 2회차 중부동, 인쇄 p.34–35 (PDF p.21)","page":"34","kind":"standard","topic":"중부동: 통합행정복합타운 행정복지센터 1,163㎡·주민자치센터 864㎡, 도심 고도제한 20~25m→36m 완화(2020.12.2 고시)","text":"중부동장 발표에서 중부·황오통합행정복합타운 건립(행정복지센터 1,163㎡ 지상 2층, 주민자치센터 864㎡ 지상 2층), 도심 고도제한 완화지역 재건축 활성화(20~25m→36m, 도시관리계획안 고시 2020.12.2), 봉황대 공영주차장 정비(총 100면: 일반 97·장애인 3), 읍성 복원(2025년 사업비 90억, 성벽 1,100m 복원)을 든다.","values":"행정복지센터 1,163㎡(2층) / 주민자치센터 864㎡(2층) / 고도제한 20~25m→36m(2020.12.2) / 봉황대 공영주차장 100면 / 읍성 복원 2025 사업비 90억·성벽 1,100m","note":"중부동 구역의 값이며 구경주역 부지의 고도지구 값이 아님. 중부동(부지 서·남측 인접)의 고도 36m 완화는 인접 구역 상한 참조치로만 사용. 고시 원문 확인 필요.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_HALL","P_H","P_PARK","P_PED","PLM_FORUM","L_GODO"]},{"fid":"K3a-057","doc":"B-survey","doc_title":"2024년 황오동 원도심(중심시가지형) 도시재생뉴딜사업 성과지표 및 모니터링 용역 결과보고서 (공공도시, 수정중본 2025.09)","loc":"황오동 성과지표·모니터링 결과보고서 §5 성과지표 결론, 인쇄 p.48, p.63, p.66, p.72–73 (PDF p.56, p.71, p.74, p.80–81)","page":"66","kind":"fact","topic":"황오동 유동인구 26,536명(2020)→22,646명(2024), 원인은 2021.12 경주역 폐역; 신규 앵커 도입으로 유동인구 재창출 제언","text":"소상공인365 기준 황오동 도시재생 대상지 유동인구가 2020년 26,536명에서 2024년 22,646명으로 줄었고, 보고서는 감소의 주된 원인을 2021년 12월 경주역 폐역이라는 거시적·구조적 충격으로 보며 기차역 폐쇄가 1~3년에 걸쳐 주변 유동인구를 급감시킨 2004년 남원역 사례를 든다. 정책 제언은 경주역 폐역 부지의 신규 사업과 황오동 재생사업을 연계해 새 방문객 동선을 원도심으로 끌어들이는 '신 앵커 기능' 도입이다.","values":"2020 26,536 → 2021 25,065 → 2022 24,555 → 2023 22,077(보정) → 2024 22,646(보정), −14.7% / 2024.01~2025.04 평균 20,986명 / 폐역 2021.12 / 남원역 2004 사례 1~3년 급감","note":"감소율 −14.7%는 값에서 계산. 2023·2024 값은 황오동 전체 기준 측정을 대상지 비율 0.504로 보정한 것이라 2020~2022(대상지 기준)와 측정 방법이 달라 연속 비교에 주의(인쇄 p.63 각주). 월별 일평균 계열이며 활성화구역 변경도 자료에 영향을 준다고 보고됨(인쇄 p.105). 두 축 KPI 중 방문·유동 축의 현재 기준선 후보.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_TWOAX","P_USE","P_RETAIL","PLM_MONITOR"]},{"fid":"K3a-058","doc":"B-survey","doc_title":"2024년 황오동 원도심(중심시가지형) 도시재생뉴딜사업 성과지표 및 모니터링 용역 결과보고서 (공공도시, 수정중본 2025.09)","loc":"황오동 성과지표·모니터링 결과보고서 §5 정책적 제언, 인쇄 p.73 (PDF p.81)","page":"73","kind":"direction","topic":"주민 설문: 개선 필요 1순위 지역상권 활성화(21.91%), 최고 기대는 보행환경(평균 7.0 이상), 거점시설 수익모델(주차장·대관 운영)","text":"주민 설문에서 개선이 필요한 프로그램 1순위는 지역상권 활성화(21.91%)이고 상인 수요로 야시장 정기 개장과 실무 위주 커리큘럼이 거론되며, 가장 높은 기대(평균 7.0점 이상)는 '글로벌 문화로 황오거리'와 '안전한 골목길' 등 보행환경 개선에 있다. 마중물 사업 종료 후에는 마을관리사회적협동조합이 주차장·대관시설 운영 수익 등 거점시설 수익모델로 재정 자립을 해야 한다고 제언한다.","values":"개선 필요 1순위 지역상권 활성화 21.91% / 기대 7.0점 이상: 글로벌 문화로 황오거리·안전한 골목길 / 수익: 주차장·대관 운영","note":"황오동 도시재생사업 대상지 설문이며 구경주역 부지 활용을 묻는 문항은 아님. 운영 주체 사례(마을관리사회적협동조합)는 부지 운영 조직 설계의 인접 선례.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_OPS","P_RETAIL","P_PED","P_COST","PLM_MONITOR"]},{"fid":"K3a-059","doc":"B-survey","doc_title":"2025년 행복황촌(성동·황오지구 일반근린형) 도시재생 성과지표 및 모니터링 용역 결과보고서 (도시사람콘텐츠랩, 2025.12)","loc":"행복황촌 성과지표·모니터링 결과보고서 §Ⅱ·Ⅲ·Ⅳ, 인쇄 p.18, p.90, p.123 (PDF p.18, p.90, p.123)","page":"18","kind":"fact","topic":"경주역 동편 행복황촌 사업(164,500㎡·127.28억·2021~2025)과 협동조합 운영, 경주역 남편 도로 접근성 개선","text":"행복황촌은 황오·성동동(경주역 동편) 164,500㎡에 2021~2025년 사업비 127.28억 원(국 72·도 12·시 36·기금 7)으로 상권활력소·마을활력소·마을부엌/카페·게스트하우스·나들이길·문화마당을 조성하는 일반근린형 사업이다. 2022.12.26 설립된 행복황촌 협동조합이 마을호텔·마을부엌 중심으로 운영을 맡아 철도·문화재로 막혀 쇠퇴한 경주역 동편 변화를 이끌 것으로 기대되며, 지하도 지상화 등으로 경주역 남편 도로 접근성이 좋아져 교통보행환경 요인이 약 10점 올랐다.","values":"164,500㎡ / 127.28억원(국 72·도 12·시 36·기금 7) / 2021~2025 / 협동조합 2022.12.26 설립 / 교통보행환경 요인 약 +10점","note":"구경주역 동측 인접 사업구역의 규모·운영 선례. 부지와의 경계·중첩은 이 쪽에 없음. 수치는 모니터링 보고서 사업 개요 표의 값.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_OPS","P_BND","P_CROSS","P_STAY","P_CULT","PLM_MONITOR"]},{"fid":"K3a-060","doc":"B-survey","doc_title":"2025년 행복황촌(성동·황오지구 일반근린형) 도시재생 성과지표 및 모니터링 용역 결과보고서 (도시사람콘텐츠랩, 2025.12)","loc":"행복황촌 성과지표·모니터링 결과보고서 §Ⅲ-6 젠트리피케이션, 인쇄 p.39, p.145 (PDF p.39, p.145)","page":"145","kind":"fact","topic":"경주역 개발 예상으로 지가·임대료 상승 예상, 게스트하우스 문의 다수 — 임대료 지원 정책 필요","text":"임대료 조사에서 경주역 개발 등이 예상되면서 지가가 오를 것으로 보이고, 길가 상점은 임대료가 계속 오를 것이며 게스트하우스 사업 문의가 많아 가격에 영향을 줄 것이라고 쓴다. 이에 임대료 부담을 낮추고 창업가가 들어올 수 있도록 임대료 지원 정책이 필요하다고 제언한다(공시지가 상승률은 매년 6% 이상 오르다 2023~2024년 소폭 하락).","values":"공시지가 2021 442,934원 → 485,880원(+9.1%) → 516,904원(+6.4%) → 488,003원(−5.59%) → 486,217원(−0.37%) / 임대료 상승 예상","note":"'경주역 개발 예상'이 지가·임대료에 미치는 영향의 정성 서술이며 계획 발표 전후 정량 분석은 아님. 공시지가 단위는 원/㎡로 추정. 표 열 순서(2021~2025)와 본문(p.27: '24년말 기준 −0.37%)의 귀속 연도가 한 해 어긋나 보여 정확한 연도는 원문 표 확인 필요.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","P_COST","P_RETAIL","PLM_MONITOR"]},{"fid":"K3a-061","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 시나리오 C·목표 3a·터미널 3건(인쇄 p.75, p.79, p.142) ↔ 건축 제안 7건(p.256–411) ↔ A-011 2030 도시기본계획 인쇄 p.250·p.225·p.251","page":"79","kind":"conflict","topic":"터미널 입지가 세 갈래: 현위치 통합 재개발(연구 본문) / 구경주역으로 이전(건축 제안 7건) / KTX 역세권(2030 기본계획)","text":"B-001 본문(시나리오 C, 목표 3a, 터미널 부지 제안 3건)은 서천교 주변 현 터미널을 통합 재개발하자고 하지만 건축 제안 7건은 터미널을 구경주역 부지로 옮긴다. 2030 기본계획은 종합터미널 최적 입지를 경부고속철도 역세권으로 보면서(재검토 단서) 중부시외버스터미널은 현 위치에서 생활권 간 연결기능으로 전환하고 고속버스터미널은 존치하며, 복합환승센터는 경주역·시외버스터미널·KTX역 3개소에 둔다.","values":"현위치 통합(p.75·79·142) / 구경주역 이전 7/23건 / 2030 plan: 최적입지=KTX 역세권(p.250), 중부시외=현 위치 기능 전환, 고속버스터미널 존치(p.250), 복합환승센터 3개소(p.225)","note":"대조 T1: 2030 도시기본계획(A-011) 인쇄 p.250·p.251(터미널 계획·총괄표)·p.225(복합환승센터), 2022 도시재생전략계획(A-006) 인쇄 p.112(복합환승센터 동일). 의뢰인의 '모빌리티 허브(관광지원·환승)'는 터미널 전체 이전이 아니라 환승·셔틀 기점이므로 이 충돌의 직격은 아니나 '터미널을 부지로' 안은 상위계획과 어긋남.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["PL30_TERM","P_TRAMHUB","P_PARK","P417_PROP"]},{"fid":"K3a-062","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §3.2·§4.2 시청=셔틀 정거장(인쇄 p.30, p.74, p.77, p.83) ↔ A-011 2030 도시기본계획 인쇄 p.287·p.290, A-006 2022 도시재생전략계획 인쇄 p.138·p.166·p.119","page":"30","kind":"conflict","topic":"행정 기능: 2030·2022 계획은 경주역 부지에 행정(공공청사·행정복합타운)을 넣는데 B-001은 행정을 제안하지 않음","text":"2030 기본계획은 경주역 이전적지에 멀티복합타운(행정·문화·멀티복합센터; 행정·문화·상업·업무)을 조성하라고 하고, 2022 도시재생전략계획은 경주역 부지개발(성동동 169-2 외 110필지 148,770㎡, 2019~2028)에 공공청사·상징광장·관람타워·문화·공원시설·복합상업시설·커뮤니티시설을 넣고 경주역사의 행정복합타운 계획과 연계하며 중점경관관리구역을 '행정복합타운'으로 지정한다. B-001은 시청을 셔틀 정거장으로만 두고 부지 행정 제안이 없으며(소규모 P09 3층·P20 주민센터뿐), 2015 설문 행정복합타운 26.2%(2위)와 달리 2025 설문에서 공공기관은 응답 3/58이다.","values":"2030 plan p.287·p.290: 행정·문화·멀티복합센터 / 2022 plan p.138: 공공청사·상징광장·관람타워 등 148,770㎡ / B-001: 행정 제안 0건(시청 이전), 설문 공공기관 3/58","note":"의뢰인의 시청·의회 이전 검토 방향은 B-001과는 불일치, 2030·2022 T1 계획과는 일치. 2023 폐철도 기본구상 설문(시청 이전 63.7%)은 이 문서군에 없음(T4, 원문 미확인). 2015·2025 설문은 문항·표본이 달라 직접 비교 불가.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_HALL","P_USE","P_BND","P417_PROP","PL30_MULTI","PLR_SITE"]},{"fid":"K3a-063","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §2.1·§4.1 서경주역 관문·무인 셔틀(인쇄 p.30, p.77) ↔ A-011 2030 도시기본계획 인쇄 p.226","page":"30","kind":"conflict","topic":"순환 교통: 서경주역 기점 무인 셔틀+광역 트램 vs 2030 터미널 기점 제1·2버스순환선·전기차 순환선","text":"B-001은 서경주역을 원도심의 기능적 관문으로 삼아 자율주행 무인 셔틀을 돌리고 (옛)경주역에서 광역 트램을 출발시킨다. 2030 기본계획은 제1순환선을 터미널~성건동~황성공원~경주역(성동시장)~중앙시장~대릉원~터미널로, 제2순환선을 오릉~월성지구~박물관~동궁과월지~황룡사지~대릉원~오릉으로 정하고 사적지 주변 전기차 순환망을 둔다. 구경주역(성동시장)을 순환 경유·환승거점으로 삼는 점은 공통이나 기점·수단·관문역이 다르다.","values":"B-001: 서경주역 기점·무인 셔틀·트램 / 2030 plan p.226: 제1순환선 경주역(성동시장) 경유·제2순환선·전기차 순환선","note":"수렴 부분: 폐철도→녹지·보행축·녹색교통(2030 plan p.99·p.104)과 B-001 다수 제안. 두 계획 모두 구경주역을 노선 경유점으로 두므로 부지에 정거장·환승 기능을 두는 것 자체는 상충 없음.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_TRAMHUB","P_CROSS","P417_MOB","PL30_HUB"]},{"fid":"K3a-064","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 §5.1 P01·P02·P03·P07 대지 면적(인쇄 p.148–161, p.257), §3.2 시나리오 C(인쇄 p.74) ↔ A-006 2022 도시재생전략계획 인쇄 p.138","page":"148","kind":"conflict","topic":"부지 경계·소유: 전략계획 148,770㎡(철도공단·철도공사·기재부) vs 제안별 29,133~123,040㎡, '철도청 장기 임대'","text":"2022 도시재생전략계획은 경주역부지 개발 사업 대상을 성동동 169-2 외 110필지 148,770㎡(철도공단 69,790·철도공사 78,864·기재부 116)로 적고, B-001 건축 제안의 대지는 29,133㎡·45,424㎡·약 97,468㎡·약 123,040㎡로 모두 달라 연구가 경계를 확정하지 않았다. 시나리오 C는 부지를 '철도청'으로부터 장기 임대한다고 쓰는데 현재 소유 주체는 국가철도공단·한국철도공사 체계다.","values":"A-006 p.138: 148,770㎡ (69,790 + 78,864 + 116) / B-001: 29,133·45,424·97,468·123,040㎡ / 시 구상 79,438㎡[T4]","note":"의뢰인 계획 경계 218,478㎡·고시 156,460㎡와도 다름. 소유 구성(철도공단 69,790㎡ 등)은 A-006 표 인용이며 최신 필지·소유 확인 필요.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_BND","P_COST","P_OPS","P417_PROP","PLR_SITE"]},{"fid":"K3a-065","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 P21 폐역사 1층 해체(인쇄 p.401) ↔ A-006 2022 도시재생전략계획 인쇄 p.119(중점경관관리구역 행정복합타운), p.87","page":"401","kind":"conflict","topic":"역사·전면부: 전략계획은 역사와 전면 오픈스페이스·화랑로 조망축 보존, B-001 P21은 폐역사 1층 해체","text":"2022 도시재생전략계획은 중점경관관리구역(행정복합타운)에서 경주역 역사 및 전면부 오픈스페이스를 보존해 관광자원화하고 화랑로에서 경주역 방향 조망축을 보존하라고 하며 1936년 건축된 역사 건물을 근대건축물로 보존 가치가 높다고 본다. B-001 P21은 폐경주역사 1층을 헐어 황오동 보행축을 내고 나머지 안은 대체로 보존·재활용이며, B-001은 중점경관관리구역이라는 규제 층 자체를 다루지 않는다.","values":"A-006 p.119: 역사·전면부 오픈스페이스·화랑로 조망축 보존 / p.87: 1936 건축·보존 가치 높음 / B-001 P21: 1층 해체","note":"A-006 p.119의 표 출처 표기는 '2025 경주시 경관계획'으로 2022 계획 변경본에 후속 반영된 것으로 보임. 부지에 걸린 경관 규제는 별도 T1(경관계획 A-009) 확인 필요.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_STN","P_FORM","P_OPEN","P_CROSS","P417_PROP","PLL_ZONE"]},{"fid":"K3a-066","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 인쇄 p.21 vs p.114·p.116·p.257·p.360, 인쇄 p.220 vs p.23·p.256; B-ref2 슬라이드 p.47 vs p.48; A-006 인쇄 p.87","page":"21","kind":"conflict","topic":"(옛)경주역 연혁 표기 불일치: 1936 vs 1937, 폐역 2021 vs 2010","text":"B-001은 (옛)경주역을 본문에서 1937년(p.21), 도면·가천대 안에서 1936년(p.114·116·257·360)으로 적고, P04는 폐역을 '2010년 경주역이 신경주역으로 이전'(p.220)이라 쓰는데 본문은 2021년 폐역·2021.12.28 이설이다(p.23, p.256). B-ref2도 p.47은 1936, p.48은 1937이고, 2022 전략계획은 1936년 건축이다. 첫 경주역은 1918년 서라벌문화회관 자리(p.21)라는 서술과 '1918 개통 이후'(p.220)·'1918년 보통역 영업 개시'(p.360)도 섞여 있다.","values":"1936 vs 1937 / 폐역 2021.12 vs 2010(P04 오기) / 1918 개업(첫 역 위치 vs 현 부지)","note":"구 역사 준공 연도는 의뢰인이 풀지 못한 항목. T1 문서(등록문화유산 등록 고시 등)로 확정해야 하며 이 문서군으로는 불가. 폐역 2021 쪽이 다수 서술과 일치.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_STN","D_HISTMAP"]},{"fid":"K3a-067","doc":"B-ref2","doc_title":"천년 고도 경주의 골격구조 변화와 (구)경주역 (채미옥, 문화국토연구협동조합, LOWCA 워크샵 발표자료 2026.9.12, 51쪽)","loc":"B-ref2 슬라이드 p.10(방리제 규모) ↔ B-001 인쇄 p.18","page":"10","kind":"conflict","topic":"신라 왕경 블록 규모: 약 120×120m(B-001) vs 1방 164m×140m(B-ref2)","text":"B-001은 신라 왕경이 정방형 격자 블록(약 120×120m)으로 조성됐다고 쓰고, B-ref2는 방리제의 1방을 폭 164m×길이 140m로 보며 왕경 면적 4.3km×3.9km·1,360방·178,936가구로 추정한다. 가구·획지 모듈을 왕경 블록에서 따오려면 어느 값을 쓸지 정해야 한다.","values":"B-001 p.18: 약 120×120m / B-ref2 p.10: 164m×140m, 1,360방, 4.3×3.9km","note":"두 값 모두 학술 서술이며 유구 실측치 인용이 없음. B-ref2는 2011 경주고도보존계획 요약으로 보임.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_LOT","P_FORM","D_HISTMAP"]},{"fid":"K3a-068","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 방향 5(인쇄 p.78) ↔ 건축 제안 주차 7건(p.161·221·258·273·299·383·407), §2.2 이슈 8(p.68) ↔ A-011 2030 도시기본계획 인쇄 p.79","page":"78","kind":"conflict","topic":"주차: 방향 5의 주차장 축소 vs 부지 내 주차 포함 제안 7건, 시민 인식 '주차' 1/52 vs 2015 설문 주차시설 확충 38.8%","text":"연구 방향 5는 원도심 주차장을 줄이고 재배치하라고 하지만 구경주역 부지 제안 7건은 주차를 포함하고 그중 P18은 약 1,000대 규모를 둔다. 2025 연구 설문에서 원도심에 필요한 시설로 '주차'를 꼽은 응답은 52명 중 1명인 반면 2015 기본계획 설문은 교통 문제 개선사항 1위로 대규모 주차시설 확충을 38.8% 택했고 거주지가 도심에 가까울수록 응답이 높았다.","values":"방향 5: 주차장 축소·재배치 / 부지 내 주차 제안 7건(P18 약 1,000대) / 2025: 주차 1/52 / 2015: 주차시설 확충 38.8%","note":"두 설문은 질문(필요시설 vs 교통문제 개선사항)·표본·시점이 달라 직접 대립이 아니라 주차 수요 추정의 불확실성을 보이는 것. 2030 plan p.79에서 '거주지가 읍·면에서 동으로 갈수록 주차 확충 응답 비율이 높다'는 서술 확인.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_PARK","P_TRIP","P_TWOAX","P417_PROP","P417_SURVEY"]},{"fid":"K3a-069","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 전권 키워드 검색(시청·의회·청사·행정), 인쇄 p.30, p.52, p.73–74, p.77, p.83","page":"","kind":"gap","topic":"시청·의회 이전 제안 없음 — 시청은 셔틀 정거장·인접 시설로만 등장","text":"(옛)경주역 제안 24건 어디에도 시청 또는 의회를 두는 안이 없고, '시청'은 셔틀 노선의 정거장(p.30, p.74, p.77, p.83)과 시민이 꼽은 상징 중심지 응답(p.52 경주시청 3표)으로만 나온다. 행정 기능은 P09의 3층 행정·보육·주거와 P20의 황오동 주민센터 정도이며, 중부·황오 통합행정복합타운은 읍성 구역 도면에 표기된다(p.119).","values":"시청·의회 제안 0/24 / 소규모 행정: P09 3층, P20 황오동 주민센터","note":"텍스트 레이어 전권 검색 결과이며 이미지 전용 쪽(약 119쪽)의 라벨은 일부만 대조해 '추정'. 시청 이전 방향의 근거는 B-ref2 p.37·p.40(공공기능 도심 집중)과 T1 2030·2022 계획(행정복합타운)에서 찾아야 함.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"","nodes":["P_HALL","P417_PROP"]},{"fid":"K3a-070","doc":"B-001","doc_title":"경주시 원도심 미래구상 기획 연구 (동국대·가천대, 경주시 미래전략실 발주, 2025.07, 417쪽)","loc":"B-001 전권 키워드 검색(용적률·건폐율·층수·고도), 인쇄 p.78, p.108, p.144, p.160, p.302, p.359","page":"","kind":"gap","topic":"부지의 법정 건폐율·용적률·최고 높이 수치 없음","text":"문서에는 부지에 대한 건폐율·용적률·최고 높이·층수 기준이 없다. 높이 관련 언급은 하천변 개발 가능 36m(p.78), 북천변 고도제한 완화 유도(p.108), 터미널 부지 두 블록의 36m·10m 고도제한(p.144), 주변 건축물 1~3층(p.160), 인근 높이에 맞춘 스카이라인(p.302), SWOT '고도제한으로 대규모 개발 불가'(p.359)뿐이다.","values":"수치 기준 없음 / 언급: 36m(하천변·노서동)·10m(사정동)·1~3층","note":"P_FAR·P_H의 'limits'는 이 문서로 줄 수 없고 규제 4겹(고도지구·현상변경 허용기준 등) T1 문서에서 확정해야 함.","tier":"T2","co
