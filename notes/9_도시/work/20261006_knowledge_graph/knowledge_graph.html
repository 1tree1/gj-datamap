<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구경주역 마스터플랜 지식그래프</title>
<style>
:root{
  --bg:#f4f3ee; --panel:#ffffff; --panel2:#f0eee7; --ink:#1d2430; --muted:#6b7380; --line:#d8d4c8;
  --accent:#2b5fd9; --hl:#fff1bf; --shadow:0 4px 18px rgba(30,36,48,.16);
  --k-intent:#c58a1f; --k-plan:#4274c9; --k-law:#be4a43; --k-data:#2f9068; --k-derived:#7f6db5; --k-param:#27364f; --k-eval:#a2449a;
  --A:#2a9d6a; --B:#2f8fd1; --C:#e0a31e; --D:#d1453b;
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1b1f26; --panel2:#232831; --ink:#e6e8ec; --muted:#98a1ae; --line:#394050;
  --accent:#7aa2ff; --hl:#4a3f12; --shadow:0 4px 18px rgba(0,0,0,.5);
  --k-intent:#d9a441; --k-plan:#6f9bf0; --k-law:#e0766f; --k-data:#4dbf90; --k-derived:#a493dc; --k-param:#aebfdc; --k-eval:#d173c8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
#top .ttl{display:flex;flex-direction:column;line-height:1.25;margin-right:6px}
#top .ttl b{font-size:15px}
#top .ttl span{font-size:11px;color:var(--muted)}
#tabs{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:9px}
#tabs button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}
#tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:700}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#qres{position:absolute;left:0;right:0;top:34px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;max-height:340px;overflow:auto;display:none}
#qres button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}
#qres button:hover,#qres button.cur{background:var(--panel2)}
#qres small{color:var(--muted);margin-left:6px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.tools label{font-size:11px;color:var(--muted)}
.tools select,.tools button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;cursor:pointer}
.tools button:hover{background:var(--panel2)}
#main{display:flex;flex:1 1 auto;min-height:0}
#left{width:268px;flex:0 0 268px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 12px 20px}
#right{width:372px;flex:0 0 372px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 28px}
body.noleft #left{display:none}
body.noright #right{display:none}
#left h4,#right h4{margin:14px 0 6px;font-size:11.5px;letter-spacing:.02em;color:var(--muted);font-weight:700;text-transform:none}
#left h4:first-child{margin-top:2px}
#stage{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#svg:active{cursor:grabbing}
#matrix{position:absolute;inset:0;overflow:auto;display:none;background:var(--bg);padding:12px 14px 40px}
#hud{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#hud .box{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;font-size:12px}
#hud button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 8px;cursor:pointer}
#hud button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px;pointer-events:none;opacity:.92}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
.pv{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.pv:hover{background:var(--panel2)}
.pv.on{background:var(--hl);font-weight:700}
.pv .gd{flex:0 0 auto}
.pg{margin:8px 0 2px;font-size:11px;color:var(--muted);font-weight:700}
.gd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;font-size:10px;font-weight:700;color:#fff;padding:0 3px}
.gd.A{background:var(--A)}.gd.B{background:var(--B)}.gd.C{background:var(--C);color:#1d2430}.gd.D{background:var(--D)}
.ck{display:flex;align-items:center;gap:7px;padding:2px 2px;font-size:12.5px;cursor:pointer;user-select:none}
.ck i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
.ck i.ln{height:3px;border-radius:2px;width:18px}
.ck em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}
.ck.rel{align-items:flex-start}
.ck.rel small{display:block;color:var(--muted);font-size:10.5px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{display:inline-block;padding:0 6px;border-radius:9px;font-size:10.5px;line-height:17px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.t1{color:#1f7a54;border-color:#9fd6bb}.chip.t2{color:#1f7088;border-color:#9cd0dc}.chip.t3{color:#9a6a0c;border-color:#e6cf93}.chip.t4{color:#b13a30;border-color:#e8a6a0}
.chip.s-보유{color:#1f7a54;border-color:#9fd6bb}.chip.s-부분{color:#9a6a0c;border-color:#e6cf93}.chip.s-요청{color:#b8610f;border-color:#efc08d}.chip.s-없음{color:#b13a30;border-color:#e8a6a0;background:rgba(209,69,59,.08)}
.chip.hard{color:#b13a30;border-color:#e8a6a0}.chip.soft{color:var(--muted)}.chip.est{border-style:dashed}
.chip.kind{color:#fff;border:0}
.k-intent.kind{background:var(--k-intent)}.k-plan.kind{background:var(--k-plan)}.k-law.kind{background:var(--k-law)}.k-data.kind{background:var(--k-data)}.k-derived.kind{background:var(--k-derived)}.k-param.kind{background:var(--k-param);color:var(--bg)}.k-eval.kind{background:var(--k-eval)}
.card{background:var(--panel2);border-radius:10px;padding:9px 11px;margin:8px 0}
.card.warn{background:rgba(224,163,30,.14);border:1px solid rgba(224,163,30,.5)}
.card.bad{background:rgba(209,69,59,.1);border:1px solid rgba(209,69,59,.45)}
.card h5{margin:0 0 3px;font-size:12px}
#right h2{margin:0 0 2px;font-size:16px;line-height:1.3}
#right .id{font:11px Consolas,"Courier New",monospace;color:var(--muted)}
#right .val{font:12px Consolas,"Courier New","Malgun Gothic",monospace;background:var(--panel2);border-radius:7px;padding:5px 8px;margin:6px 0;word-break:keep-all}
#right p{margin:6px 0}
#right details{margin:8px 0}
#right summary{cursor:pointer;font-weight:700;font-size:12.5px;padding:3px 0}
.rb{margin:6px 0 10px}
.rb .rh{display:flex;align-items:center;gap:6px;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:3px}
.rb .rh i{width:14px;height:3px;background:var(--rc);border-radius:2px;display:inline-block}
.rb .rh span{color:var(--muted);font-size:11px}
.rb .rh em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}
.it{padding:3px 4px;border-radius:6px}
.it.hl{background:var(--hl)}
.it .nt{font-size:11.5px;color:var(--muted);margin:1px 0 2px 2px}
.it .rf{color:var(--muted);opacity:.85;font-size:10.5px}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-align:left;cursor:pointer;font-weight:700;font-size:12.5px}
.lnk:hover{text-decoration:underline}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:12px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.fid{font:10px Consolas,"Courier New",monospace;color:var(--accent);border-bottom:1px dotted var(--accent);cursor:help;margin:0 1px;white-space:nowrap}
.bar{display:flex;height:13px;border-radius:7px;overflow:hidden;margin:4px 0 2px;background:var(--panel2)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin:6px 0;font-size:12px}
.ev .src{font-size:10.5px;color:var(--muted)}
.ev.t1{border-color:#2a9d6a}.ev.t2{border-color:#13a3b5}.ev.t3{border-color:#e0a31e}.ev.t4{border-color:#d1453b}.ev.k-conflict{background:rgba(224,53,158,.07)}.ev.k-gap{background:rgba(138,99,210,.08)}
.chip.ev-conflict{color:#c0267f;border-color:#e69ac8}.chip.ev-gap{color:#6b49b8;border-color:#c1aeea}.chip.ev-constraint{color:#b13a30;border-color:#e8a6a0}.chip.ev-standard{color:#1f7088;border-color:#9cd0dc}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.mx thead th{position:sticky;top:0;z-index:3;background:var(--panel);font-weight:700}
table.mx thead tr.r2 th{top:26px}
table.mx .corner{position:sticky;left:0;z-index:5;min-width:200px;text-align:left;padding:6px 10px;background:var(--panel)}
table.mx th.kh{height:26px;font-size:11.5px;color:#fff;text-align:center}
table.mx th.gh{height:150px;min-width:30px;max-width:34px;vertical-align:bottom}
table.mx th.gh div{writing-mode:vertical-rl;margin:0 auto;padding:6px 0;font-size:11.5px;font-weight:600;white-space:nowrap;max-height:146px;overflow:hidden}
table.mx th.rh{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:3px 8px;font-weight:600;min-width:200px}
table.mx tr.pgrp td{background:var(--panel2);font-weight:700;font-size:11.5px;color:var(--muted);padding:3px 10px;position:sticky;left:0}
table.mx td.c{text-align:center;min-width:30px;height:30px;cursor:pointer;position:relative;font-weight:600}
table.mx td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.mx td.c.hard::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:1px;background:#d1453b}
table.mx td.c.gap::before{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;border:1.5px solid #d1453b;background:var(--panel)}
table.mx td.sum{text-align:center;min-width:34px;color:var(--muted)}
table.mx tfoot td{background:var(--panel2);text-align:center;font-weight:700;font-size:11.5px;position:sticky;bottom:0}
table.mx tr.sel th.rh,table.mx tr.sel td.sum{background:var(--hl)}
.mxnote{font-size:11.5px;color:var(--muted);margin:0 0 8px;max-width:980px}
#tip{position:fixed;z-index:60;pointer-events:none;max-width:380px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);display:none}
#tip b{display:block;margin-bottom:2px}
#tip .m{color:var(--muted);font-size:11px}
#help{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:80;display:none;align-items:center;justify-content:center}
#help .pane{background:var(--panel);border-radius:14px;max-width:880px;width:calc(100% - 40px);max-height:calc(100% - 50px);overflow:auto;padding:18px 24px 22px;box-shadow:var(--shadow)}
#help h3{margin:14px 0 4px;font-size:13.5px}
#help h2{margin:0}
#help table{border-collapse:collapse;font-size:12px;margin:4px 0}
#help td,#help th{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
#help li{margin:2px 0}
@media (max-width:1100px){#right{width:320px;flex-basis:320px}#left{width:230px;flex-basis:230px}}
@media (max-width:820px){#left{display:none}#right{display:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="ttl"><b>구경주역 마스터플랜 지식그래프</b><span id="sub"></span></div>
    <nav id="tabs">
      <button data-v="overview" title="묶음(그룹) 단위로 본 전체 구조">한눈에</button>
      <button data-v="detail" title="노드 하나하나와 엣지 전체">전체 그래프</button>
      <button data-v="matrix" title="마스터플랜 값 × 근거 묶음 표">값 × 근거 표</button>
    </nav>
    <div class="search"><input id="q" type="search" placeholder="노드 검색  (예: 고도지구, 주차, 시굴, P_H)" autocomplete="off"><div id="qres"></div></div>
    <div class="tools">
      <label>색 <select id="colorsel"><option value="kind">노드 종류</option><option value="grade">근거 등급(값)</option><option value="cur">현재 값 출처(값)</option></select></label>
      <button id="bFit" title="화면에 맞추기">맞춤</button>
      <button id="bLeft" title="왼쪽 패널 접기/펴기">◧</button>
      <button id="bRight" title="오른쪽 패널 접기/펴기">◨</button>
      <button id="bTheme" title="밝게/어둡게">◐</button>
      <button id="bSvg" title="현재 그래프를 SVG로 저장">SVG</button>
      <button id="bPng" title="현재 그래프를 PNG로 저장">PNG</button>
      <button id="bHelp" title="읽는 법">?</button>
    </div>
  </header>
  <div id="main">
    <aside id="left"></aside>
    <section id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="matrix"></div>
      <div id="hud"></div>
      <div id="empty">표시할 노드가 없습니다. 왼쪽 필터를 확인하세요.</div>
      <div id="hint"></div>
    </section>
    <aside id="right"></aside>
  </div>
</div>
<div id="tip"></div>
<div id="help"><div class="pane" id="helpbody"></div></div>

<script>const KG = {"nodes":[{"id":"I_BND","label":"계획 경계선(내가 그린 선)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"최종콘타모델_v2.3dm · 내가 하고자하는 경계라인","value":"218,478㎡ (300×945 m)","desc":"고정 입력은 이 선 하나(CLAUDE.md §2). 고시 구역(156,460㎡)보다 60,498㎡(27.7%) 크고 시 구상 79,438㎡[T4]의 2.75배다.","cur_src":"","cur_note":""},{"id":"I_SKETCH","label":"손그림 스케치(프로그램 15)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"work/20261005_plan_sketch · plan_clean","value":"프로그램 15 → 획지 19·공원 4","desc":"트레이싱지 스케치를 3dm에 정합(IoU 0.976). 도로·보행축·청년주거·시청·문화·창조산업·시장·구 역사 이전·관광지원·주차타워를 담는다.","cur_src":"","cur_note":""},{"id":"I_DIR_CROSS","label":"동서 단절 해소 (P1)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 지구단위계획안 §1 P1","value":"985 m 무횡단 · 육교 1개(폭 3.2 m)","desc":"문서 5건이 공통으로 요구하는 1순위. 횡단 가로 3~5개와 24시간 개방 보행 주축.","cur_src":"","cur_note":""},{"id":"I_DIR_MOBILITY","label":"모빌리티 허브·P+R·트램 예비부지 (P2·P5)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 §1 P2·P5 · 전체기록 v2","value":"교통광장·관광지원시설·주차전용","desc":"터미널 본체·대형 주차장은 두지 않고 동해축 시외버스 정차·순환셔틀·트램 기점만 둔다. 주차는 총량 순증이 아니라 치환.","cur_src":"","cur_note":""},{"id":"I_DIR_CITY","label":"시청·행정복합 (P3)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 §1 P3 · 논리 팩트체크 §6","value":"시청·의회 캠퍼스(Plot 3)","desc":"시청 본청 이전은 시의 결정을 전제로 하되 엔진에서 유/무를 이진 비교한다(미실시).","cur_src":"","cur_note":""},{"id":"I_DIR_HOUSE","label":"청년주거·직주락 (P4)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 §1 P4 · 교훈 5","value":"543~905세대(개념안)","desc":"결정도에 주거 용지가 없는 것이 최대 공백. 저녁 6시 이후 죽는 구역을 막는다(부산 대연 2,300가구→1,300명 정착).","cur_src":"","cur_note":""},{"id":"I_DIR_MARKET","label":"성동시장 연계(흡수 금지) (P6)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 §1 P6 · 교훈 6","value":"성동시장 클러스터·체험판매","desc":"기존 상권을 흡수하지 않고 연장한다. 백화점·대형판매 기각, 마켓홀·장옥형 수용.","cur_src":"","cur_note":""},{"id":"I_DIR_HERITAGE","label":"구 역사·조망축 존중 (P7)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 §1 P7","value":"구 역사 이전·근대역사관 겸용","desc":"구 역사·전면 광장·화랑로 조망축 보존. 이전은 결정이 아니라 스케치 반영(등록문화유산 아님 확인).","cur_src":"","cur_note":""},{"id":"I_DIR_ARCH","label":"매장유산이 순서·콘텐츠를 정함 (P8)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"v2 §1 P8","value":"시굴 필요 145,879㎡","desc":"유존지역 → 1단계는 가역적 프로그램만. 발굴 유물은 수장고의 소장품.","cur_src":"","cur_note":""},{"id":"I_DIR_ART","label":"레지던시·공방·창업 (창조산업)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"스케치 · 한눈에 · 논리 팩트체크 §4.4","value":"창조산업 18,119㎡ + 창업지원","desc":"공연장이 아니라 공방·작업실·국악 연습실(예술인 675명 근거). 1946 경주예술학교 선례.","cur_src":"","cur_note":""},{"id":"I_DIR_TWOAX","label":"두 축 KPI (방문↔거주)","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"교훈 6 · 두 축 논거서","value":"(방문객·체류)/(거주·생활업종·야간)","desc":"방문객 수로만 성공을 재면 전주의 10년 뒤. 두 축을 항상 나란히 보고한다.","cur_src":"","cur_note":""},{"id":"I_DIR_DISPERSE","label":"분산 삽입형·울산형 회피","kind":"intent","group":"설계 방향","tier":"","scale":"S1","status":"보유","ref":"교훈 4","value":"대안 시나리오(미작성)","desc":"단일 대형 집중은 도심 속 외딴 섬(울산 우정). 부산 혁신도시는 4개로 쪼개 기존 도심에 삽입.","cur_src":"","cur_note":""},{"id":"I_LESSON","label":"사례 교훈 10 (CLAUDE.md §5)","kind":"intent","group":"설계 방향","tier":"","scale":"","status":"보유","ref":"CLAUDE.md §5 · docs/20_cases","value":"1단계=연결·기반·보행 …","desc":"비가역 투자는 뒤로(우메코지 13년), 최약점 통과폭, 운영 조직 설계, 실패 사례 명시.","cur_src":"","cur_note":""},{"id":"PL30_SPACE","label":"공간구조·동서 분리 진단","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.285 (P3-C07-S02)·p.86·p.34·p.99 [K1-021]","value":"철도·사적지구가 시가지를 동서·남북으로 분리 — 경주역사는 도심기능 저해 요인(p.285)","desc":"상위계획이 철도와 사적지구로 시가지가 동서·남북으로 갈렸다고 진단한다(동쪽 주거지는 저밀·생활환경 악화). 횡단축 요구(P1)의 법정 계획 근거. v1의 '133–139쪽'은 오기 — 해당 문구의 실제 위치는 p.285.","cur_src":"","cur_note":""},{"id":"PL30_POP","label":"계획인구·생활권 인구배분","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.122–123·141–144 [K1-033][K1-034]","value":"2030 계획 320,000(2020 300,000·2025 310,000) ↔ 주민등록 242,512(2026.08) — 격차의 본체는 사회적증가 53,769 미실현","desc":"원도심 생활권 배분과 상업용지 수요추정이 이 인구를 전제로 했다. 계획의 내국인 자연증가 경로 대비로는 −1.5%(2020)·−4.5%(2025)에 그친다. 원도심 동별 계획인구·세대·밀도는 계획서에 없다(중심생활권 200,000인·순밀도 130.12인/ha만) [K1-035]. 실제 인구는 프로젝트 기록 인용(T2).","cur_src":"","cur_note":""},{"id":"PL30_HUB","label":"복합환승센터·순환선·TDM","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.225–226 (복합환승센터·제1순환선)·p.216·240–246 (주차)·p.289 (보행) [K1-010]","value":"복합환승센터 3개소(경주역·시외버스터미널·KTX역) · 제1순환선이 경주역(성동시장) 경유","desc":"경주역은 복합환승센터 3개소 중 하나이고 제1순환선(터미널–성건동–황성공원–경주역(성동시장)–중앙시장–대릉원–터미널)이 지난다. 센터 규모·면적·운영 방식은 없다. 주차는 '도심 외부 대규모 주차장 + 교통관리지구' 원칙(p.216)이다.","cur_src":"","cur_note":""},{"id":"PL30_TERM","label":"종합터미널 = KTX 역세권(상충)","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.217·250 (종합터미널) · p.225 (경주역=복합환승센터) [K1-011]","value":"신경주역 역세권(417 연구는 서천교)","desc":"종합터미널(교통센터)은 신경주역 역세권(화천리)이 최적입지(재검토 단서), 노서동 시외터미널은 생활권 연결기능으로 전환, 고속터미널 존치. 같은 계획 p.225는 경주역도 복합환승센터로 지정(내부 불일치). 2007년 자료 발췌라 단계 일정이 지났다. 2040 재정비 방향 확인 필요.","cur_src":"","cur_note":""},{"id":"PL30_MULTI","label":"멀티복합타운(행정·문화)","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.99·104·144·287·290–291 [K1-001·002·003·004·005]","value":"멀티복합타운(행정·문화·멀티복합센터, p.287) → 행정·문화·상업·업무(p.290)","desc":"경주역 이전적지의 상위계획상 정체. p.291 도면에는 '비즈니스센터·청년창업센터'와 바로 남쪽 '주차장 신설'이 표기된다(도면 판독). 위치·규모·면적은 없고 시청·의회 이전을 정한 조항도 없다 [K1-055]. 같은 대상의 명칭이 절마다 다르다(멀티복합센터·멀티복합타운·시민센터).","cur_src":"","cur_note":""},{"id":"PL30_SURVEY","label":"시민의식 설문(부지 활용)","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.79 (PDF 쪽 93) · 2015.9.18~10.17 [K1-043][K3a-047]","value":"복합위락 44.5·행정복합 26.2·공원광장 22.9·문화예술 5.1(%)","desc":"경주역 부지 활용 선호 + 교통 불만 1위 주차시설 확충 38.8%. 배포 1,970부·회수 1,408부(71.5%), 신뢰수준 95%·오차 ±3.1%. 인쇄쪽은 79(v1·자료전수의 '78'은 정정). p.80·81의 수치는 원문 복사 오류로 사용 금지.","cur_src":"","cur_note":""},{"id":"PL30_LAND","label":"토지이용·용도별 수요추정","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.166–196 (p.168 주거·p.173 상업 원단위·p.177·193–194 용도지역)","value":"상업 원단위 도심상업 15㎡/인·3층·건폐 80% · 주거 2.10인/가구·밀도 160/140/120 인/ha · 상향은 지구단위계획+공공기여","desc":"용도지역 상향은 지구단위계획 수립을 수반하고 공공기여 원칙을 전제하며 공공 추진사업은 예외 가능(p.177·193) [K1-031]. 상업 4.10㎢ 수요는 320,000인 전제라 실제 인구 하향 시 과대 [K1-040].","cur_src":"","cur_note":""},{"id":"PL30_PARK","label":"공원녹지 지표·공원 계획","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.349–378 (p.355 지표·p.360 공원 목록)","value":"2030 1인당 도시공원 16.41㎡(조성 8.21㎡) · 중심생활권 8.94㎡/인(시 최저, 국가 최저기준 9㎡ 미달)","desc":"중심생활권 근린공원 목록에 성동·황오가 없고 경주역 이전적지에 지정된 공원도 없다(p.360) — 상위계획이 막지도 정하지도 않은 여지(해석) [K1-056][K1-057]. 황성공원 0.895㎢(북천 북쪽).","cur_src":"","cur_note":""},{"id":"PL30_REGEN","label":"도시재생·도심정비·주거환경","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.271–304 (p.272–281 재생·p.285–287·p.301–304 주거) [K1-044~048]","value":"재생 1단계 = 경주역·중심상권(p.276) · 고도제한 완화 검토(대상·폭·시기 없음, p.287)","desc":"원도심 재생 방침과 주거 지표. 쇠퇴진단(2016.11): 중부동 인구 −24.95%·사업체 −23.04%·노후 78.12%, 황오동 −37.08%·−20.50%·81.95%. 도심 주상복합·직주근접·소형주택 의무비율(수치 없음)을 말하나 '청년' 명시 조항은 없다 [K1-039].","cur_src":"","cur_note":""},{"id":"PL30_ENV","label":"저탄소·에너지·폐기물·상하수","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.261–270 (급수·하수)·p.305–330 (에너지·폐기물)","value":"급수 519 ℓ/인·일(2013) → 2030 목표 350 ℓ · 하수 387 ℓ/인·일(+지하수 10%) · 에너지 7.05 TOE/인·년","desc":"급수·하수·에너지 원단위(2030 계획값). 건물 용도별(ℓ/㎡·일) 원단위와 ZEB 정량 기준은 없다. 하수는 분류식 원칙·중수도·빗물이용(용적률 완화 인센티브)을 제시 [K1-068][K1-069][K1-070].","cur_src":"","cur_note":""},{"id":"PL30_LSC","label":"경관·고도·역사문화 보전 방침","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.331–346 (연계축 p.342·가로경관축 p.335·고도 p.332) [K1-024][K1-027~029]","value":"경관 연계축: 월성→대릉원→노동노서고분군(봉황로)→읍성→북천→황성공원 · 북천 수경관축 100 m 관리구역","desc":"연계축은 봉황로를 따르는 별개 축으로 읽히며 부지를 지나지 않는다 — 북천~황성공원 구간과 부지 북단의 접속이 쟁점(해석). 원화로는 가로경관축. 고층 부정 평가의 대상은 신개발지(황성·용강·동천).","cur_src":"","cur_note":""},{"id":"PL30_NEWTRANSIT","label":"신교통(BRT→트램) 단계 구상·노선도","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.216·223·288–289 [K1-007~009]","value":"1단계 BRT → 2단계 Tram · KTX역~도심~보문 22.0 km · 대량운송수단은 타당성평가 후 장기 검토","desc":"본문은 '폐철도를 이용한 신교통수단 도입'을 적지만 신교통 노선도는 폐선축이 아니라 터미널·태종로·대릉원 북측 동서 가로를 따르고 부지 남단 부근에서만 교차(도면 판독, GIS 대조 필요). 전기차 순환선 ①②의 번호가 p.226과 p.288에서 뒤바뀜.","cur_src":"","cur_note":""},{"id":"PL30_PUBFAC","label":"공공·문화시설 배치 방침(도심 집중 해소·분산)","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.252–255·441–443 [K1-053][K1-054][K1-065]","value":"시청 1개소 고정(2013~2030) · 읍면동사무소 23→25 · 문화시설 도심 집중 억제 · 신경주역 개발에 맞춰 화천리 일대에 행정체계·공공시설","desc":"공공시설 도심 집중을 풀어 외곽에 분산·증설하라는 방침. 시청·의회 이전·입지를 정한 조항은 없다(전수 검색). 같은 계획이 경주역 이전적지에는 '행정' 기능을 둔다(p.287·290) — 부문 간 불일치.","cur_src":"","cur_note":""},{"id":"PL30_COMM","label":"상업·유통·관광 육성 방침","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.418–421 [K1-041][K1-042][K1-066]","value":"전통시장 일상관광지화·차 없는 거리 · 대형마트·복합쇼핑센터 추가 건립 · 체류형 관광 전환","desc":"원도심은 업종 차별화로 전통시장을 보완하라면서 대규모 소매점·복합쇼핑센터 추가 건립도 같은 쪽에서 추진 — '성동시장 연장(흡수 금지)' 방향과 부분 충돌. 관광호텔 14→12개소(2009→2013)·방문객 +23.9%(S3 통계).","cur_src":"","cur_note":""},{"id":"PL30_FIN","label":"재정·투자계획(재정 여건·우선순위)","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.449–458 [K1-050][K1-051]","value":"재정자립도 25.22%(2013) · 지방채 0 계획 · 단계별 투자액·경주역 사업비 없음","desc":"도시재생활성화사업은 민간자본 참여를 적극 유도할 사업으로 명시. 투자우선순위 결정기준 4개(미래상 부합·파급효과 / 지역숙원·삶의 질 / 공간구조 개편 / 도시규모 대비 부족시설)만 있고 사업별 순위·투자액은 없다. 2013 기준값.","cur_src":"","cur_note":""},{"id":"PL30_DISASTER","label":"방재·안전·우수 저류 방침","kind":"plan","group":"2030 도시기본계획","tier":"T1","scale":"S3","status":"보유","ref":"A-011 p.381–408 (p.395·397·400) [K1-059][K1-060]","value":"방화지구·소방도로·CPTED(지구단위계획 도입)·지진 오픈스페이스 · LID·필로티·저류","desc":"구시가지 주택의 화재 취약(조적조·밀집·좁은 도로) 진단. 2016.9 M5.8 지진은 방재 현황·기본방향에 반영되지 않았고 지진 위험도·활성단층 정보가 없다. 부지는 북천 인접 — 폭우재해취약지역 등급도(p.399) GIS 대조 필요.","cur_src":"","cur_note":""},{"id":"PLR_DECLINE","label":"법정 쇠퇴진단 2022","kind":"plan","group":"도시재생 계획","tier":"T1","scale":"S2","status":"보유","ref":"A-006 (인쇄 251)","value":"황오동 인구 −43.0%·노후 87.9%","desc":"도시재생특별법 §13 3지표. 기준연도 미기재 → 2026 갱신 필요(종합정보체계 값 지정).","cur_src":"","cur_note":""},{"id":"PLR_AREA","label":"활성화지역 9개소·경계·사업","kind":"plan","group":"도시재생 계획","tier":"T1","scale":"S2","status":"부분","ref":"A-006 · A-012","value":"A 경주역전 308,898.9㎡·C 성동·황오 184,830㎡(2016) · 2022 변경: 성동지구 205,600㎡ 해제 → 부지는 활성화지역 밖","desc":"지정 고시 경계 원문은 gaps.md 미해결. 활성화지역 한정 특례(국공유재산 수의계약·부담금 감면·건축규제 완화)는 부지에 그대로 적용되지 않는다(추정) [K2-006][K2-020]. 경주역전 활성화지역(215,000㎡) 지목에 철도용지 45,907㎡ — 부지 일부와 겹칠 수 있다 [K2-009]. 도면상 역사부지는 A·C 경계 밖 [K1-017].","cur_src":"","cur_note":""},{"id":"PLR_LINK","label":"폐선 활용 신교통·동서 통로","kind":"plan","group":"도시재생 계획","tier":"T1","scale":"S3","status":"보유","ref":"A-006","value":"신교통·동서 연결 통로","desc":"전략계획이 폐선 부지를 신교통과 동서 단절을 잇는 통로로 규정(P1·P2 근거).","cur_src":"","cur_note":""},{"id":"PLA18","label":"경주역전(황오동 원도심) 활성화계획·변경(2025.12)","kind":"plan","group":"도시재생 계획","tier":"T1","scale":"S2","status":"보유","ref":"A-008 · A-012 (고시 제2020-1호) [K2-048][K3b-059]","value":"황오동 118-12 일원 0.215㎢ · 고시 2020-1호 256.7억(2019–2023) → 변경 총 281.69억(마중물 250억)","desc":"성동시장·황오 커뮤니티센터(1,753㎡·7층·164.76억)·프론티어밸리(640㎡·17.07억)·상생협력상가 등 기존 상권 사업과 기능이 겹치면 치환 위험(P6). 성동시장 주차타워 251대·황오동 공영 251면. 활성화계획 안에서도 재원표 국비 150/지방 100과 집행표 125/125가 다르다 [K3b-060].","cur_src":"","cur_note":""},{"id":"PLA20","label":"활성화계획 2020(행복황촌 254.47억)","kind":"plan","group":"도시재생 계획","tier":"T1","scale":"S2","status":"보유","ref":"A-007 · B-007","value":"총사업비 254.47억(도로 개설 126억 포함, A-007) · 성과지표 보고서 사업개요 127.28억·164,500㎡(2021–2025)","desc":"경주역 동편 일반근린형(행복황촌). 마을관리협동조합(2022.12.26 설립)·마을호텔 2 ETAIL","rel":"limits","strength":"hard","basis":"확인","note":"계획서에 젠트리피케이션 대응방안(상생협의체·상생계획·상생협력상가·투기방지) 필수 — 상생협력상가 임대료 ≤시세 80%·최대 10년·차임 인상률 ≤5%는 예시","ref":"B-004 p.71 [K3b-053]"},{"src":"PLP_GUIDE","dst":"P_LOT","rel":"sizes","strength":"soft","basis":"확인","note":"계획서 필수: 가구·획지계획 + 획지표(가구·획지번호·용지분류·면적·건폐율·용적률·높이/층수·수용인구), 토지·건축물 조서, 용지 분류는 지구단위계획수립지침 제7장","ref":"B-004 p.28 [K3b-046]"},{"src":"PLP_GUIDE","dst":"P_TRIP","rel":"guides","strength":"soft","basis":"확인","note":"교통처리계획 제출(건축·도시·교통·재해 심의는 통합심의)","ref":"B-004 p.28·14 [K3b-046][K3b-049]"},{"src":"L_HIA","dst":"P_PHASE","rel":"sequences","strength":"soft","basis":"추정","note":"개발공사는 사업계획 수립 완료 전 국가유산 영향진단 — 유존지역·지표조사 실시 지역은 제외(구경주역은 제외 대상으로 보임)","ref":"B-002 p.3 [K3b-011]"},{"src":"D_DIGPLAN","dst":"P_DIG","rel":"limits","strength":"soft","basis":"추정","note":"1단계 시굴 58,381㎡는 지장물을 철거하지 않고 중앙 선로대 위주 — 구 역사 본관·전면 광장·플랫폼 하부 조사는 1단계에 없는 것으로 보인다(판독·추정)","ref":"B-003 p.6 [K3b-020]"}],"evidence":[{"fid":"K1-001","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-가 시가지 도시기능 정비 · 인쇄p.287 (PDF p.301)","page":"287","kind":"direction","topic":"경주역 이전적지 활용 — 멀티복합타운(행정·문화·멀티복합센터)","text":"경주역 이전적지에 행정·문화·멀티복합센터를 담는 ‘멀티복합타운’을 조성해 도심의 중심기능을 높이고 도심공동화를 막는 것이 시가지 도시기능 정비 전략의 첫 항목이다.","values":"멀티복합타운(행정·문화·멀티복합센터)","note":"같은 대상이 절마다 이름이 다름: 경주역 멀티복합센터(p.104)·경주역사부지 멀티복합타운(p.144)·시민센터(멀티복합타운, 위치 미명시, p.255). 기능 구성은 p.290·p.291에서 확장. 기존 KG seed PL30_MULTI에 대응(seed의 쪽 표기 '99×2·104'는 p.99·p.104 외에 p.144·p.287·p.290으로 보강 가능).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_HALL","P_CULT","P_TWOAX","PL30_MULTI"]},{"fid":"K1-002","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-라 도심 활성화계획 + [도심 활성화계획(안)] 도면 · 인쇄p.291·290 (PDF p.305·304)","page":"291","kind":"direction","topic":"도심활성화계획 — 경주역사활용 거점의 기능 구성(도면 판독 포함)","text":"도심기능 강화 방안으로 경주 역사부지에 행정·문화·상업·업무를 수용하는 멀티복합타운을 두고, 재래시장 현대화와 숙박·문화기능 강화로 관광객의 도심 유입을 촉진한다고 본문(p.290)에 쓴다. 같은 계획의 도면(p.291)은 ‘경주역사활용’ 거점에 ‘행정/문화/멀티복합센터(비즈니스센터, 청년창업센터 등)’를 적고, 바로 남쪽에 ‘주차장 신설’, 서쪽에 ‘성동시장 현대화’, 근처에 ‘전기자동차 순환선①’을 표기한다.","values":"행정·문화·상업·업무 / 비즈니스센터·청년창업센터 / 주차장 신설","note":"비즈니스센터·청년창업센터·주차장 신설 표기는 텍스트층에 없고 도면(assets/p291.jpg) 판독으로만 확인됨. p.287은 ‘행정·문화·멀티복합센터’만 적고 p.290은 상업·업무까지 포함해 쪽마다 기능 구성이 다름. 같은 쪽에 ‘역사도시 위상강화(황남·사정·인왕 한옥마을 정비)’와 ‘특화거리 조성(봉황로 문화거리·패션거리·다문화거리 정비, 사적지와 도심을 잇는 전통 먹거리·야간경관·한옥숙박)’ 방침도 있음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_JOBS","P_CULT","P_PARK","P_RETAIL","P_HALL","P_STAY","PL30_MULTI"]},{"fid":"K1-003","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C03-S01 도시여건변화 전망과 과제 §1.2-5) 교통시설의 정비 · 인쇄p.99 (PDF p.113) | P1-C02-S02 경주시 일반현황 및 특성 §2.2-다 교통망 · 인쇄p.34 (PDF p.48)","page":"99","kind":"direction","topic":"철도 이설로 단절 회복 + 폐철도 역사·선로 활용(멀티복합센터, 문화공간·녹지·녹색교통)","text":"동해남부선·중앙선의 복선전철화·이설로 시내 관통에 따른 공간단절이 회복될 것으로 보고, 폐철도 역사를 활용한 멀티복합센터와 선로를 활용한 도심 내 문화공간·녹지·녹색교통 확충으로 도심을 활성화한다는 기대를 적는다. 외곽 순환도로와 시가지 가로망 정비로 도심 교통정온화를 유도한다는 문장이 이어진다.","values":"1910년대 건설 동해남부선·중앙선 / 멀티복합센터 + 문화공간·녹지·녹색교통","note":"p.34(일반현황)에도 ‘폐선되는 선로 및 역사부지 멀티복합센터 건립 등을 통한 도심재생·활성화 유도’가 같은 취지로 나옴. 부문별 연계표에서는 폐철도 부지가 ‘녹색교통(자전거·보행) 이용시설 확충’(p.107)과 ‘녹지연계체계 구축’(p.108) 두 곳에서 반복됨. 철도 이설 대상: 동해남부선은 외동 시가지·도심을 우회(p.217). 같은 쪽 §1.2-6)에 ‘이전적지를 활용한 경쟁력 확보방안과 도심지역 접근성 향상을 위한 가로망 개선으로 도심공동화 방지’(p.99)도 있어 P_CROSS·P_LANE의 상위 근거로 쓸 수 있음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_CROSS","P_OPEN","P_USE","P_TRAMHUB","PL30_MULTI","PL30_SPACE"]},{"fid":"K1-004","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C03-S02 도시미래상 및 목표설정 §2.2-다 계획목표별 세부실천전략(R: 부자도시 조성) · 인쇄p.104 (PDF p.118)","page":"104","kind":"direction","topic":"도시미래상 실천계획 — 철도역사·폐철도 활용 도시공간 재창조","text":"‘부자도시 조성’ 전략(우선순위 2)의 실천계획으로 동해남부선·중앙선 철도역사 및 폐철도 활용에 따른 도시공간 재창조를 제시하며, 경주역 멀티복합센터·역사문화관·왕경유적지 복원·옛길복원·녹지·보행공간축 조성을 열거한다.","values":"경주역 멀티복합센터 / 역사문화관 / 왕경유적지 복원 / 옛길복원 / 녹지·보행공간축","note":"구체 시설이 처음 열거되는 곳(seed PL30_MULTI의 ‘인쇄 104’). ‘역사문화관’은 p.344의 ‘경주역사도시문화관(구 경주여중 부지)’과 위치가 달라 별개 시설로 보임. ‘옛길복원’ 대상 노선은 미특정.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_CULT","P_AXIS","P_PED","P_OPEN","PL30_MULTI"]},{"fid":"K1-005","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C04-S02 생활권 설정 및 인구배분계획 §2.4-가 중심생활권 세부계획 · 인쇄p.144 (PDF p.158)","page":"144","kind":"direction","topic":"중심생활권 세부계획 — 경주역사부지 멀티복합타운·구시가지 특화가로·시장 활성화","text":"행정·업무·문화·관광 중심기능을 맡는 중심생활권의 시가지정비 항목으로 도시재생 및 활성화, 경주역사부지 멀티복합타운 조성, 구시가지 특화가로 조성 및 시장 활성화를 두고, 기본방향에 도심기능 제고(행정·업무·상업)와 구시가지의 체계적 관리방안을 명시한다.","values":"경주역사부지 멀티복합타운 / 구시가지 특화가로 조성 및 시장 활성화","note":"p.144 중심생활권 구상도에도 ‘경주역 멀티복합타운’이 도심 라벨로 표기되어 신경주역세권 개발과 별도로 구분됨. ‘구시가지 특화가로’의 대상 가로는 미특정(p.291 도면은 봉황로·패션거리·다문화거리).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_RETAIL","P_LANE","P_HALL","PL30_MULTI"]},{"fid":"K1-006","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-가 동해남부선 폐선 활용전략 · 인쇄p.287 (PDF p.301) | P3-C05-S01 토지이용 현황분석 §1.4-나-5) 개발과 보전의 적절한 조화 · 인쇄p.165 (PDF p.179) | P3-C10-S02 공원·녹지 기본방향 및 체계구상 §2.1-나-2) 공원·녹지의 네트워크화 · 인쇄p.354 (PDF p.368) | P3-C10-S03 공원·유원지계획 §3.3-나 녹지배치계획 · 인쇄p.371 (PDF p.385) | P3-C10-S01 공원·녹지 현황 및 문제점 §1.2 녹지현황 · 인쇄p.351 (PDF p.365)","page":"287","kind":"direction","topic":"동해남부선 폐선 활용전략 — 관광문화 커뮤니티 통합·폐선 거점 완충녹지·유휴부지 시민 휴식공간·철도변 선형 공원화","text":"동해남부선 폐선은 기존 노선을 따라 광역 관광문화 커뮤니티를 통합해 관광객 유입을 유도하고 각 폐선 거점에 완충녹지를 배치해 관광자원으로 개발하는 것으로 정리되며, 토지이용 과제는 이설로 생기는 유휴부지를 시민 휴식공간 제공과 교통문제 해소에 활용하도록 한다. 공원녹지 부문은 철도변 완충·경관녹지를 선형 도시공원으로 만든다는 방향이며, 철도변 완충녹지는 존치하되 여건변화 지역은 조정할 수 있다고 한다.","values":"폐선 거점 완충녹지 배치 / 이설 유휴부지 → 시민 휴식공간 + 교통문제 해소(p.165) / 철도변 선형 도시공원화 / 완충녹지 177개소 2,220,303㎡·연결녹지 1개소 740㎡(시 전체)","note":"p.351: 시 전체 완충녹지는 주로 철도변·간선도로변·산업단지변에 선형 지정되어 있어 폐선 후 이 도시계획시설 녹지의 조정·해제 여부가 지구단위계획의 쟁점. 연결녹지는 시 전체 1개소 740㎡뿐이며 확충 목표는 계획서에 없음(p.351·p.356).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_OPEN","P_PED","PL30_PARK"]},{"fid":"K1-007","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-다-1) 시가지교통계획 및 신교통수단 도입 · 인쇄p.288 (PDF p.302)","page":"288","kind":"direction","topic":"신교통수단의 원도심 경유 + 폐철도를 이용한 신교통수단 도입","text":"신경주역~보문관광단지 신교통수단이 원도심을 경유하도록 계획해 시가지와 보문단지의 물리적 단절을 막고 도심 경제를 활성화하며, 동해선·중앙선 이설에 따른 폐철도를 이용한 신교통수단 도입을 별도 항목으로 명시한다.","values":"신경주역~보문 신교통 원도심 경유 / 폐철도 이용 신교통수단 도입","note":"트램 예비부지 근거로 쓸 수 있는 유일한 직접 문구이나 폐철도 신교통의 구간·노선·시기는 없음. 같은 계획의 신교통 노선도(p.224·p.289)는 폐선축이 아니라 터미널·대릉원 쪽 동서 가로를 따라 그려져 본문과 도면이 어긋남(→ 도면 항목 참조).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_AXIS","PL30_NEWTRANSIT"]},{"fid":"K1-008","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.4-다-4)② 신교통시스템 도입 검토 · 인쇄p.223 (PDF p.237) | P3-C06-S01 교통계획 §1.3-나-3) 대중교통 이용의 활성화 · 인쇄p.216 (PDF p.230)","page":"223","kind":"constraint","topic":"신교통 단계 구상(BRT→Tram) + 대량운송수단은 타당성평가 후 장기 검토","text":"신교통은 KTX역~도심~보문단지 22.0km 구간에 1단계 BRT, 2단계 Tram으로 도입하는 단계 구상이다. 다만 새로운 대량운송수단은 막대한 건설비·재정 부담 때문에 기존체계의 운영효율, 도시 재정능력, 수요예측 타당성평가를 거쳐 장기적으로 검토하도록 단서를 붙인다.","values":"1단계 BRT / 2단계 Tram / KTX역~도심~보문단지 22.0km","note":"p.216 단서 때문에 트램은 사실상 장기·조건부. 같은 구간을 BRT→Tram으로 전환하는 구상이므로 예비부지는 BRT 정류장 겸용 정거장 후보로도 읽힘(해석). 물류계획 절(p.249)은 환승수단에 ‘경전철(건설 시)’을 쓰는 등 2007년 자료 용어가 남아 있어 용어 불일치.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_TRAMHUB","P_PHASE","P_COST","PL30_NEWTRANSIT"]},{"fid":"K1-009","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 [시가지교통계획(안)] 도면 · 인쇄p.289 (PDF p.303) | P3-C06-S01 교통계획 [신교통시스템 노선계획] 도면 · 인쇄p.224 (PDF p.238) | P3-C07-S02 도심 및 시가지정비 [도심 활성화계획(안)] 도면 · 인쇄p.291 (PDF p.305)","page":"289","kind":"conflict","topic":"신교통 노선(도면)은 경주역 부지를 직접 경유하지 않음","text":"도면상 신경주역~보문 신교통 노선은 버스터미널·태종로·대릉원 북측의 동서 가로를 따라 도심을 지나 보문으로 가며, 폐선축과는 부지 남단 부근에서 교차하는 것으로 읽힌다. 폐선축을 따라 부지 안으로 들어오거나 경주역에 정거장을 두는 표기는 없어, 의뢰인의 교통광장·트램 예비부지(폐선축)는 상위계획 신교통 노선과 접점이 남단 교차부에 한정된다.","values":"노선: 신경주역–버스터미널–(태종로·대릉원 북측)–황룡사지 북측–보문 / 폐선축과 부지 남단 부근에서 교차(도면 판독)","note":"도면 판독(축척 없음)이라 교차 위치·이격은 확정 불가 — GIS 대조 필요. 남단 교차부에 정거장·환승(트램 예비부지)을 두는 것은 도면과 어긋나지 않는 해석 여지. p.289 도면의 전기자동차 순환선①·신설주차장은 경주역 부근에 표기되어 신교통 정류장 대신 이들이 경주역 연결을 맡는 구조로 보임.","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"conflicts","nodes":["P_TRAMHUB","PL30_NEWTRANSIT"]},{"fid":"K1-010","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.4-다-4)③ 대중교통 시설의 개선 및 확충방안 · 인쇄p.225 (PDF p.239) | P3-C06-S01 교통계획 §1.4-다-4)④ 도심지 수요관리(TDM) · 인쇄p.226 (PDF p.240) | P3-C07-S02 도심 및 시가지정비 §2.3-다-1) · 인쇄p.288 (PDF p.302)","page":"225","kind":"direction","topic":"복합환승센터 3개소 중 경주역 + 제1순환선이 경주역(성동시장) 경유","text":"경주시 복합환승센터를 도심의 경주역, 시외버스터미널, KTX역 3개소에 설치하고 읍·면사무소 중심 환승시설 12개소를 두어 간선버스로 도심과 연결하도록 노선개편을 검토하며, 도면은 경주역을 환승시설이 방사형으로 모이는 허브로 그린다. 제1순환선(터미널~성건동~황성공원~경주역(성동시장)~중앙시장~대릉원~터미널)과 사적지 주변 전기차 순환망이 도심 가로기능 재정립과 역사적 골격 회복을 목적으로 구상된다.","values":"복합환승센터 3개소(경주역·시외버스터미널·KTX역) + 읍면 환승시설 12개소 / 제1·2 순환선 + 전기차 순환선 2개","note":"환승시설 신설 시 Barrier-free·자전거보관대 설치 요구. 센터 규모·면적·운영 방식은 미제시. 전기차 순환선 ①②의 번호가 p.226과 p.288에서 서로 뒤바뀜(노선은 동일, 저속전기차의 일반도로 운행 허용방안 검토 필요가 전제). seed PL30_HUB의 ‘199–246’을 p.225·p.226으로 좁힐 수 있음. 종합터미널은 신경주역 역세권(→ 상충 항목 참조).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_TRAMHUB","P_PED","P_PARK","PL30_HUB"]},{"fid":"K1-011","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S02 물류계획 §2.3-가-2) 종합터미널(교통센터) 계획(안) · 인쇄p.250 (PDF p.264) | P3-C06-S01 교통계획 §1.4-가-2)·3) 철도·기타 · 인쇄p.217 (PDF p.231)","page":"250","kind":"conflict","topic":"종합터미널(교통센터)·공항·관광버스·화물터미널은 고속철도 역세권(신경주역)이 최적입지","text":"공항·시외·관광버스와 화물터미널을 통합한 종합터미널(교통센터)을 고속철도 역세권(건천읍 화천리)에 두는 것이 최적입지로 분석되고, 노서동의 중부시외버스터미널은 생활권 간 연결기능으로 전환하고 고속버스터미널은 존치한다. 다만 현 고속버스터미널과 주변 상권을 고려해 도시교통정비계획 수립 시 재검토하도록 단서를 단다.","values":"신설 터미널 5종 전부 고속철도 역세권(화천리) / 중부시외·고속버스터미널(노서동) 존치","note":"의뢰인 방향(구경주역 모빌리티 허브·셔틀)과 상충(seed PL30_TERM). 단 같은 계획 p.225는 경주역도 복합환승센터로 지정(내부 불일치). 이 절은 2007 도시교통정비 기본 및 중기계획 발췌라 단계 일정(2010·2013·2015)이 이미 경과했고, 역세권을 ‘법적 설치 불가능(농림·준농림)·접근성 불량’으로 평가하면서도 최적으로 판정. 후속 재정비(2040 재정비, 프로젝트 기록) 방향 확인 필요.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_TRAMHUB","P_PARK","PL30_TERM"]},{"fid":"K1-012","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.4-바-3) 주차장 확보방안 + [주차장 확보방안] 도면 · 인쇄p.244 (PDF p.258) | P3-C07-S02 도심 및 시가지정비 [시가지교통계획(안)] 도면 · 인쇄p.289 (PDF p.303) | P3-C07-S02 도심 및 시가지정비 [도심 활성화계획(안)] 도면 · 인쇄p.291 (PDF p.305)","page":"244","kind":"fact","topic":"대형주차장 6개소 — 도면에는 경주역 바로 옆 ‘신설주차장’ 표기","text":"본문은 도심관광지 주변 대형주차장 6개소(오릉 앞 1,000여 면 이상=순환대중교통 기점, 박물관 주차장 확대)만 적어 위치를 일부만 특정하지만, 주차장 확보방안 도면(p.244)과 시가지교통계획 도면(p.289)·도심 활성화계획 도면(p.291)에는 경주역 바로 옆에 ‘신설주차장(주차장 신설)’이 표기되어 있다.","values":"본문 6개소(p.244) vs 4개소(p.288) / 오릉 1,000여 면 이상 / 박물관 주차장 확대 / 경주역 인근 신설 1개소(도면)","note":"도면 마커 수가 6개(경주역 인근·서측·동궁 동측 2·박물관·오릉 남측)로 본문 6개소와 맞고 경주역 인근 마커가 그 하나로 읽힘 — 도면 판독. 주차 면수·규모는 어디에도 없음. 기존 work/20260928_구경주역_주차대수_산정_v1.md가 p.244를 인용 중이므로 도면의 경주역 마커를 보강 근거로 쓸 수 있음. 개소수 4(p.288) vs 6(p.244) 불일치는 원문 그대로.","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"anchors","nodes":["P_PARK","P_TRAMHUB","PL30_HUB"]},{"fid":"K1-013","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.3-나-5)·6) 추진방향(교통관리지구·도심외부 주차) · 인쇄p.216 (PDF p.230) | P3-C07-S02 도심 및 시가지정비 §2.3-다-1) · 인쇄p.288 (PDF p.302) | P3-C06-S01 교통계획 §1.4-사-3)③ Park & Ride · 인쇄p.246 (PDF p.260)","page":"216","kind":"conflict","topic":"도심 외부 대규모 주차장 + 교통관리지구 원칙 vs 경주역 인근 도심 내 신설주차장","text":"계획의 원칙은 시가지·유적지 중심에 교통관리지구를 지정해 외부 관광차량 진입을 철저히 금지하고(주민 일부 허용) 승용차 진입을 억제하며, 수요에 기반한 대규모 주차장은 도심 외부에 신설·확장해 순환대중교통으로 환승시키는 것이다. 이 원칙은 경주역 인근 대형 신설주차장 도면 표기나 부지 내 주차 허브 구상과 긴장한다.","values":"교통관리지구: 외부 관광차량 진입 금지·지역주민 일부 허용 / Park & Ride·Park & Bus Ride","note":"설문 교통 1순위가 ‘대규모 주차시설 확충’ 38.8%(p.79)라는 수요와는 정합하나 위치 원칙은 도심 외부. 구경주역 부지가 ‘도심 외부’가 아니라 도심 북단 가장자리·북천 접경이라는 점이 논거가 될 수 있음(해석). p.246 P&R은 관광열차·버스 연계, 지역주민·사업자 배려와 수익성 보장을 단서로 둠.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_PARK","P_TRAMHUB","P_TRIP","PL30_HUB"]},{"fid":"K1-014","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.4-바-1) 주차장 기본방향·③ 주차장 정비구상 · 인쇄p.241·240 (PDF p.255·254) | P3-C06-S01 교통계획 §1.1-가-5) 주차시설 현황 · 인쇄p.203 (PDF p.217)","page":"241","kind":"standard","topic":"주차 정비구상 — 노상 점진 폐지, 노외 추가 공급(주차타워·지하), 부설주차 의무 + 교통영향분석","text":"노상주차장은 점진적으로 폐지하고 노외주차장은 추가 공급이 불가피하다고 보아 주차타워·도로지하공간·학교운동장 지하공간 개발로 확보하며, 일정규모 이상 건축물은 주차장 조례에 따라 부설주차장을 의무 확보하되 교통영향분석·개선대책으로 유출입 위치를 조정한다.","values":"2013 노외 179개소 12,933면(개소당 72.3) / 노상 18개소 624면 / 부설 18,959개소 38,323면 / 합계 51,880면","note":"p.240 기본방향은 ‘주차장 무조건 공급우선 지양, 면적·인구밀도·차량보유 등으로 적정 공급단위 결정’, 확충수단에 ‘공공용지(공원 등) 지하주차장’·‘공동주차장 10~50대·민영 50~200면’ 규모 예시 있음. 주차장 확보율 목표 수치는 없음(주거지역 70% 기준은 p.283 최저기준). 지하 확보 수단은 매장문화재 규제와 충돌 가능(→ 갭 항목).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_PARK","P_TRIP","P_DIG","PL30_HUB"]},{"fid":"K1-015","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C10-S03 공원·유원지계획 §3.6 공원녹지사업 가이드라인(주차장·광장·학교) · 인쇄p.378 (PDF p.392) | P3-C06-S01 교통계획 §1.4-바-1)② 주차시설 확충방안 · 인쇄p.240 (PDF p.254)","page":"378","kind":"direction","topic":"공공주차장 지하화 + 상부 공원 중복결정, 광장 전면개방·투수성 포장","text":"공공주차장은 가급적 지하화하고 상부를 공원으로 중복결정해 활용하며 평면주차장은 친환경 포장, 건물형은 옥상·벽면 녹화를 권고한다. 광장은 인접지역에서의 접근 제한이 없는 전면 개방형에 투수성 포장을 원칙으로 한다.","values":"지하화+상부 공원 중복결정 / 광장 전면개방·투수성 포장 / 학교 이전 시 우선 공원·녹지화","note":"출처 가이드라인은 2020 경주시 공원녹지기본계획(2016.07.). 지하화 수단은 매장유산 조사·보존 전제가 없는 일반 원칙 — 부지의 지하 굴착 제약(P_DIG)과 충돌(→ 갭 항목). 광장 ‘전면 개방’은 24시간 개방 통로 구상과 정합.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_PARK","P_OPEN","P_DIG","P_PED","PL30_HUB","PL30_PARK"]},{"fid":"K1-016","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-다 기초생활인프라 현황분석 및 계획 · 인쇄p.284·283 (PDF p.298·297)","page":"284","kind":"standard","topic":"A 경주역전활성화지역 기초생활인프라 최저기준·현황·부족수","text":"A 경주역전활성화지역(인구 2,560인·1,024세대)은 기초생활인프라 최저기준 대비 생활권공원 23,040㎡·근린광장 1개소·초등학교 1개소·작은도서관 3개소·공공체육시설 10,752㎡가 없고, 공공주차장은 기준 717면에 475면이 있어 242면이 부족하다.","values":"공공주차장 717면(현황 475, 부족 242) / 생활권공원 23,040㎡(현황 0) / 근린광장 1 / 초등학교 1 / 공공체육 10,752㎡ / 작은도서관 3","note":"기준은 국가도시재생기본방침 별표2 ‘국가적 최저기준(안)’(p.283): 주차장확보율 70%, 1인당 생활권공원 9㎡, 근린광장 2,000~4,000세대당 1개소, 공공체육 1인당 4.2㎡, 작은도서관 500가구 이상 1개소(33㎡ 이상). 같은 표의 B 4,654인/1,862세대, C 2,763/1,105, D 1,797/719 → A·B·C·D 합 11,774인. 면적 대비 자체 산출 총밀도(원문 수치 아님): A 약 83, C 약 150, B 약 158, D 약 77 인/ha. 공공체육시설 부족수는 5개 지역 모두 10,752㎡로 복사 오류(원문 각주).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_PARK","P_OPEN","P_CULT","P_HOUSE","L_INFRA","PLR_AREA"]},{"fid":"K1-017","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-가 도시재생활성화지역의 지정 · 인쇄p.277·276 (PDF p.291·290)","page":"277","kind":"fact","topic":"도시재생활성화지역 A(경주역전)·C(성동·황오) 지정과 면적","text":"경주역·성동시장 주변(성동동·황오동 일원) 308,898.9㎡를 A 경주역전활성화지역(우선순위 1), 경주역 동측 주거지 184,830㎡를 C 성동·황오활성화지역(우선순위 2)으로 지정했고 둘 다 ‘폐선예정인 경주역사 인접부지’로 규정한다.","values":"A 308,898.9㎡ / C 184,830㎡ / B 294,900㎡ / D 234,686㎡ / 5개소 계 1,333,274.9㎡","note":"지정·면적은 본문 표(p.277) 확인. 도면(p.277) 판독(추정): A 내부는 대부분 일반상업지역 색(분홍), C·B·D는 주거지역 색(연노랑)이고, 경주역사 부지(폐선축)에 해당하는 회색-녹색 블록은 A·C 어느 경계에도 포함되지 않고 둘 사이에 놓임 — 즉 A·C 면적에 부지 면적이 포함되지 않는 것으로 보이며 ‘인접부지’라는 표현과 맞음. 2016.11 전략계획 기준이므로 2026-8호 고시 현황·2022 변경 전략계획으로 대조 필요. 의뢰인 계획 경계(218,478㎡)·고시 구역(156,460㎡)·시 구상 면적(79,438㎡)과는 별개의 도시재생 범위. A=일반형/중심시가지형 표기가 본문(p.276)과 도면 제목(p.277)에서 서로 반대.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_BND","P_USE","P_FAR","PLR_AREA"]},{"fid":"K1-018","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-나 활성화지역의 연관사업 및 연계방안 · 인쇄p.278 (PDF p.292)","page":"278","kind":"direction","topic":"A·C 지역을 ‘경주역사부지’ 거점으로 융화 + 청년창업 지원","text":"A와 C 지역은 경주역사부지를 거점으로 융화시키며 주민편의공간을 확충하고, A 활성화를 B 주거지 재생으로 넓히면서 청년창업 등 지원방안으로 지역소득을 늘린다고 한다. 도면은 이 거점을 ‘경주역사(관광/문화 Complex) 부지’로 표기하고, A 계획내용을 경주역전 상징거리·전통시장 활성화 지원·유해환경 개선·특화상권 조성으로 적는다.","values":"우선순위 A 1 / C 2 / B 3 / D 4 / E 5","note":"A(서)–C(동)가 폐선부지를 사이에 둔 동서 연계라는 점이 P_CROSS의 직접 계획 근거. ‘유해환경 개선’은 성동시장 주변(A) 대상. B 지역은 ‘마을공동체 복원 및 청년문화 활성화’.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CROSS","P_USE","P_RETAIL","P_JOBS","P_OPS","PLR_AREA"]},{"fid":"K1-019","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-나-1) 연계사업 ② 철도역사 및 폐철도 활용사업 · 인쇄p.279 (PDF p.293)","page":"279","kind":"fact","topic":"연계사업② 철도역사·폐철도 활용 — 기본구상 용역 중, 사업비 미산정","text":"경주역을 포함한 철도역사 13개와 폐철도(동해남부선·중앙선)의 활용 기본구상 용역이 진행 중이며 연구용역비 200백만원만 적히고 사업비는 없다. 기대효과는 주민과 관광객이 이용하는 관광·거점시설이다.","values":"철도역사 13개 / 연구용역비 200백만원","note":"2023.04 경주시 폐철도 기본구상(폐역 17개소·80.3km, 프로젝트 기록)의 선행 사업으로 보임 — 13개→17개는 시점 차이. 2016.11 전략계획 기준.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_PHASE","P_USE","PL30_REGEN"]},{"fid":"K1-020","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 [도시재생활성화지역과 주변지역 사업 간 연계방안(경주시가지)] 도면 · 인쇄p.281 (PDF p.295)","page":"281","kind":"fact","topic":"도면: 연계사업②의 구역이 북천변에서 남단 도시계획도로까지 폐선축 전체를 포괄","text":"연계방안 도면에서 연계사업②의 대상 구역이 북천 남안에서 남쪽 도시계획도로까지 폐선축을 따라 길게 그려지고 A·C와는 별도 구역으로 표시되며, ‘관광문화 거점·주변지역 연계’ 표식과 서쪽(A·성동시장)·동쪽(C) 양방향 화살표, 남쪽 쪽샘지구에서 올라오는 ‘관광객 유입’ 화살표가 붙는다.","values":"관광문화 거점 / 서·동 양방향 연계 / 남측 쪽샘지구→관광객 유입 / 성동리 전랑지는 동측 C·D 사이에 표기","note":"구역 형상이 의뢰인 계획 경계(남북 약 945m 띠)와 비슷함 — GIS 중첩 확인 필요. 남쪽 화살표는 남북 종축이 대릉원·쪽샘 쪽으로 이어져야 한다는 계획 의도로 읽힘(해석). 동해남부선 선이 북천을 건너 북쪽으로 계속 표기됨.","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"anchors","nodes":["P_BND","P_AXIS","P_CROSS","PLR_AREA"]},{"fid":"K1-021","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.1 현황 및 문제점 가·나 · 인쇄p.285 (PDF p.299)","page":"285","kind":"fact","topic":"기존 시가지의 동서·남북 분열 진단 — 철도와 사적지구, 경주역사는 도심기능 저해 요인","text":"기존 시가지가 동해남부선 철도와 사적지구 지정으로 동서·남북으로 분리되어, 동쪽 주거지역은 저밀 개발로 도심기능 수행이 어렵고 생활환경이 악화되었으며, 북천 이북의 고밀 개발지구·기존도심의 저밀규제지구·남쪽 사적보존지구 사이 토지이용 균형도 깨졌다고 진단하고 경주역사를 도심기능 저해 요인으로 적는다.","values":"동서 분열(동쪽 주거지 저밀·환경 악화) / 남북 분열(북천 이북 고밀 vs 기존도심 저밀규제 vs 남측 사적보존)","note":"‘동서 분리’ 서술의 실제 출처는 P3-C07-S02 p.285(이 항목). 기존 KG seed PL30_SPACE는 출처를 P2-C04-S01(133–139)로 적었으나 그 절에는 해당 문구가 없음 → 출처 정정 필요. 같은 취지: p.86(SWOT 약점 ‘시가지 관통 도로 및 철도로 도시공간 양분’), p.34, p.99.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CROSS","P_AXIS","P_LANE","P_STN","P_HOUSE","PL30_SPACE"]},{"fid":"K1-022","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-마 도심 고도관리방안 [도심 최고고도지구 지정현황] · 인쇄p.292 (PDF p.306)","page":"292","kind":"standard","topic":"도심 최고고도지구 지정현황 (성동동은 10·15·20·25m 지구에 모두 등장)","text":"최고고도지구는 시 전체 20개 지구 8.145㎢이며 도심은 5개 지구로 7m 이하(황오동 0.227㎢), 10m(황남·사정·인왕·성동 1.132㎢), 15m(성동·노서·성건·서부동 0.351㎢), 20m(성동·노동·노서·성건동 0.894㎢), 25m(성건·성동·황오동 0.963㎢)다.","values":"7m 0.227 / 10m 1.132 / 15m 0.351 / 20m 0.894 / 25m 0.963 (㎢) / 도심 계 3.567㎢ / 주변 7~45m 15개 지구 4.578㎢","note":"성동이 4개 지구 대상지역에 모두 나와 이 표만으로는 부지 적용 높이를 특정할 수 없음. 프로젝트 규제 리스트(work/20260928_구경주역_규제법령_전수리스트_v1.md)는 부지에 도심20m(경고 제200호, 1992-07-09)·도심15m가 걸리는 것으로 확정 — 이 표의 ‘20m: 성동’ 및 도면 범례(최초결정 1975.5, 일부변경 1992.7)와 정합. 도심 5지구 중 15m 이하가 47.9%.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FAR","P_FORM","L_GODO"]},{"fid":"K1-023","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-가 고도지구 관리 / §2.1-라 / §2.3-마 · 인쇄p.287·285·292 (PDF p.301·299·306) | P3-C07-S03 주거환경계획 §3.3-다-1) 노후건축물 재개발·재건축 · 인쇄p.302 (PDF p.316) | P3-C05-S01 토지이용 현황분석 §1.4-가-2) · 인쇄p.164 (PDF p.178)","page":"287","kind":"direction","topic":"도심 고도지구로 재건축·재개발 불가 → 공동화 진단, ‘고도제한 완화’ 검토 방침","text":"도심 전역의 고도지구가 재개발·재건축을 막아 도심 슬럼화·공동화를 낳는다고 진단하고, 노후주택·상가 재건축을 위한 고도제한 완화와 주민 의견 수렴에 따른 전반적 고도완화 검토를 방침으로 두되 완화 대상 지구·폭·시기는 제시하지 않는다.","values":"‘고도완화 검토 필요’ — 대상·폭·시기 미제시 / 재건축 용적률·높이는 적정 수익률 한도 내 관리","note":"p.287 재건축 전략: 민간 재건축의 획일화를 막기 위해 용적률·높이를 적정 수익률 한도 내에서 관리하고 순환재개발·가로주택정비·주거환경관리사업 등 정비방식 다양화. p.302는 ‘문화재보호구역·사적지구·최고고도지구 등으로 건축구조·용적률·층고 규제가 심해 재건축·재개발이 어렵다’며 ‘공적규제완화’가 필요하다고 적음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_H","P_FAR","P_HOUSE","PL30_REGEN"]},{"fid":"K1-024","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C09-S01 경관 현황 및 문제점 §1.1-라 시가지경관 / §1.2 종합분석 · 인쇄p.332 (PDF p.346) | P3-C07-S02 도심 및 시가지정비 §2.3-마 도심 고도관리방안 · 인쇄p.292 (PDF p.306)","page":"332","kind":"conflict","topic":"고도 완화(도시재생) vs 고층 부정(경관) vs 역사도시 고도관리 강화 검토","text":"도시재생 부문은 고도제한 완화를 검토하지만 경관 부문은 중심시가지의 저층 경관을 문제로 삼지 않고 황성·용강·동천 신개발지의 고층 개발과 남산·서악산·명활산 조망축을 가로막는 고층아파트를 부정적으로 평가하며, 도시재생 절 자체도 UNESCO 역사도시 지정에 따른 고도관리방안 검토를 병기해 완화와 강화가 함께 열려 있다.","values":"조망 대상: 남산·서악산·명활산 / 신개발지 고층: 황성·용강·동천","note":"부지 높이 상향은 도심20m 지구 변경 심의(고시 단서)와 이 경관 방침을 모두 넘어야 함. 고층 부정 평가의 대상은 쇠퇴하지 않은 신개발지이고 쇠퇴한 구시가지는 노후·부조화(형태·색채 불일치, 변형 한옥, 옥외광고물)가 문제로 지목됨.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_H","P_FORM","PL30_LSC","PL30_REGEN"]},{"fid":"K1-025","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P1-C02-S03 상위 및 관련계획 §3.1-마 경주고도(古都) 보존육성기본계획(2011) · 인쇄p.66·64·65 (PDF p.80·78·79)","page":"66","kind":"direction","topic":"고도보존육성기본계획 — ‘비움(고도골격 보존)’·‘채움(도시기능 재생)’ 이원 관리","text":"경주고도 보존육성기본계획(2011)은 공간을 고도골격의 확인·회복·보존이 필요한 ‘비움의 공간’과 도시기능을 회복·재생할 ‘채움의 공간’으로 나누고, 채움의 공간인 도심은 공공기능·문화기능을 강화해 저층 중심의 도심재생 기반을 마련하고 건축물 외관·간판 정비로 가로경관을 개선하며 주거지는 주택 내부·주거환경을 개선하도록 한다.","values":"비움: 고도 보존하기 / 채움: 고도 활력넣기 / 목적 3가지(역사적 골격 회복·주민보상 및 지원·위축된 도시기능 재생)","note":"「고도 보존에 관한 특별법」(2004) 기반(2011). 규제 4겹 중 ②에 해당하나 이 계획서의 인용은 방향 수준이며 보존·육성지구 경계나 행위기준은 없음. 도심=채움의 공간이라는 점이 공공·문화기능(행정·문화 복합) 도입의 상위 논거(해석).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_H","P_USE","P_HALL","P_CULT","P_FORM","L_GODOLAW"]},{"fid":"K1-026","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C04-S01 공간구조의 설정 §1.3-나-1) 도심(3개 권역) / §1.2 대안 / §1.1-라 · 인쇄p.135·134·138·133 (PDF p.149·148·152·147) | P3-C07-S02 도심 및 시가지정비 §2.2 기본방향 · 인쇄p.286 (PDF p.300)","page":"135","kind":"direction","topic":"도심 3개 권역 — 중심권역(행정·업무·상업·문화재 복원), 부도심 폐지·도심 편입","text":"도심을 중심(행정·업무·상업·문화재 복원)·동남부(관광·휴양, 역사·문화)·서부(역세권개발·R&DB) 3개 권역으로 나누어 기능을 특화하고, 대안 2 채택으로 1부도심(역세권)을 폐지해 도심 기능을 강화하며 기본방향에 원도심 지역 활성화 전략 수립을 둔다. 도심 정비는 압축적·짜임새 있는 개발과 보행자·대중교통 친화형 공간을 원칙으로 한다.","values":"중심권역: 행정·업무·상업·문화재 복원 / 서부권역: 역세권개발·R&DB","note":"구시가지(중심권역)와 신경주역세권(서부권역)이 같은 도심 위계에 나란히 놓임 — 신경주역세권 계획인구 축소(48,900→16,000, p.121)와 동시 조정. 기존 계획의 문제점(다핵화로 지역균형발전 저해, p.85)을 해결한 구조.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_HALL","P_RETAIL","P_TWOAX","PL30_SPACE"]},{"fid":"K1-027","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C09-S03 경관 실천전략 §3.1-다 중심시가지경관권역 · 인쇄p.337·338 (PDF p.351·352)","page":"337","kind":"direction","topic":"중심시가지경관권역 — 가로변 저층·읍성 가로·필지 보존, 도심상업지역 가이드라인","text":"중심시가지는 문화재 주변 역사문화미관지구의 높이규제로 가로변에 저층 건물이 입지하고 옛 읍성의 가로·필지·문화재가 밀집한 곳으로 진단하며, 도심상업지역 전략으로 보행자거리 조성, 옥외광고물 관리, 주요 조망축 확보, 색채·간판·건물 입면 가이드라인을 제시한다.","values":"도심상업지역: 보행자거리·광고물 관리·조망축·색채/간판/입면 가이드라인 / 읍성지역권역: 시각회랑·역사문화경관 네트워크","note":"부지가 읍성지역권역·도심상업지역 중 어디에 속하는지는 문서에 없음(부지 서측이 성동시장·경주읍성에 인접). 권역 수는 p.334·p.335는 5개 경관권역, p.336~338은 4개 + 중심시가지 하위 8개로 서술이 다름.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_FORM","P_H","P_LOT","P_PED","PL30_LSC"]},{"fid":"K1-028","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C09-S02 경관기본구상 §2.2 [경관기본관리구역] · 인쇄p.335 (PDF p.349) | P3-C09-S03 경관 실천전략 §3.2-다·라 경관축 · 인쇄p.341·342 (PDF p.355·356)","page":"335","kind":"direction","topic":"시가지 가로경관축(원화로 포함)·도심수경관축(북천 100m)","text":"시가지 가로경관축에 태종로·화랑로·봉황로·중앙로·금성로·월성로·원화로가 지정되어 부지 서측 가로 원화로가 경관축이며 방침은 전선지중화·간판 정리·보행로를 점령한 판매시설 정비와 역사경관·현대 상업가로의 조화다. 서천·북천·남천 도심수경관축은 하천경계선 100m 이내를 관리구역으로 하고 인공시설물 설치를 지양하며 친수공간 접근성을 높인다.","values":"가로경관축 7개 노선(본문 p.342는 ‘8개 구간’) / 수경관축 하천경계선 100m 이내 / 수변가로경관축(강변로)","note":"북천이 부지 북측 경계이므로 북단 건축·시설은 하천경계 100m 관리구역에 걸릴 가능성 — 하천구역·경계 GIS 확인 필요(추정). 수변가로경관축은 수변부 옛 숲 복원·완충녹지 확보, 강변측 가로식재는 수경관이 조망되도록 시각 개방(p.342). 7 vs 8 불일치는 원문 표기 차이.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_AXIS","P_FORM","P_OPEN","P_BND","P_PED","PL30_LSC"]},{"fid":"K1-029","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C09-S03 경관 실천전략 §3.3-가-1) 노동노서고분군 일대 · 인쇄p.342·343 (PDF p.356·357)","page":"342","kind":"direction","topic":"경관 연계축 — 월성대공원→대릉원→노동노서고분군(봉황로)→경주읍성→북천→황성공원","text":"지표경관거점 노동노서고분군은 월성대공원→대릉원→노동노서고분군(봉황로)→경주읍성(경주역사도시문화관)→북천→황성공원으로 이어지는 연계 거점 역할을 하도록 하고, 왕경골격의 도시계획도로 복원 및 경관형성 방안과 탐방로·보행로 계획을 마련한다.","values":"연계축 6점 / 왕경골격 도시계획도로 복원","note":"이 남북 연계축은 봉황로를 따르며 부지(원화로 동측 폐선축)를 지나지 않는 별개 축으로 읽힘(도면 비교 해석) — 북천~황성공원 구간이 부지 북단과 만나는 접속이 쟁점. ‘왕경골격 도로 복원’은 기존 도로망 변경을 전제하나 토지이용계획에 대응 계획이 없음. seed PL30_LSC의 ‘경관 연계축’은 p.342–343·p.344로 특정 가능.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_CROSS","P_PED","PL30_LSC"]},{"fid":"K1-030","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C05-S03 토지이용계획 §3.3-다 도시지역 용도지역별 관리방향 1)·2) · 인쇄p.194 (PDF p.208)","page":"194","kind":"constraint","topic":"도심부 일반상업지역은 역사문화미관·중심미관지구에 적합하게, 준주거=역세권 도심형 주거 복합","text":"도심부 일반상업지역은 문화재 분포·역사골격에 적합한 용도를 유도하고 역사문화미관지구·중심미관지구에 맞도록 계획·관리하며, 지구단위계획 등으로 문화·사회복지시설 등 다양한 용도의 복합을 유도한다. 준주거지역은 역세권 중심의 도심형 주거와 상업·업무 보완 복합용도지역으로 관리하고 주거지역 내 한옥은 정체성 유지를 위해 주변 환경에 맞게 유도한다.","values":"일반상업(도심부)=역사문화미관+중심미관 / 준주거=역세권 도심형 주거+상업·업무 복합","note":"‘역사문화미관지구’는 이 절에서 처음 나오는 세분 지구명. 상업지역 지정은 역세권 등 대중교통 접근성이 충분한 곳 중심, 기존 중심지와 토지이용 연속성을 고려해 면적형태로 지정하라는 원칙도 같은 쪽.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_FORM","P_FAR","P_HOUSE","PL30_LAND"]},{"fid":"K1-031","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C05-S03 토지이용계획 §3.1-가 시가화용지 계획방향 / §3.3-가·나 용도지역 관리방안 · 인쇄p.177·193 (PDF p.191·207)","page":"177","kind":"constraint","topic":"용도지역 상향은 지구단위계획 + 공공기여 전제, 공공 추진사업은 예외 가능","text":"개발밀도가 높은 용도지역으로 상향(up-zoning)하려면 지구단위계획 수립을 수반해야 하고, 용도지역 조정은 구체적 계획 수립을 전제로 합리적 공공기여 원칙·기준을 마련하며 주변 용도지역과 과도한 차이가 나지 않는 범위로 한다. 공공에서 추진하는 사업은 이 기준을 적용하지 않을 수 있다.","values":"공공기여 원칙 / 주변과 과도한 차이 금지 / 공공추진사업 예외 가능 / 역세권 형성 등 급변 시 조정 검토","note":"승인계획의 관리원칙이지 법조문은 아님. ‘공공에서 추진하는 사업은 상기기준을 적용하지 아니할 수 있음’(p.193)은 공공 주도(시 구상·도시재생 혁신지구)인 구 경주역 사업에 유리한 예외 문구.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_FAR","P_USE","P_BND","PL30_LAND"]},{"fid":"K1-032","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C05-S03 토지이용계획 §3.3-다-2) 상업지역 · 인쇄p.194 (PDF p.208) | P3-C07-S03 주거환경계획 §3.3-라-4) 주거유형의 다양화 · 인쇄p.304 (PDF p.318)","page":"194","kind":"conflict","topic":"고밀주거 목적 상업지역 조정 제한 vs 도심 주상복합·직주근접 유도","text":"상업지역으로의 조정은 업무·상업 수요와 구체적 개발계획을 전제로 하고 고밀주거개발을 위한 조정은 제한하는 반면, 주거환경계획은 도심 내 직주근접을 위해 주상복합주택 건설을 유도하고 소형주택·공공임대 공급을 늘리라고 한다.","values":"상업지역 고밀주거 조정 제한 / 도심 주상복합 건설 유도 / 소형주택 일정비율 의무","note":"청년주거(직주락) 구상은 상업지역 위에 주거를 얹는 방식이면 p.194와, 준주거·복합용도로 구성하면 p.194·p.304 모두와 정합. 부지 결정도(2026.01)는 주거용지가 없으므로 용도 변경 여지는 고시 단서(특별계획구역 세부개발계획 시 용도지역·지구 변경 가능, 프로젝트 규제 리스트)에 의존.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_HOUSE","P_USE","P_FAR","PL30_LAND"]},{"fid":"K1-033","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C04-S02 생활권 설정 및 인구배분계획 §2.3 생활권별 인구배분계획 · 인쇄p.142·143·141 (PDF p.156·157·155)","page":"142","kind":"standard","topic":"중심생활권 인구배분·밀도 계획 (2013 → 2030)","text":"중심생활권(11개 동 + 현곡·천북 등)의 계획인구는 2013년 178,973인에서 2015년 174,000→2020년 191,000→2025년 195,000→2030년 200,000인으로 시 전체 320,000인의 62.5%이며, 자연적증가 172,956인과 사회적증가 23,390인(도동·용황·보문천군·충효 도시개발 + 주택건설 10개소)으로 구성되고 순밀도는 116.44→130.12인/ha로 높인다.","values":"178,973 → 200,000인 / 순밀도 116.44 → 130.12 인/ha / 자연 172,956 + 사회 23,390","note":"중심생활권은 11개 동 외에 읍·면 일부를 포함한 470.75㎢ 단위라 ‘원도심 생활권’ 값이 아님. 사회적증가 23,390인은 구시가지 내부가 아닌 외곽 신규개발 의존. 순밀도는 시가화면적을 2013·2030 동일(15.37㎢)로 두고 계산(원문). seed PL30_POP의 ‘140–148’을 p.141–143·p.144로 특정 가능.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_HOUSE","P_RETAIL","P_JOBS","PL30_POP"]},{"fid":"K1-034","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C03-S04 도시지표 설정 §4.2-나 계획인구 · 인쇄p.122·123 (PDF p.136·137) | P2-C04-S02 생활권 설정 및 인구배분계획 §2.3-나 인구배분계획 · 인쇄p.142 (PDF p.156)","page":"122","kind":"conflict","topic":"계획인구 320,000(2030) vs 실제 주민등록인구 242,512(2026.08) — 격차의 본체는 사회적증가 미실현","text":"2030 계획인구 320,000인은 내국인 자연적증가 252,490 + 외국인 10,000 + 사회적증가 53,769(일반산업단지 24,353·도시개발 13,634·주택건설 9,878·신경주역세권 5,904) 등으로 구성되는데, 프로젝트 기록상 주민등록인구는 2020년 253,502·2025년 244,055·2026.08 242,512명으로 계획 2020년 300,000·2025년 310,000을 각각 약 15.5%·21.3% 밑돈다(자체 산출).","values":"계획 2020 300,000 / 2025 310,000 / 2030 320,000 ↔ 실제 253,502 / 244,055 / 242,512","note":"실제값은 이번에 원문 재열람하지 않은 프로젝트 기록 인용(work/20260928_경주와_구경주역_한눈에_v1.md, work/20261006_research_notes/research_C2_wondanwi.md 288행; T2). 기준 차이 주의: 계획 총인구는 외국인을 포함하고 주민등록인구는 외국인 별도 집계 — 계획의 내국인 자연증가 경로(2020 257,426·2025 255,460·2030 252,490, p.123) 대비 실제는 −1.5%(2020)·−4.5%(2025) 수준이라 격차 대부분이 사회적증가 53,769(개발·산단 유입) 미실현에서 나옴. 상업 수요 4.10㎢(p.173)·주택수요(p.300)도 320,000 전제. seed PL30_POP과 일치.","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"conflicts","nodes":["P_HOUSE","P_RETAIL","P_JOBS","P_TWOAX","P_USE","PL30_POP"]},{"fid":"K1-035","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C04-S02 생활권 설정 및 인구배분계획 §2.3 생활권별 인구배분계획(전체) · 인쇄p.142·148 (PDF p.156·162) | P2-C03-S04 도시지표 설정 §4.1~4.4 도시지표(전체) · 인쇄p.122 (PDF p.136)","page":"142","kind":"gap","topic":"원도심(성동·황오·중부 등) 동별 계획인구·세대·밀도 배분 없음","text":"계획은 5개 중생활권 단위까지만 인구를 배분하며 성동동·황오동·중부동 등 원도심 동별 계획인구·세대·밀도나 구시가지 단독 생활권 값은 어디에도 없다. 동별 수치가 있는 것은 2016 도시재생전략계획 발췌의 활성화지역 A~E 현재 인구뿐이다.","values":"—","note":"도시지표(p.109–130)·생활권(p.140–148)을 키워드(황오·성동·중부·동별)로 검색해 공백 확인. 동별 값은 KOSIS 주민등록(프로젝트 C-018)로 대체해야 하며 중부동→황오동 2025 통합으로 시계열 단절(프로젝트 기록).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_HOUSE","P_JOBS","PL30_POP"]},{"fid":"K1-036","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C03-S04 도시지표 설정 §4.2-다 인구구조예측(내국인) · 인쇄p.123 (PDF p.137) | P1-C02-S06 도시의 문제점과 잠재력 §6.1-라 위협요인 · 인쇄p.87 (PDF p.101)","page":"123","kind":"fact","topic":"인구구조 전망 — 2030 65세 이상 33.1%·15~64세 54.5%·부양률 83.4%","text":"내국인 자연적증가 기준 15~64세 인구는 2013년 185,167명(70.3%)에서 2030년 137,681명(54.5%)으로 줄고 65세 이상은 44,500명(16.9%)에서 83,536명(33.1%)으로 늘어 부양률이 42.2%에서 83.4%가 된다고 전망하며, 위협요인으로 지속적 인구감소와 청년층의 주변지역 이탈을 꼽는다.","values":"65+ 16.9→33.1% / 15–64 70.3→54.5% / 부양률 42.2→83.4%","note":"이 구간 0~14세 시계열(2020 9.2%→2030 12.4%)은 2015년 코호트 과소계상의 전파로 사용 금지(원문 분석 주). S3(시 전체) 통계 — S1 프로그램의 직접 정당화에 사용 금지(CLAUDE.md 스케일 규칙).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","P_HOUSE","P_JOBS","PL30_POP"]},{"fid":"K1-037","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C05-S02 용도별 수요추정 §2.1 주거용도 가·나·다 · 인쇄p.168·167·169·170 (PDF p.182·181·183·184)","page":"168","kind":"standard","topic":"주거 수요 산정 원단위 — 밀도 160/140/120, 배분 50/10/40, 호당 부지·용적률","text":"중심생활권 주거용지 밀도를 고밀 160·중밀 140·저밀 120인/ha(현황 순밀도 141.26)로 두고 2030 밀도배분을 아파트 50%·연립다세대 10%·단독 40%로 설정하며, 호당 부지는 단독 200㎡(평균 용적률 80%)·연립 100㎡(140%)·공동 85㎡(180%), 공공용지율 30%, 혼합률 10%, 가구당 인구 2.10인, 주택보급률 115%를 적용한다.","values":"160/140/120 인/ha / 50:10:40% / 200·100·85㎡ / 용적률 80·140·180% / 공공용지율 30% / 혼합률 10% / 2.10인/가구 / 115%","note":"인구밀도법 27.28㎢와 호당부지법 36.37㎢ 중 낮은 값을 채택(p.170). 가구당 인구 2.10은 청년 1~2인 가구 세대수 환산에 쓸 수 있는 계획 전제이나 평균치. 혼합률 10%는 근린생활·상업·업무 혼합분. 주택보급률은 2013년 114.8%.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_HOUSE","P_FAR","PL30_LAND"]},{"fid":"K1-038","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S03 주거환경계획 §3.3-나-3) 저소득층 주거안정대책 [최저주거기준] · 인쇄p.301 (PDF p.315)","page":"301","kind":"standard","topic":"최저주거기준 — 1인 14㎡·2인 26㎡·3인 36㎡·4인 43㎡ (국토해양부 공고 제2011-490호 인용)","text":"계획서는 저소득층 주거안정 항목에서 최저주거기준을 인용해 총주거면적 1인 14㎡(침실 1·부엌), 2인 26㎡(침실 1·식사실 겸 부엌), 3인 36㎡, 4인 43㎡, 5인 46㎡, 6인 55㎡와 부부 침실 공유·만 6세 이상 자녀 분리 등 시설기준, 방음·환기·채광·난방과 자연재해 위험 지역 입지 금지 등 구조·환경기준을 제시한다.","values":"1인 14㎡ / 2인 26㎡ / 3인 36㎡ / 4인 43㎡ / 5인 46㎡ / 6인 55㎡ (총주거면적)","note":"법정 최저기준이라 청년 1~2인 세대 전용면적 하한의 근거로 쓸 수 있음 — 다만 계획서가 인용한 것은 2011년 공고이므로 현행 기준·공공임대 표준 면적은 별도 확인. 같은 항목에서 ‘해일·홍수·산사태·절벽 붕괴 등 자연재해 위험이 현저한 지역에 위치하지 않을 것’을 요구(북천 인접부의 침수 취약 여부 확인과 연결).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_HOUSE","L_MINHOUSE"]},{"fid":"K1-039","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S03 주거환경계획 §3.3-라 친환경적 개발기법을 적용한 주거지역 조성 1)·4) · 인쇄p.304·303 (PDF p.318·317) | P3-C07-S03 주거환경계획 §3.2-나 / §3.3-나 · 인쇄p.299·300 (PDF p.313·314)","page":"304","kind":"direction","topic":"도심 복합개발·직주근접·주상복합·소형주택 의무비율 (대규모 택지개발 지양)","text":"도심은 상업·업무·주거가 복합된 개발을 유도해 직장과 거주지를 가깝게 하고 도심 내 직주근접 주거를 위해 주상복합주택 건설을 유도하며, 주거단지 개발 시 일정비율 이상 소형주택 건설을 의무화하고 독신가구·산업근로자 등 특수계층 주택을 유도한다. 대규모 택지개발은 지양하고 기존 주택지·저밀 기존 주거지를 정비·활용하며 소형(임대)주택 공급을 확대한다.","values":"소형주택 일정비율 의무(비율 미제시) / 도심 주상복합 유도 / 주택형식 공동 50·연립 10·단독 40%","note":"‘청년’을 명시한 주거 조항은 없음(청년 관련은 p.278 청년창업·p.275 청년·예술가 프로그램·p.291 도면 청년창업센터). 소형주택 의무비율 수치 없음. 같은 절 p.302는 도심 고도 등 규제로 재건축이 어렵다고 서술해 주상복합 실현성은 규제완화를 전제. p.108은 직주근접으로 지역간 교통발생·화석연료 소비 최소화를 환경 부문 연계 방안으로 명시.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HOUSE","P_USE","P_JOBS","P_TWOAX","PL30_REGEN"]},{"fid":"K1-040","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C05-S02 용도별 수요추정 §2.2 상업용도 가·나 · 인쇄p.173·171·172 (PDF p.187·185·186)","page":"173","kind":"standard","topic":"상업용도 원단위 — 도심상업 15㎡/인·3층(도심 고도제한 반영)·건폐율 80%","text":"도심상업은 1인당 상면적 15㎡·평균층수 3층(도심 고도제한 반영)·건폐율 80%·공공용지율 40%, 지역중심 12㎡·2층·60%·35%, 지구중심 10㎡·2층·60%·30%를 적용하고, 중심생활권은 도심상업 이용인구 60,000인(0.62㎢)·지역중심 110,000인(1.69㎢)·지구중심 30,000인(0.35㎢)으로 2030년 시 전체 상업용도 4.10㎢를 산정한다.","values":"도심상업 15㎡/인·3층·80%·40% → 0.62㎢(중심생활권) / 전체 4.10㎢(2013 현황 3.27㎢)","note":"320,000인 전제라 실제 인구 하향 시 과대(상업 수요 반박 근거, 프로젝트 자료전수 §0-7과 일치). 도심상업 최소이용인구 150,000인·이용반경 8km·도로율 28~37%(p.172). 지역중심 12㎡가 중심생활권에만 적용되고 타 생활권은 10㎡(원문 각주). 경주 1인당 상업지역 13.12㎡(전국 6.93·경북 12.69, 2013, p.171).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_RETAIL","P_FAR","P_H","P_USE","PL30_LAND"]},{"fid":"K1-041","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C12-S01 경제·산업 개발계획 §1.4-나·다 상업·유통 기본방향·추진전략 · 인쇄p.418 (PDF p.432)","page":"418","kind":"direction","topic":"전통시장 일상관광지화·차 없는 거리·원도심 업종차별화","text":"재래시장은 현대화·특화로 지역문화공간·일상관광지로 만들고 문화마당을 접목한 전통문화거리와 차 없는 거리로 보행쇼핑을 활성화하며, 신도심과 원도심의 업종 차별화로 경쟁력 보완관계를 유지하고 원도심의 계획적 정비로 재래시장 활성화와 영세 소매상업 경쟁력 강화를 꾀한다.","values":"—","note":"성동시장은 시티투어 ‘양동마을·남산권’ 코스(p.246)·제1순환선 경유(p.226)에 포함되고 성동시장 주차타워(251대, p.280)가 있음. 어떤 업종을 어디에 배분할지는 미제시. 의뢰인의 ‘성동시장 연장(흡수하지 않음)’ 방향과 정합.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_RETAIL","P_PED","P_TWOAX","PL30_COMM"]},{"fid":"K1-042","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C12-S01 경제·산업 개발계획 §1.4-나-3)·다-3)·5) 상업·유통 · 인쇄p.419 (PDF p.433)","page":"419","kind":"conflict","topic":"대형마트·복합쇼핑센터 추가 건립 vs 전통시장·영세상인 보호","text":"경주시 상업·유통시설이 빈약하다며 대규모 소매점·복합쇼핑센터와 대형마트의 추가 건립을 추진하면서, 같은 쪽에서 종전부지 개발과 연계한 지역 균형적 상업지역 분배와 영세상인 보호·지역협력사업 강화 필요도 함께 적는다.","values":"복합쇼핑센터·대형마트 추가 건립 / 종전부지 개발 연계 상업지역 분배 / 영세상인 보호","note":"시민 설문 경주역 부지 활용 1순위 복합위락공간 44.5%(p.79)와 같은 방향의 수요 근거이나, 성동시장을 흡수하지 않고 연장하는 방향과는 충돌 가능. ‘종전부지’가 철도 이전적지를 포함하는지는 원문에서 불명.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_RETAIL","P_USE","PL30_COMM"]},{"fid":"K1-043","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P1-C02-S04 시민의식 설문조사 §4.4-나·다 공간구조·교통부문 설문결과 · 인쇄p.79 (PDF p.93)","page":"79","kind":"fact","topic":"시민의식 설문 — 경주역 부지 활용 선호와 교통문제 1순위","text":"경주역 부지 이전 활용방안 응답은 복합위락공간 44.5%, 행정복합타운 26.2%, 공원·광장 22.9%, 문화·예술공간 5.1%이고, 교통문제 개선사항은 대규모 주차시설 확충 38.8%·대중교통 서비스 개선 25.6%·도로망 확충 20.3%·쾌적한 보행환경 14.3%이며 거주지가 외곽에서 중심 동으로 갈수록 주차 확충 응답이 높다.","values":"44.5 / 26.2 / 22.9 / 5.1 (%) ; 38.8 / 25.6 / 20.3 / 14.3 (%)","note":"인쇄쪽은 79(assets/p079.jpg 하단 쪽번호 확인). 기존 프로젝트 문서·KG seed(PL30_SURVEY)의 ‘인쇄쪽 78’은 79로 정정 필요(78쪽은 개발 중심축·우선 개선사항). 2015.9~10 조사, 배포 1,970부·회수 1,408부(71.5%), 신뢰수준 95%·오차 3.1%. 체크리스트(p.76)에는 ‘폐철도부지활용’ 항목이 있으나 결과표 없음. p.80 ‘선호 주거유형’·p.81 ‘경관관리 방안’ 수치는 복사 오류로 사용 금지(원문 각주).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_PARK","P_HALL","P_RETAIL","P_OPEN","PL30_SURVEY"]},{"fid":"K1-044","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.1-가-2) 경주시 쇠퇴분석 결과 · 인쇄p.272 (PDF p.286)","page":"272","kind":"fact","topic":"쇠퇴진단 — 중부동·황오동 3개 분야 모두 쇠퇴","text":"3개 분야(인구사회·산업경제·물리환경) 모두 쇠퇴로 판정된 곳은 성건·중부·황오·황남·월성동과 감포읍이며, 중부동은 인구 -24.95%·사업체 -23.04%·노후건축물 78.12%, 황오동은 -37.08%·-20.50%·81.95%다.","values":"중부동 -24.95/-23.04/78.12 ; 황오동 -37.08/-20.50/81.95 ; 성건동 -27.41/-8.32/69.73 (%)","note":"성동동은 2016년 행정동 중부동 소속으로 보임(추정). 판정기준: 30년 최고 대비 인구 -20%·10년 최고 대비 사업체 -5%·20년 이상 건축물 50% 이상 중 2개 분야 이상. 2016.11 전략계획 자료 — 공모 자격(쇠퇴진단)은 최신 기준으로 재산출 필요.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","P_HOUSE","P_RETAIL","PL30_REGEN","D_DECLINE"]},{"fid":"K1-045","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.1-나 재생관련 여건 전망 · 인쇄p.273 (PDF p.287)","page":"273","kind":"direction","topic":"KTX역세권 개발은 젊은 인구 유출·도심 쇠퇴를 가속 + 경주역·폐선부지는 활력 재창조 공간","text":"문화재 분포로 개발이 제한되고 원도심 쇠퇴는 재생사업 없이는 지속되며, KTX역세권 개발은 도시기능의 외부 확산과 젊은 인구 유출을 가속해 도심 고령화·쇠퇴를 키울 수 있다고 보고, 경주역 및 폐선부지의 발생 토지를 지역 활력 재창조 공간으로 활용할 방안이 시급하다고 진단한다.","values":"—","note":"같은 쪽에 ‘신라왕경 복원이 쪽샘지구 생활권 축소·인구유출을 일으키므로 황남·인왕·사정·구황동 재생정비계획 필요’(활성화지역으로 지정되지 않음)가 있음. 폐선부지를 ‘생활권 회복’ 쪽으로 쓰라는 계획서 자체 논거.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TWOAX","P_HOUSE","P_USE","PL30_REGEN"]},{"fid":"K1-046","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.1-나 재생관련 여건 전망 · 인쇄p.273 (PDF p.287) | P3-C13-S01 재정부문 §1.3-나-1) 세입예산 · 인쇄p.453 (PDF p.467) | P3-C06-S03 공공시설계획 §3.3-바 광역 공공시설 입지 유도 · 인쇄p.255 (PDF p.269) | P3-C06-S02 물류계획 §2.3-가 종합터미널 계획 · 인쇄p.250 (PDF p.264)","page":"273","kind":"conflict","topic":"신경주역(KTX) 역세권 집중 계획 vs 도심 쇠퇴 가속 경고","text":"재생 절은 KTX역세권 개발이 젊은 인구 유출로 도심 쇠퇴를 가속한다고 경고하지만, 재정 절은 신경주역세권·한수원 이전을 세입 확대의 기회요인으로 삼고, 공공시설 절은 화천리 일대 행정체계·공공시설을, 물류 절은 종합터미널 등 신설 5개 터미널을 신경주역 역세권에 모은다.","values":"신경주역세권 계획인구 48,900→16,000, 유입인구 27,000→5,904(p.116·121)","note":"의뢰인 방향(도심·구경주역 거점화)은 재생 절 논리와 같은 편이고 교통·공공시설·재정 절과는 상충. 계획서 안에서 부문 간 조정 근거는 ‘투자 우선순위 고려사항 — 다른 사업과의 관계’(p.457) 정도. 신경주역세권 사업규모는 3.00→0.60㎢(−80%)로 축소 적용.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_TRAMHUB","P_HALL","P_TWOAX","PL30_TERM","PL30_PUBFAC"]},{"fid":"K1-047","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.2-라 단계별 추진계획 · 인쇄p.276 (PDF p.290) | P3-C05-S03 토지이용계획 §3.2-마 단계별 개발계획 · 인쇄p.189 (PDF p.203)","page":"276","kind":"direction","topic":"도시재생 단계 — 1단계 경주역·중심상권 → 2단계 성건·황오 → 3단계 황남·교동 → 4단계 읍면","text":"도시재생은 1단계 경주역 및 중심상권 일대(지역 중심형)에서 시작해 2단계로 경주역 서북 석장동(성건동 일대)과 동쪽 황오동 주거지로 확장하고, 3단계 황남동·교동, 4단계 읍·면 지역으로 넓힌다.","values":"1단계 경주역·중심상권 → 2단계 성건·황오 → 3단계 황남·교동 → 4단계 읍면","note":"연도 없이 순서만 있음. 의뢰인의 ‘연결·기반·보행 선행, 비가역 투자 후행’ 순서와 방향이 같음. 시가화예정용지 개발단계(2013~15/2016~20/2021~25/2026~30, p.189)는 별도 체계로 2단계가 ‘새로운 공간구조 개편을 선도하는 전략사업 용지 우선개발’.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","PL30_REGEN"]},{"fid":"K1-048","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-나 연계방안 / §1.2-다 권역별 추진방안 · 인쇄p.278·275 (PDF p.292·289) | P3-C07-S02 도심 및 시가지정비 [도심 활성화계획(안)] 도면 · 인쇄p.291 (PDF p.305) | P3-C12-S01 경제·산업 개발계획 §1.3-다-3) 제조업 추진전략 · 인쇄p.416 (PDF p.430) | P1-C02-S03 상위 및 관련계획 §3.1-나-3) 경북종합계획 경주시 발전방향 · 인쇄p.60 (PDF p.74) | P3-C12-S02 사회·문화 개발계획 §2.3-다-4)·6) 교육 실천전략 · 인쇄p.441 (PDF p.455)","page":"278","kind":"direction","topic":"청년창업·청년문화·예술가·예술인마을·문화예술 특성화 관련 조항","text":"A 활성화로 청년창업 등 지원방안을 마련하고(B는 청년문화 활성화), 역사·문화권에서는 청년·지역 예술가 프로그램을 운영하며, 산업 부문은 젊은 벤처 중심 강소 중소기업 육성과 창업기업 입지 유도를 제시한다. 상위계획은 예술인마을 조성(경북종합계획)과 문화·예술 특성화고·대학 유치, 역사유적지 연접 이전 시설 부지를 활용한 특성화대학(문화재연구·보수, 한옥연구, 신라학, MICE)을 제시한다.","values":"A 청년창업 지원 / B 청년문화 활성화 / 역사·문화권 청년·지역 예술가 프로그램 / 도면 p.291 청년창업센터 / 예술인마을 / 특성화대학(문화재·한옥·신라학·MICE)","note":"레지던시·공방을 직접 명시한 문구는 없음 — 가장 가까운 상위 근거는 예술인마을·청년·예술가 프로그램·특성화대학. 특성화대학 입지는 ‘학교 등 공공시설 이전 부지’로 철도 이전적지는 명시되지 않음(준용 여부는 해석). 학교 이전적지(구 경주여중)에 문화관(p.344)·공원(p.354·p.378)·특성화대학(p.441) 세 용도가 병존하고 조정 방식은 없음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CULT","P_JOBS","P_TWOAX","P_USE","PL30_REGEN"]},{"fid":"K1-049","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-나-1) 연계사업 ①~⑦ · 인쇄p.280·279 (PDF p.294·293)","page":"280","kind":"fact","topic":"주변 연계사업 7건 — 규모·사업비","text":"A 지역 주변 연계사업은 ① 경주읍성 정비복원 605억(잔여 약 350억, 2002~2020, 45,497㎡), ③ 성동시장 주차타워 53억·251대(2015 준공), ④ 상업가로개선(완료), ⑤ 경주고도보존사업 4,050억(국비 70%, 2012~2021, 277.1만㎡), ⑥ 황남동 한옥지구 정비 500억(2013~2022, 232,662㎡), ⑦ 황남시장 재개발 176~522억이며, ② 폐철도 활용은 용역 단계다.","values":"① 605억 / ③ 53억·251대 / ⑤ 4,050억 / ⑥ 500억 / ⑦ 176~522억 / ② 용역비 2억","note":"고도보존사업(국비 70%)이 사업비의 압도적 비중. 성동시장 주차타워 251대는 이미 존재하는 인접 주차 공급(부지 주차 산정 시 차감·연계 대상). 2016.11 기준 계획값 — 현재 진행 상태는 별도 확인.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_COST","P_PHASE","P_PARK","P_RETAIL","PL30_REGEN"]},{"fid":"K1-050","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C13-S01 재정부문 §1.1-라 재정건전성 / §1.3 재정규모 전망 / §1.4-나 민간자본 · 인쇄p.451·453·454 (PDF p.465·467·468)","page":"451","kind":"constraint","topic":"재정 여건 — 재정자립도 25.22%, 지방채 0, 민간자본 유치 대상에 도시재생활성화사업","text":"2013년 재정자립도 25.22%(시평균 36.85%)·관리채무비율 17.06%(시평균 9.75%)로 재정이 취약하고 세입 전망은 연 2.0% 증가에 지방채 0으로 계획되며, 민간자본 참여를 적극 유도할 사업에 도시재생활성화사업을 명시한다.","values":"재정자립도 25.22% / 관리채무비율 17.06% / 세입 2030 1,524,314백만원 / 4개 시점(2015·2020·2025·2030) 합 5,303,322백만원","note":"세입·세출 전망이 전 연도 동일(연 2.0%). 신경주역세권·한수원 이전을 세입 기회요인으로 제시(충돌 항목 참조). ‘합계’ 열은 연도별 4개 시점의 합일 뿐 누적 총액이 아님. 2013 기준값 — 현재 재정지표로 갱신 필요.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_OPS","PL30_FIN"]},{"fid":"K1-051","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C13-S02 단계별 투자계획 §2.2 단계별 투자계획 · 인쇄p.457·456 (PDF p.471·470)","page":"457","kind":"gap","topic":"단계별 투자계획에 투자액·경주역 사업비 없음","text":"‘단계별 투자계획’ 절은 기반시설 공급 목표 지표와 우선순위 고려사항 13개·결정기준 4개만 제시하고 총사업비·단계별 투자액·재원 분담·개별 사업 목록·실제 순위를 담지 않으며 경주역 이전적지 사업의 사업비도 없다.","values":"우선순위 결정기준 4개: 미래상 부합·파급효과 / 지역숙원·삶의 질 / 공간구조 개편 / 도시규모 대비 부족시설","note":"결정기준 4개 모두에 구시가지 사업이 해당될 수 있으나 적용 결과는 없음. 도시기본계획은 정책계획이라 사업비 미확정이 오류는 아님 — 사업비는 중기지방재정계획·도시관리계획 소관. 인용 가능한 개별 사업비는 p.279–280의 다른 계획 인용치뿐.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_PHASE","PL30_FIN"]},{"fid":"K1-052","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.2-다·라·바 기본방향 · 인쇄p.286 (PDF p.300) | P3-C07-S03 주거환경계획 §3.3-다-2) 주민참여에 의한 커뮤니티 조성 · 인쇄p.302 (PDF p.316) | P3-C07-S01 도시재생계획 §1.2-가 도시재생 기본방향 · 인쇄p.274 (PDF p.288)","page":"286","kind":"direction","topic":"거버넌스·협동조합·중간지원조직·자생적 재생","text":"도시재생은 외부 자원이 아니라 내부 자원과 지역민의 참여에 기대는 자생적 접근을 취하고, 행정·민간·기업 협력과 민관협력 강화를 도심 정비의 기본방향으로 하며, 협동조합 활성화와 사회적기업지원센터 등 중간지원조직, 건축·가로·녹화협정을 통한 주민 주도 관리를 제시한다.","values":"건축협정·가로협정·녹화협정 / 사회적기업지원센터(중간지원조직) / 협동조합 + 도시재생 연계","note":"운영 주체·재원은 구체화되어 있지 않음(운영조직 설계는 별도 과제). p.373·p.455에 공원녹지 조직 정비·시민참여예산제가 있으나 일반론.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_OPS","P_COST","PL30_REGEN"]},{"fid":"K1-053","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S03 공공시설계획 §3.1-가 현황 / §3.2 기본방향·수요추정 · 인쇄p.252·253·254 (PDF p.266·267·268)","page":"252","kind":"conflict","topic":"공공시설 도심 집중 해소 — 외곽 분산·증설 방침, 시청 1개소 유지","text":"시청·법원·경찰서 등이 중심생활권에 집중해 이용불편과 통행집중을 낳는다며 읍·면 등 도심 외곽에 공공기능·시설을 분산·증설하도록 하고, 수요추정에서 시청은 2013~2030년 1개소로 고정하며 읍면동사무소만 23→25개소로 늘린다.","values":"시청 1개소(2013~2030) / 읍면동사무소 23→25 / 지구대·파출소 24→26","note":"시청 이전·의회·청사 신축 입지를 정한 조항은 없음. 같은 계획이 p.287·p.290에서는 경주역 이전적지에 ‘행정’ 기능을 두어 부문 간 불일치. 기능 집적(One-Stop·공공서비스 집적화, p.253·p.255)은 지지.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_HALL","P_TWOAX","PL30_PUBFAC"]},{"fid":"K1-054","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S03 공공시설계획 §3.3-가·바 실천전략 · 인쇄p.255 (PDF p.269)","page":"255","kind":"fact","topic":"시민센터(멀티복합타운) — 중추관리거점, 위치 미명시","text":"시민센터(멀티복합타운)를 국제회의 교류, 광역유통 업무, 첨단산업, 사회복지 기능을 수용하는 중추관리거점으로 조성하고 시민 사회단체 활동 지원 조직의 역할을 부여하며, 별도로 신경주역 개발에 따라 건천읍 화천리 일대에 행정체계와 공공시설을 갖추도록 한다.","values":"국제회의 교류·광역유통 업무·첨단산업·사회복지","note":"위치 미명시 — 경주역 멀티복합타운과 같은 대상인지 이 절만으로는 판단 불가. 시청·의회 이전을 뒷받침하는 문구는 아님.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HALL","P_USE","P_JOBS","PL30_PUBFAC"]},{"fid":"K1-055","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S03 공공시설계획 §3.2-나 수요추정(시청 1개소 유지) · 인쇄p.254 (PDF p.268)","page":"254","kind":"gap","topic":"시청·시의회 이전 직접 조항 없음","text":"계획서 전체에서 ‘시청’은 현황·수요표(1개소)와 일반 용어로만 나오고 ‘시의회’는 계획 수립 절차(의견청취)에만 나오며, 시청·의회의 이전·신축·입지를 정한 조항은 없다. 구경주역에 행정 기능을 두는 상위계획 근거는 ‘멀티복합타운(행정·문화)’(p.287)과 설문 ‘행정복합타운 26.2%’(p.79)뿐이다.","values":"—","note":"전수 키워드 검색(시청·시의회·의회·청사·행정복합)으로 확인. 시청 이전의 직접 근거는 별도 계획(청사 신축 계획, 2026-8호 고시 공공청사용지 24,987㎡ — 프로젝트 기록)으로 보완해야 함.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HALL","PL30_PUBFAC","PL30_MULTI"]},{"fid":"K1-056","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C10-S02 공원·녹지 기본방향 및 체계구상 §2.1-다 공원계획 지표 · 인쇄p.355 (PDF p.369) | P3-C07-S01 도시재생계획 §1.3-다-1) 기초생활인프라 최저기준 · 인쇄p.283 (PDF p.297)","page":"355","kind":"standard","topic":"공원 지표 — 1인당 16.41㎡·조성 8.21㎡, 중심생활권 8.94㎡(최저), 국가 최저기준 9㎡","text":"2030년 도시공원(근린·도시자연·주제) 총면적 5.25㎢·1인당 16.41㎡, 조성 기준 1인당 8.21㎡(2015년 3.60㎡)로 계획하되 중심생활권은 20개소 1.788㎢·1인당 8.94㎡로 전체 최저이며 기초생활인프라 최저기준(생활권공원 1인당 9㎡)에 미달한다.","values":"16.41㎡/인 ; 조성 8.21㎡/인 ; 중심생활권 8.94㎡/인(20개소 1.788㎢) ; 국가 최저기준 9㎡/인","note":"공원 조성률 목표는 2030년 50%. 부지는 A 활성화지역 생활권공원 부족 23,040㎡와 중심생활권 8.94㎡/인 미달을 해소할 거의 유일한 대규모 공공 오픈스페이스 후보라는 해석은 원문에 없는 추론. seed PL30_PARK(16.41㎡)와 일치. 소규모 오픈스페이스를 지역별·연차별로 확충해 탄소흡수·열섬 완화를 꾀한다는 방침도 있음(p.310).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_OPEN","PL30_PARK"]},{"fid":"K1-057","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C10-S03 공원·유원지계획 §3.1-나 공원계획 세부내역(근린·주제공원 목록) · 인쇄p.360·361·362 (PDF p.374·375·376) | P3-C10-S02 공원·녹지 기본방향 및 체계구상 §2.2-나 확충체계구상 · 인쇄p.356 (PDF p.370)","page":"360","kind":"gap","topic":"경주역 이전적지·성동동에 지정·계획된 공원 없음","text":"공원계획 목록(근린공원 34·주제공원 13)에 성동동·경주역 일대 공원이 없고 확충체계(대규모 시설 이전지·공원서비스 소외지역)도 경주역 이전적지를 공원 대상으로 지목하지 않으며, 도시재생활성화지역 A~D에는 조성 공원이 0이다.","values":"중심생활권 근린공원 목록에 성동·황오 없음(황성공원 0.895㎢ 등) / 활성화지역 A~D 생활권공원 현황 0㎡","note":"p.350: 활성화지역 A~D 생활권공원 0㎡. 2030년 +14개소 1.434㎢ 신규 공원의 위치는 계획서에 없음(세부내역은 기정 47개소만). 따라서 부지 내 공원·광장은 상위계획이 막지도 정하지도 않은 여지(해석).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_OPEN","PL30_PARK"]},{"fid":"K1-058","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C10-S03 공원·유원지계획 §3.6 공원녹지사업 가이드라인 · 인쇄p.376·377·378 (PDF p.390·391·392) | P3-C10-S03 공원·유원지계획 §3.3-가-3) 연결녹지 · 인쇄p.371 (PDF p.385)","page":"376","kind":"standard","topic":"공원녹지사업 가이드라인 수치 — 출입구·녹도·소공원·가로수·자전거 분리","text":"도시공원은 보행 주 도착지점 기준 2개 방향 이상 출입구를 확보하고 안전상 필요한 구간 외 울타리를 금지하며, 도시개발 시 건축한계선 내 폭 2m 이상 녹도와 포켓공간, 연결녹지는 폭 1m 이상·녹지율 70% 이상, 약 200㎡ 이상 쉼터의 소공원 지정, 보도폭 3.0m 이상 도로 가로수 식재, 자전거도로와 보행자도로는 가급적 녹지로 분리한다.","values":"출입구 ≥2방향 / 녹도 폭 ≥2m / 연결녹지 폭 ≥1m·녹지율 ≥70% / 소공원 ≥약 200㎡ / 가로수: 보도폭 ≥3.0m","note":"출처: 2020 경주시 공원녹지기본계획(2016.07.). 테마가로는 보행자 전용도로·녹도 기능을 겸하고 기반시설은 지중화(p.377). 하천은 저수로·고수부지·제방에 친수·산책·휴게공간(p.377). 울타리 금지·2방향 출입구는 24시간 개방 통로 구상과 정합.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_OPEN","P_PED","P_LANE","P_FORM","PL30_PARK"]},{"fid":"K1-059","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C11-S03 방재 실천전략 §3.2-가-1)·3.2-다-4) 화재 / CPTED · 인쇄p.395·397 (PDF p.409·411) | P3-C11-S01 방재 현황 및 문제점 §1.1-가 화재 · 인쇄p.381 (PDF p.395) | P3-C11-S03 방재 실천전략 §3.5-가 지진예방대책 · 인쇄p.405 (PDF p.419)","page":"395","kind":"direction","topic":"방재 — 방화지구·소방도로·CPTED·지진 오픈스페이스(구시가지 취약성 진단)","text":"구시가 주택은 조적조·가연성 지붕·밀집에 도로폭이 좁아 화재에 취약하다고 진단하고 노후건축물 밀집지·재래시장의 방화지구 지정, 연소방지 수림대, 소방차 진입이 쉬운 소방도로 정비를 제시한다. 신규개발·도시재생에는 CPTED(자연적 감시·접근통제)를 지구단위계획에 도입하고, 지진 취약지역에는 공원·녹지 오픈스페이스와 대피공간 확보 및 기반시설 분산배치를 요구한다.","values":"방화지구(중심시가지 대로변, 시 전체 0.43㎢) → 노후 밀집지·재래시장으로 확대 / 소방도로 정비 / CPTED / 지진 대피공간","note":"2016.9 규모 5.8 지진은 방재 현황(p.381)·기본방향(p.389–390)에 반영되지 않았고 실천전략 3.5(p.405–408)에 일반론만 있음 — 구시가지를 지진 취약지역으로 지목하거나 내진보강 대상을 특정하지 않으며 지진 위험도·활성단층 정보도 없음(정제본 주기·키워드 검색으로 확인). 층수·사업비 하한을 정할 지반·단층 근거는 외부 자료 필요. ‘지구단위계획에 CPTED 적극 도입’(p.397)은 이 부지 계획에 직접 적용되는 문구.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_SAFETY","P_LANE","P_FORM","P_OPEN","PL30_DISASTER"]},{"fid":"K1-060","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C11-S03 방재 실천전략 §3.3-나-2) 폭우재해 취약지역 활용방안(LID) · 인쇄p.400 (PDF p.414) | P3-C11-S03 방재 실천전략 §3.1-다 재해에 안전한 도시개발 · 인쇄p.394 (PDF p.408) | P3-C11-S03 방재 실천전략 §3.1-나 재해 저감시설 확충 · 인쇄p.393 (PDF p.407)","page":"400","kind":"direction","topic":"우수 저류·저영향개발(LID)·필로티 권장·오픈스페이스 확보","text":"신규 개발·관거정비 시 투수성 포장과 우수 저류를 도입하는 방향이며, 인구가 밀집한 시 중심 동지역에는 생태수로·생태저류지·도로변 저류·빗물정원·옥상녹화 등 저영향개발(LID)을 도입하고 공원·주차장·학교 등 도시계획시설에 저류기능을 결합하는 방안을 검토하라고 한다. 수해·상습침수 예상지는 가급적 운동장·공원 등 오픈스페이스로 확보하고 침수 우려지는 1층 필로티와 빗물이용시설을 권장한다.","values":"LID: 생태수로·생태저류지·도로변 저류·빗물정원·옥상녹화 / 침수 우려지 1층 필로티 권장","note":"부지는 북천 인접 — 폭우재해취약지역 Ⅰ·Ⅱ등급 분포도(p.399)를 GIS로 대조해야 하며 텍스트로는 판별 불가. 저류·우수 정책은 구시가지 일상 이용 공원의 녹지 용량 논거와도 연결.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STORM","P_OPEN","P_FORM","P_PARK","PL30_DISASTER"]},{"fid":"K1-061","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.1-가-1) 도심 간선가로 / §1.4-마 자전거도로망 · 인쇄p.200·237·238·219·235 (PDF p.214·251·252·233·249)","page":"200","kind":"fact","topic":"도심 가로망 제원 — 원화로(서측)·화랑로·태종로·서라벌대로 + 원화로 자전거 전용도로","text":"도심 간선가로 중 부지 서측 남북 가로 원화로(월성로와 함께 4~6차로, 폭 10~30m)와 동서 가로 화랑로(4차로 30m)·태종로(4차로 25m)·서라벌대로(4~6차로 25~50m)·용담로(4~6차로 20~30m)가 있고, 원화로 선덕네거리~경주교 2.88km는 자전거 전용도로(양방향, 중기 2016~2020), 화랑로 선덕네거리~경주교 1.2km는 장기(2021~2030) 단방향 자전거도로로 계획된다.","values":"원화로 4~6차로 10~30m / 화랑로 4차로 30m / 태종로 4차로 25m / 서라벌대로 4~6차로 25~50m / 원화로 자전거전용 2.88km","note":"‘문화재 보존으로 신설도로 계획이 어렵다’는 전제(p.219)로 기존 가로망 관리 중심 — 동서 횡단 가로 신설은 이 전제와 긴장함. 다만 철도 이설로 비는 선로·역사부지는 기존 철도용지라 상위계획이 말하는 ‘신설도로’와 성격이 다르다고 볼 여지(해석; 매장유산 조사는 별개). 신설·확장 도시계획도로는 폭원별 자전거도로 표준단면(홀수 차로 + 양측 자전거 전용도로)을 갖추도록 규정(p.235).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_CROSS","P_LANE","P_AXIS","P_PED","PL30_HUB"]},{"fid":"K1-062","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S02 도심 및 시가지정비 §2.3-다-1) 자전거도로 및 보행로 정비·조성 · 인쇄p.289·290 (PDF p.303·304) | P3-C06-S01 교통계획 §1.4-라 보행자도로 계획 · 인쇄p.230·231·232·235 (PDF p.244·245·246·249)","page":"289","kind":"direction","topic":"보행축 교차 광장·차 없는 거리·보행전용도로화 + 이면도로 속도규제","text":"보행중심 교통체계로 보행축 교차지점에 광장·휴게공간을 확보하고 사적지 주변은 보행자 전용도로(차 없는 거리)로 만들며, 보행 흡인력이 높은 도로는 보행전용 도로화하고 특정 시간대에는 차량통행을 규제한다. 이면도로는 속도규제 표지·과속방지턱·차로폭 좁힘·시케인으로 감속시키고 초등학교 주변은 ZONE30으로 관리한다.","values":"시케인 엇갈림 0.5m: 27.5→18.0km/h / 초등학교 주변 ZONE30(30km/h) / 보행자 전용도로 교차부 소광장","note":"도면(p.290)의 보행자 전용도로(녹색)는 대릉원·쪽샘·월성 권역에 집중되고 경주역 권역에는 지정이 없으며, 적용 대상 가로는 계획서가 지정하지 않음(기법만 제시). 보행자 전용도로 교차부분 소광장·야간 조명·편의시설 확충(p.230).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_PED","P_LANE","P_OPEN","P_CROSS","PL30_HUB"]},{"fid":"K1-063","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.1-가-3)·나-5) 철도 현황·수송현황 · 인쇄p.208 (PDF p.222) | P3-C06-S01 교통계획 §1.1-나-7) 수단통행분석 · 인쇄p.209 (PDF p.223)","page":"208","kind":"fact","topic":"경주역(일반철도) 이용 실적 2013 — 승차 560,123명","text":"2013년 일반철도 경주역은 승차 560,123명·하차 580,953명·수입 3,215,738천원이며 신경주역(고속철도)은 승차 1,111,982명·수입 31,856,481천원으로 수입이 약 9.9배다. 2009~2013년 경주역 승차는 393,759→560,123명(+42%)으로 늘었으나 수입은 4,879,689→3,215,738천원으로 줄었다.","values":"경주역 2013: 승차 560,123 / 하차 580,953 / 수입 3,215,738천원","note":"폐역(2021.12) 전 기준선(약 1,500명/일 승차, 자체 산출). 철도 수단분담은 도보포함 1.51%(2007 조사, p.209)·2030 전망 0.1%(p.213)로 철도 수요가 정량 전망에 사실상 반영되지 않음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TRAMHUB","P_TRIP","P_TWOAX","D_STNRIDE"]},{"fid":"K1-064","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.2-다 통행 발생량 전망 · 인쇄p.213 (PDF p.227) | P3-C06-S01 교통계획 §1.1-나-7) 수단통행분석 · 인쇄p.209 (PDF p.223)","page":"213","kind":"standard","topic":"통행량·수단분담 전망 (교통 평가 입력)","text":"2030년 통행량은 794,851통행/일(연 0.9% 증가), 수단분담은 승용차 40.3%·도보/자전거 27.9%·버스 15.6%·택시 7.9%·철도 0.1%로 2015년과 사실상 같아, 대중교통·녹색교통 활성화 목표가 정량 전망에 반영되지 않았다.","values":"794,851통행/일 ; 승용 40.3 / 도보·자전거 27.9 / 버스 15.6 / 택시 7.9 / 철도 0.1 (%)","note":"현황(2007 조사, 도보 제외: 버스 42.70·승용 31.16)과 전망 사이 분담률이 불연속(원문 설명 없음). 도심 내부 가로 V/C는 분석되지 않아 부지 교통영향 평가의 입력으로는 부족 — 교통영향평가는 별도 조사 필요.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_TRIP","P_TWOAX","P_TRAMHUB","D_MODE"]},{"fid":"K1-065","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C12-S02 사회·문화 개발계획 §2.4-나·다 문화·체육 기본방향·실천전략 · 인쇄p.443·444·442 (PDF p.457·458·456)","page":"443","kind":"conflict","topic":"문화시설 도심 집중 억제·분산배치 방침 vs 경주역 멀티복합타운(문화)","text":"문화시설은 시민 이용을 고려해 적정 규모로 분산 배치하고 도심부 집중을 억제하며 생활권 중심 소규모 문화·체육시설을 확보하라고 하면서, 공연장·전시시설을 겸한 복합문화시설 조성과 지역 역사·생활을 보여주는 소규모 박물관·기념관, 행정동별 도서(분)관 1개소 이상도 함께 제시한다.","values":"도서(분)관 행정동별 ≥1개소 / 소규모 박물관·기념관 / 복합문화시설(공연장·전시)","note":"‘종합문화예술회관 등은 도 차원 시설이라 경주시 차원 문화시설이 부족’(p.442)이라는 진단은 복합문화시설 도입의 근거. 근대역사관·레지던시처럼 소규모·생활밀착형은 분산 방침과 정합, 대형 집객 문화시설은 긴장.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_CULT","P_USE","PL30_PUBFAC"]},{"fid":"K1-066","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C12-S01 경제·산업 개발계획 §1.5 관광 현황·기본방향·추진전략 · 인쇄p.421·422·423 (PDF p.435·436·437)","page":"421","kind":"direction","topic":"관광 — 체류형 전환·관광특구(시내지구 포함)·전통시장 연계","text":"경주를 찾는 관광객이 대부분 체류형이 아닌 당일·통과형이라는 진단 아래 체류형 관광객 유치, 관광안내소·숙박·체험·국제교류 기능 강화, 전통시장과 연계한 관광경쟁력, 관광열차 등 관람 교통수단 개발을 제시한다. 관광특구(1994.8.31, 32.65㎢)는 시내지구를 포함한다.","values":"2013 방문객 8,894,724명(외국인 2.2%) / 목표 3,000만(2030) / 관광호텔업 14→12개소(2009→2013) / 관광특구 32.65㎢","note":"관광호텔 감소와 방문객 +23.9%의 엇갈림이 숙박 수요 논거. 관광특구 제도를 활용한 규제완화 방안은 서술 없음. 외국인 관광객 6% 유치·200만명 목표(p.105). S3 통계 — S1 프로그램 정당화에 직접 사용 금지.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STAY","P_TWOAX","P_RETAIL","P_TRAMHUB","PL30_COMM"]},{"fid":"K1-067","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P1-C02-S06 도시의 문제점과 잠재력 §6.1·6.2 SWOT 및 정책과제 · 인쇄p.86·87·88 (PDF p.100·101·102)","page":"86","kind":"fact","topic":"SWOT — 도심 관련 약점·위협과 극복전략(도심재생)","text":"약점으로 문화재·도심 고도제한에 의한 개발 제약, 시가지 관통 도로·철도의 공간 양분, 관광 방문을 지역소득과 연계할 테마·상권 미발달, 보문관광단지와 시가지 연계 부족을 꼽고, 위협으로 지속적 인구감소와 청년층 이탈을, 극복전략으로 도심재생을 통한 기능회복을 제시한다.","values":"관광객 3,000만(2030 예측, p.86)","note":"방문객(체류)과 거주·생활업종·야간을 함께 보
