는 두 축 KPI의 상위 진단 근거. S3 서술.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TWOAX","P_RETAIL","P_JOBS","PL30_SPACE"]},{"fid":"K1-068","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P2-C03-S04 도시지표 설정 §4.4-가 생활환경지표(상수도·하수도·에너지) · 인쇄p.128 (PDF p.142)","page":"128","kind":"standard","topic":"상하수·에너지 원단위 (2030 계획값)","text":"2030년 계획값은 1일 1인당 급수량 350ℓ(2013년 519ℓ), 1인 1일 하수량 387ℓ에 지하수유입 10%를 더한 계획오수량 129,413㎥/일, 1인당 에너지 7.05 TOE/년·전력 29.4 MWh/인·도시가스 1,356㎥/인이다.","values":"350ℓ/인·일 ; 387ℓ/인·일(+10%) ; 7.05 TOE/인·년 ; 29.4 MWh/인 ; 1,356㎥/인","note":"급수 감축은 유수율 향상 전제(p.263)이고 하수 원단위는 감축이 없어 두 수치를 함께 쓰면 모순(하수/급수 110.6%). 전력·가스 1인당 2~3배 증가 전망은 저탄소 방침(p.307~310)과 불일치. 건물 용도별(ℓ/㎡·일) 원단위는 없음 — 건축 용도 기준 산정은 별도 기준 필요. seed PL30_ENV(급수 519ℓ)는 2013 현황이고 2030 목표는 350ℓ.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_SEWER","P_ENERGY","PL30_ENV"]},{"fid":"K1-069","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S06 하수도 §6.3 하수도 실천전략 · 인쇄p.267·266·265 (PDF p.281·280·279) | P3-C06-S05 상수도 §5.3 상수도 실천전략(중수도) · 인쇄p.264 (PDF p.278) | P3-C08-S03 수환경 §3.3-라 물 재이용 활성화 · 인쇄p.319·318 (PDF p.333·332)","page":"267","kind":"direction","topic":"하수 분류식·중수도·빗물이용·용적률 완화","text":"하수는 우·오수 분류식을 원칙으로 시가지 신규조성·재개발 시 관로 설치를 병행하고 중수도 지역순환방식과 인공지반 녹화·투수포장·빗물침투도랑 등 녹색기반시설을 확대하며, 신축건물의 빗물이용·중수도 의무 대상을 넓히고 물 재이용시설 설치 시 조세감면·금융지원·건축물 용적률 규제완화를 추진한다.","values":"경주 하수처리장 110,000㎥/일(전체 146,656) ; 계획오수 2030 129,413㎥/일 ; 정수장 161,700㎥/일(2030까지 공급 가능)","note":"경주(천북면 신당리) 하수처리장이 전체 용량의 75%이며 구시가지 하수를 받는 구조. 동지역 하수도 보급률 99.3%로 사실상 완료(p.265). 용적률 완화는 도심 최고고도지구에서는 높이 제한이 먼저 걸려 실효가 제한(원문 정제본 분석). 정수장 용량은 본문 161,700과 표 138,500이 불일치(원문 각주).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_SEWER","P_FAR","P_STORM","PL30_ENV"]},{"fid":"K1-070","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C08-S05 에너지 §5.3-나·라 신재생·에너지 사용효율 · 인쇄p.326·327·328 (PDF p.340·341·342) | P3-C08-S01 저탄소 녹색도시 조성 §1.4-나 친환경 건축물 확대 · 인쇄p.310 (PDF p.324)","page":"326","kind":"direction","topic":"에너지 — 신축 신재생 열생산 의무화·에너지제로 중립빌딩·바람길·기존 건축물 에너지진단","text":"신축 건축물에 열에너지 사용량의 일정비율을 신재생으로 공급하도록 의무화하는 열생산 의무화 도입을 제시하고, 패시브하우스·탄소중립형 에너지제로 중립빌딩 보급과 인센티브, 기존 건축물 에너지진단, 일조·자연채광·바람길 확보를 통한 열섬 완화, 지역 커뮤니티 단위 융복합 신재생 보급을 제시한다.","values":"신재생 열생산 의무비율 미제시 / 2013 신재생 보급 1,167 TOE(총수요의 약 0.07%)","note":"ZEB 등급·의무 비율·건물 에너지 목표치 같은 정량 기준은 없음(공백). 친환경 건축물·에너지 절약 건축물 인센티브의 내용(용적률·세제 등)도 미제시(p.310·p.327).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_ENERGY","P_FAR","PL30_ENV"]},{"fid":"K1-071","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C08-S04 폐기물 §4.3-나 폐기물 발생 억제 / §4.1 현황 · 인쇄p.322·320 (PDF p.336·334)","page":"322","kind":"gap","topic":"폐기물 감량·원단위 목표 부재","text":"생활폐기물 발생량은 2013년 2,174.3톤/일로 현황만 있고 ‘감량목표율·원단위 발생량 목표 준수’를 말하면서 목표값과 2030 전망은 없으며 지역별 발생량·처리시설 위치도 없다.","values":"2,174.3톤/일(2013)","note":"부지 폐기물 발생량 산정은 상위계획 원단위가 없어 별도 기준(환경부 원단위 등)이 필요. 폐기물·빗물·재생에너지 통합 자원순환시스템 구축 방침만 있음(p.310).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_WASTE","PL30_ENV"]},{"fid":"K1-072","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C05-S03 토지이용계획 §3.2·3.3 토지이용계획 전체 · 인쇄p.177·186 (PDF p.191·200)","page":"177","kind":"gap","topic":"부지 단위 수치(면적·경계·용도지역·건폐율·용적률·높이·획지·용도 구성비) 부재","text":"계획서는 정책계획이라 구 경주역 부지의 면적·경계, 용도지역 변경, 건폐율·용적률·최고높이, 획지·가구 분할, 용도 구성비를 정하지 않으며, 부지 관련 수치는 도시재생활성화지역 면적(A 308,898.9㎡)과 상업·주거 수요 원단위 정도다.","values":"—","note":"의뢰인 계획 경계(218,478㎡)·시 구상 면적(79,438㎡)·고시 구역(156,460㎡)에 대한 상위계획 근거는 없음(수치 검색으로 확인) — 경계·밀도는 고시·도시관리계획으로만 정해짐.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_BND","P_FAR","P_H","P_LOT","P_USE","PL30_LAND"]},{"fid":"K1-073","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C07-S01 도시재생계획 §1.3-나 연계방안 도면 · 인쇄p.278 (PDF p.292) | P3-C07-S02 도심 및 시가지정비 §2.1-나 · 인쇄p.285 (PDF p.299) | P1-C02-S02 경주시 일반현황 및 특성 §2.2-라 문화재 현황 · 인쇄p.35 (PDF p.49)","page":"278","kind":"gap","topic":"구 역사 건물의 보존·이축·철거·문화재 지위 조항 없음","text":"계획서는 경주역을 철도역사 기능이 이전되는 ‘이전적지·역사부지’로만 다루며 구 역사 건물의 보존·이축·철거나 등록문화재 여부를 정하지 않고, 도면은 이 거점을 ‘경주역사(관광/문화 Complex) 부지’로 표기한다.","values":"등록문화재 2개(2014, 시 전체; 구 역사 해당 여부 미기재)","note":"‘경주역사는 도심기능 저해 요인’(p.285)은 철도 기능에 대한 서술이며 건물 보존 여부와 무관. 구 역사의 문화유산 지위·보존방침은 문화유산 관련 문서(프로젝트 규제 리스트)로 확인.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STN","P_USE","PL30_MULTI"]},{"fid":"K1-074","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C06-S01 교통계획 §1.4-바-1)③ 주차장 정비구상 · 인쇄p.241 (PDF p.255) | P3-C10-S03 공원·유원지계획 §3.6 가이드라인 / §3.2-5) 온천유원지 · 인쇄p.378·367 (PDF p.392·381) | P1-C02-S03 상위 및 관련계획 §3.1-마 고도보존육성기본계획 · 인쇄p.66 (PDF p.80)","page":"241","kind":"gap","topic":"매장문화재·지하 굴착 제약 조항 부재 vs 지하화 주차 수단 병존","text":"계획서 전체에 매장문화재·시굴·지표조사·현상변경 허용기준 조항이 없고(‘발굴을 통한 실체 확인’은 고도보존기본계획 인용, ‘현상변경허가 불허 9회’는 온천유원지 폐지 사유뿐), 주차는 지하공간 개발·공공주차장 지하화 후 상부 공원이라는 수단을 일반 원칙으로 제시한다.","values":"문화재현상변경허가 불허 9회 → 온천유원지 폐지(0.740㎢, 구정동)","note":"부지는 매장유산 유존지역이라 1단계 지하 굴착이 불가능하다는 프로젝트 전제 — 상위계획의 지하화 수단은 이 부지에 적용 불가(해석). 신라왕경 핵심유적 특별법(2019 제정으로 알려짐)은 2017년경 수립된 이 계획서에 반영되어 있지 않음(추정).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_DIG","P_PARK","P_PHASE","PL30_HUB"]},{"fid":"K1-075","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P3-C09-S03 경관 실천전략 §3.1-다 도심상업지역 / §3.3-가 지표적 경관거점 · 인쇄p.338·343 (PDF p.352·357) | P3-C07-S01 도시재생계획 §1.3-가 활성화지역 도면 · 인쇄p.277 (PDF p.291)","page":"338","kind":"gap","topic":"삼층석탑·성동동 전랑지 대상 조망축·마당 조항 없음","text":"계획서에는 삼층석탑·성동동 전랑지를 대상으로 한 조망축·마당 조항이 없고, 가장 가까운 것은 도심상업지역의 ‘주요 조망축 확보’와 읍성지역권역 ‘시각회랑’뿐이다. 성동리 전랑지는 D 활성화지역 위치 설명(성동리 전랑지 인근 주거지)과 도면 지명으로만 나온다.","values":"—","note":"p.281 도면에서 ‘성동리전랑지’는 부지 동쪽 C·D 지역 사이에 표기. 남산 방향 조망은 뷰콘(view cone) 도입 방침이 있으나(p.343) 석탑과 무관. 석탑 마당·조망축은 문화유산 관련 문서에서 따로 근거를 찾아야 함.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_PAGODA","P_FORM","PL30_LSC"]},{"fid":"K1-076","doc":"A-011","doc_title":"2030 경주도시기본계획","loc":"P1-C01-S02 계획의 범위 및 내용 §2.1 계획의 범위·단계별 개발계획 · 인쇄p.6 (PDF p.20)","page":"6","kind":"gap","topic":"문서 시한 — 기준연도 2010(현황 2013)·목표 2030, 승인 연월·후속 재정비 상태 본문에 없음","text":"이 계획서의 기준연도는 2010(현황자료 2013)이고 목표연도는 2030이며 승인 연월은 본문에 없다. 1단계(2013~2015)·2단계(2016~2020)·3단계(2021~2025)는 이미 지났고 인용하는 수치 대부분이 2013 기준이다.","values":"단계: 2013~2015 / 2016~2020 / 2021~2025 / 2026~2030","note":"프로젝트 기록(work/20261006_knowledge_graph/seed_kg_v1.py PL30_TERM)에 ‘2040 재정비(2025.06~2028.06)’ 메모가 있어 후속 도시기본계획이 진행 중일 가능성 — 이 문서에는 없으며 외부 확인 필요(웹 검색 미수행). 모든 항목의 인용 시 ‘2013 기준 T1 승인계획’ 전제를 붙일 것.","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"calibrates","nodes":["PL30_TERM"]},{"fid":"K2-001","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅲ-2-타 폐철도 활용사업 2) 폐철도 활용 관련 추진사업 · 인쇄 138쪽 · PDF 148쪽","page":"138","kind":"fact","topic":"경주역부지 개발사업 개요 — 위치·면적·소유·기간","text":"전략계획이 경주시 주요업무계획(2021)을 인용해 적은 경주역부지 개발사업은 성동동 169-2 외 110필지, 148,770㎡(철도공단 69,790·철도공사 78,864·기재부 116), 사업기간 2019~2028년(10년)이다.","values":"성동동 169-2 외 110필지; 148,770㎡ (철도공단 69,790 / 철도공사 78,864 / 기재부 116); 2019~2028 (10년)","note":"지주가 철도공단·철도공사 양분이라 둘 다 혁신지구 시행자 자격 범위에 든다(별도 항목). 면적은 다른 문서·고시와 불일치(별도 conflict 항목).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_BND","P_PHASE","P_OPS","PLR_SITE"]},{"fid":"K2-002","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅲ-2-타 인쇄 138쪽 · Ⅳ-3-5-나 중심생활권 기본방향 인쇄 176쪽 · Ⅳ-4-4-가 원도심 도시재생권역 인쇄 194쪽 (PDF 148·186·204)","page":"138","kind":"direction","topic":"경주역부지 도입기능과 중심생활권 기본방향 — 복합거점·폐선 기능재편","text":"사업내용으로 공공청사·상징광장·관람타워·문화·공원시설·복합상업시설·커뮤니티시설이 열거되고 폐선예정부지 신교통수단 도입 검토가 별도 행으로 붙는다. 변경 전략계획은 중심생활권의 첫째 방향을 '경주역부지 복합거점개발 및 폐선예정지역 기능재편'으로 두어 대단위 복합거점으로의 기능 전환, 폐선로 공공공간 조성과 신교통 도입, 공공 거점시설 집약을 제시하고, 원도심 권역(6.50㎢)도 경주역 부지를 활용한 복합 산업거점 조성을 방향으로 한다.","values":"공공청사, 상징광장, 관람타워, 문화·공원시설, 복합상업시설, 커뮤니티시설; 원도심 도시재생권역 6.50㎢","note":"프로그램별 면적·층수·구성비는 어느 쪽에도 없음(공백). '공공청사'의 주체(시청·의회 여부)도 미기재.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_HALL","P_OPEN","P_RETAIL","P_CULT","P_TRAMHUB","P_JOBS","PLR_SITE"]},{"fid":"K2-003","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅷ-2-4-라 도시재생 연계방안 인쇄 381쪽 · Ⅳ-3-3-가 기존 전략계획상 기본구상 인쇄 166쪽 (PDF 391·176)","page":"381","kind":"direction","topic":"경주역 부지: 공공행정기관 이전 등 행정업무시설 (활성화지역 외)","text":"신교통 연계방안 절은 '활성화지역 외의' 경주역 부지를 복합 거점으로 쓰고 공공행정기관 이전 등 주민생활지원·행정업무 시설을 조성해 지역 균형성장을 유도한다고 쓴다. 같은 쪽에서 동해남부선으로 동서로 분리된 황오동 주거생활권의 커뮤니티 결집을 위한 H/W·S/W 사업 연계도 언급한다. 변경 전(기정) 기본구상(p.166)도 경주역사에 추진 중인 행정복합타운 계획과 연계해 커뮤니티 중심으로 쓰도록 했다.","values":"","note":"시청·의회로 한정하지 않고 '공공행정기관 이전 등'으로만 서술. 기정 구상(2016/2020)의 행정복합타운 문구가 변경안에서 그대로 유지되는지는 미확인.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HALL","P_USE","P_CROSS","PLR_SITE"]},{"fid":"K2-004","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"부록 4. 경주시 도시재생위원회 자문(2021.9.17) 인쇄 451~452쪽 (PDF 461~462)","page":"451","kind":"direction","topic":"시청사 이전 '검토' — 성동지구(역사 부지) 사업유형 논의","text":"2021.9 위원회 자문에서 위원이 성동지구 내 역사 부지는 고도제한과 시청사 이전 등이 검토되고 있어 경제기반형 근거가 약하다고 지적했고, 시 답변은 경주역부지 활용에 시청사 이전 검토와 다각적 활용방안이 논의 중이며 이를 도시경제기반형으로 설정해 타 부처 연계사업을 집약하는 복합개발의 법적 근거를 마련하겠다고 밝힌다.","values":"","note":"승인계획에 남은 시청사 이전의 유일한 직접 언급이며 '검토·논의' 단계. 이후 심의에서 성동지구는 활성화지역에서 제외됨(별도 항목).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HALL","P_COST","P_USE","PLR_SITE"]},{"fid":"K2-005","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"부록 4. 도시재생위원회 자문 인쇄 452쪽 (PDF 462)","page":"452","kind":"conflict","topic":"폐역부지에 중심시가지형 사업을 하면 기능중복·재원운용 제약","text":"시 답변은 경주역 서측 경주역전지구가 이미 중심시가지형(원도심 상권·관광 중심기반)으로 사업 중이어서, 폐역부지에 같은 유형을 추진하면 기능중복에 따른 재원운용 제약과 사업 아이템 발굴 한계가 생긴다고 보고, 기존 사업과 연계·집약이 가능한 상위 유형(도시경제기반형)을 택했다고 설명한다.","values":"","note":"부지 프로그램에서 경주역전지구 사업(청년창업·성동시장 재편·문화거점)과 겹치는 기능을 줄여야 한다는 논리로 재사용 가능. 도시경제기반형 지정 자체는 최종 심의에서 반영되지 않음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_USE","P_RETAIL","P_CULT","P_COST","PLR_SITE"]},{"fid":"K2-006","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅵ-4-1 기승인 활성화지역 변경 방향 인쇄 277·279·282쪽, 부록 주민공청회 인쇄 445~446쪽·경북도 서면심의 인쇄 458쪽 (PDF 287·289·292·455~456·468)","page":"279","kind":"constraint","topic":"경주역 부지는 활성화지역 밖 — 성동지구 해제와 지정 개수 상한","text":"확정된 전략계획(변경)은 성동지구(205,600㎡)를 활성화지역에서 해제하고, 연접한 경주역 부지는 폐역부지 활용계획을 수립 중이므로 개발방향이 확정돼 연관성이 생기면 전략계획에 재반영을 검토한다고 쓴다. 2022.1 경북 도시재생위원회는 조건부가결하며 상정 13개소를 9개소로 줄였는데(성동·황오2·감포·양월 제외), 2021 가이드라인 개정으로 지자체 인구규모별 지정 수가 제한되기 때문이다. 해제지역의 기반시설·기초생활인프라는 인정사업·부처연계사업으로 공급한다.","values":"성동 205,600㎡ 해제; 기정 7개소→변경 9개소(존치 2·변경 2·해제 3·신규 5); 상정 13→9","note":"2022 전략계획 기준으로 부지에는 활성화지역 특례(국공유재산 수의계약·부담금 감면·건축규제 완화)가 적용되지 않는다(추정). 편입 경로는 전략계획 재변경(B-ref1: 2035 전략계획 수립 예정) 또는 혁신지구 등 별도 제도. 주민공청회(2021.7)에서도 시는 폐선로는 지정 기준 면적상 모든 노선을 편입하기 어렵고 활성화지역에 편입된 역사만 폐철도 활용사업단과 연계해 활용방안을 검토하겠다고 답했다(4차 p.445, 5차 p.446).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_COST","P_BND","P_OPS","PLR_AREA"]},{"fid":"K2-007","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅵ-1-1-나 법적 지정기준 인쇄 243쪽 (PDF 253)","page":"243","kind":"standard","topic":"활성화지역 법정 쇠퇴 지정요건 — 3지표 중 2개 이상","text":"도시지역에서 인구(최근 30년 최다 대비 20% 이상 감소 또는 5년간 3년 연속 감소), 사업체(10년 최다 대비 5% 이상 감소 또는 5년간 3년 연속 감소), 노후건축물(준공 20년 이상 50% 이상) 3개 지표 중 2개 이상을 충족해야 한다(법 제13조제4항, 시행령 제17조).","values":"인구 −20%↑ / 사업체 −5%↑ / 20년↑ 건축물 ≥50%; 3개 중 2개 이상","note":"공모 자격요건의 법정 기준.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["D_DECLINE","P_COST","L_REGENLAW"]},{"fid":"K2-008","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅵ-2-2 행정구역별 쇠퇴분석 인쇄 251~252쪽, 경주역전지구 개요 인쇄 287쪽 (PDF 261~262, 297)","page":"251","kind":"fact","topic":"법정 쇠퇴진단 — 황오·중부·성건·황남 (+경주역전지구)","text":"행정동 기준(기준연도 미기재)으로 황오동은 인구 −43.0%·사업체 −2.7%(2년 연속 감소)·20년↑ 건축물 87.9%로 2개 충족, 중부동은 −26.7%·−6.8%·84.5%로 3개 모두 충족, 성건동 −29.0%·+2.2%·72.4%와 황남동 −27.2%·+8.2%·82.0%는 각 2개 충족이다. 경주역전지구(집계구)는 인구 −53.9%·사업체 −6.0%·노후 86.9%로 3개 충족이다. 성동동은 별도 행이 없고 황오동 행정동에 포함되는 것으로 보인다(행정구역별 표 23개 행에 성동동 없음). 현 시청 소재지 동천동도 인구 −5.5%(5년 연속 감소)·노후건축물 63.8%로 2개 충족해 쇠퇴지역으로 분류된다.","values":"황오동 −43.0% / −2.7% / 87.9%; 중부동 −26.7% / −6.8% / 84.5%; 성건동 −29.0% / +2.2% / 72.4%; 황남동 −27.2% / +8.2% / 82.0%; 경주역전지구 −53.9% / −6.0% / 86.9%; (참고) 동천동 −5.5% / 사업체 미충족 / 63.8%","note":"기준연도 미기재 — 2026 공모용은 최신 통계로 재산출 필요(CLAUDE.md §9 착수순서 1).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","D_DECLINE","PLR_DECLINE"]},{"fid":"K2-009","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅵ-5-2-가 경주역전지구 토지이용 현황 인쇄 290쪽 (PDF 300) · A-008 인쇄 32쪽과 대조","page":"290","kind":"conflict","topic":"경주역전 활성화지역과 철도 부지의 경계 중첩 가능성","text":"경주역전 활성화지역(215,000㎡)의 지목에 철도용지 45,907㎡(국토교통부 29,282㎡ 등)가 있고 국공유지가 39.1%, 국토교통부 소유가 52,874㎡다. 활성화계획 쪽(A-008 p.32)에도 철도 도시계획시설 35,201㎡가 잡혀 있어 구경주역 부지의 일부가 이미 경주역전 활성화지역·활성화계획에 걸려 있을 수 있다.","values":"철도용지 45,907㎡; 국토교통부 소유 52,874㎡; 국공유지 39.1%; 철도시설 35,201㎡(A-008 p.32)","note":"표의 '사유지' 철도용지 16,606㎡는 법인(철도공사 등) 소유가 사유지로 분류된 것으로 추정. 경계 도면 대조 필요(S1 경계 확정 전 확인 항목).","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"conflicts","nodes":["P_BND","P_COST","PLR_AREA"]},{"fid":"K2-010","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅵ-5-2-가 경주역전지구 인쇄 286·288·291쪽, Ⅳ-1-3 폐선부지 전략 인쇄 161쪽 (PDF 296·298·301·171)","page":"291","kind":"direction","topic":"경주역전지구 사업방향과 약점 — 인접 지구가 이미 맡는 기능","text":"경주역전지구(중심시가지형)는 청년창업플랫폼·문화거점으로 원도심 상권 회복, 외국인 공동체·문화시설로 다문화 교류공간, 성동시장 기능 재편, 역사문화 특화골목·주민참여 투어를 방향으로 한다. 약점으로 고도제한에 따른 대규모 개발 불가와 전철 복선화에 따른 경주역 기능 상실(교통 접근성 약화 우려), 위협으로 관광객용 주차 등 집객 인프라 부족을 든다. 상위 전략(p.161)은 전통시장 기능재편·공실점포 활용 신상권·신구상권 상생을 제시한다.","values":"경주역전지구 215,000㎡; 상업지역 167,315㎡·자연녹지 47,685㎡","note":"부지 프로그램과의 역할분담 기준선 — 청년창업·시장 재편·다문화·투어는 경주역전지구가 선점.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_RETAIL","P_CULT","P_USE","P_PARK","P_FAR","P_H","PLR_AREA"]},{"fid":"K2-011","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅵ-5-1 활성화지역 특화방안 인쇄 286쪽, 황오1지구 인쇄 292~294쪽 (PDF 296, 302~304)","page":"292","kind":"fact","topic":"황오1지구(역 동측): '경주역으로 단절된' 동서 격차","text":"황오1(164,500㎡, 제2종일반주거 161,942㎡)은 인구 −45.3%·노후건축물 93.9%로 쇠퇴 3개 중 2개를 충족하며, 쇠퇴원인을 '경주역으로 단절된 생활권의 동서 지역 간 격차 심화'로 보고 서측 시가지와 단절돼 생활편의시설·교통 접근성이 낮다고 진단한다. 특화방안은 '경주역으로 단절된 도심 동측 근린생활권 활성화를 통한 도심지와의 순환적 연결체계 확보'다.","values":"164,500㎡; 인구 −45.3%; 노후 93.9%(425동 중 399동); 2018 인구 2,295명(2000년 4,192명)","note":"","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_CROSS","P_HOUSE","P_USE","PLR_AREA"]},{"fid":"K2-012","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅷ-2-4 폐선 연계방안 인쇄 378~379쪽, Ⅳ-3-3 인쇄 166쪽, Ⅱ-1-2 고도보존육성계획 인쇄 22쪽, 기본경관계획 인쇄 23쪽 (PDF 388~389·176·32·33)","page":"378","kind":"direction","topic":"철도선로의 기능전환 — 분리요소에서 동서 연결 통로로","text":"전략계획은 폐선으로 남는 선로를 시가지를 갈라 커뮤니티 교류를 끊고 경관을 해치는 요소로 보고, 이격된 생활권·거점을 잇는 선형 매개체로서 공용공간·여가공간·랜드마크로 활용하도록 한다. 변경 전 구상은 '철도선을 기준으로 단절된 동서지역을 이어주는 통로'를, 인용된 고도보존육성계획(2017)은 유적을 가르는 철도의 기능전환·제거와 유적지-구도심 간 보행·자전거 탐방로를, 기본경관계획은 주요 유적·오픈스페이스를 잇는 보행탐방로와 야간탐방 루트 특화를 제시한다.","values":"","note":"고도보존육성계획·기본경관계획은 2차 인용(원문 확인 필요).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CROSS","P_AXIS","P_PED","P_OPEN","PLR_LINK"]},{"fid":"K2-013","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-3-3 유휴 공공자산 인쇄 87쪽, Ⅷ-2-4-다 폐선부지 활용 기본방향 인쇄 380쪽 (PDF 97·390)","page":"380","kind":"direction","topic":"구 역사: 1936 근대건축물(보존가치 높음) → 리모델링·복합개발로 청년 문화 플랫폼","text":"경주역 역사 건물은 1936년 건축된 근대건축물로 보존가치가 높고 문화재로서의 상징성도 지닌다고 평가한다. 활용방향은 기존 역사건물을 리모델링·복합개발해 청년층이 활동하는 문화 플랫폼으로 공유하고, 폐선로·역사 주변은 공공 오픈스페이스·공원·녹지 확충과 경관개선으로 정비하는 것이다.","values":"1936년 건축","note":"이축 여부나 보존 등급(등록문화유산 등)은 기술 없음. 실제로는 이미 '경주문화관1918'로 리모델링되어 있다(B-ref1·B-006).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STN","P_OPEN","P_USE","P_CULT","PLR_SITE"]},{"fid":"K2-014","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅲ-1-1-다 경주시 경관계획 인쇄 118~119쪽 (PDF 128~129)","page":"118","kind":"constraint","topic":"행정복합타운 중점경관관리구역(성동동 40 일원) — 구역·목표·보전사항","text":"2025 경관계획의 중점경관관리구역 5개소 중 '행정복합타운'은 성동동 40 일원 45.51ha(황오동·성동동)이며 기 지정 활성화지역과 일부 중첩된다. 목표는 '경주시 미래를 대표하는 도심 활력 중심지'이고 계획방향은 ① 형성: 성동시장·다문화거리 디자인 특화, 경주역 복합행정타운 경관 가이드라인 제시 ② 관리: 가로변 건축물·옥외광고물과 노후 주거지·유해시설 정비 ③ 보전: 경주역 역사 및 전면부 오픈스페이스 보존(관광자원화), 화랑로에서 경주역 방향 조망축 보존이다.","values":"성동동 40 일원; 45.51ha; 황오동·성동동; 조망축: 화랑로→경주역","note":"구역명이 '행정복합타운'이므로 경관계획이 부지에 행정기능을 전제한 것으로 읽힘(추정). 구역 45.51ha는 부지보다 넓은 주변 포함 범위. 경관계획 원문(A-009)과 지구단위계획 연계 조항 확인 필요.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_HALL","P_FORM","P_STN","P_OPEN","P_AXIS","PLL_ZONE"]},{"fid":"K2-015","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅳ-4-4-가 원도심 권역 활성화 방향 인쇄 195쪽, Ⅸ-2-6-나 원도심권역 소요사업비 인쇄 415~417쪽 (PDF 205·425~427)","page":"416","kind":"gap","topic":"재원조달계획에 경주역부지 개발비 없음 — '폐선예정부지 도시관리계획 수립 18억'뿐","text":"원도심 권역 소요사업비 5,437.69억원(기추진 연계 4,584.75·권역 활성화 852.94) 표에서 폐선부지 관련 항목은 '폐선예정부지 도시관리계획 수립'(2022년 이후 폐쇄되는 경주역부지 활용·개발방향 수립, 지방비 100%) 18억원뿐이고 경주역부지 개발사업 자체의 사업비 항목은 없다. 비교로 황룡사 복원·정비(경찰서 이전적지) 2,900억, 경주읍성 605억, 경주역전 뉴딜 250억, 중심상가시장 주차타워 50억이 반영된다.","values":"도시관리계획 수립 18억(지방비 100%); 원도심 권역 5,437.69억; 전 권역 9,177.73억","note":"2026 구상 3,822억은 이 전략계획 이후 수치로 전략계획에는 근거가 없다. 도시재생위원회 답변(p.452)은 부지 매입 재원·활용방안을 폐철도 활용사업 주관부서(폐철도활용사업단)와의 협업으로 마련한다고 하므로, 재원표에 개발비가 없는 것은 부지 개발이 재생 재원이 아니라 폐철도 활용사업 소관이어서일 수 있다(추정).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_PHASE","P_BND","PLR_SITE"]},{"fid":"K2-016","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅸ-2-2-나 도시재생 신규제도 인쇄 405~406쪽 (PDF 415~416)","page":"405","kind":"standard","topic":"혁신지구 — 국비 최대 250억·규모 50만㎡ 이하·공공 시행자(철도공사·철도시설공단 포함)","text":"전략계획이 정리한 혁신지구(법 제41조)는 공공주도로 쇠퇴지역 내 산업·상업·주거 등 기능이 집적된 지역거점을 조성하는 지구단위개발사업으로, 국비는 국가가 타당성을 인정하는 범위에서 최대 250억원, 사업규모는 50만㎡ 이하(시행령 제45조 제6항)다. 개발이익 사유화 방지를 위해 공영개발자만 시행하며 시행자는 지자체, LH·HUG·한국철도공사·한국철도시설공단 등 대통령령 지정 공공기관, 지방공사, 공공 50% 초과 출자법인이다.","values":"국비 ≤250억; ≤50만㎡; 시행자: 지자체 / 공공기관(철도공사·철도시설공단 포함) / 지방공사","note":"2026 상반기 국가시범지구(혁신지구) 공모가이드라인(archive B-S3-20260206)은 도시재생 혁신지구 규모를 200만㎡ 이하로 적어 상한이 다름(2022 전략계획은 당시 시행령 기준). CLAUDE.md 구상의 '국비 250억'은 이 상한과 같은 수치.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_BND","P_COST","P_OPS","PLP_GUIDE"]},{"fid":"K2-017","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅸ-2-2-가 도시재생 뉴딜사업 유형 인쇄 403쪽, Ⅸ-2-6 인쇄 413쪽, Ⅸ-2-4 주택도시기금 인쇄 410~411쪽 (PDF 413·423·420~421)","page":"403","kind":"standard","topic":"국비 지원 한도(뉴딜 유형별)와 주택도시기금 출·융자 한도","text":"뉴딜 유형별 국비 한도·권장면적은 경제기반형 250억(50만㎡ 내외·6년), 중심시가지형 150억(20만㎡ 내외·5년), 일반근린형 100억(10~15만㎡·4년), 주거지지원형 100억(5~10만㎡·4년), 우리동네살리기 50억(5만㎡·3년)이며 경주역전 250억은 국비 150+지방비 100이다. 주택도시기금은 도시재생지원 출자가 총사업비 20% 이내, 융자 50% 이내(연 2.2%, 공공 차주 1.8%), PF보증 80% 이내이고 대상은 활성화지역·혁신지구·인정사업이다.","values":"경제기반형 250억/50만㎡/6년; 중심시가지형 150억/20만㎡/5년; 일반근린형 100억/10~15만㎡/4년; 기금 출자 ≤20%·융자 ≤50%(2.2%)·PF보증 ≤80%","note":"2019·2021 뉴딜 가이드라인 기준이라 현행 확인 필요. 국비 상한(250억)만으로는 3,822억 구상(T4)의 약 6.5%.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_BND","PLP_GUIDE"]},{"fid":"K2-018","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅶ-1 도시재생 인정사업 개요 인쇄 355~356쪽, Ⅸ-2-2-나-4) 인쇄 407쪽, Ⅶ-2 인쇄 358쪽 (PDF 365~366·417·368)","page":"355","kind":"standard","topic":"인정사업 요건 — 면적 10만㎡ 미만·활성화지역 밖·국비 10~50억","text":"인정사업은 점단위 사업(면적 10만㎡ 미만, 도시지역, 활성화지역 밖; 예외로 안전등급 D·E 건축물 정비·공사중단 장기방치건축물·빈집정비는 안에서도 가능)에 3년간 국비 10~50억원(지방비 매칭 40~60%)을 지원하고, 공공지원민간임대·소규모 공공주택·국유재산 개발사업·고용기반 창출 건축물 등을 대상사업으로 한다. 요건 지역은 쇠퇴 3지표 중 2개 이상 또는 기초생활인프라 국가최저기준 미달 지역이며, 사례로 진주 구진주역 철도부지 복합문화공원이 제시된다.","values":"면적 <10만㎡; 국비 10~50억/3년; 지방비 매칭 40~60%","note":"부지 전체(≥148,770㎡)는 10만㎡ 미만 요건을 넘으므로 분할 시행 또는 일부 획지(청년주거·생활SOC)에만 적용 가능.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_COST","P_BND","P_HOUSE","PLR_AREA"]},{"fid":"K2-019","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅶ-3 인정사업 대상지 발굴 인쇄 359~361쪽, Ⅳ-1-3-3) 인쇄 161쪽 (PDF 369~371·171)","page":"360","kind":"fact","topic":"분산 삽입형 후보 — 노동 공영주차장·경주경찰서 이전예정부지 (+이전적지 복합전환 방침)","text":"전략계획의 원도심 인정사업 대상지는 노동 공영주차장(노동동 12 일원, 7,536㎡, 경주시 소유; 일부 공간을 SOC·커뮤니티 공간으로 기능 전환)과 경주경찰서 이전예정부지(동부동 150, 3,500㎡, 경찰청 소유; 이전 후 활성화지역 연계거점으로 활용)이며, 공공기관 이전 등으로 남는 유휴공간은 복합 거점공간으로 기능을 전환한다는 방침이 있다.","values":"노동 공영주차장 7,536㎡; 경주경찰서 이전예정부지 3,500㎡","note":"분산 삽입형 대안의 후보지이자 시청 이전 시 이전적지 처리 논리의 선례. 부지 주차·복합 기능과 중복될 수 있음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["PL30_MULTI","P_PARK","P_USE","P_HALL","PLR_AREA"]},{"fid":"K2-020","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅸ-3-3~4 제도적 지원방안 인쇄 429~430쪽 (PDF 439~440)","page":"429","kind":"standard","topic":"활성화지역 한정 특례 — 국공유재산·부담금·건축규제 완화","text":"활성화지역 내 국공유재산은 도시재생사업 외 목적으로 매각·양도할 수 없고 시행자에게 수의 사용허가(20년 이내)·매각·대부·양여와 사용료 감면이 가능하며, 교통유발부담금·개발부담금 등 부담금과 지방세를 감면할 수 있다. 활성화계획에서는 조례 건폐율·용적률 한도(법정 최대 초과 불가)·주차장 설치기준·가로구역별 최고높이 등을 완화할 수 있고, 입지규제최소구역은 도시경제기반형에 한한다.","values":"사용허가 ≤20년; 입지규제최소구역=도시경제기반형 한정","note":"특례는 활성화지역 지정(활성화계획) 전제이므로 부지가 지역 밖이면 그대로 적용되지 않는다(추정). 완화 목록에 고도지구·문화재 높이규제는 열거되지 않음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_COST","P_OPS","P_FAR","P_H","P_PARK","PLR_AREA"]},{"fid":"K2-021","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-1-4-라 관리구역 인쇄 45~47쪽 (PDF 55~57)","page":"46","kind":"standard","topic":"높이·형태 규제 수치 인용 — 고도지구·미관지구·역사문화환경 보존지역","text":"고도보존육성기본계획(2017) 표를 인용해 최고고도지구 7~36m 이하(7.15㎢, 시 면적 0.54%), 역사문화미관지구 2층, 일반미관지구 2~6층을 제시하고, 역사문화환경 보존지역은 1~7구역(9단계)으로 보존구역부터 최고 25m까지 높이를 규제(2구역 평지붕 5m·경사지붕 7.5m 이하)하며 법에 의한 행위제한 면적이 시의 27.17%라고 적는다. 고도지구는 2020.12 경북도 고시 제2020-479호 기준으로 반영했다.","values":"최고고도지구 7~36m↓; 역사문화미관 2층; 일반미관 2~6층; 보존지역 ≤25m(2구역 5m/7.5m); 행위제한 27.17%","note":"2차 인용 — 부지 필지별 적용 지구·구역은 별도 확인(regulation-checker).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FORM","P_FAR","L_GODO"]},{"fid":"K2-022","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅷ-1~4 신교통 인쇄 369~381쪽, Ⅲ-1-1-가-2) 인쇄 111·115쪽 (PDF 379~391·121·125)","page":"370","kind":"direction","topic":"폐선 활용 신교통(트램·모노레일 등) — 노선·종류는 미확정","text":"동해남부선·중앙선 폐선(복선전철 이설 2021년 이후)으로 생기는 유휴부지에 트램·모노레일 등 신교통을 도입해 신도시~원도심~관광지를 잇는 방안을 법 제13조에 따라 제시하되 시스템 종류와 노선은 사업 추진 시 선정하도록 남긴다. 경주역 일원에 신교통 거점 조성과 재생사업 연계가 필요하다고 보며, 2030 기본계획 신교통 계획안은 1단계 KTX역~도심~보문단지 BRT 22.0km, 2단계 Tram이고 관광 순환버스 노선에 경주역~보문단지~불국사~통일전~경주역이 있다.","values":"BRT 22.0km(1단계) → Tram(2단계); 순환노선 경주역~보문단지~불국사~통일전~경주역","note":"정거장·노선 위치는 도면(그림)으로만 제시되어 텍스트로는 확인 불가(공백).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_TRAMHUB","P_TRIP","PLR_LINK"]},{"fid":"K2-023","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅷ-3-1 도심 복합환승센터 인쇄 382~385쪽 (PDF 392~395)","page":"382","kind":"direction","topic":"복합환승센터 = 경주역·시외버스터미널·KTX역 / 부지 마스터플랜에 대중교통 거점 반영","text":"도시기본계획상 복합환승센터는 도심의 경주역·시외버스터미널·KTX역에 설치하는 것으로 하며, 전략계획은 경주역 부지 활용 마스터플랜 수립 시 도심관광·신경주역·보문단지 등 주요 거점으로의 양질의 교통서비스를 위한 대중교통 거점 조성을 고려해 반영하라고 한다. 시외·고속버스터미널(노서동)은 존치한 채 기능재편·주변정비만 서술한다.","values":"복합환승센터 3개소: 경주역·시외버스터미널·KTX역","note":"도시기본계획 원문의 2차 인용. 터미널의 부지 이전은 K2 문서에 없음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_TRAMHUB","P_TRIP","PLR_LINK"]},{"fid":"K2-024","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅷ-4 주차장 및 자전거도로 확충 인쇄 386쪽, Ⅵ-2-2 원도심 추진사업 인쇄 268쪽, Ⅸ 사업비표 인쇄 417쪽 (PDF 396·278·427)","page":"386","kind":"direction","topic":"주차 — 무조건 공급 지양, 유형별 규모 제시","text":"도시재생은 기반시설 공급 위주가 아니므로 이용 인구·수요·현황을 종합 검토해 적정 공급단위를 정하라고 하고, 2030 기본계획 방안으로 블록별 공동주차장 10~50대, 상업지역 민영주차장 50~200면, 공원 등 공공용지 지하주차장, 공영주차장 기계화 등을 든다. 원도심 연계사업으로 중심상가시장 주차타워(50억원)와 서천둔치 다목적광장(주차장) 정비가 열거된다.","values":"공동 10~50대; 민영 50~200면; 중심상가시장 주차타워 50억(국비 30)","note":"공공용지 지하주차 안은 부지의 매장문화재(시굴 필요) 때문에 곤란. A-008 p.46은 같은 사업을 '성동시장 주차타워'로 적어 명칭이 불일치.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_PARK","P_DIG","PLR_LINK"]},{"fid":"K2-025","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅴ-2-1 기초생활인프라 국가적 기준 인쇄 215~217쪽 (PDF 225~227)","page":"216","kind":"standard","topic":"기초생활인프라 국가 최저기준 — 공원·주차·SOC","text":"국가 도시재생 기본방침의 최저 향유기준은 마을단위(도보 3km/h) 유치원 5~10분·초등 10~15분·도서관 10~15분·어린이집 5분·경로당·노인교실 5~10분·생활체육 10분·근린공원 10~15분·소매점 10분이고, 마을주차장은 주거지역 내 주차장확보율 70% 이상이다. 지역거점(차량 25km/h)은 공공도서관 10분·사회복지시설 20~30분·보건소 20분·응급실 30분·공공문화시설 20분·공공체육 15~30분·지역거점공원(10만㎡↑) 10분이다. 거리환산은 도서관 750m, 어린이집·경로당 250m, 노인교실·소매점·공영주차장 500m, 생활체육·도시공원 750m, 의원 1,250m, 약국 1,000m 등이다.","values":"근린공원 10~15분(750m); 지역거점공원 10만㎡↑ 10분; 공영주차장 500m·주거지 확보율 ≥70%; 도서관 750m; 노인교실 500m","note":"이 문서는 '별표 2'를 직접 표기하지 않고 '국가 도시재생 기본방침'으로만 인용. A-008 p.37(AURI 표)은 기존기준으로 도시공원 9㎡/인·생활체육 4.2㎡/인·작은도서관 500가구 이상 1개소를 병기.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_OPEN","P_PARK","P_USE","L_INFRA"]},{"fid":"K2-026","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅴ-2-2-가 마을단위시설 향유수준 인쇄 219~220쪽 (PDF 229~230)","page":"219","kind":"fact","topic":"행정동별 기초생활인프라 충족 — 황오동은 도서관·노인교실 미달","text":"행정동 평균 도보 접근거리 기준으로 황오동은 도서관(833.5m>750m)·노인교실(950.2m>500m)이 미달이고 공영주차장(438.9m)·도시공원(664.4m)은 충족이다. 중부동은 어린이집(251.9m>250m)만 미달, 성건동은 도서관·노인교실·공영주차장(751.1m>500m) 미달, 황남동은 도서관·노인교실·의원·약국·생활체육·도시공원·소매점·공영주차장이 모두 미달이다.","values":"황오동 도서관 833.5m/노인교실 950.2m 미달; 공영주차장 438.9m·도시공원 664.4m 충족","note":"행정동 평균값이라 부지 자체 값이 아님. 도서관·노인교실이 원도심 공통 미달 시설.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_PARK","P_OPEN","P_CULT","L_INFRA"]},{"fid":"K2-027","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅴ-1-2-다 시설 유형별 공급방향 인쇄 213쪽, Ⅴ-2-3 공급계획 인쇄 238~239쪽 (PDF 223·248~249)","page":"213","kind":"standard","topic":"공원 1인당 16.41㎡ · 도심지역 지역거점시설 확대 · 복합화 유형","text":"공원·녹지는 2030 기본계획의 1인당 공원면적 16.41㎡를 고려해 조성하고, 도심지역(상업 형성지역)은 복수 생활권에서 접근이 쉬운 문화·복지·의료 지역거점시설을 확대해 집객력을 높이며, 복합화는 수직·수평·중복 유형과 공공임대주택 복합화·국공유지 활용을 권장한다.","values":"16.41㎡/인 (2030)","note":"","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_OPEN","P_USE","P_HOUSE","L_INFRA","PL30_PARK"]},{"fid":"K2-028","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅲ-2 장래수요분석 인쇄 143~146쪽, Ⅲ-1-2·4 인쇄 120·141쪽 (PDF 153~156·130·151)","page":"143","kind":"conflict","topic":"계획인구·상업수요 과대 + 신경주역세권 6,300세대","text":"2030 기본계획은 계획인구 32만(인구전망 316,259)을 전제로 상업용도 4.10㎢(중심생활권 2.66㎢)를 산정했으나 등록·추계 인구는 2030년 248,687명으로 전망 대비 67,572명 적어 용도별 수요가 줄고 확장보다 기존 시가지 용도 전환이 필요하다고 본다. 신경주역세권 개발(533,630㎡, 15,435명·6,300세대, 2011~2022)이 끝나면 도심 인구 이동으로 공동화가 심해질 수 있으며 원도심은 고도규제로 공동주택 공급이 저조해 재생과 연계한 공급이 필요하다고 한다.","values":"계획 320,000 / 전망 316,259 / 추계 248,687 (−67,572); 상업용도 4.10㎢(도심상업 0.62·지역중심 1.69·지구중심 0.35); 신경주역세권 6,300세대","note":"2026.6 실제 총인구 243,051명(B-ref1)은 이미 2030 추계(248,687)보다 낮다 → 상업·주거 수요를 보수적으로.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_RETAIL","P_HOUSE","P_FAR","PL30_POP"]},{"fid":"K2-029","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-2-3-가 상권 분포현황 인쇄 76쪽, Ⅱ-1 인쇄 16·40쪽 (PDF 86·26·50)","page":"76","kind":"fact","topic":"시청 이전이 만든 상권 — 저녁 혼잡·낮은 안정성·과밀 경쟁","text":"전략계획은 시청사 이전으로 급속히 형성된 시청주변 상권을 대중교통은 원활하나 저녁 시간대 혼잡이 심하고 상권안정성이 낮으며 출점 경쟁이 높은 과밀 경쟁 지역으로 기술한다. 시청 이전·안강 주거단지·KTX 역세권 개발 같은 외연 확장 정책이 원도심 중심권 약화와 공동화를 낳았다는 진단도 함께 있다.","values":"","note":"시청은 현재 동천동에 있으므로 구경주역으로의 재이전은 이 상권과 원도심 양쪽에 영향. '저녁 혼잡'은 야간활동 지표와 방향이 같아 보일 수 있으나 상권 불안정성과 함께 읽어야 함.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_HALL","P_RETAIL","P_TWOAX","D_FOOT"]},{"fid":"K2-030","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-2-3-나 전통시장 인쇄 77~78쪽 (PDF 87~88)","page":"77","kind":"fact","topic":"성동시장 현황과 인접 시장","text":"성동시장은 성동동 51-1, 1971년 개설, 공설 상설시장으로 매장면적 3,738㎡, 점포 610·상인 760, 의류·식료품·농수산물 특화, 휴무는 첫째·셋째 일요일이다. 인접 시장은 중앙시장(성건동, 사설, 700점포), 경주중심상가시장(노동동, 513), 경주봉황중심상가시장(노동동, 520), 북정로 중심상가시장(황오동, 39)이다.","values":"성동시장 3,738㎡ / 610점포 / 760명; 중앙시장 700점포; 중심상가시장 513; 봉황중심상가 520","note":"점포수는 문서마다 610(A-006)·500여(A-008 p.36)·587(소진공 2024, 기존 노트)로 다름(기준연도·정의 차).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","D_MARKET"]},{"fid":"K2-031","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-1-4 중심지 상업·건축물 인쇄 43쪽 (PDF 53)","page":"43","kind":"fact","topic":"중심지 업종 변화 2015→2019 — 숙박·음식 +21.2%, 도소매 정체","text":"성건·중부·황남·황오 행정동 사업체는 2015→2019년 3,363→3,603개(+7.1%)로, 숙박·음식점업 1,224→1,483(+21.2%)·보건복지 +14.6%인 반면 도소매 1,703→1,695(−0.5%)·제조업 −10.3%·금융보험 −12.7%다. 중심지 10개 법정동 건축물 용도는 2017→2021년 제1종근생 +9.2%, 숙박시설 131→136(+3.8%)이다.","values":"숙박·음식점업 +21.2%; 도소매 −0.5%; 제조업 −10.3%; 숙박시설 131→136","note":"관광 업종 증가·생활 업종 정체의 T1 근거(두 축 '치환' 가설의 보조).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_TWOAX","P_RETAIL","P_STAY","D_STORES"]},{"fid":"K2-032","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-1-3 인구 인쇄 32·34쪽, Ⅱ-3-1 건축물 인쇄 80~83쪽 (PDF 42·44·90~93)","page":"32","kind":"fact","topic":"황오·중부·성건·황남 인구·주택 지표","text":"2000→2020년 인구는 황오동 12,623→6,567, 황남동 11,157→4,779, 중부동 7,719→5,308, 성건동 21,987→14,047이다. 황오동은 세대 3,665 중 1인가구 1,244(2019), 인구밀도 5,299/㎢다. 20년↑ 주택 비율은 황남 86.9%·황오 81.7%·성건 72.8%·중부 60.1%(시 62.7%), 최근 5년 신규주택은 황오 4.9%·황남 3.3%·중부 12.2%·성건 8.4%(시 17.3%), 60㎡ 이하 소형주택은 황오 31.1%·황남 41.1%·성건 27.0%·중부 24.0%(시 36.3%), 시 주택보급률은 120.6%(2019)다.","values":"황오동 6,567명(2020); 1인가구 1,244/3,665세대; 노후주택 81.7%; 신규주택 4.9%; 소형주택 31.1%","note":"황오동 노후 비율이 지표마다 다름(건축물 87.9% p.251 / 주택 81.7% p.82 / A-008 86.5·89.7%) — 분모(건축물 vs 주택) 차이.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_HOUSE","P_TWOAX","D_DECLINE"]},{"fid":"K2-033","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅸ-4 모니터링 및 성과관리계획 인쇄 431~432쪽 (PDF 441~442)","page":"431","kind":"standard","topic":"전략계획 모니터링 지표 체계 — 사회문화·경제·물리","text":"사회문화(인구변화율, 유동인구·거점시설 방문객 수, 주민참여, 만족도), 경제(총사업체·고용·도소매업 변화율, 창업·입점점포 수, 주요상권 통행량, 빈 점포 수와 공실 활용, 상생협약 건수), 물리(노후·소형·신규주택 비율, 노후·공폐가 정비와 유휴공간 활용, 생활SOC·기반시설 공급, 주민공동이용시설·거점공간 수) 3개 영역을 연 단위 통계와 준공 후 현장조사로 운영한다.","values":"유동인구·방문객 수; 빈 점포 수·공실 활용; 창업·입점점포 수","note":"두 축 KPI 후보 지표의 공식 어휘. 방문 축(유동인구·방문객·통행량)과 거주·생활 축(인구변화율·빈 점포·생활SOC)이 모두 들어 있음.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_TWOAX","PLR_DECLINE"]},{"fid":"K2-034","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅸ-1 도시재생사업 추진체계 및 운영방안 인쇄 391~401쪽, Ⅸ-2-2-나-3) 인쇄 406쪽 (PDF 401~411·416)","page":"391","kind":"direction","topic":"거버넌스 — 행정지원·현장지원센터·주민협의체 + 총괄사업관리자","text":"추진주체는 행정지원기반(전담조직·추진단·행정협의회), 현장지원기반(도시재생지원센터·현장지원센터), 주민협의체 3축이고 지원센터 운영방식은 행정직영·민간위탁·공공위탁·재단설립 4유형을 비교한다. 공기업 등에 계획·시행·운영을 위탁하는 총괄사업관리자 방식(LH·지방공사 등, 유형별 국비 100~250억, 거점개발에는 국비+지방비의 30% 범위 내 지원)을 위한 역할분담 계획을 둔다.","values":"총괄사업관리자 국비 100~250억; 거점개발 30% 범위","note":"준공 후 운영 주체·재원은 일반론 수준(교훈 9 '운영 조직 설계'에 쓸 구체 사례는 A-007·B-007).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_OPS","P_COST","PLR_AREA"]},{"fid":"K2-035","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅲ-1-2-타 폐철도 활용사업 인쇄 138쪽, Ⅳ-4-4-나 동천 권역 인쇄 197~198쪽, Ⅲ-1-1-다-3) 공원녹지 인쇄 113쪽 (PDF 148·207~208·123)","page":"138","kind":"fact","topic":"남북 폐선축 — 동천~황성 도시숲(철로변 완충녹지) 이미 계획","text":"폐철도 활용 관련 사업으로 동해남부선 철로변 완충녹지를 활용한 산책로·광장 등으로 형산강~북천을 잇는 '동천~황성 도시숲' 공원 조성이 병기되고, 동천 권역 구상은 폐선 철로 재편을 통한 도시숲·도심 휴식공간 조성과 시청 일원 활성화를 연계한다. 공원녹지 방향도 철도변 완충·경관녹지를 선형 도시공원화한다고 적는다.","values":"형산강~북천 연결 도시숲; 동천 권역 0.76㎢","note":"부지 북측 폐선축은 이미 도시숲으로 계획되어 있어 남북 종축의 접속 조건이 된다. 남측(선도동) 연결은 B-006 참조.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_AXIS","P_OPEN","PLR_LINK"]},{"fid":"K2-036","doc":"A-006","doc_title":"경주시 도시재생전략계획(변경) 최종보고서 (2022.01)","loc":"Ⅱ-4-마-6) 교통 혼잡구간 인쇄 55쪽, Ⅱ-3-2 에너지 인쇄 86쪽, Ⅳ-1-3-4) 인쇄 162쪽 (PDF 65·96·172)","page":"55","kind":"gap","topic":"부지 교통발생·상하수·에너지 부하 수치 없음","text":"전략계획에는 경주역 부지의 교통발생량·하수·에너지 수요 원단위나 부지 단위 영향 검토가 없다. 있는 것은 도심 혼잡구간(2021.1 기준: 평일 시가지·시청 주변, 주말 황리단길 방향, 화랑로 역전삼거리~중앙시장네거리 월·토), 도시가스 보급률 79%(2019), 친환경 자동차 충전시설·신재생에너지 도입 방향뿐이다.","values":"도시가스 보급률 79%(2019); 혼잡: 화랑로 역전삼거리~중앙시장네거리","note":"교통영향평가·상하수 용량은  L=450m, B=25m, 120억원, 2020~2021·토지보상 중)과 양정로 개설(통일정비~기관차 사무소~알천북로, L=1km, B=20~25m, 교량 L=180m, 2005~2025·보상·개설 중)을 제시하고, 다른 쪽(p.87)은 '대상지 남측 분황로와 팔우정삼거리를 연결하는 도로개설'로 접근성이 좋아진다고 같은 맥락으로 쓴다. 양정로는 '철도 배후 주거지 도시계획도로'가 목적이고 사업범위에 문화재구역이 걸리며, 2020년 이후 계획은 보상·도로개설 0.45km(B=20m)·교량가설 180m다.","values":"태종로 L=450m B=25m 120억; 양정로 L=1km B=20~25m 교량 180m 126억(p.101·145) 또는 300억(p.70)","note":"B-006(2025.6)은 태종로 2026·양정로 2027 예정으로 적어 일정이 지연됨. 사업비 126억(p.101·145) vs 300억(p.70), 양정로 위치 서술 불일치(p.30 '대상지 남측' vs p.90 '북측') — 선형은 도면 확인 필요. 현재 완공 여부는 문서 기준일(2025.12) 현황 미확인.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_CROSS","P_AXIS","P_LANE","P_DIG","P_COST","PLA20"]},{"fid":"K2-040","doc":"A-007","doc_title":"경주시 도시재생활성화계획(일반근린형) 일상이 여행이 되는 마을, 행복 황촌 (2025.12 변경판)","loc":"Ⅳ-4 도시재생 1,2단계 및 주변 개발계획 검토 인쇄 146쪽, Ⅱ-2 경관계획 인쇄 69쪽 (PDF 150·73)","page":"146","kind":"direction","topic":"경주역 철도역사·폐철도부지 활용(2019~2028) = 분산된 행정기능 통합·행정복합타운","text":"황오1 활성화계획은 경주역 철도역사·폐철도부지 활용(2019~2028)을 '경주시 도심에 흩어져 있는 행정시설 통합을 통한 주민 행정 편의성 제고'로 규정하고, 행정복합타운으로 계획되는 경주역 부지와의 정합성 확보로 시너지를 내며 글로벌문화로와 황촌나들이길의 연결동선을 수립한다고 적는다. 경관계획 인용 부분은 경주역 행정복합타운 조성에 맞춘 경주역 삼거리·원화로 정비를 중심시가지 경관정비에 넣는다.","values":"2019~2028; 경주역 삼거리·원화로 정비","note":"'분산된 행정기능 통합'은 시청 단독이 아니라 도심 산재 행정시설 전반을 뜻할 수 있음 — 시청·의회 포함 여부는 미기재.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_HALL","P_USE","P_PED","P_CROSS","P_TRIP","PLA20"]},{"fid":"K2-041","doc":"A-007","doc_title":"경주시 도시재생활성화계획(일반근린형) 일상이 여행이 되는 마을, 행복 황촌 (2025.12 변경판)","loc":"Ⅱ-4 인쇄 62·82·85쪽, Ⅳ-3 황촌 나들이길 인쇄 105·132쪽 (PDF 66·86·89·109·136)","page":"85","kind":"fact","topic":"선로·역·지하차도에 의한 단절 — 황오1 접근성과 가로 폭","text":"황오1은 경주역에서 직선 300m 내외인데도 경주역 및 열차선로로 단절돼 대중교통·보행 접근성이 낮고 도서관·생활체육시설·공영주차장 접근성이 철도로 차단돼 불리하다고 진단한다. 황촌나들이길은 '동해선(철도)로 단절된 지역의 주요 소통로'로서 원효로 L=350m(B=12m)를 황오리 지하차도 진출입부와 함께 정비하고 골목 2,720m(B=4~8m)를 개선한다(28.27억). 대상지 내 도로 폭은 원효로 12m(보차혼용), 원효로 169·170번길 10m, 원효로 163·178번길과 양정로 8m, 원효로 177번길·양정로 130번길 6m다.","values":"원효로 350m/12m; 골목 2,720m/4~8m; 나들이길 28.27억원","note":"기존 동서 연결은 원효로(황오리 지하차도) 등 소수. 나들이길 사업을 '글로벌문화로'와 연결동선으로 잇는다는 문장은 A-007 p.146.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_CROSS","P_PED","P_LANE","PLA20"]},{"fid":"K2-042","doc":"A-007","doc_title":"경주시 도시재생활성화계획(일반근린형) 일상이 여행이 되는 마을, 행복 황촌 (2025.12 변경판)","loc":"Ⅱ-1-3 도시기반시설 현황 인쇄 30쪽, Ⅱ-1 도로 현황 인쇄 40쪽 (PDF 34·44)","page":"30","kind":"fact","topic":"원화로(국도 7호선, B=30m) — 남북 간선과 동서 접속 가로","text":"원화로(국도 7호선, B=30m)는 황오동 팔우정삼거리에서 용강네거리까지 성동동·동천동·황성동을 지나는 남북 간선이고 원효로·봉황로·화랑로·백률사길·유림로·구황로와 국도 4호선의 월성로·태종로, 925번 지방도 용담로에 접속한다. 경주역은 대상지(황오1)에서 서측 약 300m이며 대로2류·중로1류와 인접한다.","values":"원화로 B=30m; 경주역까지 약 300m","note":"남북 종축(원화로)과 동서 접속 가로(화랑로·원효로·태종로)의 기존 체계 — 부지 서측 경계 접속 조건으로 쓸 수 있으나 원화로 위치 서술(황오1의 '서측'이면서 경주역은 그 서쪽 300m)이 모호해 도면 확인 필요.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_AXIS","P_LANE","P_CROSS","PLA20"]},{"fid":"K2-043","doc":"A-007","doc_title":"경주시 도시재생활성화계획(일반근린형) 일상이 여행이 되는 마을, 행복 황촌 (2025.12 변경판)","loc":"Ⅱ-1 지역자산 인쇄 56·58쪽, Ⅱ-4 잠재력 인쇄 87~88쪽 (PDF 60·62·91~92)","page":"56","kind":"fact","topic":"경주역과 함께 조성된 근대 철도관사 7개소·목조 전봇대","text":"대상지(황오1)에는 일제강점기 경주역과 함께 조성된 관사 7개소와 목조 전봇대 등 근대문화유산이 남아 있고 이를 근대문화자산 활용 사업의 소재로 거론한다. 인근 공공기관으로 한국철도공사 경주기관차승무사업소가 있다고 적는다.","values":"관사 7개소; 목조 전봇대","note":"B-ref1은 관사촌을 해방 전 80여 호·약 7할 현존으로 적어 규모가 다르고, B-007은 철도관사가 숙소·카페로 전환된 사례를 보여준다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_STN","P_CULT","P_FORM","D_RAILHERIT","PLA20"]},{"fid":"K2-044","doc":"A-007","doc_title":"경주시 도시재생활성화계획(일반근린형) 일상이 여행이 되는 마을, 행복 황촌 (2025.12 변경판)","loc":"Ⅱ-4 쇠퇴양상 인쇄 79·83쪽 (PDF 83·87)","page":"83","kind":"fact","topic":"황오1지구 인구·주거 노후 — 노령화지수 530.4","text":"황오동 인구는 2009년 9,553명에서 2018년 7,204명(−24.59%)으로 줄고 노령화지수는 530.4(시 189.7), 기초생활수급자는 6.6%(시 3.6%)이며, 대상지 건축물은 20년↑ 95.2%(665동), 일반목구조 24.5%, 단독·공동주택 60.0%(419동), 공·폐가 11동(1.5%), 빈 점포 5동(0.6%)이다.","values":"노령화지수 530.4; 기초수급 6.6%; 20년↑ 95.2%(665동); 공폐가 1.5%","note":"","tier
