"conf":0.5,"conf_txt":"추정","relation":"","nodes":["P_USE","P_TWOAX","P417_SURVEY"]},{"fid":"K3b-001","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅳ 지표조사 결과 · 슬라이드 22(PDF 22)","page":"22","kind":"constraint","topic":"시굴조사 필요 면적(유존지역)","text":"2022년 지표조사에서 조사지역 148,770㎡ 가운데 이미 조사된 구역을 뺀 145,879㎡(성동동 유물산포지 104,997㎡ + 성동동사지Ⅱ 40,882㎡)가 시굴조사 대상으로 판정됐다. 철도·건물 조성 당시 지하 매장유산이 훼손됐을 가능성은 낮다고 본다.","values":"148,770㎡ → 145,879㎡ (= 104,997 + 40,882); 제외 2,891㎡; 기조사 540+2,331+525 = 3,396㎡; 성동동사지Ⅱ 전체 63,450㎡ 중 40,882㎡","note":"전수리스트 §8.1과 중복 — 쪽 번호만 확인. 제외분 2,891㎡와 기조사 3,396㎡의 차(505㎡)는 발표자료에 설명이 없다. 근거인 2022 지표조사는 현장조사 1.5일(슬라이드 13)의 지표 관찰이라 '유존 가능성' 판단이며 시굴 결과 전까지 확정이 아니다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_DIG","P_PHASE","P_LOT","D_SURVEY"]},{"fid":"K3b-002","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅳ 지표조사 · 슬라이드 15(결과서 이미지)·17(구역 지도)(PDF 15·17)","page":"15","kind":"fact","topic":"지표조사 종합의견과 조사구역(1·2·3구역)","text":"지표조사는 부지를 3구역으로 나눠 진행했다: 1구역은 사지Ⅱ 북편(북쪽 선로·차량 정비고·기관차 승무사업소), 2구역은 대합실·역 광장·주차장·플랫폼·창고와 남쪽 황오동 지하도 앞 선로·공터, 3구역은 사지Ⅱ 분포지 일대(폐선로·테니스장·주차장·코레일 사무실)이다. 공터·선로 사이·텃밭에서 토기·기와·자기편이 다량 확인되고 경계 50m 이내에 통일신라 주변 유적이 많으며 건물 조성 때 훼손됐을 가능성이 낮아 유적이 남아 있을 가능성이 크다고 종합했다.","values":"1·2·3구역; 조사지역 경계 50m 이내 통일신라 주변유적 다수; 현장조사 1.5일","note":"결과서 본문은 슬라이드 15 이미지를 확대 판독. 2구역(역 대합실·광장 포함)도 시굴 필요 범위에 속하므로 구 역사 주변 굴착은 존치 여부와 별개로 조사 선행 대상으로 읽힌다(해석).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_DIG","P_STN","P_LOT","D_SURVEY"]},{"fid":"K3b-003","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅳ 지표조사 · 슬라이드 14·19–21(PDF 14·19–21)","page":"14","kind":"fact","topic":"부지 내 유적 4곳·주변 40개소·기조사 3건","text":"지표조사는 부지 안 유적으로 ①성동동 118번지(경주차량분소·일제 기관차 검수고 부지; 통일신라 건물지 1동·우물 1·수혈 2·석열 1), ②성동동 대구기관차승무분소 휴게실 부지(통일신라 주혈 6기), ③성동동사지Ⅱ(경주역 철로·기관차사무소 자리), ④황오동 삼층석탑을 꼽고 반경 1km 안 주요 유적을 40개소로 센다. 2002~2004년의 기조사 3건(정밀발굴 540㎡·시굴 2,331㎡·정밀발굴 525㎡)에서도 통일신라 건물지·적심석·우물이 나왔다.","values":"부지 내 4개소; 반경 1km 40개소; 기조사: 2002.8~10 정밀 540㎡(성동동 114), 2003.10 시굴 2,331㎡(117·118; 적심석군 4·수혈 1·석열 1), 2004.2~4 정밀 525㎡(118; 건물지 1·우물 1·수혈 2·석열 1; 토기 1점·와전 7점)","note":"기조사 위치(성동동 114·117·118)는 슬라이드 17 지도상 부지 북부 동측 차량분소 일대로 판독된다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_DIG","P_PAGODA","P_LOT","D_SURVEY","D_HERITPTS"]},{"fid":"K3b-004","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅳ 지표조사 · 슬라이드 14, Ⅲ 슬라이드 10(PDF 14·10)","page":"14","kind":"fact","topic":"황오동 삼층석탑의 위치·내력","text":"황오동 삼층석탑은 경주역 앞 광장 북쪽에 있는 통일신라 말기 양식의 석탑(도지정 문화유산자료)이며, 1936년 역이 현 위치로 옮겨질 때 남산 장창곡 사자사지의 탑재를 옮겨 복원한 것이다. 석등대좌 2·비개 2·배례석 1(안상)·주춧돌 16기가 함께 남아 있다고 한다.","values":"석등대좌 2기·비개 2기·배례석 1기·주춧돌 16기; 도지정 문화유산자료; 현상변경 허용기준 3구역의 기준 문화재(슬라이드 10)","note":"'조사대상지 내 유적'(슬라이드 13). 현 위치가 원 위치가 아니라 1936년 역 이전 때 옮겨 복원된 것이라는 서술이 발표자료에 있다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_PAGODA","P_STN","P_OPEN","D_HERITPTS"]},{"fid":"K3b-005","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅰ·Ⅱ 조사 유형 · 슬라이드 5–7(PDF 5–7)","page":"7","kind":"standard","topic":"조사 유형별 발굴 범위(정밀·시굴·표본)","text":"매장유산 보존조치는 현상보존, 정밀발굴(유존지역 전체), 시굴(유존지역의 10% 이하 발굴), 표본조사(2% 이하)로 나뉜다. 지표조사에서 유물이 확인되고 원지형이 남았거나 다른 근거가 복합되면 시굴, 매장 가능성이 확정적이고 범위가 명확하면 정밀발굴, 현지보존유적이거나 위원 3인 이상이 필요성을 인정하면 현상보존이다.","values":"시굴 ≤ 유존지역 10%, 표본 ≤ 2%, 정밀 100%; 별표3 근거 ①유물 ②주변 유적 ③기존 유존지역 ④입지 ⑤원지형 ⑥기타","note":"B-003 슬라이드 6의 '시굴 = 대상지 10% 이내 → 트렌치 약 5,900㎡'가 같은 규칙(58,381㎡×10%)이다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_DIG","P_COST","L_BURIED"]},{"fid":"K3b-006","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅱ 조사 유형 · 슬라이드 8(PDF 8)","page":"8","kind":"constraint","topic":"발굴 유예·시굴 유예·참관조사 기준","text":"‘2m 미만의 경미한 성토’는 표본·시굴조사까지 유예될 수 있으나 고분 등 지하 유구에 영향을 줄 우려가 있으면 발굴한다. ‘성토 후 공원 조성 또는 주차장 시설’, 지하 구조물이 없는 가설건축물, 1년 이내 단기 성토는 발굴조사 유예 대상이지만 표본·시굴 단계는 거쳐야 하며, 임시공작물·관로매설·전주 설치 같은 지표 형질변경은 참관조사 후 발굴 여부를 판단한다.","values":"표본·시굴 유예: 2m 미만 성토(단 지하유구 우려 시 발굴); 발굴 유예(표본·시굴은 실시): 성토 후 공원·주차장, 지하구조물 없는 가설건축물(건축법 시행령 제15조), 1년 내 단기 성토; 참관조사: 임시공작물·관로매설·전주 설치","note":"전수리스트 §8.1의 '2m 미만 성토 + 성토 후 공원·주차장'은 원문에서 서로 다른 칸의 조건이다(2m 미만 = 표본·시굴 유예 / 성토 후 공원·주차장 = 발굴 유예). 관로(오수·우수·전력) 매설은 참관조사 대상이다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_DIG","P_OPEN","P_PARK","P_PHASE","P_SEWER","L_BURIED"]},{"fid":"K3b-007","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅱ 조사 유형 · 슬라이드 8 하단(PDF 8)","page":"8","kind":"gap","topic":"‘구경주역 부지는 해당사항 없음’ 표기의 범위","text":"슬라이드 8 하단은 ‘기준 적용 대상 이외의 경우 발굴조사 실시’ 뒤에 구경주역 부지를 ‘해당사항 없음’으로 적었다. 부지가 위 유예·제외 기준표의 적용 대상(기준 외 사례가 아님)이라는 뜻으로 읽히지만, 부지의 어느 구역에 어느 칸이 적용되는지는 발표자료에 없다.","values":"—","note":"문구 해석은 추정이다('예외 기준이 부지에 적용되지 않는다'로도 읽힐 수 있음). 1단계 배치가 유예 기준에 의존하기 전에 국가유산청·발표자에게 서면 확인 필요.","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"limits","nodes":["P_DIG","P_PHASE","L_BURIED"]},{"fid":"K3b-008","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅴ 제언 · 슬라이드 24–25, 29(PDF 24·25·29)","page":"24","kind":"standard","topic":"시굴·정밀발굴 비용과 기간","text":"145,879㎡ 기준(평지·조사조건 양호) 시굴은 306,273,000원·현장 54일, 정밀발굴은 6,320,204,000원·현장 633일로 산출됐고, 보정계수와 단계적 조사를 반영하면 63~80억 원·630~700일을 예상한다. 단계적 조사 시 비용과 일수가 늘어난다.","values":"시굴 소계 278,430,000 + VAT 27,843,000 = 306,273,000원(직접인건비 59,717,710·직접경비 125,407,191·제경비 62,703,596[인건비의 105%]·학술료 30,605,327); 정밀 소계 5,745,640,000 + VAT 574,564,000 = 6,320,204,000원(직접인건비 1,181,624,112·직접경비 2,717,735,458·제경비 1,240,705,318·학술료 605,582,358); 63~80억 원/630~700일","note":"전수리스트 §8.1과 중복(쪽 번호 확인). 원단위(파생): 시굴 약 2,100원/㎡, 정밀발굴 약 4.3만~5.5만원/㎡. 비교 사례(슬라이드 29): 경주 화천리 83,780㎡ 약 30억 원·6개 기관 공개입찰(약 3.6만원/㎡), 전주탄소소재 산단 371,643㎡ 약 87억 원·5개 기관(약 2.3만원/㎡) — 연합발굴팀 구성을 기간·비용 단축 수단으로 제시하나 단축 수치는 없다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_COST","P_PHASE","D_SURVEY"]},{"fid":"K3b-009","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅴ 제언 · 슬라이드 26(PDF 26)","page":"26","kind":"direction","topic":"일괄 조사 vs 지구별 단계 조사","text":"전체를 일괄 조사하면 매장유산 현황을 한꺼번에 파악하고 비용·기간이 줄지만 대상지 토지 매입이 끝나야 가능해 현실성이 의문이다. 지구별 단계 조사는 토지 매입·사업 진행에 맞춰 연차로 조사할 수 있으나 비용·기간이 늘고 지구별 결과가 전체 사업계획에 차질을 줄 수 있다.","values":"—","note":"B-003이 택한 1단계 시굴(철도공단·코레일 보유지 58,381㎡)이 후자(단계 조사)에 해당한다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","P_COST","D_SURVEY"]},{"fid":"K3b-010","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅴ 제언 · 슬라이드 27–28(PDF 27·28)","page":"27","kind":"direction","topic":"보존조치 시나리오·예측가능성 연구용역 제언","text":"시굴·발굴 뒤 보존조치는 기록보존(사업 진행)·유구 이전복원·유적 현상보존으로 갈리고 유적의 성격·중요도·밀집도에 따라 달라지므로 조치별 시나리오를 미리 세워야 하며, 신라왕경의 방·전랑지(북궁 추정)·도로 구조와 부지의 관련성을 보는 ‘매장유산 예측가능성 연구용역(가제)’과 전담 인력 배치를 제안한다. 기록보존되는 중요 유적이나 현상보존 구역은 ‘구경주역 전시관·복합문화관’ 콘텐츠로 쓰고 시립박물관은 전시관·문화관보다 과감한 보존·활용 계획을 요구한다.","values":"사례: LH 광주산정 공공주택지구 기초연구(2024), 충주 바이오헬스 국가산단 고고역사 기초연구(2025)","note":"발표자료는 신라왕경 방·도로 구조를 가구·가로 위치 결정과 직접 연결하지는 않고 '관련성 검토'만 말한다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_CULT","P_STN","P_DIG","P_LOT","P_PHASE","P_OPS","D_SURVEY"]},{"fid":"K3b-011","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅰ 관련 법령 · 슬라이드 3(PDF 3)","page":"3","kind":"constraint","topic":"국가유산영향진단법 제9조의 적용 제외","text":"개발공사는 사업계획 수립 완료 전에 국가유산 영향진단을 받아야 하지만(국가유산영향진단법 제9조, 2025.2.14.), 매장유산 유존지역과 지자체장이 문화유산지표조사를 실시한 지역은 제외된다고 정리했다.","values":"—","note":"구경주역은 2022 지표조사를 마친 지역이라 제외 대상으로 보이나(추정) 발표자료가 부지 적용 여부를 직접 말하지는 않는다. ICOMOS HIA 요구는 별개(전수리스트 §6).","tier":"T2","conf":0.5,"conf_txt":"추정","relation":"sequences","nodes":["P_PHASE","L_HIA"]},{"fid":"K3b-012","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅲ 문화유산 현황 · 슬라이드 10·12(PDF 10·12; 표는 슬라이드 12 이미지)","page":"12","kind":"constraint","topic":"현상변경 허용기준 3구역과 구역별 높이","text":"현상변경 허용기준 3구역은 사업 대상지의 약 2/3에 해당하고, 슬라이드 표는 3구역을 ‘경주시 도시계획 조례 등 관련 법률에 따라 처리’로 두면서 조건 ⑤에 한해 건축물 최고높이 평슬라브 8m 이하·경사지붕 12m 이하를 적었다. 조건 ①~⑤의 정의는 슬라이드에 없다.","values":"3구역: 조례 등 처리 + ⑤ 평슬라브 ≤8m / 경사지붕 ≤12m; 비교: 2-1구역 5m/7.5m(④ 개별검토/12m), 2-2구역 개별검토/12m(전통한옥)·①②③ 8m/12m·④ 20m, 2-3구역 개별검토/12m·①②③ 11m/15m, 2-4·2-5구역 15m, 4구역 개별심의/12m, 1구역 개별검토, 5구역 조례 처리","note":"이 표는 슬라이드 12의 이미지로만 있어 텍스트 추출에 잡히지 않는다. 전수리스트 §3의 '구역별 허용 높이 원문 미확인'을 부분 해소하나 ⑤의 적용 대상은 불명 — 국가유산청 고시 원문 필요. 소지도에서 3구역은 (구)경주역 일대의 원형 구역으로 보인다(추정). 고도지구 20m가 허용기준 '수용값'이라는 2020-479 변경사유(전수리스트 §3)와의 관계도 확인해야 한다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FORM","P_PAGODA","L_HIST"]},{"fid":"K3b-013","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅳ 지표조사 · 슬라이드 13(PDF 13)","page":"13","kind":"fact","topic":"부지 주변 지정유산까지의 거리","text":"지표조사가 든 주변 지정유산과의 거리는 사적 제512호 경주 대릉원 일원 127m, 시도지정 경주부관아건물 152m, 사적 제17호 남고루 187m, 사적 제88호 전랑지 205m, 사적 제96호 경주읍성 325m, 동경관 445m, 사적 제18호 동궁과 월지 840m, 보물 제68호 정려비 912m이다. 황오동 삼층석탑·성동동사지Ⅱ·성동동 118번지 유적은 조사대상지 안에 있다.","values":"127·152·187·205·325·445·840·912 m","note":"발표자료는 거리만 제시하며 역사문화환경 보존지역 반경(예: 500m) 적용 여부는 말하지 않는다. 500m 이내인 곳은 대릉원·부관아·남고루·전랑지·경주읍성·동경관 6곳이다(파생).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_H","P_FORM","P_PAGODA","P_AXIS","D_HERITPTS"]},{"fid":"K3b-014","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅴ 제언 · 슬라이드 23 우측 도면·표(PDF 23)","page":"23","kind":"fact","topic":"시 구상 1단계 토지이용 구성(79,438㎡)","text":"경주시 도시재생혁신지구(1단계) 토지이용 구상표는 합계 79,438㎡를 준주거용지 20,262㎡(25.5%), 상업용지 17,819㎡(22.4%), 문화시설용지 12,260㎡(15.4%), 공공시설 29,097㎡(36.7%; 도로 19,643㎡ + 공원 9,454㎡)로 나눈다.","values":"79,438 = 20,262 + 17,819 + 12,260 + 29,097 (도로 19,643 + 공원 9,454)","note":"표에 공공청사 행이 없다. 도면은 블루 점선(혁신지구 1단계)과 레드 점선(민자유치 2단계)을 구분하며 공공청사 2개소·복합문화공간이 2단계 쪽에 그려져 이 표 밖일 가능성이 있다(추정). 고시 2026-8호는 주거용지가 없는데 시 구상은 준주거 25.5%를 둔다 — 두 안의 주거 취급이 다르다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_USE","P_HOUSE","P_RETAIL","P_CULT","P_OPEN","P_BND","PLP_CONCEPT"]},{"fid":"K3b-015","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅴ 제언 · 슬라이드 23 우측 도면(PDF 23)","page":"23","kind":"fact","topic":"시 구상의 단계·우선순위(공공청사·시청이전)","text":"시 구상 도면은 공공청사 2개소를 ‘1순위: 타당성조사 용역 발주’, 복합문화공간을 ‘2순위: 민자유치’로 표시하고, 레드 점선 구역을 ‘민자유치(2단계 — 시청이전 계획 포함)’, 블루 점선 구역을 ‘도시재생혁신지구(1단계)’로 구분한다.","values":"공공청사 1순위(타당성조사 용역); 복합문화공간 2순위(민자유치); 2단계에 시청이전 계획 포함","note":"시청 이전은 시 구상에서 2단계·민자유치 영역에 속해 혁신지구(국비) 1단계 밖으로 읽힌다(추정). 공모 가이드라인상 공공청사는 국비 대상에서 제외된다(B-004 p.14).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_HALL","P_PHASE","P_COST","PLP_CONCEPT"]},{"fid":"K3b-016","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅴ 제언 · 슬라이드 23 우측 도면(PDF 23)","page":"23","kind":"fact","topic":"시 구상의 구 역사 이전·화랑로 연결·모빌리티 허브 배치","text":"시 구상 도면은 화랑로를 ‘화랑로 연결’로 부지를 동서로 가로지르게 표시하고, 그 남쪽에 ‘2-1 미래모빌리티 통합허브(자율주행 셔틀 기반)’와 ‘1-2 경주역사 이전’ 용지를 두며, 화랑로 북쪽에는 1-1 K-헤리티지센터·1-2 헤리티지힐링파크·3-1 경주Stay①(청년오피스복합타운), 남단에는 3-2 경주Stay②(상업·숙박타운)를 둔다.","values":"추진전략 1(K-헤리티지 복합거점: 센터·힐링파크·국제관광안내/행정서비스), 2(미래모빌리티 통합허브: 자율주행 셔틀·AI 교통관제·통합 데이터), 3(경주Stay: 청년오피스복합타운·상업숙박타운·K-F&C마켓)","note":"'경주역사 이전' 표기는 경관계획의 '보전·활용'(A-009 본책 p.224·242)과 상충한다(충돌 항목 참조). 도면·전략 목록에 트램 언급은 없고 모빌리티 허브는 셔틀 기반으로 적혀 있다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_STN","P_CROSS","P_TRAMHUB","P_STAY","P_HOUSE","PLP_CONCEPT"]},{"fid":"K3b-017","doc":"B-002","doc_title":"김권일(신라문화유산연구원) 「구경주역 매장유산 현황 및 도시재생 관련 제언」, 2026.2.27 도시재생 국가시범지구 혁신포럼 발표자료(30쪽)","loc":"04 김권일 학예연구실장_발표자료…pdf · Ⅲ 문화유산 현황 · 슬라이드 11 소유자별 현황표(PDF 11)","page":"11","kind":"fact","topic":"79,438㎡ 구상 범위의 소유 현황","text":"시 구상 범위 79,438㎡(102필지)는 국유지 71필지 56,001㎡(70.5%), 사유지 29필지 23,412㎡(29.5%), 공유지 2필지 25㎡로 구성된다. 소유 현황도에서 사유지(적색)는 서측 중부 띠와 동쪽 돌출부 부근에 모여 있다.","values":"국유 56,001㎡(71필지) · 사유 23,412㎡(29필지) · 공유 25㎡(2필지) = 79,438㎡(102필지)","note":"혁신지구는 토지 수용 불가·시행자의 전체 권원 확보가 요건(B-004 p.4–5)이므로 사유지 23,412㎡는 협의매수·조건부매매 대상이다. 국유지 안에서 국가철도공단·한국철도공사 보유분은 이 표에 구분되지 않는다(B-003 p.7이 시굴 1단계에서만 구분). 소유 현황도의 79,438㎡ 경계는 남북 띠에 동쪽으로 뻗은 좁은 돌출부가 붙은 형상이며, 이 돌출부는 시 구상 도면의 '화랑로 연결' 가로와 위치가 맞는 것으로 보인다(판독·추정).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_BND","P_COST","P_PHASE","PLP_CONCEPT","D_OWNER"]},{"fid":"K3b-018","doc":"B-003","doc_title":"경주시 「구)경주역 일원 매장유산 시굴조사 추진계획」(7쪽)","loc":"구경주역 일원 시굴조사 계획.pdf · 사업개요·필요성 · PDF쪽 1–2(인쇄쪽 번호 없음)","page":"1","kind":"fact","topic":"시굴계획서의 사업 개요·기간·필요성","text":"시굴조사 추진계획서는 사업명을 ‘경주시 도시재생혁신지구(국토부 공모사업)’, 소재지를 황오동 169-2번지 일원(구 경주역 폐철도 부지), 면적을 156,460㎡, 사업기간을 2027.6~2032.6(5년)으로 적고 기간·사업비 등은 협의 과정에서 변경될 수 있다고 단서를 단다. 필요성은 관광거점 간 연계 부족과 폐역에 따른 원도심 유동인구 감소·상권 위축이다.","values":"156,460㎡; 2027.6~2032.6(5년간)","note":"전수리스트 §8.1과 중복(쪽 번호 확인). 156,460㎡는 고시 2026-8호 구역이며 시 구상 표(B-002 슬라이드 23)의 79,438㎡와 다르다. 5년 안에 시굴(54일)과 정밀발굴(현장 630~700일)이 들어가야 한다는 점이 일정 제약이다(파생).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","P_BND","P_COST","D_DIGPLAN"]},{"fid":"K3b-019","doc":"B-003","doc_title":"경주시 「구)경주역 일원 매장유산 시굴조사 추진계획」(7쪽)","loc":"구경주역 일원 시굴조사 계획.pdf · 비전·추진전략 · PDF쪽 2–3","page":"3","kind":"direction","topic":"사업 방향과 추진전략 3개","text":"사업 방향은 초기 혁신지구 제도로 공공주도 개발계획을 마련하고 기업이 참여하는 기능을 유치하는 것이며, 추진전략은 ①역사·문화·관광의 K-헤리티지 복합거점 조성, ②미래모빌리티 통합허브 구축, ③경주Stay 청년 랜드마크 조성이다. 문제의식으로 청년 유출·문화재로 인한 지역발전 한계·재원 확보를 든다.","values":"전략 1·2·3","note":"전략 3은 '청년 랜드마크'(오피스·Stay)로 적혀 있고 거주 세대 공급 수치는 이 문서에 없다.","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_USE","P_HOUSE","P_TRAMHUB","P_CULT","P_STAY","D_DIGPLAN"]},{"fid":"K3b-020","doc":"B-003","doc_title":"경주시 「구)경주역 일원 매장유산 시굴조사 추진계획」(7쪽)","loc":"구경주역 일원 시굴조사 계획.pdf · 지장물 현황 및 시굴조사 · PDF쪽 5–7","page":"6","kind":"constraint","topic":"1단계 시굴 범위(지장물 외)·소유자·지장물","text":"1단계 시굴은 약 58,381㎡이며 지장물을 철거하지 않고 시행하되 선로 등은 임시 적치하고(지도의 ‘지장물 외 시·발굴 조사지역’), 대상지 10% 이내이므로 실제 트렌치는 약 5,900㎡이다. 58,381㎡의 소유는 국가철도공단 43,886㎡·한국철도공사 14,495㎡이며 조사기관 검토 후 시굴 세부내역을 다시 협의하고, 사업지 안 지장물은 건축물을 포함해 16개 이상이며 주요 건축물은 준공 30년 이상으로 노후하다.","values":"58,381㎡ = 43,886 + 14,495; 트렌치 ≈ 5,900㎡; 지장물 ≥ 16","note":"지장물 16종(p.5): 정비플랫폼(상부 차양)·기존 선로(비사용)·구경주역 본관·승강장 및 인접 건축물·부속 건축물·철차량 정비고 추정 건물·코레일 관사(3층 추정)·코레일 건물(2층)·사용 중 주차장·기계설비 구조물·관리시설·전통양식 건축물·철도 부속시설. 지도(p.6) 판독상 노란 시굴 범위는 중앙 선로대 위주이고 서측 띠의 구 역사 본관·전면 광장(삼층석탑 일대 포함)·플랫폼 건물 자리와 동측 수림·관사 구간은 제외돼 구 역사 하부 조사는 1단계에 없는 것으로 보인다(추정).","tier":"T2","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_DIG","P_PHASE","P_STN","P_LOT","P_COST","D_DIGPLAN"]},{"fid":"K3b-021","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 4.5 중점경관관리구역 계획 · 인쇄쪽 p.236–237(PDF 241–242)","page":"236","kind":"fact","topic":"중점경관관리구역: ‘행정복합타운’ → ‘황오동’ 구역으로 확장","text":"2025 기본경관계획의 ‘행정복합타운’ 중점경관관리구역(성동동 40 일원 45.51ha)은 2030 재정비에서 폐 경주역에 연접한 ‘경주역 동편 도시재생사업’ 구역과 주변 노후·불량 주거지를 포함해 ‘황오동’ 중점경관관리구역(황오동 169-2 일원 90.18ha)으로 확장됐다. 성동시장·황리단길·경주읍성은 별도의 ‘구시가지’ 구역(229.41ha)에 속한다.","values":"행정복합타운 45.51ha → 황오동 90.18ha(성동동·황오동·인왕동·구황동); 구시가지 229.41ha(버스터미널 31.17 + 경주읍성 70.14 결합·확장)","note":"구경주역 부지는 '행정복합타운'이라는 이름의 구역에서 '황오동' 구역으로 이름·범위가 바뀐 상태다. 구시가지 구역 계획도(p.240)에서 원화로가 구시가지 구역의 동쪽 경계로 그려져 부지와 성동시장 사이에서 두 구역이 맞닿는 것으로 판독된다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_BND","P_FORM","P_H","PLL_ZONE"]},{"fid":"K3b-022","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 1.2–1.3 구성·체계 · 인쇄쪽 p.5–6(PDF 10–11); 2.3.1 p.193(PDF 198); 2.4.1 p.220(PDF 225)","page":"5","kind":"constraint","topic":"경관가이드라인의 적용 수준과 우선순위","text":"경관가이드라인 가운데 중점경관관리구역별·경관지구별은 ‘필수’, 요소별·경관권역별은 ‘권장’ 수준이며, 충돌하면 중점경관관리구역 > 경관지구 > 경관권역 순으로 우선 적용하고 경관심의 대상은 체크리스트 자가점검 결과를 내야 한다. 가이드라인에 없는 높이·규모는 고도보존육성기본계획을, 색채·재질은 ‘경주8색 색채 가이드라인’을 따른다.","values":"적용수준: 요소별 권장 / 권역별 권장 / 중점경관관리구역별 필수 / 경관지구별 필수","note":"부지는 황오동 중점경관관리구역(필수)과 핵심 신라왕경 zone(권장)에 동시에 걸리므로 충돌 시 황오동 가이드가 우선한다. 경관가이드라인이 고도지구 같은 법정 용도지구와 충돌할 때의 우선순위는 문서에 없다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FORM","P_PHASE","PLL_GUIDE"]},{"fid":"K3b-023","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.3.3.2 황오동 중점경관관리구역 · 인쇄쪽 p.201(PDF 206)","page":"201","kind":"standard","topic":"황오동 구역 건축물 높이·이격 기준","text":"황오동 중점경관관리구역 가이드라인(필수)은 도로와 인접한 건축물의 최대 높이를 3층(15m 이하)으로 제한하고 역사적 자원에 가까울수록 더 낮추라고 하며, 폐 경주역 주변은 복합 플랫폼을 이루되 주요 건축물 높이를 경관을 방해하지 않게 조정하라고 한다. 도로변 건축물은 도로에서 1m 이상 이격해 전면공간을 녹지·화단으로 만들고, 체크리스트는 조례 높이 제한 준수와 통경축을 고려한 배치를 묻는다.","values":"도로 인접 건축물 ≤ 3층·15m; 도로 이격 ≥ 1m","note":"고도지구 20m·현상변경 허용기준과 별개의 겹이며 도로 인접 건축물에 한해 15m다. '모든 도로'인지 '주요 도로'인지 원문은 구분하지 않는다. 이격 항목은 원문 소제목이 '옥외광고물 및 간판 관리' 아래에 들어 있어 편집 오류로 보인다(내용은 이격 배치).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FORM","P_CROSS","PLL_ZONE"]},{"fid":"K3b-024","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.3.3.2 황오동 구역 p.201–202(PDF 206–207); 본책 p.242 D5(PDF 247), p.293(PDF 298)","page":"201","kind":"standard","topic":"황오동 구역 색채·재질·야간 조명","text":"폐 경주역사 주변 건물은 갈색·회색 계열 전통색으로 마감하고 외벽은 자연석·벽돌을 쓰며 인접 건축물은 유사한 주조색으로 연속성을 만든다. 야간 조명은 주거지 빛공해를 막는 저조도로 하되 폐 경주역과 원화로 인근 도로는 저조도 주황색 LED로 안전한 보행 환경을 만들고 광고물 조명은 과도하지 않게 하며 인접 건축물 간 방식을 맞춘다.","values":"색채: 갈색·회색 계열, 외벽 자연석·벽돌; 조명: 저조도, 주황색 LED(폐 경주역·원화로 인근)","note":"본책 p.293의 황오동 지구단위계획구역 제안(안)이 같은 내용을 반복한다. 시가지경관지구 쪽은 광고 조명 자정 이후 점등 제한 또는 200cd 이하, 공원·광장 LED 500cd 이하(별책 p.229).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_FORM","PLL_GUIDE","PLL_ZONE"]},{"fid":"K3b-025","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.3.3.1–2 황오동 구역 p.200, 203(PDF 205, 208)","page":"203","kind":"standard","topic":"황오동 구역 공공공간·녹지·보행","text":"황오동 구역 가이드라인은 원화로·알천남로 도로변에 가로수를 배치하고 폐 경주역 전면에 공공녹지를 조성해 광장·휴식 공간을 확보하라고 하며 체크리스트로 공원·광장 등 공공공간의 녹시율 30% 이상을 묻는다. 주거 밀집 구역에는 보행자 전용(우선) 도로를 두라고 권장한다.","values":"공공공간 녹시율 ≥ 30%(체크리스트 문항)","note":"'녹시율'(시각 녹지량)을 면적 비율로 환산하는 기준은 문서에 없다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_OPEN","P_PED","PLL_ZONE"]},{"fid":"K3b-026","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 4.3.6 중심 시가지 통경축 · 인쇄쪽 p.204, 206(PDF 209, 211); 4.5.6 p.243(PDF 248); 기정 평가 p.50(PDF 55)","page":"206","kind":"constraint","topic":"화랑로 통경축 — 폐 경주역 부지 개발 시 반드시 반영","text":"중심 시가지 통경축 중 화랑로는 폐 경주역 부지에서 개발사업이 진행될 때 랜드마크로서의 상징성을 고려한 스카이라인을 계획하되 통경축을 반드시 반영하도록 한다. 통경축은 건축물 높이 규제보다 기존 가로의 특성을 살려 가로 중심으로 설정하고 신규 개발사업은 통경축을 반영해야 하며, 황오동 구역 계획도는 부지를 동서로 가로지르는 통경축을 북부(D1 복합플랫폼 부근)와 역사 앞(P1 부근) 두 곳에 표시한다.","values":"통경축 2개소(계획도 표시); 화랑로 통경축 세부 계획","note":"통경축의 폭·정확한 좌표는 없다(도면 표기뿐). 2025 기정계획에서도 같은 항목이 '계획 지속 필요(사업계획 단계)'로 남았다(p.50). 황오동 가이드라인 체크리스트도 통경축 고려 배치를 묻는다(별책 p.201).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_CROSS","P_PED","P_H","P_AXIS","PLL_AXIS"]},{"fid":"K3b-027","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 4.2.2 중심문화 경관권역 · 인쇄쪽 p.157(PDF 162); p.32(PDF 37); p.154(PDF 159); p.224(PDF 229)","page":"157","kind":"constraint","topic":"화랑로 등 주요 가로에서 산악 조망을 확보하는 스카이라인","text":"경주역 폐철도부지 개발에서 신축되는 건축물은 화랑로 등 주요 가로에서 산악으로의 조망이 확보되도록 스카이라인을 계획한다. 핵심 신라왕경 zone 구시가지 지침도 역사 자원이 돋보이도록 장대한 규모의 건축물을 지양하고 역사 자원을 배려하는 스카이라인·통경축을 요구한다.","values":"—(수치 없음)","note":"산악 조망의 대상 산·시점·가시 범위·수치 기준이 없다. p.157 항목은 '역사문화 zone' 소제목 아래에 실려 있어 zone 귀속이 모호하다(구시가지 항목은 p.154 핵심 신라왕경 zone). 2025 기정계획 평가표에서 '반영 ○'로 표시된 항목이다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FORM","P_CROSS","PLL_AXIS"]},{"fid":"K3b-028","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 4.3.2 역사조망축 · 인쇄쪽 p.187–190(PDF 192–195); 4.5.6 p.241(PDF 246)","page":"188","kind":"constraint","topic":"역사조망축(신라옛길 조망축 = 양정로)","text":"2030 재정비는 역사조망축을 신규 경관축으로 두어 옛 월성에서 북천으로 열린 경관을 가졌던 통경축(현 양정로)을 ‘신라옛길 조망축’, 첨성로를 ‘역사유적 조망축’으로 지정했고, 조망축 인근 건축물에는 전면공지 확보와 높이 규제·관리 방안 수립, 조망점의 조망데크·편의시설 확충을 세부 계획으로 둔다. 황오동 구역 경관구조에 역사조망축이 포함되며 구역 사진에 ‘양정로(성동리 전랑지 인근)’가 나온다.","values":"신라옛길 조망축 = 양정로; 역사유적 조망축 = 첨성로","note":"높이 수치는 없고 '방안 수립' 수준이다. 황오동 계획도(p.243)에서 역사조망축으로 보이는 갈색 양방향 화살표는 성동리전랑지 부근에서 부지 동측을 남북으로 지나는 것으로 판독되며(추정) 부지 안을 관통하는지는 불명확하다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_AXIS","P_CROSS","P_H","P_FORM","PLL_AXIS"]},{"fid":"K3b-029","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 4.3.3–4 녹지경관축·수변경관축 · 인쇄쪽 p.187, 192, 194, 198(PDF 192, 197, 199, 203); 기정 평가 p.65(PDF 70)","page":"192","kind":"direction","topic":"폐철도 녹지경관축·북천 수변축","text":"폐철도 녹지경관축은 경주시 폐철도 개발계획의 ‘계획 확정구간’에 한해 신규 추가된 세부축이며 폐선 녹지화 때 주변 식생에 맞춘 연속 경관과 도시공원 등 녹지공간 조성을 요구하고, 북천 수변경관축은 북천 주변 폐선철로를 북천 조망명소·하천탐방로로 쓰게 한다. 2025 기정계획의 ‘북천과 도심 고분공원 연결 녹지축’은 미반영으로 남았다.","values":"예시 구간: 무열왕릉~형산강철교~선덕여고~사천왕사지","note":"폐철도 녹지경관축의 예시 구간에 구경주역 구간이 확정구간으로 포함되는지는 문서에 없다(공백).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_AXIS","P_OPEN","PLL_AXIS"]},{"fid":"K3b-030","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 4.5.6 황오동 구역 계획 · 인쇄쪽 p.241–243(PDF 246–248); 4.4.5 p.222, 224(PDF 227, 229); p.220(PDF 225); 별책 p.204(PDF 209)","page":"242","kind":"direction","topic":"황오동 구역의 구 역사·광장·복합플랫폼 방향(보전·활용)","text":"황오동 구역 계획은 폐 경주역사의 상징성을 보전하면서 시민을 위한 관광자원·공공공간으로 활용하고 역사 전면 녹지를 정비해 광장으로 리노베이션하며(P1), 폐 경주역 부지에 랜드마크 상징 오픈스페이스·복합휴게공간을 둔 복합플랫폼(D1)과 통경축 확보를 요구한다. 지표적 경관거점 ‘폐 경주역 역사’는 근대문화유산으로서 보전·활용하고 역사 앞을 상징적 오픈스페이스로 만들며 폐철도 개발 기본계획과 연계하라고 하고, 이전·해체에 대한 언급은 없다.","values":"P1 역사 관광자원 활용·광장 리노베이션; D1 복합플랫폼; D2 북천~역사유적지구 가로; D3 글로벌어울림광장; M2 원화로 가로정비; 관광특화 경관거점 ‘폐선부지(폐 경주역·북천철교·금장철교)’는 상징성·활용성 있는 구간에 한해 휴게·문화공간·오픈스페이스 활용 방안 수립(p.220)","note":"이 방향은 시 구상의 '경주역사 이전'(B-002 슬라이드 23) 및 2023 폐철도 개발 기본계획안의 화랑로 연장 전제(D-ref 김성주 p.26)와 충돌한다 — 충돌 항목 참조. 기정계획 p.65는 '경주역을 보전하여 역사갤러리 등 관광자원으로 활용' 항목을 반영(○)으로 표시.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STN","P_OPEN","P_CROSS","PLL_ZONE"]},{"fid":"K3b-031","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 5.2 경관사업 · 인쇄쪽 p.257, 259, 265, 268, 271(PDF 262, 264, 270, 273, 276)","page":"268","kind":"fact","topic":"경관사업 제안과 예상 사업비(광장·화랑로·폐선철로)","text":"경관사업 제안 중 ‘경주역 역사 광장 특화 조성’은 12,000㎡(사괴석 화강석 포장·휴게시설·식재)에 1단계 50.7억 원+2단계 11.46억 원=62.16억 원, ‘폐 경주역 앞 화랑로 역사·문화 가로 개선’은 12,500㎡(화랑로 정비 1,500m 27억 원 + 폐 경주역 경관 정비 8,000㎡·전기 123.36억 원)에 150.36억 원, ‘폐선철로 활용 조망명소’는 14,438㎡에 107.29억 원으로 추정된다.","values":"광장 12,000㎡·6,216,400,000원; 화랑로 12,500㎡·15,035,600,000원; 폐선철로 14,438㎡·10,729,400,000원","note":"경관법 경관사업(예산 주체·국비 여부 불명)이며 혁신지구 국비 대상과 별개다. 12,000㎡는 경관계획이 제시한 유일한 광장 규모 수치다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_OPEN","P_CROSS","P_COST","PLL_GUIDE"]},{"fid":"K3b-032","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 5.2.3 경관사업 계획 08번 · 인쇄쪽 p.265(PDF 270)","page":"265","kind":"direction","topic":"‘폐 경주역 앞 화랑로’ 사업의 설계 방향","text":"‘폐 경주역 앞 화랑로 역사·문화 가로 개선사업’은 철도부지로 단절된 역사성을 복원하고 주변 개발과 연계한 동선을 짜며 건축물 설계 때 연속적 보행경관을 위해 저층부에 통일감 있는 입면계획을 적용하라고 한다. 황성 도시숲~북천~폐 경주역~형산강 둔치~남측 국가유산 복원 구간을 잇는 녹지축, 자생식물 가로수 특화거리, 폐 경주역 정체성 표석도 요구하며 화랑로를 경주 중심 시가지에서 가장 오래된 중심도로로 규정한다.","values":"화랑로 가로 정비 L = 1,500m","note":"","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_FORM","P_CROSS","P_AXIS","P_PED","PLL_GUIDE"]},{"fid":"K3b-033","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 5.5 지구단위계획 · 인쇄쪽 p.290–293(PDF 295–298)","page":"293","kind":"direction","topic":"지구단위계획 연계와 황오동 지구단위계획구역 제안(안)","text":"경관계획은 중점경관관리구역 5곳(구시가지·황오동 등)에 신규 지구단위계획구역 지정을 제안하며 중점경관관리구역의 경관가이드라인을 지구단위계획 세부 지침으로 반영하라고 한다. 황오동 제안(안)은 상업지역 건축물의 입구를 도로변으로 향하게 하고 건축선과 도로변 사이 이격거리를 확보하며, 폐 경주역과 인근은 도시재생과 연계한 색채 일관성, 폐 경주역 전면녹지, 원화로·알천남로 가로수, 주요 도로변 보행자전용도로를 제시한다.","values":"—","note":"'제안(안)'이며 결정된 지구단위계획이 아니다(고시 2026-8호가 기정). 신규 구역의 경계 좌표는 없고 시 전체 개관도(p.291)뿐이다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_FORM","P_LOT","P_OPEN","P_PED","PLL_GUIDE"]},{"fid":"K3b-034","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 5.6 경관운영 · 인쇄쪽 p.297–298(PDF 302–303)","page":"297","kind":"constraint","topic":"경관심의 대상과 절차","text":"경주시 경관조례(제16·20·21조) 발췌에 따르면 경관지구 안의 건축물과, 공공건축물로서 연면적 1,000㎡ 이상인 공공청사·문화·집회시설·의료·노유자·교육연구시설 등, 시 출자·출연 기관의 건축물이 경관심의 대상이다. 도시공원·광장·수변공간·사적지 주변 경관 조명시설은 사업비 1억 원 이상, 도로는 총사업비 100억 원 이상이 대상이고 신청은 사업계획서와 경관 체크리스트 자가측정 결과를 첨부해 위원회 개최 2주 전에 접수한다.","values":"공공건축물 연면적 ≥ 1,000㎡; 경관 조명시설 ≥ 1억 원; 도로(변경안은 철도시설도) 총사업비 ≥ 100억 원; 위원회 2주 전 접수","note":"'변경 경관심의 대상(안)'은 철도시설 100억 원 이상과 교통시설(터미널) 건축물을 추가하는 조례 개정 제안이라 시행 여부는 미확인. 시청·수장고·교통허브 건축물은 규정 문언상 대상에 든다(해석).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_HALL","P_CULT","P_TRAMHUB","P_PHASE","P_OPEN","L_LSCORD"]},{"fid":"K3b-035","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.4.3 시가지경관지구 · 인쇄쪽 p.227–231(PDF 232–236); 본책 p.278, 281(PDF 283, 286)","page":"228","kind":"standard","topic":"시가지경관지구(대로2-1 등) 높이·용도·조명 기준","text":"시가지경관지구 가이드라인(필수)은 주요 도로변 건축물을 최대 6층(30m 이하)으로 제한하고 상업시설은 인접 건물과 높이 차를 5m 이내로 맞추며 광고물은 가로 2m·세로 1m 이내로 한다. 경주시 도시계획조례(제1737호)는 시가지경관지구 안에서 공장·창고·위험물 저장·처리 시설·자동차 관련 시설(주차장 제외) 등의 건축을 금지한다.","values":"≤ 6층·30m; 인접 건물 높이차 ≤ 5m; 광고물 ≤ 2m×1m; 광고 조명 200cd 이하 또는 자정 이후 점등 제한; 공원·광장 LED ≤ 500cd","note":"부지에는 대로2-1 시가지경관지구가 837㎡(전수리스트 §1.2)만 걸려 영향 면적이 작고, 황오동 가이드(3층/15m)가 우선한다(별책 p.6).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_USE","PLL_GUIDE"]},{"fid":"K3b-036","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.3.3·2.4.3·2.2.2.2 · 인쇄쪽 p.201(PDF 206), p.228(PDF 233), p.154·158(PDF 159·163); 본책 p.292(PDF 297); B-002 슬라이드 12","page":"201","kind":"conflict","topic":"높이 기준의 다중 겹침(20m 고도지구 외)","text":"부지의 높이는 고도지구 20m·15m 하나로 정해지지 않는다: 황오동 가이드(필수)는 도로 인접 건축물을 3층·15m 이하, 시가지경관지구 가이드(필수)는 주요 도로변을 6층·30m 이하, 핵심 신라왕경 zone 가이드(권장)는 역사·문화자원 주변을 2층 이하로 적고, 현상변경 허용기준 3구역 표에는 조건 ⑤의 8m(평슬라브)·12m(경사지붕)가 있다. 가이드라인끼리는 중점경관관리구역 > 경관지구 > 경관권역 순으로 우선한다.","values":"고도지구 20m(145,364㎡)·15m(11,143㎡)[전수리스트]; 황오동 ≤3층·15m; 시가지경관지구 ≤6층·30m; 핵심 신라왕경 zone ≤2층(권장); 허용기준 3구역 ⑤ 8m/12m","note":"근거가 서로 다르다(고도지구=국토계획법 용도지구, 경관가이드라인=경관법 계획, 허용기준=국가유산청 기준·본 문서는 T2 발표 인용). 가이드라인과 용도지구 사이의 우선순위, '엄격한 값이 우선'인지는 문서에 없다. 3층·15m는 고도지구 20m(5층 가정)보다 엄격한 현재 유일한 T1 정량값이다. 핵심 신라왕경 zone은 경주역·월성 주변 간판도 1.5m×0.8m로 제한하고 폐 경주역 앞 광장을 상징적 오픈스페이스로 조성하라고 한다(별책 p.154·158).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_H","P_FORM","P_FAR","PLL_ZONE"]},{"fid":"K3b-037","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.1.1 건축물 · 인쇄쪽 p.28(PDF 33), p.42–45(PDF 47–50), p.48–50(PDF 53–55)","page":"42","kind":"standard","topic":"요소별 건축물 지침(상업·업무, 공공건축물, 공동주택)","text":"상업·업무 건축물은 지나치게 긴 장방형 배치를 피하고 통경축을 확보하며 1층 외벽 투시율 50% 이상, 건축선 통일, 상층부 후퇴, 외장재 3종 이내, 주차는 후면·측면 배치를 권장한다. 공공건축물은 건축선에서 최대한 이격해 전면공지를 활용하고 과도한 규모를 피하며 진입부에 광장·휴게공간을 두고 담장을 피하고 지상 주차 대신 지하·후면 주차를 유도하며, 공동주택은 산악 조망을 확보하고 단지 간 간격·도로 이격으로 개방감을 둔다.","values":"1층 외벽 투시율 ≥ 50%; 외장재 ≤ 3종; 공공건축물 지상 주차 지양(지하·후면)","note":"모두 요소별 '권장' 수준. '공공건축물 지하 주차 유도'는 매장유산 지하 제약(B-002 슬라이드 8·22)과 충돌할 수 있다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_FORM","P_LOT","P_PARK","P_HOUSE","P_RETAIL","PLL_GUIDE"]},{"fid":"K3b-038","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 별책 경관가이드라인 및 체크리스트(2025.4)","loc":"2030 경주시 경관계획_경관가이드라인 및 체크리스트.pdf · 2.1.2.7 폐철도 · 인쇄쪽 p.104–108(PDF 109–113)","page":"104","kind":"direction","topic":"폐철도 가이드라인(권장)","text":"폐철도부지 지침은 레일·구조물 일부를 남겨 철도 흔적을 보존하고 녹지화로 연속 녹지축을 만들며, 철도역과 주변을 역사박물관·철도테마전시관으로 리모델링하고 다목적 광장·주차 공간으로 쓰고 소규모 상점가·음식점·공방·플리마켓과 예술창작·전시 공간을 두라고 권장한다. 무장애 시설, 벤치·쉼터·어린이 놀이·자연학습원, 저채도 자연친화 색채와 은은한 야간 조명도 요구한다.","values":"—(수치 없음)","note":"요소별 '권장' 수준이며 수치 기준이 없다. 가로판매대는 설치 후에도 보도폭 2m 이상을 보장하라는 지침이 보행가로 편에 있다(별책 p.84).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_STN","P_RETAIL","P_CULT","P_OPEN","P_AXIS","P_PARK","PLL_GUIDE"]},{"fid":"K3b-039","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 2.4 경관자원 현황조사(폐 경주역)·4.4.7 생활경관거점·4.5.5 구시가지 구역 · 인쇄쪽 p.87–88(PDF 92–93), p.230–232(PDF 235–237), p.239(PDF 244)","page":"88","kind":"fact","topic":"성동시장·폐 경주역 현황(경관 조사)과 연계 관리","text":"폐 경주역은 철로 이설로 폐역된 뒤 ‘경주문화관 1918’로 개관했고 서측에 성동시장이 있으며 주변 상업지역은 좁은 골목과 노후 시설로 상권이 쇠퇴했고, 동측 주거지역과 서측 상업지역을 잇는 육교는 낙후됐다. 성동시장은 생활경관거점으로 인근 폐 경주역 활용사업과 연계한 경관관리가 필요하다고 평가되며 화랑로변 보도 확장·옥외광고물 가이드·도로 적치물 관리가 계획되고, 구시가지 구역 M4는 성동시장 상인회 협정·안내시설물·중앙통로 정비를 제시한다.","values":"—","note":"보행 육교는 부지 횡단의 기존 수단으로 서술되며, 김성주(2025)는 폐선 후 임시보행로·임시주차장(140대)을 추가로 기록한다(D-ref).","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","P_CROSS","P_LANE","PLL_GUIDE"]},{"fid":"K3b-040","doc":"A-009","doc_title":"경주시 「2030 경주시 경관계획」 재정비(2025.4) 본책","loc":"2030 경주시 경관계획.pdf · 경관계획 전반(정량 규정 부재 확인)","page":"","kind":"gap","topic":"경관계획이 정량으로 말하지 않는 값","text":"경관계획은 구 역사의 위치(원위치·이전 여부)·건폐율·용적률·주차 면수·광장·공원 면적 비율·통경축의 폭과 좌표를 정하지 않는다. 정량값은 황오동 구역의 3층(15m)·이격 1m·녹시율 30%와 시가지경관지구의 6층(30m) 정도이고 나머지는 방향 문장이다.","values":"—","note":"공백 기록. 쪽 번호는 특정되지 않아 page = null이나 확인 범위는 본책 304쪽·별책 242쪽 키워드 검색 및 해당 절 정독이다.","tier":"T1","conf":0.5,"conf_txt":"추정","relation":"limits","nodes":["P_STN","P_FAR","P_PARK","P_CROSS","P_OPEN","PLL_ZONE"]},{"fid":"K3b-041","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 2-1 국비 지원 인쇄쪽 p.12, 2-2 p.14","page":"12","kind":"constraint","topic":"국비 한도·기간·지방비 매칭","text":"국가시범지구 국비는 5년간 총사업비의 25% 이내에서 최대 250억 원이며, 일률 지원이 아니라 사업 타당성·예산편성 적절성을 보고 정하고 성과와 연동해 가감한다. 경주(기타 시군)의 국고보조율은 60%라 국비 250억 원에는 지방비 약 166.67억 원을 매칭해야 한다.","values":"국비 ≤ 250억 원/5년, ≤ 총사업비 25%; 기타 시군 국고보조율 60%·지방비 40% → 매칭 166.67억 원","note":"3,822억 원 구상 대비 국비 250억 원은 약 6.5%(파생)이며 이 규모에서는 25% 한도가 아니라 250억 원 상한이 구속한다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","PLP_GUIDE"]},{"fid":"K3b-042","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 2-2 지원사항 인쇄쪽 p.14; 활성화계획 가이드라인 p.83–84","page":"14","kind":"constraint","topic":"국비 대상 시설 유형(공공청사 제외)","text":"국비보조 대상은 도시재생기반시설·생활SOC 등 공공시설(주차장·도로·공원·공동이용시설과 지자체가 설치·운영하는 지식산업센터·기업지원센터 등)이며 공공청사는 제외하고, 기존 도시재생사업으로 지원된 단위사업도 제외한다. 상세 지원표(p.83–84)는 주차장·공원·광장·공동이용시설의 토지비·건설비를 지원(공유지에 건설하면 건설비만)하고 도로는 토지비·건설비 미지원으로 적어 p.14의 도로 포함 문구와 어긋난다.","values":"대상: 주차장·도로(p.14 문구상 포함)·공원·공동이용시설·지식산업센터·기업지원센터; 제외: 공공청사, 기지원 단위사업; 상세표(p.83–84): 도로 미지원/주차장·공원·광장 지원","note":"상세표(p.83–84)는 활성화계획 일반 예산지침으로 국가시범지구에 그대로 적용되는지 명시가 없다. 시청(공공청사)은 국비가 아니라 지자체 재원이며 조성원가 수준 매입이 가정된다(p.46). 반대로 지자체가 설치·운영하는 지식산업센터·기업지원센터는 대상 유형에 명시돼 있다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_HALL","P_COST","P_PARK","P_OPEN","P_CROSS","P_RETAIL","PLP_GUIDE"]},{"fid":"K3b-043","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-2-4 예산의 편성 및 집행 인쇄쪽 p.81–83","page":"82","kind":"constraint","topic":"부지매입비·상생협력상가 비율 상한과 집행 금지","text":"부지 매입비는 재정보조 사업비(국비+지방비)의 30%를 넘을 수 없고(공시지가가 전국 평균 이상이면 40%), 상생협력상가 조성은 5% 범위(인정사업 40%)로 제한한다. 현장지원센터 운영비·S/W 역량강화, 계획에 없는 사업, 이미 국고보조를 받는 사업과 중복되는 비용, 시설 내 집기 등은 예산 집행이 금지된다.","values":"부지매입비 ≤ 재정보조 사업비의 30%(40%); 상생협력상가 ≤ 5%(인정사업 40%)","note":"국비 250억 + 매칭 166.67억 = 약 416.7억 원 기준 부지매입비 상한은 약 125억 원(파생). 국유 철도부지 매입가는 소유·관리청 협의 결과에 따른다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_RETAIL","P_BND","PLP_GUIDE"]},{"fid":"K3b-044","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 1-2 주요 내용 인쇄쪽 p.4–5; 2-2 p.15; 참고3 p.20; 3-1-5-2 p.44","page":"4","kind":"constraint","topic":"부지 권원 확보·수용 불가·시행자 요건","text":"혁신지구는 토지 수용이 불가하고 시행자가 국가시범지구 전부의 부지 권원을 확보해야 하며(법 제45조), 시행자는 지자체·공공기관(한국철도공사·국가철도공단 포함)·지방공사·공공 출자 50% 초과 법인이다. 국공유지는 등기부등본과 소유·관리청의 가격·조건·부대사항 협의 완료 공문을, 사유지는 매매계약·사용승낙 서류를 증빙해야 하고 자문기준에 ‘사용권원 확보 비율’이 들어 있으며 권원 확보는 최종 평가 전까지 제출할 수 있다.","values":"수용 불가; 전체 권원 확보; 시행자 ∈ {지자체, 공공기관, 지방공사, 공공 >50% 법인}","note":"B-002 슬라이드 11(국유 70.5%·사유 29.5%), B-003 p.7(철도공단·코레일 보유)과 맞물린다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_BND","P_COST","P_OPS","P_PHASE","PLP_GUIDE"]},{"fid":"K3b-045","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 1-2 인쇄쪽 p.4; 참고1 p.6; 2-2 p.16","page":"4","kind":"constraint","topic":"지구 규모 상한·기능 집적·선례 면적","text":"혁신지구는 200만㎡ 이하이며 산업·상업·주거·복지·행정 중 2개 이상 기능이 집적돼야 하고 쇠퇴지역 요건 2개 이상을 충족해야 하며 2026 상반기에는 국가시범지구 1곳만 선정한다. 참고 선정 사례 17곳(도시재생 혁신지구)은 9,542㎡~354,567㎡이고 중앙값이 약 1.8만㎡이며 79,438㎡보다 큰 곳은 춘천(127,096㎡)과 서울 강서(354,567㎡) 둘뿐이다.","values":"≤ 200만㎡; 기능 ≥ 2; 선례(n=17) 중앙값 ≈ 18,375㎡, 범위 9,542~354,567㎡","note":"선례 통계는 p.6 표에서 직접 계산한 파생값. 고시 구역 156,460㎡도 강서(354,567㎡) 외에는 선례보다 크다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_BND","P_USE","P_COST","PLP_GUIDE"]},{"fid":"K3b-046","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-1-4 국가시범지구계획 포함사항·양식 인쇄쪽 p.28–29, 31–34","page":"28","kind":"standard","topic":"계획서 필수 데이터(조서·획지·수용인구·시설·재원)","text":"국가시범지구계획에는 토지(소유권·규모·이용)·건축물(규모·경과년수·층수·구조·허가 유무) 조서, 주요 도입기능의 규모·위치·운영주체와 인구(이용/거주)·사업체·주택·상업시설 수요 추정, 가구·획지 계획, 건축계획(배치도·입면도·조감도), 수용인구 및 개발밀도(획지별 건폐율·용적률·높이/층수·수용인구), 도시·군계획시설(도로·주차장·공원) 신설·폐지·변경, 교통처리계획, 재원조달·연차별 집행, 지구단위계획·도시혁신계획, A3 전체사업계획도·혁신지구 결정도를 담아야 한다. 용지 분류는 지구단위계획수립지침 제7장을 따른다.","values":"획지표 열: 가구번호·획지번호·용지분류·면적·건폐율·용적률·높이/층수·수용인구","note":"도입기능 표(p.31)의 분류: 산업(공장·업무)·상업(판매·근생)·주거(공동주택 분양/임대·준주택 분양/임대)·복지(공동이용시설·문화집회)·행정(공공청사·교육연구)·기타 — 숙박시설 전용 행은 없다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_LOT","P_FAR","P_H","P_HOUSE","P_USE","P_TRIP","P_COST","PLP_GUIDE"]},{"fid":"K3b-047","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-1-1 작성안내 인쇄쪽 p.25; 3-2-1 p.59","page":"25","kind":"constraint","topic":"공모 서류 작성 규칙(해외사례·타 지역 사진 금지, 분량·서식)","text":"계획서·검토서에는 해당 지역의 현황과 활동을 이해할 수 있는 사진·도면을 쓰되 해당 지역과 무관한 해외사례와 타 지역 사진은 쓰지 않는다. 검토서 본문은 A4 50쪽 이내·본문 13pt·줄간격 160%, 사업계획도는 A3로 접어 제출하고 참고·증빙자료 위치를 본문에 표시한다.","values":"검토서 A4 ≤ 50쪽; 13pt/160%;  않는다. 이 문서만으로는 20m·15m 상한을 완화할 수 있다고 볼 수 없다.","values":"—","note":"전수리스트 §4.1: 고도지구 변경은 세부개발계획 때 승인권자 심의가 필요하다. 타 법령과의 관계는 국토부·국가유산청 협의 사항으로 남는다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"limits","nodes":["P_H","P_FAR","PLP_GUIDE"]},{"fid":"K3b-051","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-1-5 검토서·별지 제2호 사전사업성 검토서 인쇄쪽 p.46, 51; 참고3 p.20; p.35; 참고 p.7","page":"46","kind":"constraint","topic":"사업성 분석·조성원가 매입·매입확약·미분양 조치","text":"사전사업성 검토서는 총수익·총사업비·IRR·민감도(국비 5,000~25,000백만 원 구간)를 요구하며 공공시설(공용 청사 등)은 지자체 등이 조성원가 수준에서 매입한다고 가정하고 분양시설은 인근 시세, 임대시설은 통상 8~12년 임대 후 일반매각을 가정한다. 자문 항목과 검토서 필수항목에 미분양시설물 조치계획·매입확약서(계획)·입주 확약(MOU)이 들어 있다.","values":"공공시설 조성원가 매입; 임대기간 통상 8~12년; 민감도 국비 5,000~25,000백만 원","note":"시청·수장고 같은 공공시설의 재원은 지자체 매입이 전제다. 고양 성사 선례는 전체 조성시설에 대한 시의 매입 확약을 제공했다(p.7). (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"funds","nodes":["P_COST","P_HALL","P_RETAIL","PLP_GUIDE"]},{"fid":"K3b-052","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-4 참고자료 인쇄쪽 p.93; 별지 제2호 p.48","page":"93","kind":"standard","topic":"건축물 조성비 산식 예시","text":"조성비는 건축공사비에 설계비 4.36%·감리비 1.09%·물가상승 10%를 더하고 제로에너지건축물 추가 공사비 5.2%(예시)와 예비비(조성비+공사비+감리비의 2%)를 반영하며, 공사비는 조달청 공사비광장·서울시 공공건축물 건립공사비 가이드를 참고하되 지하주차장·부지 조건 같은 증가요인을 고려한다.","values":"설계비 공사비×4.36%; 감리비 ×1.09%; 물가상승 ×10%; ZEB ×5.2%(예시); 예비비 2%","note":"비율은 서식 예시(2종 보통·중급 기준)이며 경주 사업의 확정 단가가 아니다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_COST","P_ENERGY","P_PARK","PLP_GUIDE"]},{"fid":"K3b-053","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-1-4 포함사항 인쇄쪽 p.28; 3-2-4 활성화계획 가이드라인 p.71–72","page":"71","kind":"constraint","topic":"젠트리피케이션 대응·상생협력상가","text":"계획서에는 상생협의체·상생계획·상생협력상가 공급계획 등 젠트리피케이션 대응방안과 투기방지 대책을 담아야 하며, 활성화계획 가이드라인은 최대 10년간 시세 80% 이하로 임대하는 상생협력상가 공급(예상 지역은 설치 의무화), 상생협약의 차임 인상률 한도 5% 이내, 대규모 판매시설·프랜차이즈·근린생활시설 입지규제 같은 도시계획 수단을 예시한다.","values":"상생협력상가 임대료 ≤ 시세 80%·최대 10년; 차임 인상률 ≤ 5%","note":"대응방안 제출은 필수(hard), 5%·80%는 예시 수치(soft)다. 기존 상권을 흡수하지 않고 연장한다는 원칙의 제도적 형태로 지구단위계획의 판매시설 입지규제가 예시된다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"guides","nodes":["P_RETAIL","P_USE","PLP_GUIDE"]},{"fid":"K3b-054","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 3-2-3 양식 인쇄쪽 p.65, 73–74; 3-2-4 p.78","page":"65","kind":"standard","topic":"성과지표(종합성과지표)와 일자리 산정식","text":"공통지표(종합성과지표)는 모든 사업에 필수이며 거점공간 공급(만족도·이용자수), 민간투자, 유동인구, 매출액, 첨단기술 적용, 민간창업·일자리, 공동체 인식 등이고, 선택지표 예시로 공실률·주민 재정착률·업종변화·야간 보행 통행량·관광객 입장객수가 있으며 성과지표는 매년 1회 이상 측정한다. 공사단계 일자리는 H/W 사업비(보상비 제외)×건설업 취업유발계수 1.25명/억 원으로 계산한다.","values":"취업유발계수 1.25명/억 원; 지표 측정 연 1회 이상","note":"야간 보행 통행량·업종변화·공실률·주민 재정착률이 선택지표로 허용되므로 거주·생활업종·야간 축 지표를 공모 지표 체계 안에서 제시할 수 있다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_TWOAX","P_JOBS","PLP_GUIDE"]},{"fid":"K3b-055","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 2-1 선정 일정 인쇄쪽 p.11, 제출 p.17; 2-2 p.15; 3-1-5 p.39; 참고4 p.21","page":"11","kind":"constraint","topic":"공모 일정·기간 규칙","text":"2026 상반기 공모는 접수 3.9~3.11(제출 마감 3.11 18:00)·자문 3~5월·실무위/특위 후 6월 말 선정으로 짜여 있다. 국가시범지구 국비지원기간은 5년이고 활성화계획 사업기간은 6년(연차별 집행계획도 1~6년차)이며, 활성화계획이 없는 지역은 시행계획인가일부터 2년 안에 활성화계획을 수립해야 하고 후보지는 지정 후 2년 안에 지구계획을 세우지 않으면 지위를 잃는다.","values":"접수 2026.3.9~3.11; 선정 6월 말; 국비 5년/활성화 6년; 인가 후 2년 내 활성화계획; 후보지 유효 2년","note":"B-003의 사업기간 2027.6~2032.6(5년)이 국비지원 5년과 맞는다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","PLP_GUIDE"]},{"fid":"K3b-056","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 2-1 선정 규모 인쇄쪽 p.11; 2-1 유의사항 p.12","page":"11","kind":"gap","topic":"하반기 공모 조건 미정","text":"가이드라인의 선정 규모표는 상반기 1곳, 하반기는 ‘미정’으로 적고 공모 접수 현황과 여건에 따라 일정·절차·방식이 바뀔 수 있다고 단서를 단다. 하반기 공모의 접수 시기·요건·국비 한도는 이 문서에 없다.","values":"상반기 1 / 하반기 미정","note":"프로젝트 전제(2026 하반기 공모)의 근거가 이 문서에서는 확인되지 않으며 상반기 접수(2026.3.9~11)는 이미 지난 시점이다. 하반기 공고문 확보가 필요하다(archive gaps.md 후보). (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"sequences","nodes":["P_PHASE","P_COST","PLP_GUIDE"]},{"fid":"K3b-057","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 참고 사례 고양 성사 혁신지구 인쇄쪽 p.7","page":"7","kind":"fact","topic":"선례: 고양 성사 혁신지구(준공 2025.10)","text":"참고 사례 고양 성사 혁신지구는 12,365㎡에 사업비 3,029억 원(국비 250억 원·지방비 167억 원)으로 복합환승주차장 360면·공공행정시설·생활SOC·임대주택 118세대·공동주택 100세대를 조성했고, 전체 조성시설에 대한 고양시의 매입 확약을 제공했다.","values":"12,365㎡; 3,029억 원; 주차 360면; 118+100세대","note":"부지면적당 사업비(파생): 고양 약 2,450만 원/㎡, 구경주역 구상(3,822억 원/79,438㎡) 약 481만 원/㎡. 사업비 구성표(출자·융자·재정보조)는 열 대응이 불명해 인용하지 않았다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_COST","P_PARK","P_HOUSE","PLP_GUIDE"]},{"fid":"K3b-058","doc":"B-004","doc_title":"국토교통부 「2026년 상반기 도시재생사업(혁신지구) 공모 가이드라인」(2026.2.6; archive 추출텍스트 v1)","loc":"B-S3-20260206-국토교통부-…공모가이드라인_추출텍스트-v1.txt · 참고2–3 자문 기준·항목 인쇄쪽 p.19–20; 3-2-2 추진체계 p.70–71; 3-2-3 p.74","page":"20","kind":"constraint","topic":"자문 평가 항목(4대 분류)·운영 주체·수익환원","text":"자문위원회는 추진 기반 구축(행정지원 역량·시행자 협력), 국가시범지구 적정성(선도적 가치·거점 역할: 기능 집적도와 공익성·수익성의 조화), 사업 실현 가능성(부지 확보·사업 구체화 및 운영방안·사업비 적정성 및 안정성), 사업 효과(경제적·사회적)로 평가하며, 구체화 항목에는 입주·유치계획(MOU·입주확약서)·운영 주체·운영비·임대·임차·수익구조 분배가 들어간다. 사회적 효과는 개발이익 일부를 임대료 인하·운영비·설치비로 돌리는지를 보고, 활성화계획은 수익 재투자·환원 방안과 재정지원 종료 후에도 이어지는 재생 계획을 요구한다.","values":"평가 4대 분류: 추진기반 / 국가시범지구 적정성 / 사업 실현가능성 / 사업효과; 자문위원 5~7인(건축·도시·산업·회계)","note":"'조성이 아니라 운영 조직을 설계한다'(CLAUDE.md 교훈 9)를 공모 평가 항목이 직접 요구하는 근거다. (쪽: 추출텍스트의 쪽 표지 기준; PDF쪽 미확인)","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"evaluates","nodes":["P_OPS","P_COST","P_USE","P_TWOAX","PLP_GUIDE"]},{"fid":"K3b-059","doc":"A-012","doc_title":"경주시 도시재생활성화계획 고시 제2020-1호(2020.1.7) ‘이천년 고도(古都), 경주의 부활’(중심시가지형)","loc":"경주시 도시재생뉴딜사업 도시재생활성화계획고시문(수정).pdf (스캔 4쪽; 이미지 판독) · ① 개요 · p.1, ⑧ p.4 (PDF 1·4)","page":"1","kind":"fact","topic":"활성화계획 고시 제2020-1호의 구역·사업 개요","text":"경주시 도시재생활성화계획 고시 제2020-1호(2020.1.7)는 황오동(원도심) 도시재생뉴딜사업 ‘이천년 고도(古都), 경주의 부활’(중심시가지형)로, 황오동 118-12번지 일원 0.215㎢에 사업기간 2019~2023(5년)·총사업비 256.7억 원이며 시행은 경주시·도시재생지원센터·현장지원센터·주민이다. 행위제한 적용 지역은 ‘해당 없음’이다.","values":"0.215㎢; 2019~2023; 256.7억 원(마중물 250.0 + 지자체 6.7); 행위제한 없음(p.4)","note":"활성화계획도(p.1)상 구역은 성동시장~황오동 일대로 그려지고 ‘경주역’은 인접 지표로만 표시돼 구경주역 부지 자체는 구역 밖으로 보인다(판독·추정). 폴더의 같은 이름 PDF 두 개(‘…(수정).pdf’와 ‘(1)’)는 해시가 같은 동일 파일이고, 같은 폴더의 ‘고시문.hwp’는 이 건이 아니라 고시 제2026-8호(폐철도 지구단위계획) 원문이다. 스캔본이라 텍스트 레이어가 없어 이미지로 읽었다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_BND","P_COST","P_PHASE","PLA18"]},{"fid":"K3b-060","doc":"A-012","doc_title":"경주시 도시재생활성화계획 고시 제2020-1호(2020.1.7) ‘이천년 고도(古都), 경주의 부활’(중심시가지형)","loc":"경주시 도시재생뉴딜사업 도시재생활성화계획고시문(수정).pdf (스캔 4쪽; 이미지 판독) · ③ 사업계획·④ 기반시설·⑤ 재원 · p.2–4 (PDF 2–4)","page":"3","kind":"fact","topic":"연계 단위사업(성동시장의 부활·상생협력상가·커뮤니티센터 등)","text":"마중물사업 250.0억 원 안에 성동시장의 부활 10.0억 원(성동시장 안 유휴공간 약 82.5㎡, 오픈 스튜디오·마케팅 위탁), 상생협력상가 12.0억 원(지방비), 황오 커뮤니티센터 126.54억 원(황오동 129-1 외 10필지, 부지 1,435㎡·7층 규모, 주차장·문화장터·플리마켓), 황오 프론티어 밸리 16.331억 원(황오동 117-3, 연면적 640.04㎡; 1층 작은도서관·2~4층 청년창업거점), 어울림마당 12.129억 원(128-11, 311㎡) 등이 있다. 재원은 p.3 표에서 마중물 국비 150.0·지방비 100.0억 원이나 p.4 집행표에서는 국비 125.00·지방비 125.00억 원으로 달라 문서 안에서 불일치한다.","values":"성동시장의 부활 10.0억; 상생협력상가 12.0억; 커뮤니티센터 126.54억(1,435㎡·7층); 프론티어 밸리 16.331억(640.04㎡); 어울림마당 12.129억(311㎡); 재원표 국비 150.0 vs 집행표 국비 125.0","note":"공모 가이드라인은 '기 도시재생사업으로 지원된 단위사업 제외'(B-004 p.14)와 주변 사업과의 중복성 검토(p.21)를 요구하므로 성동시장 연계 판매·체험 계획은 이 사업과 역할을 구분해야 한다. 황오 커뮤니티센터(주차장 포함)는 인근 주차 공급 현황으로 계산에 들어갈 수 있다.","tier":"T1","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_RETAIL","P_PARK","P_CULT","P_JOBS","P_COST","PLA18"]},{"fid":"K3b-061","doc":"D-ref","doc_title":"최무현(2012) 「경주관내 근대철도역사의 건축적 특성에 관한 연구」, 한국농촌건축학회논문집 14(3), pp.109–120 (KCI_FI001686762.pdf)","loc":"KCI_FI001686762.pdf · 3.2.1 경주역사·표 3 · 인쇄쪽 p.112–113(PDF 4–5)","page":"112","kind":"fact","topic":"구 역사의 규모·구조·형태(1936년 도면 기반)","text":"현 경주역사는 1936.12.1 신축된 단층 건물로 남북으로 긴 장방형 평면에 중앙 대합실(360㎡, 30m×12m)·정면 3열주 포치 캐노피·한식 골기와 우진각 지붕(제관양식)이 특징이며, 건축면적은 표 3에 797㎡, 본문에 737㎡로 서로 다르게 적혀 있다. 우측 증축부(1976)는 273㎡이고 2002년 리모델링으로 벽체·창호가 개수되고 천장고가 약 50cm 낮아져 4,050mm가 됐으며 일부는 휴게실·갤러리로 쓰인다.","values":"대합실 360㎡(30m×12m); 건축면적 797㎡(표3)/737㎡(본문); 우측 증축 273㎡(1976); 천장고 4,050mm; 단층","note":"코레일 대구본부 보관 도면과 현장 육안 조사에 근거하며 원도면은 미확보(정보공개 대상). 구조 서술의 불일치는 별도 충돌 항목 참조.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"sizes","nodes":["P_STN","D_STNPLAN"]},{"fid":"K3b-062","doc":"D-ref","doc_title":"최무현(2012) 「경주관내 근대철도역사의 건축적 특성에 관한 연구」, 한국농촌건축학회논문집 14(3), pp.109–120 (KCI_FI001686762.pdf) / 김성주(2025) 「도심의 폐철도역 부지를 활용한 미디어테크 설계: 구경주역을 중심으로」, 한양대 석사학위논문 (폐경주역미디어테크.pdf)","loc":"KCI_FI001686762.pdf p.111–112(PDF 3–4) / 폐경주역미디어테크.pdf 표 3.1 p.27, 3.3.4 p.38–40(PDF 37, 48–50)","page":"112","kind":"conflict","topic":"구 역사 구조 서술의 불일치","text":"최무현(2012)은 구 역사를 철근콘크리트조 벽체에 한식 기와 지붕으로 적고(표 3·본문), 김성주(2025)는 표 3.1에서 벽돌조+목조 지붕으로 적으면서 본문에서는 전통 처마부를 콘크리트로 간소화하고 내부는 서양식 왕대공 트러스라고 설명한다. 이축(해체·이전)이나 존치 보강의 전제가 되는 구조 형식이 문헌마다 다르다.","values":"RC조(최무현) vs 벽돌조+목조 지붕(김성주 표 3.1); 처마부 콘크리트·왕대공 트러스(김성주 p.38·40)","note":"공모 가이드라인은 리모델링 대상 구조물의 안전성 증빙(정밀안전진단보고서 등)을 요구한다(B-004 p.59). 실측·진단 자료 없이는 구조를 확정할 수 없다.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"conflicts","nodes":["P_STN","D_STNPLAN"]},{"fid":"K3b-063","doc":"D-ref","doc_title":"최무현(2012) 「경주관내 근대철도역사의 건축적 특성에 관한 연구」, 한국농촌건축학회논문집 14(3), pp.109–120 (KCI_FI001686762.pdf) / 김성주(2025) 「도심의 폐철도역 부지를 활용한 미디어테크 설계: 구경주역을 중심으로」, 한양대 석사학위논문 (폐경주역미디어테크.pdf) / 성희연(2023) 「1930년대 경주지역 철도부설과 지역사회의 변화」, 국민대 석사학위논문 (1930경주철도와사회변화.pdf) / 김신재(2013) 「1930년대 경주의 도시모습과 사회변화」, 신라문화 41 (1930경주도시변화.pdf)","loc":"최무현 p.112–113(PDF 4–5); 김성주 p.27–30(PDF 37–40); 성희연 p.6(PDF 13), p.36(PDF 43); 김신재 p.387(PDF 5); A-009 본책 p.127(PDF 132)","page":"112","kind":"fact","topic":"구 경주역 연혁(개업·이전·지정·폐역)","text":"경동선 서악~불국사·포항 구간이 1918.10 개통되면서 경주역이 사정동(현 서라벌문화회관 자리)에 처음 들어섰고(최무현은 영업개시를 1918.11.1로 적음) 1921년 목조 한옥형 역사가 지어졌으며, 1936.12.1 현 역사가 성동동에 신축·이전되고 1939.6 표준궤 개량으로 선로가 읍성 북쪽을 경유해 성동리 경주역에 연결됐다. 이후 2007 화물 취급 중단, 2013 철도기념물 지정, 2021.12 폐역, 2022 ‘경주문화관 1918’ 개관으로 이어진다.","values":"1918.10 개통(경동선) / 1918.11.1 영업개시(최무현); 1921 한옥형 역사(최무현 본문은 1927 철거로도 기술); 1936.12.1 현 역사; 1939.6 표준궤 개량; 2013 철도기념물; 2021.12 폐역; 2022 개관","note":"의뢰서의 '개업 1918.12.28'은 이 문서군에서 확인되지 않았다. '12월 28일'은 폐선일(2021.12.28)로 나온다(A-009 본책 p.127). 철도기념물은 등록문화유산과 별개 지정으로 읽힌다(공백 항목 참조).","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_STN","D_HISTMAP"]},{"fid":"K3b-064","doc":"D-ref","doc_title":"성희연(2023) 「1930년대 경주지역 철도부설과 지역사회의 변화」, 국민대 석사학위논문 (1930경주철도와사회변화.pdf) / 김신재(2013) 「1930년대 경주의 도시모습과 사회변화」, 신라문화 41 (1930경주도시변화.pdf)","loc":"성희연 p.35–36(PDF 42–43); 김신재 p.388(PDF 6)","page":"36","kind":"fact","topic":"1918 봉황로·1936 화랑로 신설과 읍성 남벽 철거","text":"1918년 경주역이 읍성 남쪽 외곽에 생기면서 역에서 읍성 남문 쪽으로 간선도로 봉황로가 신설됐고, 1936년 역이 성동동으로 옮겨지면서 이전된 역에서 서쪽으로 뻗는 화랑로가 새로 개설돼 그 과정에서 읍성 남쪽 성벽이 완전히 철거됐다. 신설 역은 읍성 남동쪽 외곽에 놓여 시가지를 관통하지 않았다.","values":"1918 봉황로; 1936.12 화랑로 신설","note":"문헌은 화랑로를 '이전된 경주역에서 서쪽으로 뻗은 도로'로 서술한다 — 화랑로 횡단 가로와 구 역사 위치가 역사적으로 한 쌍이라는 읽기는 해석. A-009 본책 p.265는 화랑로를 '가장 오래된 중심도로'로 표현한다.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"anchors","nodes":["P_CROSS","P_STN","P_AXIS","D_HISTMAP"]},{"fid":"K3b-065","doc":"D-ref","doc_title":"김신재(2013) 「1930년대 경주의 도시모습과 사회변화」, 신라문화 41 (1930경주도시변화.pdf) / 성희연(2023) 「1930년대 경주지역 철도부설과 지역사회의 변화」, 국민대 석사학위논문 (1930경주철도와사회변화.pdf)","loc":"김신재 p.387(PDF 5); 성희연 p.36(PDF 43)","page":"387","kind":"fact","topic":"철도가 도시조직 바깥에 놓인 방식(1936·1939)","text":"1936년 새 역과 선로는 읍성 남동쪽 외곽에 놓여 시가지를 관통하지 않았고, 1939년 표준궤 개량 때 태종로를 지나던 기존 노선이 철거되고 김유신 장군묘 앞 터널을 거쳐 읍성 북쪽을 지나 성동리 경주역에 닿는 노선이 새로 놓였다. 읍성 북쪽을 지나 성동리 역으로 들어오는 현재 폐선 축의 선형이 이 두 시점의 이설로 정해진 것으로 읽힌다.","values":"1936.12 이전; 1939.6 노선 정리","note":"폐선 축의 선형 기원 판단은 해석(문헌은 노선 이설 사실만 서술). 동측 주거지역과 서측 상업지역의 동선 단절은 경관계획 조사(A-009 본책 p.88)와 김성주(2025) p.26이 현황으로 서술한다.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_CROSS","D_HISTMAP"]},{"fid":"K3b-066","doc":"D-ref","doc_title":"김성주(2025) 「도심의 폐철도역 부지를 활용한 미디어테크 설계: 구경주역을 중심으로」, 한양대 석사학위논문 (폐경주역미디어테크.pdf)","loc":"폐경주역미디어테크.pdf · 3.2.2 · 인쇄쪽 p.26(PDF 36)","page":"26","kind":"fact","topic":"잔존 철도유산·임시보행로·임시주차 현황","text":"구 경주역 주변에는 기관차 승무사업소·기관차 검수고·승무원 합숙소·관사·탑승장 플랫폼·급수탑·무사고기원탑·철도 육교·전차대 등 철도유산이 활용 전략 없이 남아 있다(성림문화재연구원 2022 인용). 철도 하부 지하차도(1970)는 2024년 철거·평면화됐고 인근에 임시공영주차장 140대가 조성됐으며 철도 육교 대신 성동동 일대에 임시보행로가 설치됐다.","values":"임시공영주차장 140대; 지하차도 1970 → 2024 철거·평면화","note":"2024년 직접 촬영·조사에 기반한 석사논문(T3). 임시주차장·임시보행로의 위치는 서술에 없다. 고물상·농작지·방음벽이 미관 저해 요소로 남아 있다고 기록한다.","tier":"T3","conf":1.0,"conf_txt":"확인","relation":"calibrates","nodes":["P_STN","P_CROSS","P_PARK","P_LANE","D_TEMPUSE","D_RAILHERIT"]},{"fid":"K3b-067","doc":"D-ref","doc_title":"김성주(2025) 「도심의 폐철도역 부지를 활용한 미디어테크 설계: 구경주역을 중심으로」, 한양대 석사학위논문 (폐경주역미디어테크.pdf)","loc":"폐경주역미디어테크.pdf · 3.2.2·4.1.1 · 인쇄쪽 p.26, 42(PDF 36, 52)","page":"26","kind":"conflict","topic":"2023 폐철도 기본계획안의 화랑로 연장 ↔ 구 역사 이전·보존","text":"2023년 경주시 폐철도부지 정비 및 개발계획 최종보고회에서 공개된 기본계획안은 경주역 주변을 상업·업무 복합지구로 재개발해 기존 경주역 부지를 공공청사, 중앙을 산책로·도시숲길 공원, 인접 부지를 상업·문화복합용지로 두며 화랑로를 연장하려면 구 경주역을 다른 곳으로 옮겨야 한다. 김성주는 이를 역사적·상징적 가치 훼손으로 비판하고 구 역사를 보존하면서 화랑로는 보행 통로로만 연장하고 교통은 북성로·태종로 연장으로 푸는 대안을 낸다.","values":"기본계획안: 역 부지 공공청사 + 중앙 선형 공원 + 상업·문화복합 / 전제: 화랑로 연장 = 구 역사 이전","note":"경관계획(A-009 본책 p.224·242)은 보전·활용, 시 구상(B-002 슬라이드 23)은 '경주역사 이전' — 세 문서가 구 역사     if (e.t.kind !== 'param' || e.s.kind === 'param' || e.s.kind === 'eval') return;
    const k = e.dst + '||' + gkey(e.s);
    if (!cell.has(k)) cell.set(k, { n: 0, hard: 0, gap: 0, items: [] });
    const c = cell.get(k); c.n++; if (e.strength === 'hard') c.hard++; if (MISSING(e.s.status)) c.gap++; c.items.push(e);
  });
  const kindSpan = KORDER.filter(k => k !== 'param' && k !== 'eval').map(k => ({ k, n: srcGroups.filter(g => g.kind === k).length })).filter(x => x.n);
  let h = `<p class="mxnote"><b>값 × 근거 표</b> — 행 = 마스터플랜 값, 열 = 근거 묶음. 칸의 숫자 = 그 묶음에서 그 값으로 들어가는 직접 엣지 수(파생 노드를 거친 간접 근거는 제외). <span style="color:#d1453b">■</span> hard 엣지 포함, <span style="color:#d1453b">○</span> 자료 공백(없음·요청) 노드 포함. 칸을 누르면 오른쪽에 그 근거가 펼쳐집니다.</p>`;
  h += '<table class="mx"><thead><tr><th class="corner" rowspan="2">마스터플랜 값 ↓ &nbsp; 근거 묶음 →</th>';
  kindSpan.forEach(x => { h += `<th class="kh" colspan="${x.n}" style="background:var(--k-${x.k})">${KIND[x.k].ko}</th>`; });
  h += '<th class="kh" colspan="7" style="background:var(--muted)">요약</th></tr><tr class="r2">';
  srcGroups.forEach(g => { h += `<th class="gh" title="${esc(g.name)}"><div>${esc(g.name)}</div></th>`; });
  h += '<th class="gh"><div>직접 근거 수</div></th><th class="gh"><div>자료 공백 수</div></th><th class="gh"><div>다른 값에서 파생</div></th><th class="gh"><div>원문 근거(건)</div></th><th class="gh"><div>상충(엣지+원문)</div></th><th class="gh"><div>근거 등급</div></th><th class="gh"><div>현재 값 출처</div></th></tr></thead><tbody>';
  const colTot = srcGroups.map(() => 0);
  const pg = []; PARAMS.forEach(p => { if (!pg.includes(p.group)) pg.push(p.group); });
  const ncol = srcGroups.length + 8;
  pg.forEach(gname => {
    h += `<tr class="pgrp"><td colspan="${ncol}">${esc(gname)}</td></tr>`;
    PARAMS.filter(p => p.group === gname).forEach(p => {
      let tot = 0, gaps = 0;
      const derivIn = INS.get(p.id).filter(e => e.s.kind === 'param').length;
      h += `<tr data-pid="${esc(p.id)}" class="${S.sel === p.id ? 'sel' : ''}"><th class="rh"><button class="lnk" data-pick="${esc(p.id)}">${esc(p.label)}</button> <button class="btn" data-focus="${esc(p.id)}" data-dir="up" style="padding:0 6px;font-size:10.5px" title="그래프로 보기">↗</button></th>`;
      srcGroups.forEach((g, ci) => {
        const c = cell.get(p.id + '||' + g.key);
        if (!c) { h += '<td class="c"></td>'; return; }
        tot += c.n; gaps += c.gap; colTot[ci] += c.n;
        const a = Math.min(0.14 + 0.15 * c.n, 0.82);
        h += `<td class="c${c.hard ? ' hard' : ''}${c.gap ? ' gap' : ''}" data-pid="${esc(p.id)}" data-gk="${esc(g.key)}" style="background:color-mix(in srgb, var(--k-${g.kind}) ${Math.round(a * 100)}%, transparent)">${c.n}</td>`;
      });
      h += `<td class="sum"><b>${tot}</b></td><td class="sum" style="color:${gaps ? '#d1453b' : 'inherit'}">${gaps || ''}</td><td class="sum">${derivIn || ''}</td><td class="sum">${p.evN || ''}</td><td class="sum" style="color:${p.confN ? '#e0359e' : 'inherit'};font-weight:${p.confN ? 700 : 400}">${p.confN || ''}</td><td class="sum"><span class="gd ${p.grade}">${p.grade}</span></td><td class="sum" style="font-size:11px"><span style="color:${CUR_C[p.cur_src] || '#9aa3b0'};font-weight:700">${esc(p.cur_src || '')}</span></td></tr>`;
    });
  });
  h += '</tbody><tfoot><tr><td class="corner" style="position:sticky;left:0;bottom:0;z-index:5;text-align:left;padding:5px 10px;background:var(--panel2)">묶음별 합계</td>';
  colTot.forEach(t => { h += `<td>${t}</td>`; });
  h += '<td colspan="7"></td></tr></tfoot></table>';
  $('#matrix').innerHTML = h;
}
$('#matrix').addEventListener('click', ev => {
  const f = ev.target.closest('[data-focus]'); if (f) { focusOn(f.dataset.focus, 'up', 2); return; }
  const pk = ev.target.closest('[data-pick]');
  if (pk) { S.sel = pk.dataset.pick; S.hlGroup = null; renderMatrix(); renderRight(); writeHash(); return; }
  const c = ev.target.closest('td.c');
  if (c && c.dataset.pid) { S.sel = c.dataset.pid; S.hlGroup = c.dataset.gk; renderMatrix(); renderRight(); writeHash(); }
});
$('#matrix').addEventListener('mousemove', ev => {
  const c = ev.target.closest('td.c');
  if (!c || !c.dataset.pid) { hideTip(); return; }
  const items = EDGES.filter(e => e.dst === c.dataset.pid && e.s.kind !== 'param' && e.s.kind !== 'eval' && gkey(e.s) === c.dataset.gk);
  showTip(`<b>${esc(BY.get(c.dataset.pid).label)} ← ${esc(GBY.get(c.dataset.gk).name)}</b>` + items.map(e => `<div>· ${esc(e.s.label)} <span class="m">(${REL[e.rel].ko}·${e.strength}${MISSING(e.s.status) ? ' · ' + e.s.status : ''})</span></div>`).join(''), ev);
});
$('#matrix').addEventListener('mouseleave', hideTip);

/* ═════════ 검색 ═════════ */
const qi = $('#q'), qr = $('#qres');
let qList = [], qCur = -1;
function runSearch() {
  const q = qi.value.trim().toLowerCase();
  if (!q) { qr.style.display = 'none'; return; }
  const sc = n => {
    const L = n.label.toLowerCase(), I = n.id.toLowerCase();
    if (L.startsWith(q) || I === q) return 0;
    if (L.includes(q) || I.includes(q)) return 1;
    if ((n.value + ' ' + n.ref).toLowerCase().includes(q)) return 2;
    if ((n.desc || '').toLowerCase().includes(q)) return 3;
    return 9;
  };
  qList = NODES.map(n => ({ n, s: sc(n) })).filter(x => x.s < 9).sort((a, b) => a.s - b.s || a.n.idx - b.n.idx).slice(0, 14).map(x => x.n);
  qCur = qList.length ? 0 : -1;
  qr.innerHTML = qList.length ? qList.map((n, i) => `<button data-id="${esc(n.id)}" class="${i === 0 ? 'cur' : ''}">${esc(n.label)}<small>${esc(KIND[n.kind].ko)} · ${esc(n.group)}</small></button>`).join('') : '<button disabled>일치 없음</button>';
  qr.style.display = 'block';
}
qi.addEventListener('input', runSearch);
qi.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
    ev.preventDefault(); if (!qList.length) return;
    qCur = (qCur + (ev.key === 'ArrowDown' ? 1 : -1) + qList.length) % qList.length;
    [...qr.children].forEach((b, i) => b.classList.toggle('cur', i === qCur));
  } else if (ev.key === 'Enter') { if (qList[qCur]) pickSearch(qList[qCur].id); }
  else if (ev.key === 'Escape') { qr.style.display = 'none'; qi.blur(); }
});
qr.addEventListener('click', ev => { const b = ev.target.closest('button[data-id]'); if (b) pickSearch(b.dataset.id); });
function pickSearch(id) { qr.style.display = 'none'; qi.value = ''; if (S.view === 'matrix' || S.view === 'overview') S.view = 'detail'; resetFiltersSilent(); focusOn(id); }
function resetFiltersSilent() {
  S.kinds = new Set(KORDER); S.rels = new Set(REL_ORDER); S.hardOnly = false; S.confOnly = false;
  S.statuses = new Set(['보유', '부분', '요청', '없음']); S.scales = new Set(['S1', 'S2', 'S3']);
  document.querySelectorAll('#left input[type=checkbox]').forEach(c => { c.checked = !(c.id === 'fHard' || c.id === 'fConf'); });
}
document.addEventListener('click', ev => { if (!ev.target.closest('.search')) qr.style.display = 'none'; });

/* ═════════ 해시(딥링크) ═════════ */
function writeHash() {
  const p = new URLSearchParams();
  p.set('v', S.view);
  if (S.focus) { p.set('f', S.focus.id); p.set('d', S.focus.dir); p.set('h', S.focus.hops); }
  if (S.group) p.set('g', S.group);
  if (S.sel) p.set('sel', S.sel);
  if (S.color !== 'kind') p.set('c', S.color);
  if (!S.anim) p.set('anim', 0);
  try { history.replaceState(null, '', '#' + p.toString()); } catch (e) { /* file:// 일부 환경 */ }
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('v') && ['overview', 'detail', 'matrix'].includes(p.get('v'))) S.view = p.get('v');
  if (p.get('c') && ['kind', 'grade', 'cur'].includes(p.get('c'))) S.color = p.get('c');
  if (p.get('anim') === '0') S.anim = false;
  if (p.get('f') && BY.has(p.get('f'))) { S.focus = { id: p.get('f'), dir: p.get('d') || defDir(BY.get(p.get('f'))), hops: +(p.get('h') || 2) }; S.view = 'detail'; }
  if (p.get('g') && GBY.has(p.get('g'))) { S.group = p.get('g'); S.view = 'detail'; }
  if (p.get('sel') && (BY.has(p.get('sel')) || GBY.has(p.get('sel')))) S.sel = p.get('sel');
  if (p.get('th') === 'dark' || p.get('th') === 'light') S.theme = p.get('th');
}

/* ═════════ 내보내기 · 도움말 · 테마 ═════════ */
function svgString() {
  const P = PAL[curTheme()], L = CUR.L; if (!L) return null;
  const clone = svg.cloneNode(true);
  clone.querySelectorAll('[data-hit]').forEach(x => x.remove());
  const v = clone.querySelector('#view'); v.removeAttribute('transform');
  const b = L.bbox, w = b.x1 - b.x0 + 20, h = b.y1 - b.y0 + 20;
  clone.setAttribute('xmlns', NS); clone.setAttribute('viewBox', `${b.x0 - 10} ${b.y0 - 10} ${w} ${h}`); clone.setAttribute('width', w); clone.setAttribute('height', h);
  clone.removeAttribute('style');
  const bg = document.createElementNS(NS, 'rect'); bg.setAttribute('x', b.x0 - 10); bg.setAttribute('y', b.y0 - 10); bg.setAttribute('width', w); bg.setAttribute('height', h); bg.setAttribute('fill', P.bg);
  clone.insertBefore(bg, clone.querySelector('#view'));
  return { s: new XMLSerializer().serializeToString(clone), w, h };
}
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function exportSVG() { const r = svgString(); if (!r) return; download('knowledge_graph_' + S.view + '.svg', new Blob([r.s], { type: 'image/svg+xml' })); }
function exportPNG() {
  const r = svgString(); if (!r) return;
  const img = new Image();
  img.onload = () => { const sc = 2, c = document.createElement('canvas'); c.width = r.w * sc; c.height = r.h * sc; const x = c.getContext('2d'); x.scale(sc, sc); x.drawImage(img, 0, 0, r.w, r.h); c.toBlob(b => download('knowledge_graph_' + S.view + '.png', b), 'image/png'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.s);
}
function helpHtml() {
  const rel = REL_ORDER.map(r => `<tr><td><span style="display:inline-block;width:26px;height:3px;background:${REL[r].c};vertical-align:middle"></span></td><td><b>${REL[r].ko}</b></td><td>${REL[r].long}</td></tr>`).join('');
  return `<h2>읽는 법</h2>
<p>노드 = 계획에 관여하는 것(방향·계획·법규·데이터·파생 제약·값·평가함수). 엣지 <b>A → B</b> = "A가 B를 정한다/한정한다/보정한다". <b>왼쪽 열은 원천, 오른쪽 열은 결과</b>입니다. 마스터플랜 값은 다시 다른 값을 정하므로(예: 용도 구성 → 주차·교통·오수) 값 열은 오른쪽으로 여러 칸으로 나뉩니다.</p>
<h3>세 가지 보기</h3>
<ul><li><b>한눈에</b>: 묶음(그룹) 단위 구조. 선 위 숫자 = 묶음 사이 엣지 수. 묶음을 더블클릭하면 그 노드들로 들어갑니다.</li>
<li><b>전체 그래프</b>: 노드 전부. 마우스를 올리면 그 노드의 연결이 강조됩니다. 노드를 <b>더블클릭</b>하거나 왼쪽 값 목록을 누르면 <b>초점 보기</b> — 그 노드의 상류(정하는 것)·하류(영향 주는 것)만 단계(1–3)별로 남깁니다.</li>
<li><b>값 × 근거 표</b>: 어느 근거 묶음이 어느 값에 몇 개의 엣지를 보내는지 한 장으로.</li></ul>
<h3>엣지(관계) — 색</h3><table>${rel}</table>
<p>굵은 선 = hard(불가능·상한: 규제·법정), 가는 선 = soft(조정·참고). <b>점선 = 추정</b>(문서로 확인하지 못하고 설계 논리로 이은 것), 점점선 = 충돌.</p>
<h3>노드 표시</h3>
<ul><li>왼쪽 작은 점 = 자료 상태 — <span style="color:#2a9d6a">●</span>보유 <span style="color:#e0a31e">●</span>부분 <span style="color:#e07a1e">●</span>요청 <span style="color:#d1453b">●</span>없음. 점선 테두리(황색·주황·적색)도 같은 뜻입니다. 빨간 점선 = <b>아직 못 구한 자료</b>.</li>
<li><b style="color:#d1453b">T4</b> = 언론·2차자료. 공모·지구단위계획 문서에는 쓰지 않는다(원문 치환 전).</li>
<li>값 노드 오른쪽 원 = <b>근거 등급</b>: <span class="gd A">A</span> T1·T2 근거가 hard로 직접 한정 · <span class="gd B">B</span> 확인된 데이터가 보정 · <span class="gd C">C</span> 방향·저작뿐 · <span class="gd D">D</span> 핵심 한정 근거가 자료 공백.</li>
<li>상단 '색'을 바꾸면 값 노드를 <b>근거 등급</b> 또는 <b>현재 값 출처</b>(고정입력·법정·실측·혼합·저작·가정·미산정)로 칠합니다. 등급은 '쓸 수 있는 근거'이고, 현재 값 출처는 '지금 실제로 무엇에 근거했는가'입니다 — 둘의 차이가 연결할 일감입니다.</li></ul>
<h3>근거 번호 (K1-031 같은 표시)</h3>
<p>점선 밑줄이 있는 <span class="fid">K1-031</span> 은 PDF·문서 원문에서 쪽 단위로 뽑은 사실의 번호입니다. 마우스를 올리면 요지, 누르면 전문과 쪽 번호가 열립니다. K1 = 2030 도시기본계획, K2 = 도시재생 계획서·성과 보고서, K3a = 417쪽 연구·시민조사, K3b = 매장유산·경관·공모 가이드라인·구 역사 문헌. 에이전트가 추출한 것이라 인용 전 원문 대조가 필요합니다.</p>
<h3>이 그래프의 한계</h3>
<ul><li>엣지의 <b>basis=확인</b>은 프로젝트 문서·PDF에서 직접 확인했다는 뜻이지 원문 대조를 마쳤다는 뜻은 아닙니다. 수치는 해당 문서의 인용이므로 인용 전 원문 확인이 필요합니다([원문 미확인]).</li>
<li>현황 앵커(3,822억·79,438㎡ 등)는 대부분 언론 경유 T4입니다.</li>
<li>S1·S2·S3 스케일 필터가 있습니다. S3 통계로 S1 프로그램을 정당화하지 않습니다.</li>
<li>근거 등급 규칙은 코드로 계산됩니다(노드 CSV를 고치면 등급도 바뀝니다). "현재 값 출처"는 감사자의 분류이며 CSV(cur_src)에서 고칩니다.</li></ul>
<h3>단축키</h3><ul><li><kbd>/</kbd> 검색 · <kbd>Esc</kbd> 선택·초점 해제 · 휠 확대 · 드래그 이동 · 노드 클릭 = 오른쪽 패널에 근거 목록</li></ul>
<p style="text-align:right"><button class="btn pri" id="helpClose">닫기</button></p>`;
}
$('#bHelp').addEventListener('click', () => { $('#helpbody').innerHTML = helpHtml(); $('#help').style.display = 'flex'; });
function openFact(fid) {
  const ev = EVBY.get(fid); if (!ev) return;
  const ns = (ev.nodes || []).map(id => BY.get(id)).filter(Boolean);
  $('#helpbody').innerHTML = `<h2>원문 근거 ${esc(fid)}</h2>${evItem(ev)}<h3>이 사실이 붙은 노드</h3><div>${ns.map(n => `<button class="btn" data-pickfact="${esc(n.id)}" style="margin:2px">${esc(n.label)}</button>`).join('')}</div><p class="id" style="color:var(--muted);font-size:11px">에이전트가 원문에서 쪽 단위로 추출한 요지입니다 — 인용 전 원문 대조가 필요합니다.</p><p style="text-align:right"><button class="btn pri" id="helpClose">닫기</button></p>`;
  $('#help').style.display = 'flex';
}
document.addEventListener('click', ev => {
  const f = ev.target.closest('[data-fid]'); if (f) { openFact(f.dataset.fid); return; }
  const pf = ev.target.closest('[data-pickfact]'); if (pf) { $('#help').style.display = 'none'; selectNode(pf.dataset.pickfact); }
});
$('#help').addEventListener('click', ev => { if (ev.target.id === 'help' || ev.target.id === 'helpClose') $('#help').style.display = 'none'; });
$('#bFit').addEventListener('click', () => fit(true));
$('#bLeft').addEventListener('click', () => { document.body.classList.toggle('noleft'); setTimeout(() => fit(false), 30); });
$('#bRight').addEventListener('click', () => { document.body.classList.toggle('noright'); setTimeout(() => fit(false), 30); });
$('#bTheme').addEventListener('click', () => { S.theme = curTheme() === 'dark' ? 'light' : 'dark'; applyTheme(); refresh(false); });
$('#bSvg').addEventListener('click', exportSVG);
$('#bPng').addEventListener('click', exportPNG);
$('#colorsel').addEventListener('change', ev => { S.color = ev.target.value; refresh(false); });
$('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) setView(b.dataset.v); });
function applyTheme() { document.documentElement.setAttribute('data-theme', curTheme()); }
document.addEventListener('keydown', ev => {
  if (ev.key === '/' && document.activeElement !== qi) { ev.preventDefault(); qi.focus(); }
  else if (ev.key === 'Escape' && document.activeElement !== qi) {
    if ($('#help').style.display === 'flex') { $('#help').style.display = 'none'; return; }
    if (S.sel) { S.sel = null; applyHL(); renderRight(); syncLeft(); writeHash(); }
    else if (S.focus || S.group) clearFocus();
  }
});
window.addEventListener('resize', debounce(() => fit(false), 150));
window.addEventListener('hashchange', () => { readHash(); refresh(false); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') { applyTheme(); refresh(false); } });

/* ═════════ 시작 ═════════ */
if (innerWidth < 1450) document.body.classList.add('noleft');
if (innerWidth < 1250) document.body.classList.add('noright');
buildLeft();
readHash();
applyTheme();
refresh(false);
window.__kg = { S, NODES, EDGES, PARAMS, GAPLIST, svgString, gradeOf, ready: true };
document.title = '구경주역 마스터플랜 지식그래프';
})();
