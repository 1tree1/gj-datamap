<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구경주역 마스터플랜 지식그래프</title>
<style>
:root{
  --bg:#f4f3ee; --panel:#ffffff; --panel2:#f0eee7; --ink:#1d2430; --muted:#6b7380; --line:#d8d4c8;
  --accent:#2b5fd9; --hl:#fff1bf; --shadow:0 4px 18px rgba(30,36,48,.16);
  --k-intent:#c58a1f; --k-plan:#4274c9; --k-law:#be4a43; --k-data:#2f9068; --k-derived:#7f6db5; --k-param:#27364f; --k-eval:#a2449a;
  --A:#2a9d6a; --B:#2f8fd1; --C:#e0a31e; --D:#d1453b;
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1b1f26; --panel2:#232831; --ink:#e6e8ec; --muted:#98a1ae; --line:#394050;
  --accent:#7aa2ff; --hl:#4a3f12; --shadow:0 4px 18px rgba(0,0,0,.5);
  --k-intent:#d9a441; --k-plan:#6f9bf0; --k-law:#e0766f; --k-data:#4dbf90; --k-derived:#a493dc; --k-param:#aebfdc; --k-eval:#d173c8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
#top .ttl{display:flex;flex-direction:column;line-height:1.25;margin-right:6px}
#top .ttl b{font-size:15px}
#top .ttl span{font-size:11px;color:var(--muted)}
#tabs{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:9px}
#tabs button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted)}
#tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:700}
.search{position:relative;flex:1 1 220px;max-width:360px}
.search input{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#qres{position:absolute;left:0;right:0;top:34px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:30;max-height:340px;overflow:auto;display:none}
#qres button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;cursor:pointer}
#qres button:hover,#qres button.cur{background:var(--panel2)}
#qres small{color:var(--muted);margin-left:6px}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.tools label{font-size:11px;color:var(--muted)}
.tools select,.tools button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 9px;cursor:pointer}
.tools button:hover{background:var(--panel2)}
#main{display:flex;flex:1 1 auto;min-height:0}
#left{width:268px;flex:0 0 268px;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:10px 12px 20px}
#right{width:372px;flex:0 0 372px;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 28px}
body.noleft #left{display:none}
body.noright #right{display:none}
#left h4,#right h4{margin:14px 0 6px;font-size:11.5px;letter-spacing:.02em;color:var(--muted);font-weight:700;text-transform:none}
#left h4:first-child{margin-top:2px}
#stage{position:relative;flex:1 1 auto;min-width:0;overflow:hidden;background:var(--bg)}
#svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block}
#svg:active{cursor:grabbing}
#matrix{position:absolute;inset:0;overflow:auto;display:none;background:var(--bg);padding:12px 14px 40px}
#hud{position:absolute;left:12px;top:10px;right:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#hud .box{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px;font-size:12px}
#hud button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:2px 8px;cursor:pointer}
#hud button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#hint{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 9px;pointer-events:none;opacity:.92}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}
.pv{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:3px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.pv:hover{background:var(--panel2)}
.pv.on{background:var(--hl);font-weight:700}
.pv .gd{flex:0 0 auto}
.pg{margin:8px 0 2px;font-size:11px;color:var(--muted);font-weight:700}
.gd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;border-radius:9px;font-size:10px;font-weight:700;color:#fff;padding:0 3px}
.gd.A{background:var(--A)}.gd.B{background:var(--B)}.gd.C{background:var(--C);color:#1d2430}.gd.D{background:var(--D)}
.ck{display:flex;align-items:center;gap:7px;padding:2px 2px;font-size:12.5px;cursor:pointer;user-select:none}
.ck i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:0 0 auto}
.ck i.ln{height:3px;border-radius:2px;width:18px}
.ck em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}
.ck.rel{align-items:flex-start}
.ck.rel small{display:block;color:var(--muted);font-size:10.5px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{display:inline-block;padding:0 6px;border-radius:9px;font-size:10.5px;line-height:17px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.t1{color:#1f7a54;border-color:#9fd6bb}.chip.t2{color:#1f7088;border-color:#9cd0dc}.chip.t3{color:#9a6a0c;border-color:#e6cf93}.chip.t4{color:#b13a30;border-color:#e8a6a0}
.chip.s-보유{color:#1f7a54;border-color:#9fd6bb}.chip.s-부분{color:#9a6a0c;border-color:#e6cf93}.chip.s-요청{color:#b8610f;border-color:#efc08d}.chip.s-없음{color:#b13a30;border-color:#e8a6a0;background:rgba(209,69,59,.08)}
.chip.hard{color:#b13a30;border-color:#e8a6a0}.chip.soft{color:var(--muted)}.chip.est{border-style:dashed}
.chip.kind{color:#fff;border:0}
.k-intent.kind{background:var(--k-intent)}.k-plan.kind{background:var(--k-plan)}.k-law.kind{background:var(--k-law)}.k-data.kind{background:var(--k-data)}.k-derived.kind{background:var(--k-derived)}.k-param.kind{background:var(--k-param);color:var(--bg)}.k-eval.kind{background:var(--k-eval)}
.card{background:var(--panel2);border-radius:10px;padding:9px 11px;margin:8px 0}
.card.warn{background:rgba(224,163,30,.14);border:1px solid rgba(224,163,30,.5)}
.card.bad{background:rgba(209,69,59,.1);border:1px solid rgba(209,69,59,.45)}
.card h5{margin:0 0 3px;font-size:12px}
#right h2{margin:0 0 2px;font-size:16px;line-height:1.3}
#right .id{font:11px Consolas,"Courier New",monospace;color:var(--muted)}
#right .val{font:12px Consolas,"Courier New","Malgun Gothic",monospace;background:var(--panel2);border-radius:7px;padding:5px 8px;margin:6px 0;word-break:keep-all}
#right p{margin:6px 0}
#right details{margin:8px 0}
#right summary{cursor:pointer;font-weight:700;font-size:12.5px;padding:3px 0}
.rb{margin:6px 0 10px}
.rb .rh{display:flex;align-items:center;gap:6px;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:3px}
.rb .rh i{width:14px;height:3px;background:var(--rc);border-radius:2px;display:inline-block}
.rb .rh span{color:var(--muted);font-size:11px}
.rb .rh em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}
.it{padding:3px 4px;border-radius:6px}
.it.hl{background:var(--hl)}
.it .nt{font-size:11.5px;color:var(--muted);margin:1px 0 2px 2px}
.it .rf{color:var(--muted);opacity:.85;font-size:10.5px}
.lnk{background:none;border:0;padding:0;color:var(--accent);text-align:left;cursor:pointer;font-weight:700;font-size:12.5px}
.lnk:hover{text-decoration:underline}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:12px}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.fid{font:10px Consolas,"Courier New",monospace;color:var(--accent);border-bottom:1px dotted var(--accent);cursor:help;margin:0 1px;white-space:nowrap}
.bar{display:flex;height:13px;border-radius:7px;overflow:hidden;margin:4px 0 2px;background:var(--panel2)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.ev{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin:6px 0;font-size:12px}
.ev .src{font-size:10.5px;color:var(--muted)}
.ev.t1{border-color:#2a9d6a}.ev.t2{border-color:#13a3b5}.ev.t3{border-color:#e0a31e}.ev.t4{border-color:#d1453b}.ev.k-conflict{background:rgba(224,53,158,.07)}.ev.k-gap{background:rgba(138,99,210,.08)}
.chip.ev-conflict{color:#c0267f;border-color:#e69ac8}.chip.ev-gap{color:#6b49b8;border-color:#c1aeea}.chip.ev-constraint{color:#b13a30;border-color:#e8a6a0}.chip.ev-standard{color:#1f7088;border-color:#9cd0dc}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.mx thead th{position:sticky;top:0;z-index:3;background:var(--panel);font-weight:700}
table.mx thead tr.r2 th{top:26px}
table.mx .corner{position:sticky;left:0;z-index:5;min-width:200px;text-align:left;padding:6px 10px;background:var(--panel)}
table.mx th.kh{height:26px;font-size:11.5px;color:#fff;text-align:center}
table.mx th.gh{height:150px;min-width:30px;max-width:34px;vertical-align:bottom}
table.mx th.gh div{writing-mode:vertical-rl;margin:0 auto;padding:6px 0;font-size:11.5px;font-weight:600;white-space:nowrap;max-height:146px;overflow:hidden}
table.mx th.rh{position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;padding:3px 8px;font-weight:600;min-width:200px}
table.mx tr.pgrp td{background:var(--panel2);font-weight:700;font-size:11.5px;color:var(--muted);padding:3px 10px;position:sticky;left:0}
table.mx td.c{text-align:center;min-width:30px;height:30px;cursor:pointer;position:relative;font-weight:600}
table.mx td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
table.mx td.c.hard::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:1px;background:#d1453b}
table.mx td.c.gap::before{content:"";position:absolute;left:3px;top:3px;width:6px;height:6px;border-radius:50%;border:1.5px solid #d1453b;background:var(--panel)}
table.mx td.sum{text-align:center;min-width:34px;color:var(--muted)}
table.mx tfoot td{background:var(--panel2);text-align:center;font-weight:700;font-size:11.5px;position:sticky;bottom:0}
table.mx tr.sel th.rh,table.mx tr.sel td.sum{background:var(--hl)}
.mxnote{font-size:11.5px;color:var(--muted);margin:0 0 8px;max-width:980px}
#tip{position:fixed;z-index:60;pointer-events:none;max-width:380px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);display:none}
#tip b{display:block;margin-bottom:2px}
#tip .m{color:var(--muted);font-size:11px}
#help{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:80;display:none;align-items:center;justify-content:center}
#help .pane{background:var(--panel);border-radius:14px;max-width:880px;width:calc(100% - 40px);max-height:calc(100% - 50px);overflow:auto;padding:18px 24px 22px;box-shadow:var(--shadow)}
#help h3{margin:14px 0 4px;font-size:13.5px}
#help h2{margin:0}
#help table{border-collapse:collapse;font-size:12px;margin:4px 0}
#help td,#help th{border-bottom:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
#help li{margin:2px 0}
@media (max-width:1100px){#right{width:320px;flex-basis:320px}#left{width:230px;flex-basis:230px}}
@media (max-width:820px){#left{display:none}#right{display:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="ttl"><b>구경주역 마스터플랜 지식그래프</b><span id="sub"></span></div>
    <nav id="tabs">
      <button data-v="overview" title="묶음(그룹) 단위로 본 전체 구조">한눈에</button>
      <button data-v="detail" title="노드 하나하나와 엣지 전체">전체 그래프</button>
      <button data-v="matrix" title="마스터플랜 값 × 근거 묶음 표">값 × 근거 표</button>
    </nav>
    <div class="search"><input id="q" type="search" placeholder="노드 검색  (예: 고도지구, 주차, 시굴, P_H)" autocomplete="off"><div id="qres"></div></div>
    <div class="tools">
      <label>색 <select id="colorsel"><option value="kind">노드 종류</option><option value="grade">근거 등급(값)</option><option value="cur">현재 값 출처(값)</option></select></label>
      <button id="bFit" title="화면에 맞추기">맞춤</button>
      <button id="bLeft" title="왼쪽 패널 접기/펴기">◧</button>
      <button id="bRight" title="오른쪽 패널 접기/펴기">◨</button>
      <button id="bTheme" title="밝게/어둡게">◐</button>
      <button id="bSvg" title="현재 그래프를 SVG로 저장">SVG</button>
      <button id="bPng" title="현재 그래프를 PNG로 저장">PNG</button>
      <button id="bHelp" title="읽는 법">?</button>
    </div>
  </header>
  <div id="main">
    <aside id="left"></aside>
    <section id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="matrix"></div>
      <div id="hud"></div>
      <div id="empty">표시할 노드가 없습니다. 왼쪽 필터를 확인하세요.</div>
      <div id="hint"></div>
    </section>
    <aside id="right"></aside>
  </div>
</div>
<div id="tip"></div>
<div id="help"><div class="pane" id="helpbody"></div></div>
<script>/*__D3__*/</script>
<script>const KG = /*__DATA__*/;</script>
<script>/*__APP__*/</script>
</body>
</html>
